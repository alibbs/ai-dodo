<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AMANA ELITE | DICE INSTANT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@600;800;900&display=swap');

        :root {
            --bg: #02040a;
            --panel: #0d111c;
            --accent: #8b5cf6;
            --gold: #fbbf24;
            --up: #00e701;
            --down: #ff3b3b;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; outline: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 20px); }

        header { height: 60px; display: flex; align-items: center; justify-content: center; padding: 0 20px; }
        .balance-box { 
            background: #000; padding: 8px 20px; border-radius: 12px; 
            border: 1px solid var(--accent); display: flex; align-items: center; gap: 10px;
        }
        .balance-box span { font-family: 'Orbitron'; font-size: 1.1rem; color: #fff; }

        .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; }
        
        .dice-hub {
            width: 100%; max-width: 420px; background: var(--panel); border-radius: 28px;
            padding: 30px 20px; position: relative; border: 1px solid var(--border);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        /* Result Area */
        .result-box {
            height: 120px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
        }
        .result-val { 
            font-size: 85px; font-weight: 900; font-family: 'Orbitron'; 
            transition: 0.05s; letter-spacing: -3px;
        }
        
        /* Slider */
        .slider-wrapper { width: 100%; position: relative; padding: 10px 0 30px 0; }
        .track { height: 12px; background: var(--down); border-radius: 10px; position: relative; overflow: hidden; }
        .track-win { position: absolute; height: 100%; background: var(--up); right: 0; transition: 0.2s ease; }
        
        input[type=range] {
            position: absolute; width: 100%; top: 2px; appearance: none; background: transparent; cursor: pointer; z-index: 10;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none; height: 36px; width: 36px; border-radius: 10px; background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); border: 4px solid var(--accent);
        }

        /* Stats */
        .stats-hub { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
        .s-box { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
        .s-box label { display: block; font-size: 8px; color: #64748b; text-transform: uppercase; margin-bottom: 4px; font-weight: 800; }
        .s-box span { font-family: 'Orbitron'; font-size: 13px; font-weight: 700; }

        /* Controls */
        .controls { 
            background: var(--panel); padding: 20px 20px 40px 20px; 
            border-radius: 30px 30px 0 0; border-top: 1px solid var(--border);
        }

        .bet-input-wrap {
            background: rgba(0,0,0,0.4); border: 1px solid var(--border);
            padding: 12px; border-radius: 16px; margin-bottom: 15px;
        }
        .bet-input-wrap label { font-size: 9px; color: #64748b; font-weight: 800; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .bet-input-wrap input { width: 100%; background: transparent; border: none; color: #fff; font-size: 22px; font-weight: 900; }

        .roll-btn {
            width: 100%; padding: 20px; border-radius: 16px; border: none;
            background: var(--accent); color: #fff; font-size: 1.4rem; font-weight: 900;
            text-transform: uppercase; cursor: pointer;
            box-shadow: 0 6px 0 #5b21b6; transition: 0.1s;
        }
        .roll-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #5b21b6; }
        .roll-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Quick Animations */
        .win-pop { animation: popWin 0.2s ease-out; color: var(--up) !important; text-shadow: 0 0 25px var(--up); }
        .loss-pop { animation: popLoss 0.2s ease-out; color: var(--down) !important; text-shadow: 0 0 25px var(--down); }

        @keyframes popWin { 0% { transform: scale(0.8); } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes popLoss { 0% { transform: scale(0.9); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <div class="balance-box">
            <i class="fa-solid fa-gem" style="color:var(--gold)"></i>
            <span id="balText">1,000.00</span>
        </div>
    </header>

    <div class="game-area">
        <div class="dice-hub">
            <div class="result-box">
                <div id="resDisplay" class="result-val">50.00</div>
            </div>
            
            <div class="slider-wrapper">
                <div class="track">
                    <div id="winFill" class="track-win" style="width: 50%;"></div>
                </div>
                <input type="range" id="mainSlider" min="2" max="98" value="50" step="0.01">
            </div>

            <div class="stats-hub">
                <div class="s-box"><label>Multiplier</label><span id="mVal">1.98x</span></div>
                <div class="s-box"><label>Roll Over</label><span id="tVal">50.00</span></div>
                <div class="s-box"><label>Win %</label><span id="cVal">50.00</span></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="bet-input-wrap">
            <label>Bet Amount</label>
            <input type="number" id="betAmount" value="10.00">
        </div>
        <button class="roll-btn" id="rollBtn" onclick="executeRoll()">Roll Dice</button>
    </div>

<script>
    let currentBalance = 1000.00;
    const slider = document.getElementById('mainSlider');
    const winFill = document.getElementById('winFill');
    const resDisplay = document.getElementById('resDisplay');
    const mVal = document.getElementById('mVal');
    const tVal = document.getElementById('tVal');
    const cVal = document.getElementById('cVal');
    const balText = document.getElementById('balText');
    const rollBtn = document.getElementById('rollBtn');

    function refreshStats() {
        const val = parseFloat(slider.value);
        const winChance = 100 - val;
        winFill.style.width = winChance + "%";
        tVal.innerText = val.toFixed(2);
        cVal.innerText = winChance.toFixed(2);
        mVal.innerText = (99 / winChance).toFixed(4) + "x";
    }

    slider.oninput = refreshStats;

    function executeRoll() {
        const bet = parseFloat(document.getElementById('betAmount').value);
        if (bet > currentBalance || bet <= 0) return;

        currentBalance -= bet;
        updateUI();
        rollBtn.disabled = true;

        const target = parseFloat(slider.value);
        const winChance = 100 - target;
        const multiplier = 99 / winChance;
        
        // سرعة فائقة: 5 فريمات فقط (إجمالي 250 مللي ثانية تقريباً)
        let frames = 0;
        const speed = setInterval(() => {
            resDisplay.innerText = (Math.random() * 100).toFixed(2);
            resDisplay.className = "result-val";
            frames++;
            
            if (frames > 5) {
                clearInterval(speed);
                const final = Math.random() * 100;
                resDisplay.innerText = final.toFixed(2);
                
                if (final > target) {
                    currentBalance += (bet * multiplier);
                    resDisplay.classList.add("win-pop");
                } else {
                    resDisplay.classList.add("loss-pop");
                }
                
                updateUI();
                rollBtn.disabled = false;
            }
        }, 40); // كل فريم 40 جزء من الثانية
    }

    function updateUI() {
        balText.innerText = currentBalance.toFixed(2);
    }

    refreshStats();
</script>
</body>
</html>
