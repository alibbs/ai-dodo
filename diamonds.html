<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMANA ELITE | Diamonds Mines</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f212e; /* لون ستيك الأصلي تقريباً */
            --side-panel: #213743;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: #2f4553;
            --brand: #a100ff;
            --brand2: #ff00b8;
            --accent: #00f2ff;
            --success: #00e701;
            --error: #ff0050;
            --radius: 10px;
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
            padding: 10px;
        }

        .game-container {
            display: flex; flex-direction: row-reverse; /* ترتيب ستيك: التحكم يسار واللعب يمين */
            width: 100%; max-width: 900px; gap: 20px;
            background: #1a2c38; padding: 20px; border-radius: 15px;
        }

        /* لوحة التحكم الجانبية */
        .side-control {
            flex: 1; background: var(--side-panel); padding: 20px;
            border-radius: var(--radius); display: flex; flex-direction: column; gap: 15px;
        }

        /* منطقة اللعب */
        .game-main { flex: 2; display: flex; flex-direction: column; align-items: center; }

        .grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
            width: 100%; max-width: 450px;
        }

        .tile {
            aspect-ratio: 1; background: #2f4553; border-radius: 6px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 30px; transition: all 0.2s; border-bottom: 4px solid rgba(0,0,0,0.2);
        }

        .tile:hover { background: #557086; transform: translateY(-2px); }
        .tile.revealed { cursor: default; background: #071824; border-bottom: none; transform: none; }
        .tile.bomb-hit { background: var(--error) !important; animation: shake 0.4s; }
        .tile i { transform: scale(0); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tile.revealed i { transform: scale(1); }

        /* إحصائيات */
        .stats-bar {
            width: 100%; display: flex; justify-content: space-between;
            margin-bottom: 15px; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px;
        }

        /* أزرار ومدخلات */
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; color: #b1bad3; font-weight: bold; }
        input, select {
            background: #0f212e; border: 2px solid var(--border);
            padding: 12px; border-radius: 5px; color: #fff; font-weight: bold; outline: none;
        }
        input:focus { border-color: #557086; }

        .btn-play {
            background: var(--success); color: #012e01; border: none;
            padding: 18px; border-radius: 5px; font-weight: 900;
            cursor: pointer; font-size: 16px; transition: 0.2s;
        }
        .btn-play:hover { filter: brightness(1.2); }
        .btn-play:disabled { opacity: 0.5; cursor: not-allowed; }

        .cashout-btn {
            background: #fff; color: #000; display: none; margin-top: 10px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* موبايل */
        @media (max-width: 768px) {
            .game-container { flex-direction: column; }
            .side-control { order: 2; }
            .game-main { order: 1; }
        }

        .d-blue { color: #00f2ff; drop-shadow: 0 0 10px #00f2ff; }
        .d-bomb { color: #fff; }
    </style>
</head>
<body>

<audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
<audio id="gemSound" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
<audio id="bombSound" src="https://assets.mixkit.co/active_storage/sfx/2592/2592-preview.mp3"></audio>

<div class="game-container">
    
    <div class="side-control">
        <div class="input-group">
            <label>Bet Amount</label>
            <input type="number" id="betAmount" value="10.00" step="0.10">
        </div>
        <div class="input-group">
            <label>Mines</label>
            <select id="bombCount">
                <option value="1">1</option>
                <option value="3" selected>3</option>
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20">20</option>
            </select>
        </div>
        <button class="btn-play" id="startBtn">Bet</button>
        <button class="btn-play cashout-btn" id="cashoutBtn">Cashout</button>
    </div>

    <div class="game-main">
        <div class="stats-bar">
            <span>Multiplier: <b id="multText" style="color:var(--accent)">1.00x</b></span>
            <span>Profit: <b id="profitText" style="color:var(--success)">$0.00</b></span>
        </div>
        <div class="grid" id="gameGrid"></div>
    </div>

</div>

<script>
    const grid = document.getElementById('gameGrid');
    const startBtn = document.getElementById('startBtn');
    const cashoutBtn = document.getElementById('cashoutBtn');
    const multText = document.getElementById('multText');
    const profitText = document.getElementById('profitText');
    
    // الأصوات
    const sndClick = document.getElementById('clickSound');
    const sndGem = document.getElementById('gemSound');
    const sndBomb = document.getElementById('bombSound');

    let gameActive = false;
    let bombs = [];
    let revealedCount = 0;
    let currentMult = 1.00;

    function createBoard() {
        grid.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.dataset.index = i;
            tile.onclick = () => revealTile(i);
            grid.appendChild(tile);
        }
    }

    function initGame() {
        sndClick.play();
        const bombNum = parseInt(document.getElementById('bombCount').value);
        bombs = [];
        while(bombs.length < bombNum) {
            let r = Math.floor(Math.random() * 25);
            if(!bombs.includes(r)) bombs.push(r);
        }
        
        gameActive = true;
        revealedCount = 0;
        currentMult = 1.00;
        updateStats();
        
        startBtn.disabled = true;
        cashoutBtn.style.display = 'block';
        createBoard();
    }

    function revealTile(index) {
        if (!gameActive) return;
        const tile = grid.children[index];
        if (tile.classList.contains('revealed')) return;

        tile.classList.add('revealed');
        
        if (bombs.includes(index)) {
            sndBomb.play();
            tile.classList.add('bomb-hit');
            tile.innerHTML = '<i class="fa-solid fa-bomb d-bomb"></i>';
            gameOver(false);
        } else {
            sndGem.currentTime = 0;
            sndGem.play();
            tile.innerHTML = '<i class="fa-solid fa-gem d-blue"></i>';
            revealedCount++;
            calculateMultiplier();
            updateStats();
        }
    }

    function calculateMultiplier() {
        const bombNum = parseInt(document.getElementById('bombCount').value);
        // معادلة ستيك التقريبية
        const totalTiles = 25;
        let mult = 1;
        for(let i=0; i<revealedCount; i++) {
            mult *= (totalTiles - i) / (totalTiles - bombNum - i);
        }
        currentMult = mult * 0.99; // عمولة بسيطة للمنصة
    }

    function updateStats() {
        const bet = parseFloat(document.getElementById('betAmount').value);
        multText.textContent = currentMult.toFixed(2) + 'x';
        profitText.textContent = '$' + (bet * currentMult).toFixed(2);
    }

    function gameOver(win) {
        gameActive = false;
        startBtn.disabled = false;
        cashoutBtn.style.display = 'none';

        // كشف كل المربعات
        bombs.forEach(index => {
            const t = grid.children[index];
            if (!t.classList.contains('revealed')) {
                t.classList.add('revealed');
                t.innerHTML = '<i class="fa-solid fa-bomb d-bomb" style="opacity:0.5"></i>';
            }
        });
        
        if(!win) {
            profitText.style.color = 'var(--error)';
            setTimeout(() => { 
                multText.textContent = "1.00x"; 
                profitText.textContent = "$0.00";
                profitText.style.color = 'var(--success)';
            }, 2000);
        }
    }

    startBtn.addEventListener('click', initGame);
    cashoutBtn.addEventListener('click', () => {
        sndGem.play();
        gameOver(true);
    });

    createBoard();
</script>

</body>
</html>
