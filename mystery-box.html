<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA | Premium Mystery Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #03050a; 
            --brand: #ff00b8; 
            --accent: #00f2ff;
            --gold: #ffb800;
            --card: rgba(255, 255, 255, 0.03); 
            --border: rgba(255, 255, 255, 0.08);
            --muted: #666;
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 0, 184, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 255, 0.08) 0%, transparent 40%);
            min-height: 100vh; padding-bottom: 120px;
        }

        /* --- Header --- */
        .header { padding: 50px 20px 20px; text-align: center; }
        .header h1 { 
            font-size: 30px; font-weight: 900; margin: 0; letter-spacing: -1px; 
            text-transform: uppercase;
        }
        .header span { 
            background: linear-gradient(to right, var(--brand), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(255, 0, 184, 0.5));
        }
        .header p { color: var(--muted); font-size: 12px; margin-top: 8px; letter-spacing: 1px; }

        /* --- Section Titles --- */
        .section-title { 
            padding: 0 25px; margin: 35px 0 15px; font-size: 10px; 
            color: var(--muted); text-transform: uppercase; letter-spacing: 3px;
            display: flex; align-items: center; gap: 15px; font-weight: 700;
        }
        .section-title::after { content: ""; height: 1px; background: linear-gradient(90deg, var(--border), transparent); flex: 1; }

        /* --- Grid & Cards --- */
        .boxes-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; padding: 0 20px;
        }

        .box-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 28px; padding: 25px 15px; text-align: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            position: relative; overflow: hidden;
            backdrop-filter: blur(15px); cursor: pointer; text-decoration: none; color: inherit;
        }

        .box-card:active { transform: scale(0.94); }

        .box-icon { font-size: 40px; margin-bottom: 12px; display: block; transition: 0.3s; }
        
        /* Standard Style */
        .box-card.standard { border-bottom: 2px solid var(--accent); }
        .box-card.standard .box-icon { color: var(--accent); filter: drop-shadow(0 0 10px rgba(0, 242, 255, 0.3)); }
        
        /* Premium Style */
        .box-card.premium { border-bottom: 2px solid var(--gold); background: rgba(255, 184, 0, 0.02); }
        .box-card.premium .box-icon { color: var(--gold); filter: drop-shadow(0 0 15px rgba(255, 184, 0, 0.4)); }

        .box-name { font-weight: 700; font-size: 13px; display: block; margin-bottom: 4px; color: #ccc; }
        .box-price { font-size: 18px; font-weight: 900; color: #fff; display: block; margin-bottom: 15px; }

        .buy-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff;
            padding: 10px; border-radius: 12px; font-size: 10px;
            font-weight: 800; width: 100%; cursor: pointer; transition: 0.3s;
            text-transform: uppercase;
        }

        .box-card:hover .buy-btn { background: #fff; color: #000; }

        /* --- Bottom Nav --- */
        .bottom-nav { 
            position: fixed; bottom: 15px; left: 15px; right: 15px; height: 70px;
            background: rgba(10, 10, 15, 0.9); display: flex; justify-content: space-around;
            align-items: center; border: 1px solid var(--border); 
            backdrop-filter: blur(20px); border-radius: 22px; z-index: 1000;
        }
        .nav-item { color: #555; font-size: 18px; text-decoration: none; text-align: center; }
        .nav-item.active { color: var(--brand); }
        .nav-item span { display: block; font-size: 8px; margin-top: 4px; font-weight: 700; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="header">
        <h1>LUCKY <span>AMANA</span></h1>
        <p>OPEN THE BOX • WIN THE ASSETS</p>
    </div>

    <div class="section-title">Starter Boxes</div>
    <div class="boxes-grid">
        <div class="box-card standard" onclick="openPurchase(5, 'Basic Drop')">
            <i class="fa-solid fa-box-archive box-icon"></i>
            <span class="box-name">Basic Drop</span>
            <span class="box-price">$5.00</span>
            <button class="buy-btn">Unlock</button>
        </div>
        <div class="box-card standard" onclick="openPurchase(10, 'Silver Box')">
            <i class="fa-solid fa-box box-icon"></i>
            <span class="box-name">Silver Box</span>
            <span class="box-price">$10.00</span>
            <button class="buy-btn">Unlock</button>
        </div>
        <div class="box-card standard" onclick="openPurchase(15, 'Gold Box')">
            <i class="fa-solid fa-parachute-box box-icon"></i>
            <span class="box-name">Gold Box</span>
            <span class="box-price">$15.00</span>
            <button class="buy-btn">Unlock</button>
        </div>
        <div class="box-card standard" onclick="openPurchase(25, 'Platinum Box')">
            <i class="fa-solid fa-gift box-icon"></i>
            <span class="box-name">Platinum Box</span>
            <span class="box-price">$25.00</span>
            <button class="buy-btn">Unlock</button>
        </div>
    </div>

    <div class="section-title">Elite Chests</div>
    <div class="boxes-grid">
        <div class="box-card premium" onclick="openPurchase(40, 'Elite Chest')">
            <i class="fa-solid fa-box-open box-icon"></i>
            <span class="box-name">Elite Chest</span>
            <span class="box-price">$40.00</span>
            <button class="buy-btn">Unlock</button>
        </div>
        <div class="box-card premium" onclick="openPurchase(60, 'Master Chest')">
            <i class="fa-solid fa-vault box-icon"></i>
            <span class="box-name">Master Chest</span>
            <span class="box-price">$60.00</span>
            <button class="buy-btn">Unlock</button>
        </div>
        <div class="box-card premium" onclick="openPurchase(80, 'Grand Master')">
            <i class="fa-solid fa-treasure-chest box-icon"></i>
            <span class="box-name">Grand Master</span>
            <span class="box-price">$80.00</span>
            <button class="buy-btn">Unlock</button>
        </div>
        <div class="box-card premium" onclick="openPurchase(100, 'Legendary Box')">
            <i class="fa-solid fa-gem box-icon"></i>
            <span class="box-name">Legendary Box</span>
            <span class="box-price">$100.00</span>
            <button class="buy-btn">Unlock</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="game.html" class="nav-item active"><i class="fa-solid fa-gamepad"></i><span>Game</span></a>
        <a href="bot-trade.html" class="nav-item"><i class="fa-solid fa-robot"></i><span>Bot</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
    </nav>

    <script>
        function openPurchase(price, name) {
            window.location.href = `unbox.html?price=${price}&name=${encodeURIComponent(name)}`;
        }
    </script>
</body>
</html>
