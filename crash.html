<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AMANA ELITE | Airplane Crash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #04060f;
            --brand: #ff00b8;
            --accent: #00f2ff;
            --up: #00ff96;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff; overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, #111428 0%, #04060f 100%);
        }

        /* Network Status */
        .network-status {
            position: fixed; top: 15px; right: 15px; font-size: 11px;
            background: var(--glass); padding: 5px 12px; border-radius: 20px;
            display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); z-index: 100;
        }
        .net-dot { width: 6px; height: 6px; background: var(--up); border-radius: 50%; box-shadow: 0 0 8px var(--up); }

        .container { width: 100%; max-width: 1000px; margin: 60px auto 20px; padding: 0 15px; display: flex; flex-direction: column; gap: 20px; }

        /* Airplane Canvas Area */
        .flight-scene {
            height: 350px; background: rgba(0,0,0,0.2); border-radius: 24px;
            border: 1px solid var(--border); position: relative; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .sky-elements { position: absolute; width: 100%; height: 100%; pointer-events: none; }
        .star { position: absolute; background: #fff; border-radius: 50%; animation: moveStar linear infinite; }

        @keyframes moveStar {
            from { transform: translateX(100vw); }
            to { transform: translateX(-10vw); }
        }

        .airplane-container {
            position: absolute; bottom: 20%; left: 10%;
            transition: all 0.1s linear; transform-style: preserve-3d;
            z-index: 5;
        }
        .airplane {
            font-size: 40px; color: var(--accent);
            text-shadow: 0 0 20px var(--accent);
            transform: rotate(-15deg);
        }
        .airplane.crashed { animation: explode 0.5s forwards; }

        @keyframes explode {
            0% { transform: scale(1) rotate(-15deg); }
            50% { transform: scale(2) rotate(0deg); color: #ff0050; opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        .multiplier-val {
            font-size: 80px; font-weight: 900; z-index: 10;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Controls Area */
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .bet-card { 
            background: var(--glass); border: 1px solid var(--border); 
            padding: 20px; border-radius: 20px; backdrop-filter: blur(10px);
        }

        .input-box {
            display: flex; background: #0b0e1a; border-radius: 12px;
            padding: 5px; border: 1px solid var(--border); margin-top: 10px;
        }
        .input-box input {
            flex: 1; background: transparent; border: none; color: #fff;
            padding: 10px; font-weight: 800; outline: none; width: 50px;
        }
        .btn-sm { background: #1a1e31; border: none; color: #fff; padding: 0 12px; border-radius: 8px; cursor: pointer; margin: 2px; font-size: 12px; }

        .btn-action {
            width: 100%; margin-top: 15px; padding: 18px; border-radius: 12px;
            border: none; font-weight: 900; font-size: 18px; cursor: pointer;
            transition: 0.3s;
        }
        .btn-bet { background: var(--up); color: #000; }
        .btn-cash { background: #fff; color: #000; display: none; }

        /* Optional Window - Players */
        .collapsible-stats {
            background: var(--glass); border: 1px solid var(--border); border-radius: 15px; overflow: hidden;
        }
        .coll-header { padding: 12px 20px; cursor: pointer; display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; background: rgba(255,255,255,0.02); }
        .coll-content { max-height: 0; transition: max-height 0.4s ease-out; overflow: hidden; }
        .coll-content.open { max-height: 400px; padding: 15px; }

        .player-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
        .won-txt { color: var(--up); font-weight: 800; }

        @media (max-width: 600px) { .controls-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="network-status">
    <div class="net-dot" id="netDot"></div>
    <span>PING: <span id="pingVal">24</span>ms</span>
</div>

<div class="container">
    <div class="flight-scene" id="scene">
        <div class="sky-elements" id="stars"></div>
        <div class="airplane-container" id="planeWrapper">
            <i class="fa-solid fa-plane airplane" id="plane"></i>
        </div>
        <div class="multiplier-val" id="multText">1.00x</div>
    </div>

    <div class="controls-grid">
        <div class="bet-card">
            <label style="font-size:12px; color:#8b8da3;">BET AMOUNT</label>
            <div class="input-box">
                <input type="number" id="betAmount" value="10.00">
                <button class="btn-sm" onclick="adjustBet(0.5)">1/2</button>
                <button class="btn-sm" onclick="adjustBet(2)">x2</button>
            </div>
            <button class="btn-action btn-bet" id="startBtn">BET</button>
            <button class="btn-action btn-cash" id="cashBtn">CASHOUT</button>
        </div>

        <div class="bet-card" style="display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <div style="color:var(--up); font-size: 24px; font-weight: 900;" id="userBalance">$0.00</div>
            <div style="font-size:11px; color:#8b8da3; margin-top:5px;">YOUR BALANCE</div>
        </div>
    </div>

    <div class="collapsible-stats">
        <div class="coll-header" onclick="toggleStats()">
            <span><i class="fa-solid fa-users"></i> LIVE PLAYERS</span>
            <span id="playerCount">241 Players</span>
        </div>
        <div class="coll-content" id="collContent">
            <div id="playerList"></div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
        authDomain: "ai-dodo.firebaseapp.com",
        projectId: "ai-dodo",
        storageBucket: "ai-dodo.firebasestorage.app",
        messagingSenderId: "261622335803",
        appId: "1:261622335803:web:0b066791230535e7d5cf1e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let userBalance = 0, userId = null, gameActive = false, currentMult = 1.0, gameLoop = null;
    let betPlaced = false;

    // --- Star Background ---
    const starContainer = document.getElementById('stars');
    for(let i=0; i<50; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.width = Math.random()*3 + 'px';
        star.style.height = star.style.width;
        star.style.left = Math.random()*100 + 'vw';
        star.style.top = Math.random()*100 + '%';
        star.style.animationDuration = (Math.random()*2 + 1) + 's';
        starContainer.appendChild(star);
    }

    // --- Network Sim ---
    setInterval(() => {
        const ping = Math.floor(Math.random()*40 + 20);
        document.getElementById('pingVal').textContent = ping;
        document.getElementById('netDot').style.background = ping > 100 ? '#ffb800' : 'var(--up)';
    }, 2000);

    // --- Auth & Balance ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            userId = user.uid;
            onSnapshot(doc(db, "users", userId), (snap) => {
                if (snap.exists()) {
                    userBalance = snap.data().balance || 0;
                    document.getElementById('userBalance').textContent = `$${userBalance.toLocaleString()}`;
                }
            });
        }
    });

    window.adjustBet = (f) => { if(!gameActive) document.getElementById('betAmount').value = (parseFloat(document.getElementById('betAmount').value)*f).toFixed(2); };
    window.toggleStats = () => document.getElementById('collContent').classList.toggle('open');

    async function startFlight() {
        const bet = parseFloat(document.getElementById('betAmount').value);
        if (bet > userBalance || bet <= 0) return;

        gameActive = true; betPlaced = true;
        document.getElementById('betAmount').disabled = true;
        await updateDoc(doc(db, "users", userId), { balance: increment(-bet) });

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('cashBtn').style.display = 'block';
        
        currentMult = 1.00;
        const plane = document.getElementById('plane');
        const wrapper = document.getElementById('planeWrapper');
        plane.classList.remove('crashed');
        wrapper.style.left = '10%'; wrapper.style.bottom = '20%';

        const crashPoint = (Math.random() < 0.05) ? 1.00 : (Math.random() * 5 + 1).toFixed(2);

        gameLoop = setInterval(() => {
            currentMult += 0.01;
            document.getElementById('multText').textContent = currentMult.toFixed(2) + 'x';
            
            // Move Airplane
            const progress = (currentMult - 1) * 10;
            wrapper.style.left = (10 + progress) + '%';
            wrapper.style.bottom = (20 + progress * 1.5) + '%';

            document.getElementById('cashBtn').textContent = `CASHOUT ($${(bet * currentMult).toFixed(2)})`;

            if (currentMult >= crashPoint) {
                clearInterval(gameLoop);
                plane.classList.add('crashed');
                document.getElementById('multText').style.color = '#ff0050';
                finishGame(false);
            }
        }, 100);

        generateFakePlayers();
    }

    async function cashout() {
        if(!gameActive || !betPlaced) return;
        const bet = parseFloat(document.getElementById('betAmount').value);
        await updateDoc(doc(db, "users", userId), { balance: increment(bet * currentMult) });
        betPlaced = false;
        document.getElementById('cashBtn').style.background = 'var(--up)';
        document.getElementById('cashBtn').textContent = 'WON!';
    }

    function finishGame(isWin) {
        gameActive = false;
        setTimeout(() => {
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('cashBtn').style.display = 'none';
            document.getElementById('cashBtn').style.background = '#fff';
            document.getElementById('betAmount').disabled = false;
            document.getElementById('multText').style.color = '#fff';
        }, 2000);
    }

    function generateFakePlayers() {
        const list = document.getElementById('playerList');
        list.innerHTML = '';
        const names = ['Ali_88', 'Samer_VIP', 'Elite_User', 'CryptoKing', 'Luna', 'Rami_X'];
        names.forEach(n => {
            const div = document.createElement('div');
            div.className = 'player-item';
            div.innerHTML = `<span>${n}</span> <span>$${(Math.random()*100).toFixed(2)}</span> <span class="won-txt">-</span>`;
            list.appendChild(div);
        });
    }

    document.getElementById('startBtn').onclick = startFlight;
    document.getElementById('cashBtn').onclick = cashout;
</script>
</body>
</html>
