<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AMANA ELITE | REAL COIN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@600;800;900&display=swap');

        :root {
            --bg: #05070a;
            --panel: #0f121a;
            --accent: #a855f7;
            --gold: #facc15;
            --up: #10b981;
            --border: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; }
        
        /* Multiplier Bar */
        .m-bar { height: 50px; background: #000; display: flex; align-items: center; gap: 8px; padding: 0 15px; overflow-x: auto; border-bottom: 1px solid var(--border); }
        .m-chip { padding: 5px 15px; background: #161b22; border-radius: 6px; font-family: 'Orbitron'; font-size: 10px; color: #4b5563; border: 1px solid transparent; transition: 0.4s; }
        .m-chip.active { background: var(--accent); color: #fff; border-color: #fff; box-shadow: 0 0 15px rgba(168, 85, 247, 0.4); }

        header { height: 60px; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .balance { background: rgba(255,255,255,0.03); padding: 8px 20px; border-radius: 50px; border: 1px solid var(--accent); font-family: 'Orbitron'; color: var(--gold); }

        .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; perspective: 2000px; }

        /* --- THE REAL 3D COIN --- */
        .coin-box { width: 150px; height: 150px; position: relative; transform-style: preserve-3d; transition: transform 0.1s linear; }
        
        /* Animation Classes */
        .tossing { animation: tossCoin 0.8s cubic-bezier(0.42, 0, 0.58, 1); }

        .coin { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.1); }
        
        .face { 
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            backface-visibility: hidden; display: flex; align-items: center; justify-content: center;
            font-size: 60px; border: 8px solid #222; 
        }

        .heads { 
            background: linear-gradient(135deg, #d4d4d8 0%, #71717a 50%, #27272a 100%);
            color: #fff; transform: rotateY(0deg); 
            box-shadow: inset 0 0 20px rgba(255,255,255,0.5);
        }

        .tails { 
            background: linear-gradient(135deg, #fbbf24 0%, #b45309 50%, #451a03 100%);
            color: #000; transform: rotateY(180deg);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        /* السماكة الجانبية للعملة */
        .coin::after {
            content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%;
            transform: translateZ(-5px); background: #3f3f46; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Toss Animation: تطلع فوق وتنزل مع دوران */
        @keyframes tossCoin {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-150px) scale(1.2); }
            100% { transform: translateY(0) scale(1); }
        }

        /* Controls */
        .controls { background: var(--panel); padding: 25px; border-radius: 35px 35px 0 0; border-top: 1px solid var(--border); box-shadow: 0 -10px 50px rgba(0,0,0,0.6); }
        .bet-input { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 20px; }
        .bet-input label { font-size: 10px; color: #666; text-transform: uppercase; font-weight: 800; }
        .bet-input input { width: 100%; background: transparent; border: none; color: #fff; font-size: 20px; font-weight: 900; margin-top: 5px; }

        .btn { width: 100%; padding: 20px; border-radius: 15px; border: none; font-weight: 900; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--accent); color: #fff; box-shadow: 0 6px 0 #7e22ce; }
        .btn-bet:active { transform: translateY(3px); box-shadow: 0 2px 0 #7e22ce; }

        .play-grid { display: none; grid-template-columns: 1fr 1fr; gap: 15px; }
        .side-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .side-btn i { font-size: 24px; }
        .side-btn.h { border-color: #71717a; }
        .side-btn.t { border-color: #fbbf24; }

        .cashout { grid-column: span 2; background: var(--up); color: #000; margin-top: 5px; box-shadow: 0 6px 0 #059669; }
        .disabled { opacity: 0.3; pointer-events: none; }

        #msg { position: absolute; top: 15%; font-family: 'Orbitron'; font-size: 24px; font-weight: 900; color: var(--up); display: none; }
    </style>
</head>
<body>

    <div class="m-bar" id="mBar">
        <div class="m-chip">1.98x</div><div class="m-chip">3.96x</div><div class="m-chip">7.92x</div>
        <div class="m-chip">15.8x</div><div class="m-chip">31.6x</div><div class="m-chip">63.2x</div>
    </div>

    <header>
        <div class="balance">
            <i class="fa-solid fa-coins"></i> <span id="bal">1,000.00</span>
        </div>
    </header>

    <div class="game-area">
        <div id="msg">+0.00</div>
        <div class="coin-box" id="coinBox">
            <div class="coin" id="coin">
                <div class="face heads"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="face tails"><i class="fa-solid fa-crown"></i></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div id="betSection">
            <div class="bet-input">
                <label>Amount</label>
                <input type="number" id="amt" value="10">
            </div>
            <button class="btn btn-bet" onclick="initBet()">PLACE BET</button>
        </div>

        <div id="playSection" class="play-grid">
            <button class="btn side-btn h" id="hBtn" onclick="play('H')">
                <i class="fa-solid fa-shield-halved"></i> HEADS
            </button>
            <button class="btn side-btn t" id="tBtn" onclick="play('T')">
                <i class="fa-solid fa-crown"></i> TAILS
            </button>
            <button class="btn cashout" id="cBtn" onclick="cashout()">CASHOUT</button>
        </div>
    </div>

<script>
    let balance = 1000.00;
    let currentBet = 0;
    let round = 0;
    let currentRot = 0;
    const mults = [1.98, 3.96, 7.92, 15.84, 31.68, 63.36, 126.72];

    const coin = document.getElementById('coin');
    const coinBox = document.getElementById('coinBox');
    const mChips = document.querySelectorAll('.m-chip');

    function initBet() {
        const a = parseFloat(document.getElementById('amt').value);
        if(isNaN(a) || a <= 0 || a > balance) return;
        
        balance -= a;
        currentBet = a;
        round = 0;
        updateUI();
        
        document.getElementById('betSection').style.display = 'none';
        document.getElementById('playSection').style.display = 'grid';
        document.getElementById('cBtn').classList.add('disabled');
        mChips.forEach(c => c.classList.remove('active'));
    }

    function play(choice) {
        setDisabled(true);
        
        // Rigged logic: 50% البداية ثم تنزل لـ 35%
        let winChance = round === 0 ? 0.49 : (0.45 - (round * 0.05));
        const win = Math.random() < winChance;
        const resultSide = win ? choice : (choice === 'H' ? 'T' : 'H');

        // تطبيق انيميشن الرمي (تطلع فوق)
        coinBox.classList.remove('tossing');
        void coinBox.offsetWidth; // Trigger reflow
        coinBox.classList.add('tossing');

        // حساب الدوران (واقعي: يدور 3-5 لفات)
        const extraSpins = 1440 + (Math.floor(Math.random() * 2) * 360);
        const targetSide = (resultSide === 'H') ? 0 : 180;
        currentRot += extraSpins + (targetSide - (currentRot % 360));
        if(currentRot % 360 !== targetSide) currentRot += 180;

        coin.style.transform = `rotateY(${currentRot}deg)`;

        setTimeout(() => {
            if(win) {
                round++;
                const m = mults[round-1];
                showMsg(`+${(currentBet * m).toFixed(2)}`, true);
                updateMBar();
                document.getElementById('cBtn').classList.remove('disabled');
                document.getElementById('cBtn').innerHTML = `CASHOUT <br> <b>${(currentBet * m).toFixed(2)}</b>`;
                setDisabled(false);
            } else {
                showMsg('LOST', false);
                setTimeout(reset, 800);
            }
        }, 800);
    }

    function cashout() {
        const win = currentBet * mults[round-1];
        balance += win;
        showMsg(`WIN!`, true);
        setTimeout(reset, 600);
    }

    function reset() {
        document.getElementById('betSection').style.display = 'block';
        document.getElementById('playSection').style.display = 'none';
        document.getElementById('msg').style.display = 'none';
        updateUI();
        setDisabled(false);
    }

    function updateUI() {
        document.getElementById('bal').innerText = balance.toLocaleString(undefined,{minimumFractionDigits:2});
    }

    function updateMBar() {
        mChips.forEach((c, i) => c.className = (i === round-1) ? 'm-chip active' : 'm-chip');
    }

    function showMsg(txt, isWin) {
        const m = document.getElementById('msg');
        m.innerText = txt;
        m.style.color = isWin ? 'var(--up)' : '#ef4444';
        m.style.display = 'block';
    }

    function setDisabled(s) {
        document.getElementById('hBtn').classList.toggle('disabled', s);
        document.getElementById('tBtn').classList.toggle('disabled', s);
        document.getElementById('cBtn').classList.toggle('disabled', s);
    }
</script>
</body>
</html>
