<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA GLOBAL | Financial Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff; --text: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1);
            --up: #00ff96; --down: #ff3b3b;
        }
        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1a0b2e 0%, #060914 100%);
            color: var(--text); padding-bottom: 110px; min-height: 100vh;
        }
        .container { padding: 20px; max-width: 450px; margin: auto; }
        .credit-card {
            width: 100%; height: 220px; background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 25px; padding: 25px;
            position: relative; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.5); backdrop-filter: blur(15px); margin-bottom: 30px;
        }
        .card-content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; justify-content: space-between; }
        .card-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #aaa; }
        .card-balance { font-size: 32px; font-weight: 900; margin-top: 5px; letter-spacing: -1px; }
        .card-balance small { font-size: 14px; color: var(--brand); margin-left: 5px; }
        .card-stats { display: flex; gap: 20px; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .stat-box { font-size: 11px; color: #ccc; }
        .stat-box b { display: block; font-size: 14px; color: var(--up); }
        .stat-box b.game-profit { color: var(--accent); }
        .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 30px; }
        .action-item { background: var(--card-bg); border: 1px solid var(--border); padding: 15px 5px; border-radius: 18px; text-align: center; cursor: pointer; }
        .action-item i { font-size: 18px; margin-bottom: 8px; display: block; color: var(--accent); }
        .action-item span { font-size: 10px; font-weight: 700; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-content { background: #11111d; border: 1px solid var(--border); width: 85%; max-width: 380px; padding: 25px; border-radius: 30px; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; color: #555; cursor: pointer; }
        .modal-btn { width: 100%; padding: 16px; border-radius: 15px; border: none; background: var(--brand); color: white; font-weight: 900; cursor: pointer; }
        #qrcode { background: white; padding: 10px; border-radius: 12px; margin: 15px auto; width: 150px; height: 150px; }
        #qrcode img { margin: auto; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: rgba(6, 9, 20, 0.98); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { text-decoration: none; color: #444; text-align: center; flex: 1; font-size: 10px; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--brand); }
    </style>
</head>
<body>

<div class="container">
    <div class="credit-card">
        <div class="card-content">
            <div class="card-top">
                <div>
                    <div class="card-label">Total Portfolio</div>
                    <div class="card-balance" id="displayBalance">0.00<small>USDT</small></div>
                </div>
            </div>
            <div class="card-stats">
                <div class="stat-box">Bot Profit <b id="displayBotProfit">+$0.00</b></div>
                <div class="stat-box">Game Win <b class="game-profit" id="displayGameProfit">+$0.00</b></div>
            </div>
        </div>
    </div>

    <div class="action-grid">
        <div class="action-item" onclick="openModal('deposit')"><i class="fa-solid fa-circle-down"></i><span>Deposit</span></div>
        <div class="action-item" onclick="openModal('withdraw')"><i class="fa-solid fa-circle-up"></i><span>Withdraw</span></div>
        <div class="action-item" onclick="openModal('swap')"><i class="fa-solid fa-rotate"></i><span>Swap</span></div>
        <div class="action-item" onclick="openModal('history')"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></div>
    </div>

    <div id="marketList">
        </div>
</div>

<div id="actionModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="color:#fff; text-align:center; margin-bottom:15px;">Action</h2>
        <div id="modalBody"></div>
        <div id="modalFooter" style="margin-top:20px;"><button class="modal-btn" onclick="closeModal()">Close</button></div>
    </div>
</div>

<nav class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="game.html" class="nav-item"><i class="fa-solid fa-gamepad"></i><span>Game</span></a>
    <a href="bot-trade.html" class="nav-item"><i class="fa-solid fa-robot"></i><span>Bot</span></a>
    <a href="overview.html" class="nav-item active"><i class="fa-solid fa-chart-pie"></i><span>Overview</span></a>
    <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
      authDomain: "ai-dodo.firebaseapp.com",
      projectId: "ai-dodo",
      storageBucket: "ai-dodo.firebasestorage.app",
      messagingSenderId: "261622335803",
      appId: "1:261622335803:web:0b066791230535e7d5cf1e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let userTRC20 = "";
    let isScannerRunning = false;

    onAuthStateChanged(auth, (user) => {
        if (user) {
            onSnapshot(doc(db, "users", user.uid), (snap) => {
                if (snap.exists()) {
                    const d = snap.data();
                    document.getElementById('displayBalance').innerHTML = `${(d.balance || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}<small>USDT</small>`;
                    document.getElementById('displayBotProfit').textContent = `+$${(d.bot_profit || 0).toFixed(2)}`;
                    document.getElementById('displayGameProfit').textContent = `+$${(d.game_profit || 0).toFixed(2)}`;
                    userTRC20 = d.trc20_address || "Searching...";
                    
                    if (!isScannerRunning && userTRC20.startsWith("T")) {
                        startScanner(userTRC20, user.uid);
                        isScannerRunning = true;
                    }
                }
            });
        } else { window.location.href = "login.html"; }
    });

    // --- سكانر الحوالات التلقائي ---
    async function startScanner(address, uid) {
        setInterval(async () => {
            try {
                const res = await fetch(`https://apilist.tronscan.org/api/token_trc20/transfers?limit=5&toAddress=${address}`);
                const data = await res.json();
                if (data.token_transfers) {
                    for (let tx of data.token_transfers) {
                        const hash = tx.transaction_id;
                        const amount = tx.quant / 1000000;
                        const txRef = doc(db, "processed_tx", hash);
                        const txSnap = await getDoc(txRef);
                        
                        if (!txSnap.exists()) {
                            await setDoc(txRef, { uid, amount, hash, date: new Date() });
                            await updateDoc(doc(db, "users", uid), { balance: increment(amount) });
                            alert(`Deposit Detected: +$${amount} added!`);
                        }
                    }
                }
            } catch(e) {}
        }, 15000);
    }

    window.openModal = function(type) {
        const modal = document.getElementById('actionModal');
        const title = document.getElementById('modalTitle');
        const body = document.getElementById('modalBody');
        modal.style.display = 'flex';

        if(type === 'deposit') {
            title.textContent = "USDT Deposit (TRC20)";
            body.innerHTML = `
                <div id="qrcode"></div>
                <div onclick="copyAddr()" style="background:#000; padding:15px; border-radius:12px; font-size:12px; word-break:break-all; border:1px dashed var(--brand); color:var(--up); text-align:center; font-family:monospace; cursor:pointer; margin-top:10px;">
                    <span id="addrTxt">${userTRC20}</span> <i class="fa-regular fa-copy"></i>
                </div>
                <p style="font-size:10px; color:#888; text-align:center; margin-top:10px;">Click the address above to copy.</p>
            `;
            if(userTRC20.startsWith("T")) {
                new QRCode(document.getElementById("qrcode"), { text: userTRC20, width: 150, height: 150 });
            }
        } else {
            body.innerHTML = `<p style="text-align:center; color:#555;">Feature coming soon...</p>`;
        }
    }

    window.copyAddr = () => {
        navigator.clipboard.writeText(userTRC20);
        alert("Address Copied!");
    }

    window.closeModal = () => { document.getElementById('actionModal').style.display = 'none'; }
</script>
</body>
</html>
