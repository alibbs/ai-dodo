<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AMANA ELITE | Airplane</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #060914;
            --brand: #ff00b8;
            --accent: #00f2ff;
            --up: #00ff96;
            --card: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            min-height: 100vh; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Header Area */
        .header {
            width: 100%; max-width: 500px; padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-weight: 900; font-size: 18px; letter-spacing: -1px; }
        .logo span { color: var(--brand); }
        .bal-display { 
            background: rgba(0, 255, 150, 0.1); border: 1px solid var(--up); 
            padding: 6px 15px; border-radius: 50px; color: var(--up); 
            font-weight: 800; font-size: 14px;
        }

        .container { width: 100%; max-width: 500px; padding: 0 15px 20px; }

        /* Airplane Scene */
        .flight-window {
            width: 100%; height: 280px; background: #0a0e1a;
            border-radius: 20px; border: 1px solid var(--border);
            position: relative; overflow: hidden; margin-bottom: 15px;
        }
        
        .ping-box {
            position: absolute; top: 12px; left: 12px; font-size: 10px;
            background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 5px;
            display: flex; align-items: center; gap: 5px; z-index: 10;
        }
        .ping-dot { width: 5px; height: 5px; background: var(--up); border-radius: 50%; }

        #canvas-wrap { position: absolute; width: 100%; height: 100%; }
        
        /* The Plane & Line */
        .plane-node {
            position: absolute; bottom: 20px; left: 20px;
            transition: transform 0.1s linear; z-index: 5;
        }
        .plane-node i { font-size: 28px; color: var(--accent); transform: rotate(-15deg); transition: color 0.3s; }
        .plane-node.crashed i { color: #ff0050; animation: shake 0.2s infinite; }

        #multiplier {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 55px; font-weight: 900; z-index: 4; text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        @keyframes shake { 0% {translate: 2px;} 50% {translate: -2px;} 100% {translate: 2px;} }

        /* Controls */
        .controls { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }
        .input-label { font-size: 11px; color: #8b8da3; font-weight: 800; margin-bottom: 8px; display: block; }
        
        .bet-box { display: flex; gap: 8px; background: #0f212e; padding: 5px; border-radius: 12px; margin-bottom: 15px; }
        .bet-box input { 
            flex: 1; background: transparent; border: none; color: #fff; 
            padding: 10px; font-weight: 800; outline: none; font-size: 16px;
        }
        .btn-mini { background: #2f4553; border: none; color: #fff; padding: 0 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        .main-action {
            width: 100%; padding: 18px; border-radius: 12px; border: none;
            font-weight: 900; font-size: 18px; cursor: pointer; transition: 0.2s;
        }
        .btn-bet { background: var(--up); color: #060914; }
        .btn-cash { background: #fff; color: #000; display: none; }
        .btn-wait { background: #2f4553; color: #8b8da3; cursor: not-allowed; display: none; }

        /* Stats Window */
        .stats-toggle {
            margin-top: 15px; background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; overflow: hidden;
        }
        .stats-head { padding: 12px 15px; cursor: pointer; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; }
        .stats-body { max-height: 0; transition: 0.3s; overflow: hidden; }
        .stats-body.open { max-height: 250px; overflow-y: auto; padding: 0 15px 15px; }
        .p-row { display: flex; justify-content: space-between; font-size: 12px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">AMANA <span>ELITE</span></div>
        <div class="bal-display" id="userBal"><i class="fa-solid fa-wallet"></i> 0.00</div>
    </div>

    <div class="container">
        <div class="flight-window">
            <div class="ping-box">
                <div class="ping-dot"></div>
                <span>PING: <span id="pingVal">32</span>ms</span>
            </div>
            
            <div id="multiplier">1.00x</div>
            
            <div id="canvas-wrap">
                <svg id="svgLine" style="position:absolute; width:100%; height:100%;">
                    <path id="flightPath" d="" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <div class="plane-node" id="planeNode">
                    <i class="fa-solid fa-plane"></i>
                </div>
            </div>
        </div>

        <div class="controls">
            <span class="input-label">BET AMOUNT</span>
            <div class="bet-box">
                <input type="number" id="betAmount" value="10.00">
                <button class="btn-mini" onclick="adj(0.5)">½</button>
                <button class="btn-mini" onclick="adj(2)">x2</button>
            </div>
            <button class="main-action btn-bet" id="btnBet">PLACE BET</button>
            <button class="main-action btn-cash" id="btnCash">CASHOUT</button>
            <button class="main-action btn-wait" id="btnWait">WAITING FOR NEXT ROUND...</button>
        </div>

        <div class="stats-toggle">
            <div class="stats-head" onclick="document.getElementById('statsBody').classList.toggle('open')">
                <span><i class="fa-solid fa-users"></i> LIVE PLAYERS</span>
                <span id="pCount">--</span>
            </div>
            <div class="stats-body" id="statsBody">
                <div id="playerList"></div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
        authDomain: "ai-dodo.firebaseapp.com",
        projectId: "ai-dodo",
        storageBucket: "ai-dodo.firebasestorage.app",
        messagingSenderId: "261622335803",
        appId: "1:261622335803:web:0b066791230535e7d5cf1e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let userId, userBalance = 0, currentMult = 1.0, isPlaying = false, hasCashout = false;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function sfx(freq, type='sine', dur=0.1) {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur);
    }

    onAuthStateChanged(auth, u => {
        if(u) { userId = u.uid; onSnapshot(doc(db, "users", userId), s => {
            userBalance = s.data().balance;
            document.getElementById('userBal').innerHTML = `<i class="fa-solid fa-wallet"></i> ${userBalance.toFixed(2)}`;
        }); }
    });

    window.adj = (f) => { if(!isPlaying) document.getElementById('betAmount').value = (parseFloat(document.getElementById('betAmount').value)*f).toFixed(2); };

    async function runLoop() {
        while(true) {
            // Waiting Phase
            document.getElementById('multiplier').style.color = 'var(--accent)';
            document.getElementById('multiplier').textContent = 'Preparing...';
            document.getElementById('planeNode').style.display = 'none';
            document.getElementById('flightPath').setAttribute('d', '');
            
            // Allow betting
            if(!isPlaying) {
                document.getElementById('btnBet').style.display = 'block';
                document.getElementById('btnWait').style.display = 'none';
            }
            
            await new Promise(r => setTimeout(r, 4000));

            // Start Phase
            document.getElementById('btnBet').style.display = 'none';
            if(!isPlaying) document.getElementById('btnWait').style.display = 'block';
            
            document.getElementById('planeNode').style.display = 'block';
            document.getElementById('planeNode').classList.remove('crashed');
            
            currentMult = 1.0;
            const crashPoint = (Math.random() < 0.03) ? 1.00 : (1.00 / (1 - Math.random()) ** 0.97).toFixed(2); // House Edge 3%
            
            const startT = Date.now();
            generatePlayers();

            while(true) {
                const elapsed = (Date.now() - startT) / 1000;
                currentMult = Math.pow(Math.E, 0.08 * elapsed);
                
                document.getElementById('multiplier').textContent = currentMult.toFixed(2) + 'x';
                
                // Animate Plane & Path
                const x = Math.min(elapsed * 40, 80);
                const y = Math.min(Math.pow(elapsed, 1.5) * 10, 70);
                document.getElementById('planeNode').style.transform = `translate(${x}vw, -${y}vh)`;
                
                const d = `M 20 260 Q ${20 + (x*2)} 260, ${20 + (x*4.5)} ${260 - (y*3.5)}`;
                document.getElementById('flightPath').setAttribute('d', d);

                if(isPlaying && !hasCashout) {
                    const bet = parseFloat(document.getElementById('betAmount').value);
                    document.getElementById('btnCash').textContent = `CASHOUT ($${(bet * currentMult).toFixed(2)})`;
                }

                if(currentMult >= crashPoint) break;
                await new Promise(r => requestAnimationFrame(r));
            }

            // Crash Phase
            document.getElementById('multiplier').textContent = currentMult.toFixed(2) + 'x CRASHED';
            document.getElementById('multiplier').style.color = '#ff0050';
            document.getElementById('planeNode').classList.add('crashed');
            sfx(100, 'triangle', 0.5);
            
            isPlaying = false;
            hasCashout = false;
            document.getElementById('btnCash').style.display = 'none';
            
            await new Promise(r => setTimeout(r, 3000));
        }
    }

    document.getElementById('btnBet').onclick = async () => {
        const bet = parseFloat(document.getElementById('betAmount').value);
        if(bet > userBalance || bet <= 0) return;
        sfx(600);
        await updateDoc(doc(db, "users", userId), { balance: increment(-bet) });
        isPlaying = true;
        document.getElementById('btnBet').style.display = 'none';
        document.getElementById('btnCash').style.display = 'block';
    };

    document.getElementById('btnCash').onclick = async () => {
        if(!isPlaying || hasCashout) return;
        const bet = parseFloat(document.getElementById('betAmount').value);
        await updateDoc(doc(db, "users", userId), { balance: increment(bet * currentMult) });
        hasCashout = true;
        sfx(1200);
        document.getElementById('btnCash').style.background = 'var(--up)';
        document.getElementById('btnCash').textContent = 'WINNER!';
    };

    function generatePlayers() {
        const count = Math.floor(Math.random()*270 + 30);
        document.getElementById('pCount').textContent = count + ' Players';
        const list = document.getElementById('playerList');
        list.innerHTML = '';
        for(let i=0; i<8; i++) {
            list.innerHTML += `<div class="p-row"><span>User_${Math.floor(Math.random()*999)}</span><span>$${(Math.random()*100).toFixed(2)}</span><span style="color:var(--up)">-</span></div>`;
        }
    }

    // Ping Sim
    setInterval(() => { document.getElementById('pingVal').textContent = Math.floor(Math.random()*20+15); }, 2000);

    runLoop();
</script>
</body>
</html>
