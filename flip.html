<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AMANA ELITE | COIN FLIP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@600;800;900&display=swap');

        :root {
            --bg: #02040a;
            --panel: #0d111c;
            --accent: #8b5cf6;
            --gold: #fbbf24;
            --blue: #3b82f6;
            --up: #00e701;
            --down: #ff3b3b;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 20px); }

        /* Header */
        header { height: 60px; display: flex; align-items: center; justify-content: center; padding: 0 20px; }
        .balance-box { 
            background: #000; padding: 8px 25px; border-radius: 50px; 
            border: 2px solid var(--accent); display: flex; align-items: center; gap: 10px;
        }
        .balance-box span { font-family: 'Orbitron'; font-size: 1.1rem; }

        .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

        /* Coin 3D Container */
        .coin-container {
            width: 180px; height: 180px; perspective: 1000px; margin-bottom: 40px;
        }
        .coin {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .coin div {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            backface-visibility: hidden; display: flex; align-items: center; justify-content: center;
            font-size: 60px; border: 6px solid;
        }
        .heads { background: var(--panel); border-color: var(--accent) !important; color: var(--accent); box-shadow: 0 0 30px rgba(139, 92, 246, 0.3); }
        .tails { background: var(--panel); border-color: var(--gold) !important; color: var(--gold); transform: rotateY(180deg); box-shadow: 0 0 30px rgba(251, 191, 36, 0.3); }

        /* Selection */
        .side-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 300px; margin-bottom: 30px; }
        .pick-btn { 
            padding: 15px; border-radius: 12px; border: 2px solid var(--border);
            background: var(--panel); color: #64748b; font-weight: 900; cursor: pointer; transition: 0.2s;
        }
        .pick-btn.active-heads { border-color: var(--accent); color: var(--accent); background: rgba(139, 92, 246, 0.1); }
        .pick-btn.active-tails { border-color: var(--gold); color: var(--gold); background: rgba(251, 191, 36, 0.1); }

        /* Controls */
        .controls { background: var(--panel); padding: 25px; border-radius: 35px 35px 0 0; border-top: 1px solid var(--border); }
        .input-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 18px; border: 1px solid var(--border); margin-bottom: 20px; }
        .input-box label { display: block; font-size: 10px; color: #64748b; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; }
        .input-box input { width: 100%; background: transparent; border: none; color: #fff; font-size: 22px; font-weight: 900; }

        .flip-btn {
            width: 100%; padding: 22px; border-radius: 18px; border: none;
            background: linear-gradient(135deg, var(--accent), #6d28d9);
            color: #fff; font-size: 1.4rem; font-weight: 900; text-transform: uppercase;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4); cursor: pointer;
        }
        .flip-btn:active { transform: scale(0.96); }
        .flip-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Animations */
        @keyframes flipHeads { from { transform: rotateY(0); } to { transform: rotateY(1800deg); } }
        @keyframes flipTails { from { transform: rotateY(0); } to { transform: rotateY(1980deg); } }

    </style>
</head>
<body>

    <header>
        <div class="balance-box">
            <i class="fa-solid fa-gem" style="color:var(--gold)"></i>
            <span id="balText">1000.00</span>
        </div>
    </header>

    <div class="game-area">
        <div class="coin-container">
            <div id="coin" class="coin">
                <div class="heads"><i class="fa-solid fa-bolt"></i></div>
                <div class="tails"><i class="fa-solid fa-crown"></i></div>
            </div>
        </div>

        <div class="side-picker">
            <button class="pick-btn active-heads" id="btnH" onclick="setSide('H')">HEADS</button>
            <button class="pick-btn" id="btnT" onclick="setSide('T')">TAILS</button>
        </div>
    </div>

    <div class="controls">
        <div class="input-box">
            <label>Wager Amount</label>
            <input type="number" id="betAmt" value="10.00">
        </div>
        <button class="flip-btn" id="flipBtn" onclick="startFlip()">Flip Coin</button>
    </div>

<script>
    let balance = 1000.00;
    let selectedSide = 'H';
    const coin = document.getElementById('coin');
    const balText = document.getElementById('balText');
    const flipBtn = document.getElementById('flipBtn');

    function setSide(s) {
        selectedSide = s;
        document.getElementById('btnH').className = s === 'H' ? 'pick-btn active-heads' : 'pick-btn';
        document.getElementById('btnT').className = s === 'T' ? 'pick-btn active-tails' : 'pick-btn';
    }

    function startFlip() {
        const amt = parseFloat(document.getElementById('betAmt').value);
        if (amt > balance || amt <= 0) return;

        balance -= amt;
        balText.innerText = balance.toFixed(2);
        flipBtn.disabled = true;

        const isHeads = Math.random() < 0.5;
        const resultSide = isHeads ? 'H' : 'T';

        // انيميشن الدوران السريع
        coin.style.transition = "transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)";
        const extraDeg = isHeads ? 1440 : 1620; // دورات كاملة + الوجه النهائي
        coin.style.transform = `rotateY(${extraDeg}deg)`;

        setTimeout(() => {
            // معالجة النتيجة
            if (resultSide === selectedSide) {
                // WIN (97% Payout)
                const win = amt * 1.97;
                balance += win;
                showNotification(true);
            } else {
                showNotification(false);
            }
            
            // إعادة تصفير الدوران للاستعداد للمرة القادمة بدون ملاحظة المستخدم
            setTimeout(() => {
                coin.style.transition = "none";
                coin.style.transform = isHeads ? "rotateY(0deg)" : "rotateY(180deg)";
                balText.innerText = balance.toFixed(2);
                flipBtn.disabled = false;
            }, 100);
            
        }, 650);
    }

    function showNotification(win) {
        // تأثير بصري سريع على الخلفية
        document.body.style.backgroundColor = win ? "#064e3b" : "#450a0a";
        setTimeout(() => {
            document.body.style.backgroundColor = "var(--bg)";
        }, 200);
    }
</script>
</body>
</html>
