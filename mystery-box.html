<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA | Mystery Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --card: rgba(255, 255, 255, 0.04); --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            background: radial-gradient(circle at top right, #1a0b2e, #060914);
            padding-bottom: 100px;
        }

        .header { padding: 40px 20px 20px; text-align: center; }
        .header h1 { font-size: 28px; font-weight: 900; margin: 0; letter-spacing: -1px; }
        .header span { color: var(--brand); text-shadow: 0 0 15px var(--brand); }

        .section-title { 
            padding: 0 20px; margin: 20px 0 10px; font-size: 14px; 
            color: var(--muted); text-transform: uppercase; letter-spacing: 2px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title::after { content: ""; height: 1px; background: var(--border); flex: 1; }

        .boxes-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; padding: 0 20px;
        }

        .box-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; padding: 20px 10px; text-align: center;
            transition: 0.3s; position: relative; overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .box-card:active { transform: scale(0.95); }

        .box-icon {
            font-size: 40px; margin-bottom: 10px; display: block;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        .box-card.premium .box-icon { color: #ffd700; filter: drop-shadow(0 0 15px #ffd700); }
        .box-card.standard .box-icon { color: var(--accent); }

        .box-name { font-weight: 800; font-size: 14px; display: block; margin-bottom: 5px; }
        .box-price { 
            font-size: 18px; font-weight: 900; color: #fff; 
            display: block; margin-bottom: 12px; 
        }

        .buy-btn {
            background: rgba(255,255,255,0.1); border: none; color: #fff;
            padding: 8px 15px; border-radius: 10px; font-size: 12px;
            font-weight: 700; width: 100%; cursor: pointer; transition: 0.3s;
        }

        .box-card:hover .buy-btn { background: var(--brand); box-shadow: 0 5px 15px var(--brand); }

        /* --- Bottom Nav --- */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 80px;
            background: rgba(17, 20, 29, 0.95); display: flex; justify-content: space-around;
            align-items: center; border-top: 1px solid var(--border); backdrop-filter: blur(10px);
        }
        .nav-item { color: #444; font-size: 22px; text-decoration: none; text-align: center; }
        .nav-item.active { color: var(--brand); }
        .nav-item span { display: block; font-size: 10px; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>LUCKY <span>BOXES</span></h1>
        <p style="color: #888; font-size: 12px;">Unbox Rare Digital Assets</p>
    </div>

    <div class="section-title">Starter Boxes</div>
    <div class="boxes-grid">
        <div class="box-card standard" onclick="openPurchase(5)">
            <i class="fa-solid fa-box box-icon"></i>
            <span class="box-name">Basic Drop</span>
            <span class="box-price">$5.00</span>
            <button class="buy-btn">OPEN</button>
        </div>
        <div class="box-card standard" onclick="openPurchase(10)">
            <i class="fa-solid fa-box box-icon"></i>
            <span class="box-name">Silver Box</span>
            <span class="box-price">$10.00</span>
            <button class="buy-btn">OPEN</button>
        </div>
        <div class="box-card standard" onclick="openPurchase(15)">
            <i class="fa-solid fa-box box-icon"></i>
            <span class="box-name">Gold Box</span>
            <span class="box-price">$15.00</span>
            <button class="buy-btn">OPEN</button>
        </div>
        <div class="box-card standard" onclick="openPurchase(25)">
            <i class="fa-solid fa-box box-icon"></i>
            <span class="box-name">Platinum Box</span>
            <span class="box-price">$25.00</span>
            <button class="buy-btn">OPEN</button>
        </div>
    </div>

    <div class="section-title">Elite Chests</div>
    <div class="boxes-grid">
        <div class="box-card premium" onclick="openPurchase(40)">
            <i class="fa-solid fa-box-open box-icon"></i>
            <span class="box-name">Elite Chest</span>
            <span class="box-price">$40.00</span>
            <button class="buy-btn">OPEN</button>
        </div>
        <div class="box-card premium" onclick="openPurchase(60)">
            <i class="fa-solid fa-box-open box-icon"></i>
            <span class="box-name">Master Chest</span>
            <span class="box-price">$60.00</span>
            <button class="buy-btn">OPEN</button>
        </div>
        <div class="box-card premium" onclick="openPurchase(80)">
            <i class="fa-solid fa-box-open box-icon"></i>
            <span class="box-name">Grand Master</span>
            <span class="box-price">$80.00</span>
            <button class="buy-btn">OPEN</button>
        </div>
        <div class="box-card premium" onclick="openPurchase(100)">
            <i class="fa-solid fa-box-open box-icon"></i>
            <span class="box-name">Legendary Box</span>
            <span class="box-price">$100.00</span>
            <button class="buy-btn">OPEN</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="game.html" class="nav-item active"><i class="fa-solid fa-gamepad"></i><span>Game</span></a>
        <a href="bot-trade.html" class="nav-item"><i class="fa-solid fa-robot"></i><span>Bot</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
    </nav>

    <script>
        function openPurchase(price) {
            // هنا نضع المنطق الخاص بفتح الصندوق
            const confirmOpen = confirm(`Do you want to open this box for $${price}?`);
            if(confirmOpen) {
                alert(`Processing... You will be redirected to the unboxing animation.`);
                // يمكنك هنا توجيه المستخدم لصفحة الأنيميشن أو سحب الرصيد
            }
        }
    </script>
</body>
</html>
