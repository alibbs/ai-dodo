<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | OKX Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .signup-card {
            background-color: #121212;
            border-radius: 28px;
            border: 1px solid #262626;
        }
        .input-field {
            background-color: #1c1c1c;
            border: 1px solid #333;
            transition: all 0.2s ease-in-out;
        }
        .input-field:focus {
            border-color: #fff;
            outline: none;
        }
        .btn-primary {
            background-color: #ffffff;
            color: #000;
            transition: transform 0.1s active;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div class="signup-card w-full max-w-md p-8 shadow-2xl">
        <div class="mb-6">
            <h1 class="text-white text-3xl font-bold tracking-tighter">OKX</h1>
        </div>

        <h2 class="text-white text-2xl font-semibold mb-2">Create account</h2>
        <p class="text-gray-400 text-sm mb-8">Join the world's leading crypto exchange.</p>

        <form id="signupForm" class="space-y-5">
            <div>
                <label class="block text-gray-400 text-xs font-bold uppercase mb-2" for="email">Email or Phone</label>
                <input type="text" id="email" class="input-field w-full p-4 rounded-2xl text-white placeholder-gray-600" placeholder="Enter your email/phone">
            </div>

            <div>
                <label class="block text-gray-400 text-xs font-bold uppercase mb-2" for="password">Password</label>
                <input type="password" id="password" class="input-field w-full p-4 rounded-2xl text-white placeholder-gray-600" placeholder="Minimum 8 characters">
            </div>

            <div>
                <label class="block text-gray-400 text-xs font-bold uppercase mb-2" for="referral">Referral Code (Optional)</label>
                <input type="text" id="referral" class="input-field w-full p-4 rounded-2xl text-white placeholder-gray-600" placeholder="Enter invite code">
            </div>

            <p class="text-[11px] text-gray-500 leading-relaxed">
                By clicking "Sign up", you agree to the 
                <a href="#" class="text-blue-400">Terms of Service</a> and 
                <a href="#" class="text-blue-400">Privacy Policy</a>.
            </p>

            <button type="submit" class="btn-primary w-full py-4 rounded-full font-bold text-lg shadow-lg">
                Sign up
            </button>
        </form>

        <div class="mt-8 text-center border-t border-gray-800 pt-6">
            <p class="text-gray-400 text-sm">
                Already have an account? 
                <a href="#" class="text-white font-bold hover:underline">Log in</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Ready for Firebase integration (auth.createUserWithEmailAndPassword)
            const email = document.getElementById('email').value;
            const referral = document.getElementById('referral').value;
            console.log("Account Creation:", email, "Referral:", referral);
        });
    </script>
</body>
</html>
