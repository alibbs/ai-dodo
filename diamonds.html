<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMANA GLOBAL | Diamond Mines</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #060914;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --brand: #a100ff;
            --brand2: #ff00b8;
            --accent: #00f2ff;
            --success: #00ff96;
            --error: #ff0050;
            --radius: 20px;
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }

        .game-wrap {
            width: 100%; max-width: 450px; padding: 20px;
            background: var(--card-bg); backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: var(--radius);
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0; font-weight: 900; background: linear-gradient(to right, var(--accent), var(--brand2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* الشبكة */
        .grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
            margin-bottom: 25px; perspective: 1000px;
        }

        .tile {
            aspect-ratio: 1; background: rgba(255,255,255,0.07);
            border-radius: 12px; border: 1px solid var(--border);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 24px; transition: 0.3s; position: relative;
        }

        .tile:hover { background: rgba(255,255,255,0.12); transform: scale(1.05); }
        .tile.revealed { cursor: default; transform: rotateY(180deg); background: rgba(0,0,0,0.3); }
        .tile i { opacity: 0; transition: 0.3s; transform: rotateY(180deg); }
        .tile.revealed i { opacity: 1; }

        /* الألوان */
        .d-blue { color: #00f2ff; }
        .d-pink { color: #ff00b8; }
        .d-yellow { color: #ffaa00; }
        .d-bomb { color: var(--error); }

        /* لوحة التحكم */
        .controls { display: flex; flex-direction: column; gap: 15px; }
        .input-box { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; color: var(--muted); font-weight: 800; text-transform: uppercase; }
        
        input, select {
            background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            padding: 12px; border-radius: 10px; color: #fff; outline: none; font-weight: bold;
        }

        .stats {
            display: flex; justify-content: space-between; 
            padding: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; margin-bottom: 15px;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--brand), var(--brand2));
            border: none; padding: 16px; border-radius: 14px; color: #fff;
            font-weight: 900; cursor: pointer; transition: 0.3s;
        }
        .btn-main:disabled { opacity: 0.4; filter: grayscale(1); }

        .cashout-btn { background: var(--success); color: #000; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="game-wrap">
    <div class="header">
        <h2>DIAMOND MINES</h2>
    </div>

    <div class="stats">
        <div>Multiplier: <span id="multText" style="color: var(--accent);">1.00x</span></div>
        <div>Profit: <span id="profitText" style="color: var(--success);">$0.00</span></div>
    </div>

    <div class="grid" id="gameGrid">
        </div>

    <div class="controls">
        <div class="input-box">
            <label>Amount</label>
            <input type="number" id="betAmount" value="10">
        </div>
        <div class="input-box">
            <label>Bombs</label>
            <select id="bombCount">
                <option value="1">1 Bomb</option>
                <option value="3" selected>3 Bombs</option>
                <option value="5">5 Bombs</option>
                <option value="10">10 Bombs</option>
            </select>
        </div>
        <button class="btn-main" id="startBtn">BET</button>
        <button class="btn-main cashout-btn" id="cashoutBtn">CASHOUT</button>
    </div>
</div>

<script>
    const grid = document.getElementById('gameGrid');
    const startBtn = document.getElementById('startBtn');
    const cashoutBtn = document.getElementById('cashoutBtn');
    const multText = document.getElementById('multText');
    const profitText = document.getElementById('profitText');

    let gameActive = false;
    let tiles = [];
    let bombs = [];
    let revealedCount = 0;
    let currentMult = 1.00;

    const gemTypes = [
        { icon: 'fa-gem', class: 'd-blue' },
        { icon: 'fa-gem', class: 'd-pink' },
        { icon: 'fa-gem', class: 'd-yellow' }
    ];

    // إنشاء الشبكة لأول مرة
    function createBoard() {
        grid.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.dataset.index = i;
            tile.addEventListener('click', () => revealTile(i));
            grid.appendChild(tile);
        }
    }

    function initGame() {
        const bombNum = parseInt(document.getElementById('bombCount').value);
        bombs = [];
        while(bombs.length < bombNum) {
            let r = Math.floor(Math.random() * 25);
            if(!bombs.includes(r)) bombs.push(r);
        }
        
        gameActive = true;
        revealedCount = 0;
        currentMult = 1.00;
        updateStats();
        
        startBtn.disabled = true;
        cashoutBtn.style.display = 'block';
        createBoard();
    }

    function revealTile(index) {
        if (!gameActive) return;
        const tile = grid.children[index];
        if (tile.classList.contains('revealed')) return;

        tile.classList.add('revealed');
        
        if (bombs.includes(index)) {
            // خسر اللاعب
            tile.innerHTML = '<i class="fa-solid fa-bomb d-bomb"></i>';
            gameOver(false);
        } else {
            // ربح ألماسة
            const gem = gemTypes[Math.floor(Math.random() * gemTypes.length)];
            tile.innerHTML = `<i class="fa-solid ${gem.icon} ${gem.class}"></i>`;
            revealedCount++;
            calculateMultiplier();
            updateStats();
        }
    }

    function calculateMultiplier() {
        const bombNum = parseInt(document.getElementById('bombCount').value);
        // معادلة تقريبية للربح بناءً على عدد القنابل والمربعات المفتوحة
        currentMult = 1 + (revealedCount * (bombNum * 0.25));
    }

    function updateStats() {
        const bet = parseFloat(document.getElementById('betAmount').value);
        multText.textContent = currentMult.toFixed(2) + 'x';
        profitText.textContent = '$' + (bet * currentMult).toFixed(2);
    }

    function gameOver(win) {
        gameActive = false;
        startBtn.disabled = false;
        cashoutBtn.style.display = 'none';

        // كشف باقي القنابل
        bombs.forEach(index => {
            const t = grid.children[index];
            if (!t.classList.contains('revealed')) {
                t.classList.add('revealed');
                t.innerHTML = '<i class="fa-solid fa-bomb d-bomb" style="opacity:0.5"></i>';
            }
        });

        if (!win) {
            multText.textContent = "1.00x";
            profitText.textContent = "$0.00";
            alert("BOMB! You lost your bet.");
        }
    }

    startBtn.addEventListener('click', initGame);
    cashoutBtn.addEventListener('click', () => {
        const bet = parseFloat(document.getElementById('betAmount').value);
        alert(`CONGRATS! You cashed out $${(bet * currentMult).toFixed(2)}`);
        gameOver(true);
    });

    createBoard();
</script>

</body>
</html>
