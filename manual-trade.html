<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>AMANA ELITE+ | Futures Terminal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --up: #02c076; --down: #f84960;
            --border: rgba(255, 255, 255, 0.08); --card: #12151c;
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- Top Header (Binance Style) --- */
        .header {
            padding: 15px; background: var(--card); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .pair-info h2 { margin: 0; font-size: 18px; color: #fff; }
        .pair-info span { font-size: 12px; color: var(--up); font-weight: bold; }

        .wallet-info { text-align: right; }
        .wallet-info small { color: #888; display: block; font-size: 10px; }
        .wallet-info b { color: var(--accent); font-size: 14px; }

        /* --- Asset Selector --- */
        .asset-nav {
            display: flex; overflow-x: auto; background: #0b0e1a; padding: 10px; gap: 10px;
        }
        .asset-nav::-webkit-scrollbar { display: none; }
        .asset-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border);
            padding: 6px 15px; border-radius: 6px; font-size: 11px; color: #ccc; cursor: pointer;
        }
        .asset-btn.active { border-color: var(--brand); color: var(--brand); background: rgba(255,0,184,0.1); }

        /* --- Chart Section --- */
        #chart-container { flex-grow: 1; position: relative; }

        /* --- Trading Panel --- */
        .trade-box {
            background: var(--card); border-top: 1px solid var(--border);
            padding: 20px; padding-bottom: 100px;
        }
        .mode-tabs {
            display: flex; background: rgba(0,0,0,0.2); border-radius: 10px; padding: 4px; margin-bottom: 15px;
        }
        .mode-btn {
            flex: 1; border: none; background: transparent; color: #666; 
            padding: 8px; font-weight: bold; border-radius: 8px;
        }
        .mode-btn.active-buy { background: var(--up); color: #fff; }
        .mode-btn.active-sell { background: var(--down); color: #fff; }

        .input-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .field { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
        .field label { display: block; font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
        .field input { width: 100%; background: transparent; border: none; color: #fff; font-weight: bold; outline: none; }

        .liq-warning {
            font-size: 10px; color: #f84960; text-align: center; margin-bottom: 10px; display: none;
        }

        .main-action {
            width: 100%; padding: 16px; border-radius: 12px; border: none;
            color: #fff; font-weight: 900; font-size: 16px; cursor: pointer;
        }
        .bg-buy { background: var(--up); }
        .bg-sell { background: var(--down); }

        /* --- Bottom Nav --- */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 75px; 
            background: #0b0e1a; border-top: 1px solid var(--border); 
            display: flex; justify-content: space-around; align-items: center; 
        }
        .nav-link { text-decoration: none; color: #444; font-size: 10px; text-align: center; }
        .nav-link.active { color: var(--brand); }
        .nav-link i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="pair-info">
            <h2 id="pairName">BTCUSDT Perpendicular</h2>
            <span id="livePrice">0.00</span>
        </div>
        <div class="wallet-info">
            <small>Available Balance</small>
            <b id="userBalance">0.00</b> <span style="font-size: 10px; color: #888;">USDT</span>
        </div>
    </div>

    <div class="asset-nav">
        <div class="asset-btn active" onclick="changeSymbol('BTCUSDT', this)">BTC</div>
        <div class="asset-btn" onclick="changeSymbol('ETHUSDT', this)">ETH</div>
        <div class="asset-btn" onclick="changeSymbol('SOLUSDT', this)">SOL</div>
        <div class="asset-btn" onclick="changeSymbol('BNBUSDT', this)">BNB</div>
        <div class="asset-btn" onclick="changeSymbol('XRPUSDT', this)">XRP</div>
    </div>

    <div id="chart-container"></div>

    <div class="trade-box">
        <div class="mode-tabs">
            <button class="mode-btn active-buy" id="buyTab" onclick="setMode('BUY')">Buy / Long</button>
            <button class="mode-btn" id="sellTab" onclick="setMode('SELL')">Sell / Short</button>
        </div>

        <div class="input-row">
            <div class="field">
                <label>Amount (USDT)</label>
                <input type="number" id="tradeAmount" value="50">
            </div>
            <div class="field">
                <label>Leverage (Max 75x)</label>
                <input type="number" id="levInput" value="10" max="75">
            </div>
        </div>

        <div class="liq-warning" id="liqMsg">⚠ WARNING: LIQUIDATION AT 68% LOSS</div>

        <button class="main-action bg-buy" id="actionBtn" onclick="openPosition()">Open Long</button>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-link"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="game.html" class="nav-link active"><i class="fa-solid fa-chart-line"></i><span>Futures</span></a>
        <a href="overview.html" class="nav-link"><i class="fa-solid fa-wallet"></i><span>Wallet</span></a>
    </nav>

<script type="module">
    // --- Firebase Configuration ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
        authDomain: "ai-dodo.firebaseapp.com",
        projectId: "ai-dodo",
        storageBucket: "ai-dodo.firebasestorage.app",
        messagingSenderId: "261622335803",
        appId: "1:261622335803:web:0b066791230535e7d5cf1e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentBalance = 0;
    let userUID = null;
    let currentMode = 'BUY';
    let currentSymbol = 'BTCUSDT';
    let entryPrice = 0;

    // --- Chart Setup ---
    const chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
        layout: { backgroundColor: 'transparent', textColor: '#888' },
        grid: { vertLines: { color: '#1a1d26' }, horzLines: { color: '#1a1d26' } },
        rightPriceScale: { borderColor: '#333' },
        timeScale: { borderColor: '#333' }
    });
    const candleSeries = chart.addCandlestickSeries({
        upColor: '#02c076', downColor: '#f84960', borderVisible: false,
        wickUpColor: '#02c076', wickDownColor: '#f84960'
    });

    // --- Data Fetching ---
    let ws;
    window.changeSymbol = (symbol, el) => {
        currentSymbol = symbol;
        document.querySelectorAll('.asset-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('pairName').textContent = symbol + " Perp";
        initStream(symbol);
    };

    function initStream(symbol) {
        if (ws) ws.close();
        ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_1m`);
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            const k = data.k;
            const price = parseFloat(k.c);
            candleSeries.update({
                time: k.t / 1000, open: k.o, high: k.h, low: k.l, close: k.c
            });
            document.getElementById('livePrice').textContent = price.toFixed(2);
            entryPrice = price; // Current market price for entry
        };
    }

    // --- Trade Logic ---
    window.setMode = (mode) => {
        currentMode = mode;
        const buyTab = document.getElementById('buyTab');
        const sellTab = document.getElementById('sellTab');
        const btn = document.getElementById('actionBtn');
        
        if(mode === 'BUY') {
            buyTab.classList.add('active-buy'); sellTab.classList.remove('active-sell');
            btn.className = "main-action bg-buy"; btn.textContent = "Open Long";
        } else {
            sellTab.classList.add('active-sell'); buyTab.classList.remove('active-buy');
            btn.className = "main-action bg-sell"; btn.textContent = "Open Short";
        }
    };

    window.openPosition = async () => {
        const amount = parseFloat(document.getElementById('tradeAmount').value);
        if (amount > currentBalance) return alert("Insufficient Margin!");

        const lev = parseInt(document.getElementById('levInput').value);
        const liqPrice = currentMode === 'BUY' ? 
            entryPrice * (1 - (0.68 / lev)) : 
            entryPrice * (1 + (0.68 / lev));

        const confirmTrade = confirm(`Confirm Position:\n${currentSymbol} x${lev}\nEntry: ${entryPrice}\nEst. Liquidation: ${liqPrice.toFixed(2)}`);
        
        if(confirmTrade) {
            const userRef = doc(db, "users", userUID);
            await updateDoc(userRef, { balance: increment(-amount) });
            alert("Position Opened! Monitoring for Liquidation...");
            // Logic to track liquidation can be added here
        }
    };

    // --- User Data ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            userUID = user.uid;
            onSnapshot(doc(db, "users", user.uid), (snap) => {
                currentBalance = snap.data().balance || 0;
                document.getElementById('userBalance').textContent = currentBalance.toFixed(2);
            });
        }
    });

    initStream('BTCUSDT');
</script>
</body>
</html>
