<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA GLOBAL | Financial Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg: #060914;
            --brand: #ff00b8;
            --accent: #00f2ff;
            --text: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --up: #00ff96;
            --down: #ff3b3b;
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: var(--text);
            padding-bottom: 110px;
            background: radial-gradient(circle at top right, #1a0b2e 0%, #060914 100%);
        }

        .container { padding: 20px; max-width: 450px; margin: auto; }

        /* --- Real Credit Card Design --- */
        .credit-card {
            width: 100%; height: 220px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.02) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px; padding: 25px; box-sizing: border-box;
            position: relative; overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
            margin-bottom: 30px;
        }
        .credit-card::before {
            content: ''; position: absolute; top: -20%; right: -10%; width: 150px; height: 150px;
            background: var(--brand); filter: blur(60px); opacity: 0.3; z-index: 0;
        }
        .card-content { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; justify-content: space-between; }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-top i { font-size: 28px; color: rgba(255,255,255,0.8); }
        .card-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #aaa; }
        
        .card-balance { font-size: 32px; font-weight: 900; margin-top: 5px; letter-spacing: -1px; }
        .card-balance small { font-size: 14px; color: var(--brand); margin-left: 5px; }

        .card-stats { display: flex; gap: 20px; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .stat-box { font-size: 11px; color: #ccc; }
        .stat-box b { display: block; font-size: 14px; color: var(--up); }
        .stat-box b.game-profit { color: var(--accent); }

        .request-card-btn {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 6px 12px; border-radius: 10px; font-size: 10px;
            font-weight: 700; cursor: pointer; backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        .request-card-btn:hover { background: var(--brand); border-color: var(--brand); }

        /* --- Actions Grid --- */
        .action-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 30px; }
        .action-item {
            background: var(--card-bg); border: 1px solid var(--border);
            padding: 15px 5px; border-radius: 18px; text-align: center;
            cursor: pointer; transition: 0.2s;
        }
        .action-item i { font-size: 18px; margin-bottom: 8px; display: block; color: var(--accent); }
        .action-item span { font-size: 10px; font-weight: 700; }

        /* --- Live Markets --- */
        .market-header { display: flex; justify-content: space-between; font-size: 12px; color: #666; font-weight: 800; padding: 0 10px 10px; }
        .asset-list { display: flex; flex-direction: column; gap: 10px; }
        .asset-row {
            background: rgba(255,255,255,0.02); border: 1px solid var(--border);
            padding: 16px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .asset-left { display: flex; align-items: center; gap: 12px; }
        .asset-icon { width: 38px; height: 38px; border-radius: 50%; background: #1a1a2e; display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--brand); border: 1px solid var(--border); }
        .price-text { display: block; font-weight: 800; font-size: 15px; }

        /* --- Modal --- */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .modal-content { background: #11111d; border: 1px solid var(--border); width: 85%; max-width: 380px; padding: 25px; border-radius: 30px; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; color: #555; cursor: pointer; }
        .modal-input { width: 100%; padding: 15px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 15px; color: white; margin-bottom: 15px; box-sizing: border-box; }
        .modal-btn { width: 100%; padding: 16px; border-radius: 15px; border: none; background: var(--brand); color: white; font-weight: 900; cursor: pointer; }

        /* --- Nav --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: rgba(6, 9, 20, 0.98); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { text-decoration: none; color: #444; text-align: center; flex: 1; font-size: 10px; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--brand); }
    </style>
</head>
<body>

<div class="container">
    <div class="credit-card">
        <div class="card-content">
            <div class="card-top">
                <div>
                    <div class="card-label">Total Portfolio</div>
                    <div class="card-balance" id="displayBalance">0.00<small>USDT</small></div>
                </div>
                <i class="fa-solid fa-layer-group"></i>
            </div>
            
            <div class="card-stats">
                <div class="stat-box">
                    Bot Profit
                    <b id="displayBotProfit">+$0.00</b>
                </div>
                <div class="stat-box">
                    Game Win
                    <b class="game-profit" id="displayGameProfit">+$0.00</b>
                </div>
            </div>
        </div>
        <button class="request-card-btn" onclick="location.href='https://wa.me/yournumber'">Request Physical Card</button>
    </div>

    <div class="action-grid">
        <div class="action-item" onclick="openModal('deposit')"><i class="fa-solid fa-circle-down"></i><span>Deposit</span></div>
        <div class="action-item" onclick="openModal('withdraw')"><i class="fa-solid fa-circle-up"></i><span>Withdraw</span></div>
        <div class="action-item" onclick="openModal('swap')"><i class="fa-solid fa-rotate"></i><span>Swap</span></div>
        <div class="action-item" onclick="openModal('history')"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></div>
    </div>

    <div class="market-header"><span>Market Watch</span><span>Live Price</span></div>
    <div class="asset-list" id="marketList">
        <div class="asset-row" id="r-btc"><div class="asset-left"><div class="asset-icon" style="color:#f7931a">₿</div><div><b>BTC</b></div></div><div class="asset-right"><span class="price-text" id="p-btc">...</span></div></div>
        <div class="asset-row" id="r-eth"><div class="asset-left"><div class="asset-icon" style="color:#627eea">Ξ</div><div><b>ETH</b></div></div><div class="asset-right"><span class="price-text" id="p-eth">...</span></div></div>
        <div class="asset-row" id="r-sol"><div class="asset-left"><div class="asset-icon" style="color:#14f195">S</div><div><b>SOL</b></div></div><div class="asset-right"><span class="price-text" id="p-sol">...</span></div></div>
    </div>
</div>

<div id="actionModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2 id="modalTitle" style="color:#fff; text-align:center;">Action</h2>
        <div id="modalBody"></div>
        <div id="modalFooter"><button class="modal-btn" onclick="processAction()">Confirm Transaction</button></div>
    </div>
</div>

<nav class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="game.html" class="nav-item"><i class="fa-solid fa-gamepad"></i><span>Game</span></a>
    <a href="bot-trade.html" class="nav-item"><i class="fa-solid fa-robot"></i><span>Bot</span></a>
    <a href="overview.html" class="nav-item active"><i class="fa-solid fa-chart-pie"></i><span>Overview</span></a>
    <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
      authDomain: "ai-dodo.firebaseapp.com",
      projectId: "ai-dodo",
      storageBucket: "ai-dodo.firebasestorage.app",
      messagingSenderId: "261622335803",
      appId: "1:261622335803:web:0b066791230535e7d5cf1e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let userTRC20 = ""; // لتخزين العنوان القادم من Firestore

    onAuthStateChanged(auth, (user) => {
        if (user) {
            onSnapshot(doc(db, "users", user.uid), (snap) => {
                if (snap.exists()) {
                    const d = snap.data();
                    document.getElementById('displayBalance').innerHTML = `${(d.balance || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}<small>USDT</small>`;
                    document.getElementById('displayBotProfit').textContent = `+$${(d.bot_profit || 0).toFixed(2)}`;
                    document.getElementById('displayGameProfit').textContent = `+$${(d.game_profit || 0).toFixed(2)}`;
                    userTRC20 = d.trc20_address || "Pending Assignment...";
                }
            });
        } else {
            window.location.href = "login.html";
        }
    });

    window.openModal = function(type) {
        const modal = document.getElementById('actionModal');
        const title = document.getElementById('modalTitle');
        const body = document.getElementById('modalBody');
        const footer = document.getElementById('modalFooter');
        modal.style.display = 'flex';
        footer.style.display = 'block';

        if(type === 'deposit') {
            title.textContent = "Deposit (TRC20)";
            body.innerHTML = `
                <p style="font-size:11px; color:#888;">Only USDT TRC20 is accepted. Deposit to your unique address:</p>
                <div style="background:#000; padding:15px; border-radius:12px; font-size:12px; word-break:break-all; border:1px dashed var(--brand); color:var(--up); text-align:center; font-family:monospace;">
                    ${userTRC20}
                </div>
                <p style="font-size:10px; color:orange; margin-top:10px;">* Funds will appear after 1 confirmation.</p>
            `;
        } else if(type === 'withdraw') {
            title.textContent = "Withdraw (TRC20)";
            body.innerHTML = `<input type="text" id="wAddr" class="modal-input" placeholder="Your TRC20 Address"><input type="number" id="wAmt" class="modal-input" placeholder="Amount">`;
        } else if(type === 'swap') {
            title.textContent = "Instant Swap";
            body.innerHTML = `<select class="modal-input"><option>USDT to BTC</option><option>USDT to ETH</option></select><input type="number" class="modal-input" placeholder="Amount">`;
        } else if(type === 'history') {
            title.textContent = "Activity History";
            footer.style.display = 'none';
            body.innerHTML = `<p style="text-align:center; color:#555; font-size:12px;">No recent transactions found.</p>`;
        }
    }

    window.closeModal = function() { document.getElementById('actionModal').style.display = 'none'; }
    window.processAction = function() { alert("Request Sent to Security Node. Please wait."); closeModal(); }

    async function fetchPrices() {
        try {
            const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbols=["BTCUSDT","ETHUSDT","SOLUSDT"]');
            const data = await res.json();
            data.forEach(c => {
                const sym = c.symbol.replace('USDT','').toLowerCase();
                document.getElementById(`p-${sym}`).textContent = '$' + parseFloat(c.price).toLocaleString();
            });
        } catch(e) {}
    }
    setInterval(fetchPrices, 10000); fetchPrices();
</script>
</body>
</html>
