<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AMANA GLOBAL | Login</title>

<style>
:root{
--bg:#0b0f1f;
--text:#ffffff;
--muted:#b8b9d9;
--brand1:#a100ff;
--brand2:#ff00b8;
--glass:rgba(255,255,255,.05);
--border:rgba(255,255,255,.1);
--radius:20px;
}
*{box-sizing:border-box}
body{
margin:0;
font-family: 'Inter', system-ui, -apple-system;
background:linear-gradient(-45deg,#0b0f1f,#140b2d,#1c0833,#120822);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
color:var(--text);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
}
@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}
.wrap{width:100%;max-width:420px;}
.card{
background:var(--glass);
backdrop-filter:blur(25px);
border:1px solid var(--border);
border-radius:var(--radius);
padding:40px 30px;
text-align:center;
box-shadow: 0 20px 50px rgba(0,0,0,0.3);
}
.logo{
font-size:28px;
font-weight:900;
margin-bottom:10px;
background:linear-gradient(135deg,var(--brand1),var(--brand2));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
letter-spacing: -1px;
}
h1{margin:0 0 8px;font-size:24px;font-weight:800;}
.sub{margin:0 0 30px;color:var(--muted);font-size:14px;}
.form-group{text-align:left;margin-bottom:18px;}
label{
display:block;
font-weight:700;
font-size:13px;
margin-bottom:8px;
color:var(--muted);
}
.field{
width:100%;
padding:14px 16px;
border-radius:14px;
border:1px solid var(--border);
background:rgba(0,0,0,.3);
color:var(--text);
font-size:15px;
transition: 0.3s;
}
.field:focus{
outline:none;
border-color:var(--brand2);
box-shadow:0 0 15px rgba(255,0,184,.2);
}
.btn{
width:100%;
padding:16px;
border-radius:14px;
font-weight:800;
font-size:16px;
cursor:pointer;
border:none;
background:linear-gradient(135deg,var(--brand1),var(--brand2));
color:#fff;
margin-top:10px;
transition: 0.3s;
box-shadow: 0 10px 20px rgba(255, 0, 184, 0.2);
}
.btn:disabled { opacity: 0.6; cursor: not-allowed; }
.msg{
margin-top:20px;
padding:12px;
border-radius:12px;
display:none;
font-size:14px;
font-weight: 600;
}
.msg.error{background:rgba(255,0,80,.15);color:#ff4d8d; border: 1px solid rgba(255,0,80,0.2);}
.msg.success{background:rgba(0,255,184,.15);color:#00ffb8; border: 1px solid rgba(0,255,184,0.2);}
.footer-note{
margin-top:25px;
font-size:12px;
color:var(--muted);
}
</style>
</head>
<body>

<div class="wrap">
    <div class="card">
        <div class="logo">AMANA GLOBAL</div>
        <h1>Welcome Back</h1>
        <p class="sub">Authorize access to your AI Vault</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input id="email" class="field" type="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label>Security Password</label>
                <input id="password" class="field" type="password" placeholder="••••••••" required>
            </div>

            <button class="btn" type="submit" id="submitBtn">Authorize Login</button>
            <div id="msg" class="msg"></div>
        </form>

        <div class="footer-note">
            &copy; 2026 AMANA GLOBAL ELITE SYSTEM
        </div>
    </div>
</div>

<script type="module">
// استيراد مكتبات Firebase
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// إعدادات Firebase الخاصة بك
const firebaseConfig = {
  apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
  authDomain: "ai-dodo.firebaseapp.com",
  projectId: "ai-dodo",
  storageBucket: "ai-dodo.firebasestorage.app",
  messagingSenderId: "261622335803",
  appId: "1:261622335803:web:0b066791230535e7d5cf1e",
  measurementId: "G-60CEST92TT"
};

// تشغيل Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");
const submitBtn = document.getElementById("submitBtn");

// وظيفة إظهار الرسائل
function showMsg(text, type) {
    msg.style.display = "block";
    msg.className = "msg " + type;
    msg.textContent = text;
}

// فحص حالة المستخدم: إذا مسجل دخول مسبقاً، حوله فوراً للرئيسية
onAuthStateChanged(auth, (user) => {
    if (user) {
        window.location.href = "home.html";
    }
});

// التعامل مع الفورم عند الإرسال
form.addEventListener("submit", async (e) => {
    e.preventDefault();

    // تجهيز الزر
    submitBtn.disabled = true;
    submitBtn.textContent = "Verifying Credentials...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        // محاولة تسجيل الدخول
        await signInWithEmailAndPassword(auth, email, password);
        
        showMsg("Identity Verified. Redirecting...", "success");

        // تحويل بعد نجاح الدخول بـ 1 ثانية
        setTimeout(() => {
            window.location.href = "home.html";
        }, 1000);

    } catch (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Authorize Login";

        // التعامل مع أخطاء تسجيل الدخول
        console.error("Login Error:", error.code);
        
        if (error.code === "auth/user-not-found" || error.code === "auth/wrong-password" || error.code === "auth/invalid-credential") {
            showMsg("Invalid email or security password", "error");
        } else if (error.code === "auth/too-many-requests") {
            showMsg("Too many attempts. Try again later.", "error");
        } else {
            showMsg("System Error: " + error.message, "error");
        }
    }
});
</script>

</body>
</html>
