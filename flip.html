<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AMANA ELITE | COIN FLIP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@600;800;900&display=swap');

        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --accent: #8b5cf6;
            --gold: #facc15;
            --silver: #e2e8f0;
            --up: #00e701;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; }
        
        /* Top Navigation */
        .top-bar { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Orbitron'; font-weight: 900; font-size: 18px; letter-spacing: 1px; }
        .balance-display { background: var(--panel); padding: 8px 15px; border-radius: 10px; border: 1px solid var(--accent); font-family: 'Orbitron'; color: var(--gold); }

        /* Multiplier Strip */
        .m-strip { height: 40px; background: rgba(0,0,0,0.3); display: flex; align-items: center; gap: 10px; padding: 0 15px; overflow-x: auto; }
        .m-item { padding: 4px 12px; background: #21262d; border-radius: 5px; font-size: 11px; font-family: 'Orbitron'; color: #8b949e; }
        .m-item.active { background: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent); }

        /* Game Container */
        .main-container { height: calc(100% - 120px); display: flex; flex-direction: column; justify-content: space-between; }

        /* Coin Area (Center) */
        .coin-area { flex: 1; display: flex; align-items: center; justify-content: center; perspective: 1500px; position: relative; }
        .coin-box { width: 180px; height: 180px; position: relative; transform-style: preserve-3d; transition: transform 0.1s linear; }
        .coin { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.15, 0, 0.15, 1); }
        
        .face { 
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 8px solid #1a1a1a; backface-visibility: hidden;
        }
        .face i { font-size: 60px; margin-bottom: 5px; }
        .face span { font-size: 10px; font-weight: 900; font-family: 'Orbitron'; }

        .heads { background: radial-gradient(circle, #475569 0%, #1e293b 100%); color: var(--silver); }
        .tails { background: radial-gradient(circle, #fbbf24 0%, #92400e 100%); color: #451a03; transform: rotateY(180deg); }

        /* Controls Panel */
        .controls { background: var(--panel); padding: 20px; border-radius: 30px 30px 0 0; border-top: 1px solid var(--border); box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
        
        .bet-input-wrap { background: #0d1117; padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; display: flex; align-items: center; }
        .bet-input-wrap input { flex: 1; background: transparent; border: none; color: #fff; font-size: 18px; font-weight: 800; font-family: 'Orbitron'; }
        
        .grid-btns { display: none; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { padding: 15px; border-radius: 12px; border: none; font-weight: 900; cursor: pointer; transition: 0.2s; font-family: 'Inter'; text-transform: uppercase; }
        .btn-bet { background: var(--accent); color: #fff; width: 100%; padding: 18px; font-size: 16px; }
        .btn-h { background: rgba(255,255,255,0.05); border: 2px solid var(--silver); color: var(--silver); }
        .btn-t { background: rgba(255,255,255,0.05); border: 2px solid var(--gold); color: var(--gold); }
        .btn-cash { grid-column: span 2; background: var(--up); color: #000; font-size: 16px; margin-top: 10px; }

        /* History Bar */
        .history-bar { margin-top: 15px; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; height: 35px; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .hist-item { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; flex-shrink: 0; }
        .hist-h { background: var(--silver); color: #000; }
        .hist-t { background: var(--gold); color: #000; }

        .tossing { animation: toss 0.8s ease-in-out; }
        @keyframes toss { 0% { transform: translateY(0); } 50% { transform: translateY(-160px) scale(1.2); } 100% { transform: translateY(0); } }
        .disabled { opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo">AMANA <span style="color:var(--accent)">ELITE</span></div>
        <div class="balance-display"><i class="fa-solid fa-coins"></i> <span id="bal">1,000.00</span></div>
    </div>

    <div class="m-strip" id="mStrip">
        <div class="m-item">1.98x</div><div class="m-item">3.96x</div><div class="m-item">7.92x</div>
        <div class="m-item">15.8x</div><div class="m-item">31.6x</div><div class="m-item">63.2x</div>
    </div>

    <div class="main-container">
        <div class="coin-area">
            <div class="coin-box" id="coinBox">
                <div class="coin" id="coin">
                    <div class="face heads">
                        <i class="fa-solid fa-shield-cat"></i>
                        <span>HEADS</span>
                    </div>
                    <div class="face tails">
                        <i class="fa-solid fa-crown"></i>
                        <span>TAILS</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div id="betUI">
                <div class="bet-input-wrap">
                    <input type="number" id="betAmt" value="10.00">
                    <span style="color:#666; font-size:12px; font-weight:800;">USDT</span>
                </div>
                <button class="btn btn-bet" onclick="startBet()">PLACE BET</button>
            </div>

            <div id="gameUI" class="grid-btns">
                <button class="btn btn-h" id="hBtn" onclick="play('H')"><i class="fa-solid fa-shield-cat"></i><br>Heads</button>
                <button class="btn btn-t" id="tBtn" onclick="play('T')"><i class="fa-solid fa-crown"></i><br>Tails</button>
                <button class="btn btn-cash" id="cBtn" onclick="cashout()">CASHOUT</button>
            </div>

            <div class="history-bar" id="history">
                </div>
        </div>
    </div>

<script>
    let balance = 1000.00;
    let currentBet = 0;
    let round = 0;
    let currentRot = 0;
    const mults = [1.98, 3.96, 7.92, 15.84, 31.68, 63.36, 126.72];

    function startBet() {
        const amt = parseFloat(document.getElementById('betAmt').value);
        if(isNaN(amt) || amt <= 0 || amt > balance) return;
        balance -= amt; currentBet = amt; round = 0;
        updateUI();
        document.getElementById('betUI').style.display = 'none';
        document.getElementById('gameUI').style.display = 'grid';
        document.getElementById('cBtn').classList.add('disabled');
        document.querySelectorAll('.m-item').forEach(i => i.classList.remove('active'));
    }

    function play(choice) {
        setDisabled(true);
        // نظام الخسارة: نسبة الفوز تنخفض كلما تقدم اللاعب
        let winChance = round === 0 ? 0.48 : (0.45 - (round * 0.06));
        const win = Math.random() < winChance;
        const result = win ? choice : (choice === 'H' ? 'T' : 'H');

        // انيميشن الرمي
        const box = document.getElementById('coinBox');
        box.classList.remove('tossing'); void box.offsetWidth; box.classList.add('tossing');

        // الدوران
        const targetDeg = (result === 'H') ? 0 : 180;
        currentRot += 1440 + (targetDeg - (currentRot % 360));
        if(currentRot % 360 !== targetDeg) currentRot += 180;
        document.getElementById('coin').style.transform = `rotateY(${currentRot}deg)`;

        setTimeout(() => {
            addHistory(result);
            if(win) {
                round++;
                const m = mults[round-1];
                updateMBar();
                document.getElementById('cBtn').classList.remove('disabled');
                document.getElementById('cBtn').innerHTML = `CASHOUT ${(currentBet * m).toFixed(2)}`;
                setDisabled(false);
            } else {
                setTimeout(reset, 800);
            }
        }, 800);
    }

    function addHistory(res) {
        const h = document.getElementById('history');
        const item = document.createElement('div');
        item.className = `hist-item ${res === 'H' ? 'hist-h' : 'hist-t'}`;
        item.innerText = res;
        h.prepend(item);
    }

    function cashout() {
        balance += currentBet * mults[round-1];
        reset();
    }

    function reset() {
        document.getElementById('betUI').style.display = 'block';
        document.getElementById('gameUI').style.display = 'none';
        updateUI();
        setDisabled(false);
    }

    function updateUI() { document.getElementById('bal').innerText = balance.toFixed(2); }
    function updateMBar() {
        const chips = document.querySelectorAll('.m-item');
        chips.forEach((c, i) => c.className = (i === round-1) ? 'm-item active' : 'm-item');
    }
    function setDisabled(s) {
        document.getElementById('hBtn').classList.toggle('disabled', s);
        document.getElementById('tBtn').classList.toggle('disabled', s);
        document.getElementById('cBtn').classList.toggle('disabled', s);
    }
</script>
</body>
</html>
