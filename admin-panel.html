<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | User Devices</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body { background: #060914; color: white; font-family: sans-serif; padding: 20px; }
        .admin-container { max-width: 800px; margin: auto; }
        h1 { color: #ff00b8; border-bottom: 2px solid #222; padding-bottom: 10px; }
        .user-card { 
            background: rgba(255,255,255,0.05); border: 1px solid #333; 
            border-radius: 15px; padding: 15px; margin-bottom: 15px;
        }
        .user-header { display: flex; justify-content: space-between; align-items: center; }
        .user-email { font-weight: bold; color: #00f2ff; }
        .device-list { margin-top: 10px; padding-left: 10px; border-left: 2px solid #ff00b8; }
        .device-item { font-size: 12px; color: #aaa; margin-bottom: 5px; padding: 5px; background: rgba(0,0,0,0.2); border-radius: 5px; }
        .device-count { background: #ff00b8; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .status-tag { font-size: 10px; color: #00ff96; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1><i class="fa-solid fa-shield-halved"></i> Admin Control</h1>
    <div id="usersList">Loading Users Data...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
        authDomain: "ai-dodo.firebaseapp.com",
        projectId: "ai-dodo",
        storageBucket: "ai-dodo.firebasestorage.app",
        messagingSenderId: "261622335803",
        appId: "1:261622335803:web:0b066791230535e7d5cf1e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // دالة لجلب الجلسات (الأجهزة) لكل مستخدم
    async function getUserDevices(uid) {
        const sessionsRef = collection(db, "users", uid, "active_sessions");
        const snap = await getDocs(sessionsRef);
        let devices = [];
        snap.forEach(doc => {
            devices.push(doc.data());
        });
        return devices;
    }

    // مراقبة المستخدمين بشكل مباشر
    onSnapshot(collection(db, "users"), async (snapshot) => {
        const listDiv = document.getElementById('usersList');
        listDiv.innerHTML = '';

        for (const userDoc of snapshot.docs) {
            const userData = userDoc.data();
            const devices = await getUserDevices(userDoc.id);

            const card = document.createElement('div');
            card.className = 'user-card';
            
            let devicesHtml = devices.map(d => `
                <div class="device-item">
                    <i class="fa-solid fa-laptop-code"></i> <b>Platform:</b> ${d.platform} <br>
                    <i class="fa-solid fa-clock"></i> <b>Last Active:</b> ${new Date(d.last_active).toLocaleString()} <br>
                    <small>${d.info.substring(0, 50)}...</small>
                </div>
            `).join('');

            card.innerHTML = `
                <div class="user-header">
                    <div>
                        <span class="user-email">${userData.email || 'No Email'}</span>
                        <div class="status-tag">${userData.username || 'User'}</div>
                    </div>
                    <span class="device-count">${devices.length} Devices</span>
                </div>
                <div class="device-list">
                    ${devices.length > 0 ? devicesHtml : '<span style="color:#555">No active sessions tracked yet.</span>'}
                </div>
            `;
            listDiv.appendChild(card);
        }
    });
</script>

</body>
</html>
