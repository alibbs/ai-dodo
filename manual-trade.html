<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>AMANA ELITE+ | Pro Terminal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --up: #00ff96; --down: #ff3b3b; --card: #11141d;
            --border: rgba(255,255,255,0.12);
        }
        * { touch-action: manipulation; box-sizing: border-box; -webkit-user-select: none; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        .header { height: 60px; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; background: var(--card); border-bottom: 2px solid var(--brand); flex-shrink: 0; }
        .header h1 { font-size: 16px; font-weight: 900; }
        .header h1 span { color: var(--brand); }
        .bal-display { text-align: right; background: rgba(0,242,255,0.05); padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(0,242,255,0.2); }
        .bal-display small { font-size: 9px; color: #888; display: block; }
        .bal-display b { color: var(--accent); font-size: 16px; }

        .asset-bar { background: #000; padding: 8px 15px; display: flex; gap: 10px; overflow-x: auto; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .asset-chip { padding: 6px 15px; background: #1a1d26; border-radius: 6px; font-size: 11px; font-weight: 800; white-space: nowrap; border: 1px solid var(--border); transition: 0.2s; }
        .asset-chip.active { border-color: var(--brand); color: var(--brand); background: rgba(255,0,184,0.1); }

        #chart-half { height: 35vh; background: #000; position: relative; flex-shrink: 0; }
        
        .pos-summary-bar { background: #0c0f1a; padding: 10px 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 12px; flex-shrink: 0; }
        
        /* التعديل هنا لضمان السكرول */
        #manage-half { flex: 1; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }

        .tabs-nav { display: flex; background: var(--card); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: transparent; color: #555; font-weight: 800; font-size: 12px; text-transform: uppercase; }
        .tab-btn.active { color: var(--brand); border-bottom: 3px solid var(--brand); }

        /* تفعيل السكرول داخل التابات */
        .tab-content { flex: 1; overflow-y: auto; padding: 15px; display: none; -webkit-overflow-scrolling: touch; }
        .tab-content.active { display: block; }

        .slider-box { margin-bottom: 20px; background: rgba(255,255,255,0.02); padding: 10px; border-radius: 10px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 11px; color: #aaa; margin-bottom: 8px; }
        .slider-label b { color: #fff; font-size: 14px; }
        .range-slider { width: 100%; -webkit-appearance: none; height: 8px; border-radius: 10px; background: #222; outline: none; }
        .range-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: var(--brand); border: 3px solid #fff; cursor: pointer; }

        .btns-row { display: flex; gap: 10px; margin-top: 10px; padding-bottom: 10px; }
        .btn-trade { flex: 1; padding: 18px; border: none; border-radius: 10px; font-weight: 900; color: #fff; font-size: 15px; letter-spacing: 1px; }
        .bg-up { background: var(--up); }
        .bg-down { background: var(--down); }

        #positions-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px; }
        .pos-card { background: #161922; border-radius: 12px; padding: 15px; border-left: 5px solid var(--brand); border: 1px solid var(--border); }
        .pnl-val { font-size: 24px; font-weight: 900; margin: 5px 0; }
        .close-pos-btn { width: 100%; background: #2a2d37; color: #fff; border: 1px solid #444; padding: 12px; border-radius: 8px; font-weight: 800; margin-top: 12px; }
        
        #history-list { padding-bottom: 20px; }
        .hist-item { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <header class="header">
        <h1>AMANA <span>ELITE+</span></h1>
        <div class="bal-display">
            <small>AVAILABLE MARGIN</small>
            <b id="walletBal">0.00</b>
        </div>
    </header>

    <div class="asset-bar" id="assetBar">
        <div class="asset-chip active" onclick="changeAsset('BTCUSDT')">BTC</div>
        <div class="asset-chip" onclick="changeAsset('ETHUSDT')">ETH</div>
        <div class="asset-chip" onclick="changeAsset('SOLUSDT')">SOL</div>
        <div class="asset-chip" onclick="changeAsset('BNBUSDT')">BNB</div>
        <div class="asset-chip" onclick="changeAsset('XRPUSDT')">XRP</div>
    </div>

    <section id="chart-half">
        <div id="tv_widget" style="height: 100%;"></div>
    </section>

    <div class="pos-summary-bar">
        <span>Active Positions: <b id="pos-count" style="color:var(--brand)">0</b></span>
        <span>Total PNL: <b id="total-pnl">0.00 USDT</b></span>
    </div>

    <section id="manage-half">
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('trade', this)">Execution</button>
            <button class="tab-btn" onclick="switchTab('positions', this)">Open Orders</button>
            <button class="tab-btn" onclick="switchTab('hist', this)">History</button>
        </div>

        <div id="tab-trade" class="tab-content active">
            <div class="slider-box">
                <div class="slider-label">Amount Size: <b id="amt-val">0.00 USDT</b></div>
                <input type="range" min="0" max="100" value="0" class="range-slider" id="amt-slider">
            </div>
            <div class="slider-box" style="border-left: 3px solid var(--accent);">
                <div class="slider-label">Leverage Multiplier: <b id="lev-val">10x</b></div>
                <input type="range" min="1" max="75" value="10" class="range-slider" id="lev-slider">
            </div>
            <div style="font-size: 10px; color: #666; text-align: center; margin-bottom: 10px;">
                Estimated Entry Fee (2.5%): <span id="fee-est">0.00</span> USDT
            </div>
            <div class="btns-row">
                <button class="btn-trade bg-down" onclick="executeTrade('SHORT')">SHORT</button>
                <button class="btn-trade bg-up" onclick="executeTrade('LONG')">LONG</button>
            </div>
        </div>

        <div id="tab-positions" class="tab-content">
            <div id="positions-list">
                <div style="text-align:center; color:#555; margin-top:20px;">No active positions</div>
            </div>
        </div>

        <div id="tab-hist" class="tab-content">
            <div id="history-list"></div>
        </div>
    </section>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, increment, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
            authDomain: "ai-dodo.firebaseapp.com",
            projectId: "ai-dodo",
            storageBucket: "ai-dodo.firebasestorage.app",
            messagingSenderId: "261622335803",
            appId: "1:261622335803:web:0b066791230535e7d5cf1e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let uBal = 0, uID = null, prices = {}, positions = [], symbol = "BTCUSDT";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                uID = user.uid;
                onSnapshot(doc(db, "users", uID), (s) => {
                    const data = s.data() || {};
                    uBal = data.balance || 0;
                    document.getElementById('walletBal').textContent = uBal.toFixed(2);
                    positions = data.activePositions || [];
                    renderPositions();
                    renderHistory(data.history || []);
                });
            }
        });

        const amtSlider = document.getElementById('amt-slider');
        const levSlider = document.getElementById('lev-slider');
        
        amtSlider.oninput = () => {
            const val = ((amtSlider.value/100)*uBal).toFixed(2);
            document.getElementById('amt-val').textContent = val + " USDT";
            document.getElementById('fee-est').textContent = (val * 0.025).toFixed(2);
        };
        levSlider.oninput = () => document.getElementById('lev-val').textContent = levSlider.value + "x";

        window.changeAsset = (newSym) => {
            symbol = newSym;
            document.querySelectorAll('.asset-chip').forEach(c => c.classList.remove('active'));
            if(event) event.target.classList.add('active');
            new window.TradingView.widget({
                "autosize": true, "symbol": "BINANCE:"+symbol, "interval": "1", "theme": "dark",
                "container_id": "tv_widget", "hide_top_toolbar": true, "backgroundColor": "#060914"
            });
            initPriceFeed(newSym);
        };

        function initPriceFeed(sym) {
            const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${sym.toLowerCase()}@ticker`);
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                prices[sym] = parseFloat(data.c);
                updateLiveUI();
            };
        }
        initPriceFeed('BTCUSDT'); 

        window.executeTrade = async (side) => {
            const amt = (amtSlider.value / 100) * uBal;
            const lev = parseInt(levSlider.value);
            const entryFee = amt * 0.025;
            if(amt < 5) return alert("Min trade 5 USDT");
            if(amt + entryFee > uBal) return alert("Low balance");
            const newPos = { id: Date.now(), symbol, side, entry: prices[symbol], amt, lev, entryFee, liq: side === 'LONG' ? prices[symbol]*(1-(0.7/lev)) : prices[symbol]*(1+(0.7/lev)) };
            await updateDoc(doc(db, "users", uID), { balance: increment(-(amt + entryFee)), activePositions: arrayUnion(newPos) });
        };

        function updateLiveUI() {
            let totalPnl = 0;
            positions.forEach(pos => {
                const curPrice = prices[pos.symbol] || pos.entry;
                let diff = pos.side === 'LONG' ? (curPrice - pos.entry) : (pos.entry - curPrice);
                let pnl = ((diff / pos.entry) * pos.lev) * pos.amt;
                totalPnl += pnl;
                const pEl = document.getElementById(`pnl-${pos.id}`);
                const rEl = document.getElementById(`roe-${pos.id}`);
                if(pEl) {
                    pEl.textContent = (pnl >= 0 ? '+' : '') + pnl.toFixed(2) + " USDT";
                    pEl.style.color = pnl >= 0 ? 'var(--up)' : 'var(--down)';
                    let roe = (diff / pos.entry) * 100 * pos.lev;
                    rEl.textContent = (roe >= 0 ? '+' : '') + roe.toFixed(2) + "% ROE";
                    rEl.style.color = roe >= 0 ? 'var(--up)' : 'var(--down)';
                }
            });
            document.getElementById('total-pnl').textContent = totalPnl.toFixed(2) + " USDT";
            document.getElementById('total-pnl').style.color = totalPnl >= 0 ? 'var(--up)' : 'var(--down)';
            document.getElementById('pos-count').textContent = positions.length;
        }

        function renderPositions() {
            const container = document.getElementById('positions-list');
            if(positions.length === 0) { container.innerHTML = `<div style="text-align:center; color:#555; margin-top:20px;">No active positions</div>`; return; }
            container.innerHTML = positions.map(pos => `
                <div class="pos-card">
                    <div style="display:flex; justify-content:space-between; font-size:12px;">
                        <b>${pos.symbol} <span style="color:${pos.side==='LONG'?'var(--up)':'var(--down)'}">${pos.side} ${pos.lev}x</span></b>
                        <span>Entry: ${pos.entry.toFixed(2)}</span>
                    </div>
                    <div class="pnl-val" id="pnl-${pos.id}">...</div>
                    <div style="display:flex; justify-content:space-between; font-size:12px;">
                        <span id="roe-${pos.id}">0.00%</span>
                        <span style="color:#666">Liq: <span style="color:var(--down)">${pos.liq.toFixed(2)}</span></span>
                    </div>
                    <button class="close-pos-btn" onclick="closePosition(${pos.id})">CLOSE POSITION</button>
                </div>
            `).join('');
        }

        window.closePosition = async (posId) => {
            const pos = positions.find(p => p.id === posId);
            if(!pos) return;
            const curPrice = prices[pos.symbol] || pos.entry;
            let diff = pos.side === 'LONG' ? (curPrice - pos.entry) : (pos.entry - curPrice);
            let pnl = ((diff / pos.entry) * pos.lev) * pos.amt;
            const record = { symbol: pos.symbol, side: pos.side, pnl: pnl.toFixed(2), fee: pos.entryFee.toFixed(2), time: new Date().toLocaleTimeString() };
            await updateDoc(doc(db, "users", uID), { balance: increment(pos.amt + pnl), activePositions: arrayRemove(pos), history: arrayUnion(record) });
        };

        function renderHistory(history) {
            const container = document.getElementById('history-list');
            container.innerHTML = [...history].reverse().map(h => `
                <div class="hist-item">
                    <div style="display:flex; justify-content:space-between">
                        <b>${h.symbol} ${h.side}</b>
                        <span style="color:${h.pnl>=0?'var(--up)':'var(--down)'}">${h.pnl>=0?'+':''}${h.pnl} USDT</span>
                    </div>
                    <div style="font-size:10px; color:#555; margin-top:8px; display:flex; justify-content:space-between">
                        <span>Fee: ${h.fee} USDT</span><span>${h.time}</span>
                    </div>
                </div>
            `).join('');
        }

        window.switchTab = (t, btn) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + t).classList.add('active');
        };
        changeAsset('BTCUSDT');
    </script>
</body>
</html>
