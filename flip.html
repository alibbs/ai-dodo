<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AMANA ELITE | COIN FLIP STAKE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@600;800;900&display=swap');

        :root {
            --bg: #02040a;
            --panel: #0d111c;
            --accent: #8b5cf6;
            --gold: #fbbf24;
            --up: #00e701;
            --down: #ff3b3b;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 20px); }

        /* Multiplier Top Bar */
        .multiplier-bar {
            height: 55px; background: rgba(0,0,0,0.4); display: flex; align-items: center; 
            justify-content: flex-start; gap: 8px; border-bottom: 1px solid var(--border);
            padding: 0 15px; overflow-x: auto; scrollbar-width: none;
        }
        .m-chip { 
            padding: 6px 15px; border-radius: 10px; font-family: 'Orbitron'; font-size: 12px; 
            background: var(--panel); color: #475569; border: 1px solid var(--border); white-space: nowrap;
        }
        .m-chip.active { background: var(--accent); color: #fff; border-color: #fff; box-shadow: 0 0 15px rgba(139, 92, 246, 0.5); }

        header { height: 60px; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .balance-box { background: #000; padding: 8px 25px; border-radius: 50px; border: 2px solid var(--accent); display: flex; align-items: center; gap: 10px; }

        .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        #profitFloat {
            position: absolute; top: 10%; font-family: 'Orbitron'; font-weight: 900;
            color: var(--up); font-size: 28px; display: none; text-shadow: 0 0 20px var(--up);
        }

        .coin-container { width: 150px; height: 150px; perspective: 1000px; }
        .coin { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.4s ease-out; }
        .coin div {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            backface-visibility: hidden; display: flex; align-items: center; justify-content: center;
            font-size: 50px; border: 6px solid;
        }
        .heads { background: var(--panel); border-color: var(--accent); color: var(--accent); }
        .tails { background: var(--panel); border-color: var(--gold); color: var(--gold); transform: rotateY(180deg); }

        .controls { background: var(--panel); padding: 20px; border-radius: 30px 30px 0 0; border-top: 1px solid var(--border); }
        
        /* Buttons Logic */
        .input-section { transition: 0.3s; }
        .play-section { display: none; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .bet-box { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 15px; }
        .bet-box label { font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 800; display: block; margin-bottom: 5px; }
        .bet-box input { width: 100%; background: transparent; border: none; color: #fff; font-size: 22px; font-weight: 900; }

        .main-btn {
            width: 100%; padding: 20px; border-radius: 15px; border: none; font-weight: 900; 
            font-size: 1.1rem; cursor: pointer; text-transform: uppercase; transition: 0.2s;
        }
        .btn-bet { background: var(--accent); color: #fff; box-shadow: 0 5px 0 #5b21b6; }
        .btn-h { background: var(--panel); border: 2px solid var(--accent); color: var(--accent); }
        .btn-t { background: var(--panel); border: 2px solid var(--gold); color: var(--gold); }
        .btn-cashout { 
            grid-column: span 2; background: var(--up); color: #000; margin-top: 5px;
            box-shadow: 0 5px 0 #059669; height: 65px;
        }
        
        .disabled { opacity: 0.5; pointer-events: none; }
        .winning { animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }
    </style>
</head>
<body>

    <div class="multiplier-bar" id="mBar">
        <div class="m-chip">1.98x</div>
        <div class="m-chip">3.92x</div>
        <div class="m-chip">7.76x</div>
        <div class="m-chip">15.3x</div>
        <div class="m-chip">30.4x</div>
        <div class="m-chip">60.2x</div>
    </div>

    <header>
        <div class="balance-box">
            <i class="fa-solid fa-gem" style="color:var(--gold)"></i>
            <span id="balText">1000.00</span>
        </div>
    </header>

    <div class="game-area">
        <div id="profitFloat">1.98x</div>
        <div class="coin-container">
            <div id="coin" class="coin">
                <div class="heads"><i class="fa-solid fa-bolt"></i></div>
                <div class="tails"><i class="fa-solid fa-crown"></i></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div id="inputSection" class="input-section">
            <div class="bet-box">
                <label>Bet Amount</label>
                <input type="number" id="betAmt" value="10.00">
            </div>
            <button class="main-btn btn-bet" onclick="placeBet()">Bet</button>
        </div>

        <div id="playSection" class="play-section">
            <button class="main-btn btn-h" id="hBtn" onclick="flip('H')">HEADS</button>
            <button class="main-btn btn-t" id="tBtn" onclick="flip('T')">TAILS</button>
            <button class="main-btn btn-cashout" id="cashBtn" onclick="cashout()">CASHOUT</button>
        </div>
    </div>

<script>
    let balance = 1000.00;
    let currentBet = 0;
    let round = 0;
    const multipliers = [1.98, 3.92, 7.76, 15.36, 30.41, 60.21, 119.22];

    const coin = document.getElementById('coin');
    const balText = document.getElementById('balText');
    const inputSection = document.getElementById('inputSection');
    const playSection = document.getElementById('playSection');
    const cashBtn = document.getElementById('cashBtn');
    const profitFloat = document.getElementById('profitFloat');
    const mChips = document.querySelectorAll('.m-chip');

    // 1. مرحلة وضع الرهان
    function placeBet() {
        const amt = parseFloat(document.getElementById('betAmt').value);
        if (isNaN(amt) || amt > balance || amt <= 0) return;

        balance -= amt;
        currentBet = amt;
        round = 0;
        
        updateUI();
        
        // تبديل الواجهة
        inputSection.style.display = "none";
        playSection.style.display = "grid";
        cashBtn.classList.add('disabled'); // لا يمكن السحب قبل أول فوز
        
        // تصفير الشريط العلوي
        mChips.forEach(c => c.classList.remove('active'));
    }

    // 2. مرحلة اختيار الوجه (اللعب)
    function flip(choice) {
        disablePlayButtons(true);
        
        // Rigged Logic: احتمالية الفوز تقل تدريجياً
        const baseWinChance = 0.48; 
        const winChance = round === 0 ? baseWinChance : (baseWinChance - (round * 0.04));
        const win = Math.random() < winChance;
        
        const resultSide = win ? choice : (choice === 'H' ? 'T' : 'H');
        const isHeads = resultSide === 'H';
        
        // Animation دوران سريع
        const rotation = isHeads ? (round * 1440 + 720) : (round * 1440 + 900);
        coin.style.transform = `rotateY(${rotation}deg)`;

        setTimeout(() => {
            if (win) {
                round++;
                const currentMult = multipliers[round-1];
                
                // تأثيرات بصرية للفوز
                profitFloat.innerText = currentMult + "x";
                profitFloat.style.display = "block";
                
                updateMultiplierBar();
                
                // تحديث زر الكاش أوت
                cashBtn.classList.remove('disabled');
                cashBtn.innerHTML = `CASHOUT <br> <small>${(currentBet * currentMult).toFixed(2)} USDT</small>`;
                
                disablePlayButtons(false);
            } else {
                // خسارة: هزة حمراء وإعادة اللعبة
                document.body.style.backgroundColor = "#450a0a";
                setTimeout(() => {
                    document.body.style.backgroundColor = "var(--bg)";
                    resetToStart();
                }, 400);
            }
        }, 500);
    }

    // 3. سحب الأرباح
    function cashout() {
        if (round === 0) return;
        const winAmt = currentBet * multipliers[round-1];
        balance += winAmt;
        updateUI();
        
        // تأثير وميض أخضر عند الربح
        document.body.style.backgroundColor = "#064e3b";
        setTimeout(() => {
            document.body.style.backgroundColor = "var(--bg)";
            resetToStart();
        }, 400);
    }

    function resetToStart() {
        inputSection.style.display = "block";
        playSection.style.display = "none";
        profitFloat.style.display = "none";
        disablePlayButtons(false);
        round = 0;
        mChips.forEach(c => c.classList.remove('active'));
    }

    function updateUI() {
        balText.innerText = balance.toLocaleString(undefined, {minimumFractionDigits: 2});
    }

    function updateMultiplierBar() {
        mChips.forEach((c, idx) => {
            c.className = (idx === round - 1) ? 'm-chip active' : 'm-chip';
        });
        // Scroll to active chip
        if(round > 3) {
            document.getElementById('mBar').scrollLeft += 80;
        }
    }

    function disablePlayButtons(status) {
        document.getElementById('hBtn').classList.toggle('disabled', status);
        document.getElementById('tBtn').classList.toggle('disabled', status);
        cashBtn.classList.toggle('disabled', status);
    }

    updateUI();
</script>
</body>
</html>
