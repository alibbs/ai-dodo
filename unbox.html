<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA | Elite Unboxing</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg: #020205; --brand: #ff00b8; --accent: #00f2ff; --gold: #ffd700;
            --surface: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% -20%, #1a0b2e, #020205);
        }

        .top-bar {
            width: 100%; padding: 25px; display: flex; justify-content: space-between;
            align-items: center; box-sizing: border-box; position: fixed; top: 0; z-index: 100;
            backdrop-filter: blur(20px); border-bottom: 1px solid var(--border);
        }

        .balance-card {
            background: linear-gradient(90deg, rgba(255, 0, 184, 0.1), rgba(0, 242, 255, 0.1));
            padding: 10px 20px; border-radius: 40px; border: 1px solid var(--brand);
            display: flex; align-items: center; gap: 10px;
        }

        .balance-card span { color: var(--accent); font-weight: 900; }

        .slider-section {
            width: 100%; padding: 120px 0 40px; background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--border); overflow: hidden;
        }

        .track-container {
            display: flex; gap: 15px; padding: 0 25px; overflow-x: auto; scrollbar-width: none;
        }
        .track-container::-webkit-scrollbar { display: none; }

        .item-node {
            min-width: 100px; height: 130px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 24px; display: flex; flex-direction: column; align-items: center;
            justify-content: center; flex-shrink: 0;
        }
        .item-node i { font-size: 30px; margin-bottom: 10px; }
        .item-node.rare { border-color: var(--gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.1); }

        .main-stage {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; max-width: 450px; padding: 20px; text-align: center;
        }

        .box-glow-zone { position: relative; margin-bottom: 30px; }
        .glow-sphere {
            position: absolute; width: 180px; height: 180px; background: var(--brand);
            filter: blur(60px); opacity: 0.2; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        #box-icon { font-size: 120px; position: relative; z-index: 2; transition: 0.5s cubic-bezier(.5,0,.5,1.5); }

        .master-btn {
            width: 100%; padding: 22px; border-radius: 24px; border: none;
            font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.3s;
            text-transform: uppercase;
        }
        .btn-open { background: #fff; color: #000; }
        .btn-open:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn-sell { background: linear-gradient(45deg, #22c55e, #10b981); color: #fff; display: none; margin-top: 15px; }

        .shaking { animation: pro-shake 0.3s infinite; }
        @keyframes pro-shake { 
            0% { transform: rotate(3deg); } 50% { transform: rotate(-3deg); } 100% { transform: rotate(3deg); }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="mystery-box.html" style="color: #fff;"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="balance-card">
            <i class="fa-solid fa-wallet"></i>
            <span id="balance-val">0.00</span>
        </div>
    </div>

    <div class="slider-section">
        <div class="track-container" id="rewards-track"></div>
    </div>

    <div class="main-stage">
        <div class="box-glow-zone">
            <div class="glow-sphere" id="sphere"></div>
            <i class="fa-solid fa-box-open" id="box-icon"></i>
        </div>
        <h2 id="display-name">Loading...</h2>
        <p id="status-msg" style="color: #666; margin-bottom: 20px;">READY TO UNBOX</p>

        <button class="master-btn btn-open" id="main-btn" onclick="startUnboxing()">Open (<span id="display-price">$0</span>)</button>
        <button class="master-btn btn-sell" id="sell-btn" onclick="sellItem()">Sell +$<span id="win-val">0</span></button>
    </div>

<script>
    // ⚠️ تنبيه: ضع بيانات الـ Firebase الخاصة بمشروعك هنا لكي يعمل الرصيد
    const firebaseConfig = {
        apiKey: "AIzaSy...", 
        authDomain: "your-app.firebaseapp.com",
        databaseURL: "https://your-app-default-rtdb.firebaseio.com",
        projectId: "your-app",
        storageBucket: "your-app.appspot.com",
        messagingSenderId: "...",
        appId: "..."
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const userId = "USER_123"; 

    const pools = {
        low: [
            { n: 'Rusty Key', v: 0.05, i: 'fa-key', p: 40 },
            { n: 'Old Battery', v: 0.50, i: 'fa-battery-quarter', p: 30 },
            { n: 'Silver Coin', v: 8.0, i: 'fa-coins', p: 20 },
            { n: 'Gold Ring', v: 45.0, i: 'fa-ring', p: 9.9 },
            { n: 'JACKPOT', v: 888.0, i: 'fa-crown', p: 0.1 }
        ],
        high: [
            { n: 'Used GPU', v: 10.0, i: 'fa-microchip', p: 50 },
            { n: 'ETH Shard', v: 50.0, i: 'fa-brands fa-ethereum', p: 30 },
            { n: 'Golden Bar', v: 300.0, i: 'fa-bars', p: 18 },
            { n: 'Cyber Truck', v: 2500.0, i: 'fa-truck-monster', p: 1.5 },
            { n: 'BTC Whole', v: 55000.0, i: 'fa-brands fa-bitcoin', p: 0.5 }
        ]
    };

    const urlParams = new URLSearchParams(window.location.search);
    const price = parseFloat(urlParams.get('price')) || 5;
    const boxName = urlParams.get('name') || "Mystery Box";
    const currentPool = (price >= 40) ? pools.high : pools.low;
    let userBalance = 0;
    let wonItem = null;

    // تهيئة الواجهة
    document.getElementById('display-name').innerText = boxName;
    document.getElementById('display-price').innerText = `$${price}`;
    
    const track = document.getElementById('rewards-track');
    currentPool.forEach(item => {
        track.innerHTML += `
            <div class="item-node ${item.p < 2 ? 'rare' : ''}">
                <i class="fa-solid ${item.i}"></i>
                <b>$${item.v}</b>
            </div>
        `;
    });

    // مراقبة الرصيد من Firebase
    function initBalance() {
        const balanceRef = database.ref('users/' + userId + '/balance');
        balanceRef.on('value', (snapshot) => {
            userBalance = snapshot.val() || 0;
            document.getElementById('balance-val').innerText = userBalance.toFixed(2);
            document.getElementById('main-btn').disabled = (userBalance < price);
        });
    }

    function startUnboxing() {
        if (userBalance < price) return;

        // خصم السعر
        const newBalance = userBalance - price;
        database.ref('users/' + userId).update({ balance: newBalance });

        const btn = document.getElementById('main-btn');
        const icon = document.getElementById('box-icon');
        btn.style.display = 'none';
        icon.classList.add('shaking');
        document.getElementById('status-msg').innerText = "UNBOXING...";

        // حساب الجائزة
        let rand = Math.random() * 100;
        let cumulative = 0;
        for (let item of currentPool) {
            cumulative += item.p;
            if (rand <= cumulative) { wonItem = item; break; }
        }

        setTimeout(() => {
            icon.classList.remove('shaking');
            icon.style.transform = "scale(1.3)";
            let color = wonItem.v >= price ? "#ffd700" : "#00f2ff";
            icon.innerHTML = `<i class="fa-solid ${wonItem.i}" style="color:${color}"></i>`;
            
            document.getElementById('status-msg').innerText = `YOU GOT: ${wonItem.n}`;
            document.getElementById('win-val').innerText = wonItem.v.toFixed(2);
            document.getElementById('sell-btn').style.display = 'block';
        }, 2000);
    }

    function sellItem() {
        const finalBalance = userBalance + wonItem.v;
        database.ref('users/' + userId).update({ balance: finalBalance }).then(() => {
            document.getElementById('sell-btn').style.display = 'none';
            document.getElementById('main-btn').style.display = 'block';
            document.getElementById('box-icon').style.transform = "scale(1)";
            document.getElementById('box-icon').innerHTML = '<i class="fa-solid fa-box-open"></i>';
            document.getElementById('status-msg').innerText = "SOLD!";
        });
    }

    initBalance();
</script>
</body>
</html>
