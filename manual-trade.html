<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA ELITE+ | LIVE FUTURES</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --up: #02c076; --down: #f84960;
            --card: #12151c; --border: rgba(255,255,255,0.08);
        }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; padding-bottom: 100px; }
        
        /* Header & Balance */
        .top-nav { padding: 15px; display: flex; justify-content: space-between; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .price-info h2 { margin: 0; font-size: 16px; }
        #livePrice { font-size: 20px; font-weight: 900; color: var(--up); }
        .balance-box { text-align: right; }
        .balance-box span { display: block; font-size: 10px; color: #888; }
        #userBalance { color: var(--brand); font-weight: 800; }

        /* Chart */
        #chart { width: 100%; height: 300px; background: #000; position: relative; }

        /* Trade Panel */
        .trade-inputs { padding: 15px; background: var(--card); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 8px; border-radius: 8px; }
        .input-group label { display: block; font-size: 9px; color: #666; margin-bottom: 4px; }
        .input-group input { width: 100%; background: transparent; border: none; color: #fff; font-weight: 900; outline: none; }

        .btn-row { display: flex; gap: 10px; padding: 0 15px 15px; background: var(--card); }
        .trade-btn { flex: 1; padding: 15px; border: none; border-radius: 10px; color: #fff; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .long { background: var(--up); box-shadow: 0 4px 15px rgba(2, 192, 118, 0.3); }
        .short { background: var(--down); box-shadow: 0 4px 15px rgba(248, 73, 96, 0.3); }
        .trade-btn:active { transform: scale(0.95); }

        /* Positions Table (Like Binance) */
        .positions-sec { padding: 15px; }
        .pos-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 10px; position: relative; overflow: hidden; }
        .pos-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .pos-side { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 900; }
        .side-long { background: rgba(2,192,118,0.2); color: var(--up); }
        .side-short { background: rgba(248,73,96,0.2); color: var(--down); }
        
        .pnl-row { display: flex; justify-content: space-between; align-items: center; }
        .pnl-val { font-size: 20px; font-weight: 900; }
        .roe { font-size: 12px; margin-left: 5px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="price-info">
            <h2 id="activeSymbol">BTCUSDT Perp</h2>
            <div id="livePrice">Loading...</div>
        </div>
        <div class="balance-box">
            <span>Available Balance</span>
            <b id="userBalance">0.00</b> <small>USDT</small>
        </div>
    </div>

    <div id="chart"></div>

    <div class="trade-inputs">
        <div class="input-group">
            <label>AMOUNT (USDT)</label>
            <input type="number" id="amount" value="100">
        </div>
        <div class="input-group">
            <label>LEVERAGE (1x - 75x)</label>
            <input type="number" id="leverage" value="10" max="75">
        </div>
    </div>

    <div class="btn-row">
        <button class="trade-btn long" onclick="openPos('LONG')">BUY / LONG</button>
        <button class="trade-btn short" onclick="openPos('SHORT')">SELL / SHORT</button>
    </div>

    <div class="positions-sec">
        <h4 style="margin: 0 0 10px 5px; color: #888;">Open Positions (1)</h4>
        <div id="positionsList">
            </div>
    </div>

<script type="module">
    // --- الشارت الحي (Binance Live Chart) ---
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
        layout: { backgroundColor: '#060914', textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#1a1d26' }, horzLines: { color: '#1a1d26' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        timeScale: { timeVisible: true, secondsVisible: true }
    });
    const candleSeries = chart.addCandlestickSeries({ upColor: '#02c076', downColor: '#f84960' });

    let currentPrice = 0;
    let activePosition = null;

    // اتصال مباشر بـ Binance WebSocket
    const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@kline_1m');
    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        const k = msg.k;
        currentPrice = parseFloat(k.c);
        
        // تحديث السعر في الهيدر
        const priceEl = document.getElementById('livePrice');
        priceEl.textContent = currentPrice.toFixed(2);
        priceEl.style.color = k.c >= k.o ? 'var(--up)' : 'var(--down)';

        // تحديث الشمعة على الشارت
        candleSeries.update({
            time: k.t / 1000,
            open: parseFloat(k.o),
            high: parseFloat(k.h),
            low: parseFloat(k.l),
            close: parseFloat(k.c)
        });

        // تحديث الـ PNL إذا كانت هناك صفقة مفتوحة
        updatePNL();
    };

    // --- منطق التداول (Trading Logic) ---
    window.openPos = (side) => {
        const amount = parseFloat(document.getElementById('amount').value);
        const lev = parseInt(document.getElementById('leverage').value);
        
        activePosition = {
            side: side,
            entry: currentPrice,
            amount: amount,
            leverage: lev,
            liqPrice: side === 'LONG' ? currentPrice * (1 - (0.68/lev)) : currentPrice * (1 + (0.68/lev))
        };
        renderPosition();
    };

    function updatePNL() {
        if (!activePosition) return;
        
        const pos = activePosition;
        let diff = pos.side === 'LONG' ? (currentPrice - pos.entry) : (pos.entry - currentPrice);
        let pnl = (diff / pos.entry) * pos.amount * pos.leverage;
        let roe = (diff / pos.entry) * 100 * pos.leverage;

        // نظام التصفية (Liquidation) عند خسارة 68%
        if (roe <= -68) {
            alert("LIQUIDATED! Position Closed at 68% Loss.");
            activePosition = null;
            document.getElementById('positionsList').innerHTML = "";
            return;
        }

        const pnlEl = document.getElementById('pnlDisplay');
        const roeEl = document.getElementById('roeDisplay');
        if(pnlEl) {
            pnlEl.textContent = (pnl >= 0 ? '+' : '') + pnl.toFixed(2) + " USDT";
            pnlEl.style.color = pnl >= 0 ? 'var(--up)' : 'var(--down)';
            roeEl.textContent = (roe >= 0 ? '+' : '') + roe.toFixed(2) + "%";
            roeEl.style.color = roe >= 0 ? 'var(--up)' : 'var(--down)';
        }
    }

    function renderPosition() {
        const container = document.getElementById('positionsList');
        if (!activePosition) { container.innerHTML = ""; return; }
        
        const p = activePosition;
        container.innerHTML = `
            <div class="pos-card">
                <div class="pos-header">
                    <span class="pos-side ${p.side === 'LONG' ? 'side-long' : 'side-short'}">${p.side} ${p.leverage}x</span>
                    <span style="font-size: 11px; color: #666;">BTCUSDT Perp</span>
                </div>
                <div class="pnl-row">
                    <div>
                        <div class="pnl-val" id="pnlDisplay">0.00 USDT</div>
                        <div class="roe" id="roeDisplay">0.00%</div>
                    </div>
                    <button onclick="closePos()" style="background: #333; border: none; color: #fff; padding: 5px 10px; border-radius: 5px; font-size: 11px;">Close</button>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 15px; font-size: 11px; color: #888;">
                    <div>Entry: ${p.entry.toFixed(2)}</div>
                    <div style="color: #f84960;">Liq: ${p.liqPrice.toFixed(2)}</div>
                </div>
            </div>
        `;
    }

    window.closePos = () => {
        activePosition = null;
        renderPosition();
    };

</script>
</body>
</html>
