<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA CRASH | Pro Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914;
            --brand: #ff00b8;
            --up: #00ff96;
            --down: #ff3b3b;
            --card: #11111d;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* Space Background */
        .game-screen {
            flex: 1; position: relative; background: radial-gradient(circle at center, #1a0b2e 0%, #060914 100%);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }

        .stars { position: absolute; width: 200%; height: 200%; background: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity: 0.3; animation: moveStars 20s linear infinite; }
        @keyframes moveStars { from { transform: translate(0,0); } to { transform: translate(-50%, -50%); } }

        .display-center { position: relative; z-index: 10; text-align: center; pointer-events: none; }
        .multiplier { font-size: 75px; font-weight: 900; line-height: 1; text-shadow: 0 0 30px rgba(255,255,255,0.2); }
        .live-profit { font-size: 20px; color: var(--up); font-weight: 800; margin-top: 10px; display: none; background: rgba(0,0,0,0.6); padding: 6px 18px; border-radius: 20px; box-shadow: 0 0 15px rgba(0,255,150,0.2); }

        #rocket {
            position: absolute; bottom: 20%; left: 10%; font-size: 45px; color: var(--brand);
            transform: rotate(-45deg); transition: 0.1s ease-out; z-index: 5;
            text-shadow: 0 0 20px var(--brand);
        }

        /* Controls Area */
        .controls {
            background: var(--card); border-top: 2px solid var(--border);
            padding: 20px; border-radius: 30px 30px 0 0; z-index: 20;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }

        .input-box {
            background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            border-radius: 12px; padding: 8px 12px;
        }
        .input-box label { display: block; font-size: 10px; color: #666; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
        .input-box input { width: 100%; background: transparent; border: none; color: white; font-size: 16px; font-weight: 700; outline: none; }

        .main-btn {
            grid-column: span 2; padding: 18px; border-radius: 15px; border: none;
            font-size: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.2s;
        }
        .btn-bet { background: var(--brand); color: white; }
        .btn-cashout { background: var(--up); color: #000; }
        .btn-waiting { background: #222; color: #555; cursor: not-allowed; }

        .history-list { display: flex; gap: 8px; padding: 10px 20px; overflow-x: auto; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--border); }
        .hist-chip { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.05); }

    </style>
</head>
<body>

    <div style="padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; background: #060914;">
        <a href="game.html" style="color:#fff; font-size: 18px;"><i class="fa-solid fa-xmark"></i></a>
        <div style="background:rgba(0, 255, 150, 0.1); padding:6px 12px; border-radius:12px; border:1px solid rgba(0, 255, 150, 0.2);">
            <i class="fa-solid fa-coins" style="color:var(--up)"></i> <span id="balance" style="font-weight: 800;">2,840.15</span>
        </div>
    </div>

    <div class="history-list" id="history">
        <div class="hist-chip" style="color:var(--up)">1.85x</div>
        <div class="hist-chip" style="color:var(--down)">1.05x</div>
        <div class="hist-chip" style="color:var(--brand)">12.40x</div>
    </div>

    <div class="game-screen">
        <div class="stars"></div>
        <i id="rocket" class="fa-solid fa-rocket"></i>
        <div class="display-center">
            <div id="multiplier" class="multiplier">1.00x</div>
            <div id="profit" class="live-profit">+$0.00</div>
        </div>
    </div>

    <div class="controls">
        <div class="input-box">
            <label>Bet Amount</label>
            <input type="number" id="amount" value="10.00">
        </div>
        <div class="input-box">
            <label>Auto Cashout</label>
            <input type="number" id="auto-cash" value="2.00" step="0.1">
        </div>
        <button id="mainBtn" class="main-btn btn-bet" onclick="onBtnClick()">Place Bet</button>
        <div id="status" style="grid-column: span 2; text-align:center; font-size:11px; color:#444; font-weight:700;">GAME IDLE - READY TO FLY</div>
    </div>

<script>
    let multi = 1.00;
    let gameState = "IDLE";
    let myBet = 0;
    let autoOut = 0;
    let userHasBet = false;
    let cashOutDone = false;
    let startTime;
    let animId;

    const multiEl = document.getElementById('multiplier');
    const profitEl = document.getElementById('profit');
    const rocketEl = document.getElementById('rocket');
    const mainBtn = document.getElementById('mainBtn');
    const statusEl = document.getElementById('status');

    function startLoop() {
        gameState = "RUNNING";
        startTime = Date.now();
        multi = 1.00;
        multiEl.style.color = "white";
        multiEl.textContent = "1.00x";
        
        // قراءة الرهان والـ Auto Cashout عند البداية
        if(userHasBet) {
            myBet = parseFloat(document.getElementById('amount').value);
            autoOut = parseFloat(document.getElementById('auto-cash').value);
            mainBtn.className = "main-btn btn-cashout";
            mainBtn.textContent = "Cash Out";
            profitEl.style.display = "block";
        } else {
            mainBtn.className = "main-btn btn-waiting";
            mainBtn.textContent = "Flying...";
        }
        statusEl.textContent = "ROCKET IS IN FLIGHT...";
        tick();
    }

    function tick() {
        if(gameState !== "RUNNING") return;
        
        let elapsed = (Date.now() - startTime) / 1000;
        multi = Math.pow(Math.E, 0.082 * elapsed);
        
        multiEl.textContent = multi.toFixed(2) + "x";
        
        // Rocket Animation
        let x = 10 + (elapsed * 3.5);
        let y = 20 + (Math.pow(elapsed, 1.4) * 2.5);
        rocketEl.style.left = Math.min(x, 75) + "%";
        rocketEl.style.bottom = Math.min(y, 75) + "%";

        if(userHasBet && !cashOutDone) {
            let currentProfit = (myBet * multi).toFixed(2);
            profitEl.textContent = "+$" + currentProfit;

            // --- AUTO CASHOUT LOGIC ---
            if(autoOut > 1.01 && multi >= autoOut) {
                doCashOut("Auto");
            }
        }

        // --- Realistic Crash Risk ---
        let crashChance = 0.002;
        if(multi > 1.5) crashChance = 0.006;
        if(multi > 3) crashChance = 0.015;
        if(multi > 10) crashChance = 0.1;

        if(Math.random() < crashChance) {
            doCrash();
        } else {
            animId = requestAnimationFrame(tick);
        }
    }

    function doCashOut(mode) {
        if(cashOutDone) return;
        cashOutDone = true;
        let win = (myBet * multi).toFixed(2);
        
        if(mode === "Auto") {
            statusEl.textContent = "AUTO CASHOUT AT " + multi.toFixed(2) + "x";
        } else {
            statusEl.textContent = "MANUAL CASHOUT AT " + multi.toFixed(2) + "x";
        }
        
        mainBtn.className = "main-btn btn-waiting";
        mainBtn.textContent = "Won: $" + win;
        profitEl.style.display = "none";
        // هنا يمكنك إضافة كود لإرسال الربح إلى قاعدة البيانات
    }

    function doCrash() {
        gameState = "CRASHED";
        cancelAnimationFrame(animId);
        multiEl.style.color = "var(--down)";
        statusEl.textContent = "CRASHED AT " + multi.toFixed(2) + "x";
        mainBtn.className = "main-btn btn-waiting";
        mainBtn.textContent = "Crashed!";
        profitEl.style.display = "none";

        // Add to history
        const h = document.getElementById('history');
        const color = multi > 2 ? 'var(--up)' : (multi > 1.2 ? 'orange' : 'var(--down)');
        const chip = `<div class="hist-chip" style="color:${color}">${multi.toFixed(2)}x</div>`;
        h.insertAdjacentHTML('afterbegin', chip);

        setTimeout(resetGame, 3000);
    }

    function resetGame() {
        gameState = "IDLE";
        userHasBet = false;
        cashOutDone = false;
        rocketEl.style.left = "10%";
        rocketEl.style.bottom = "20%";
        mainBtn.className = "main-btn btn-bet";
        mainBtn.textContent = "Place Bet";
        statusEl.textContent = "PREPARING NEXT ROUND...";
        
        setTimeout(startLoop, 3000); // 3 seconds wait between rounds
    }

    function onBtnClick() {
        if(gameState === "IDLE" && !userHasBet) {
            userHasBet = true;
            mainBtn.className = "main-btn btn-waiting";
            mainBtn.textContent = "Bet Placed!";
            statusEl.textContent = "WAITING FOR TAKE-OFF...";
        } else if(gameState === "RUNNING" && userHasBet && !cashOutDone) {
            doCashOut("Manual");
        }
    }

    // Auto Start the 24/7 Cycle
    resetGame();
</script>
</body>
</html>
