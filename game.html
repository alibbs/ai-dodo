<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA ELITE | Selection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --card-bg: rgba(255, 255, 255, 0.04); --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff; --muted: #888;
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: var(--text);
            background: radial-gradient(circle at top right, #1a0b2e, #060914);
            min-height: 100vh; display: flex; flex-direction: column;
        }

        .container { padding: 25px; max-width: 450px; margin: auto; width: 100%; box-sizing: border-box; }

        .header { text-align: center; margin-bottom: 40px; margin-top: 20px; }
        .header h1 { font-size: 28px; font-weight: 900; letter-spacing: -1px; margin: 0; }
        .header p { color: var(--muted); font-size: 14px; margin-top: 5px; }

        /* --- Selection Cards --- */
        .selection-grid { display: flex; flex-direction: column; gap: 20px; }

        .select-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 30px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .select-card:active { transform: scale(0.97); background: rgba(255,255,255,0.08); }

        .icon-box {
            width: 70px; height: 70px;
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px;
            flex-shrink: 0;
        }

        /* تدرج خاص بكل خيار */
        .trading-icon { background: linear-gradient(135deg, #00f2ff, #0066ff); box-shadow: 0 10px 20px rgba(0, 242, 255, 0.2); }
        .gaming-icon { background: linear-gradient(135deg, #ff00b8, #a100ff); box-shadow: 0 10px 20px rgba(255, 0, 184, 0.2); }

        .info h3 { margin: 0; font-size: 20px; font-weight: 800; }
        .info p { margin: 5px 0 0; font-size: 13px; color: var(--muted); line-height: 1.4; }

        .arrow { margin-left: auto; color: var(--muted); font-size: 18px; }

        /* --- Bottom Nav --- */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 85px; 
            background: rgba(6, 9, 20, 0.98); border-top: 1px solid var(--border); 
            display: flex; justify-content: space-around; align-items: center; 
            z-index: 1000; backdrop-filter: blur(15px); padding-bottom: 10px;
        }
        .nav-item { text-decoration: none; color: #444; text-align: center; flex: 1; font-size: 10px; }
        .nav-item i { font-size: 24px; display: block; margin-bottom: 5px; }
        .nav-item.active { color: var(--brand); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 data-key="game_hub_title">Elite Center</h1>
        <p data-key="game_hub_desc">Choose your path to profit</p>
    </div>

    <div class="selection-grid">
        <a href="bot-trade.html" class="select-card">
            <div class="icon-box trading-icon">
                <i class="fa-solid fa-chart-line"></i>
            </div>
            <div class="info">
                <h3 data-key="ai_trading">AI Trading</h3>
                <p data-key="trading_sub">Passive income with Neural Bots</p>
            </div>
            <i class="fa-solid fa-chevron-right arrow"></i>
        </a>

        <a href="game-list.html" class="select-card">
            <div class="icon-box gaming-icon">
                <i class="fa-solid fa-gamepad"></i>
            </div>
            <div class="info">
                <h3 data-key="elite_games">Elite Games</h3>
                <p data-key="games_sub">Play & win provably fair assets</p>
            </div>
            <i class="fa-solid fa-chevron-right arrow"></i>
        </a>
    </div>
</div>

<nav class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span data-key="home">Home</span></a>
    <a href="game.html" class="nav-item active"><i class="fa-solid fa-gamepad"></i><span data-key="game">Game</span></a>
    <a href="bot-trade.html" class="nav-item"><i class="fa-solid fa-robot"></i><span data-key="bot">Bot</span></a>
    <a href="overview.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i><span data-key="overview">Overview</span></a>
    <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span data-key="profile">Profile</span></a>
</nav>

<script src="translate.js"></script>
</body>
</html>
