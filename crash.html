<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AMANA ELITE | Crash Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #060914;
            --brand: #ff00b8;
            --accent: #00f2ff;
            --up: #00ff96;
            --card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            background: radial-gradient(circle at top right, #1a0b2e 0%, #060914 100%);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }

        .logo-mini { position: absolute; top: 15px; left: 15px; font-size: 14px; font-weight: 900; }
        .logo-mini span { color: var(--brand); }

        .container { width: 100%; max-width: 900px; padding: 15px; box-sizing: border-box; margin-top: 50px; display: grid; grid-template-columns: 320px 1fr; gap: 20px; }

        /* Game Display */
        .game-area {
            background: var(--card); border: 1px solid var(--border); border-radius: 20px;
            height: 400px; position: relative; display: flex; align-items: center; justify-content: center;
            overflow: hidden; flex-direction: column;
        }

        #multiplier { font-size: 70px; font-weight: 900; color: #fff; z-index: 2; transition: color 0.2s; }
        #multiplier.crashed { color: #ff0050; }

        /* Sidebar & Controls */
        .sidebar { display: flex; flex-direction: column; gap: 15px; }
        .wallet-header { display: flex; justify-content: flex-end; }
        .bal-display { background: rgba(0, 255, 150, 0.08); border: 1px solid var(--up); padding: 8px 15px; border-radius: 50px; color: var(--up); font-weight: 800; font-size: 14px; }

        .controls { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; color: #8b8da3; font-weight: 700; text-transform: uppercase; }

        .bet-input-wrapper { display: flex; gap: 5px; }
        .bet-input-wrapper input { flex: 1; background: #0f212e; border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: #fff; font-weight: 800; outline: none; }
        .btn-adjust { background: #2f4553; border: none; color: #fff; padding: 0 15px; border-radius: 8px; font-weight: 800; cursor: pointer; }
        .btn-adjust:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-main { background: var(--up); color: #060914; border: none; padding: 18px; border-radius: 10px; font-weight: 900; font-size: 16px; cursor: pointer; }
        .cashout-btn { background: #fff; color: #000; display: none; }

        /* Live Players Table */
        .live-stats { background: var(--card); border-radius: 20px; border: 1px solid var(--border); padding: 15px; margin-top: 10px; height: 300px; overflow: hidden; }
        .stats-header { display: flex; justify-content: space-between; font-size: 12px; color: #8b8da3; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .player-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .player-row.won { color: var(--up); }
        
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } .container { margin-top: 60px; } }
    </style>
</head>
<body>

<div class="logo-mini">AMANA <span>ELITE</span></div>

<div class="container">
    <div class="sidebar">
        <div class="wallet-header">
            <div class="bal-display" id="userBalance"><i class="fa-solid fa-wallet"></i> 0.00</div>
        </div>

        <div class="controls">
            <div class="input-group">
                <label>Bet Amount</label>
                <div class="bet-input-wrapper">
                    <input type="number" id="betAmount" value="10.00" step="1">
                    <button class="btn-adjust" id="halfBtn" onclick="adjustBet(0.5)">½</button>
                    <button class="btn-adjust" id="doubleBtn" onclick="adjustBet(2)">x2</button>
                </div>
            </div>
            <button class="btn-main" id="startBtn">Place Bet</button>
            <button class="btn-main cashout-btn" id="cashoutBtn">Cashout</button>
        </div>

        <div class="live-stats">
            <div class="stats-header">
                <span>Player</span>
                <span>Bet</span>
                <span>Payout</span>
            </div>
            <div id="playerList"></div>
        </div>
    </div>

    <div class="game-area">
        <div id="multiplier">1.00x</div>
        <div id="totalPool" style="position:absolute; bottom:20px; font-size:12px; color:#8b8da3;">
            Total Bet: <span id="poolAmount" style="color:white">$0.00</span> | <span id="userCount">0</span> Players
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
        authDomain: "ai-dodo.firebaseapp.com",
        projectId: "ai-dodo",
        storageBucket: "ai-dodo.firebasestorage.app",
        messagingSenderId: "261622335803",
        appId: "1:261622335803:web:0b066791230535e7d5cf1e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let userBalance = 0, userId = null, gameActive = false, currentMult = 1.00, gameLoop = null;
    let betPlaced = false, hasCashout = false;

    const multDisplay = document.getElementById('multiplier'),
          balDisplay = document.getElementById('userBalance'),
          betInput = document.getElementById('betAmount'),
          startBtn = document.getElementById('startBtn'),
          cashoutBtn = document.getElementById('cashoutBtn'),
          playerList = document.getElementById('playerList');

    // Audio Context for Stake Sound
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTick() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            userId = user.uid;
            onSnapshot(doc(db, "users", userId), (snap) => {
                if (snap.exists()) {
                    userBalance = snap.data().balance || 0;
                    balDisplay.innerHTML = `<i class="fa-solid fa-wallet"></i> ${userBalance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                }
            });
        }
    });

    window.adjustBet = (f) => { if(!betPlaced) betInput.value = (parseFloat(betInput.value)*f).toFixed(2); };

    function generateFakePlayers() {
        playerList.innerHTML = '';
        const count = Math.floor(Math.random() * (300 - 27 + 1)) + 27;
        const total = Math.floor(Math.random() * (3000 - 600 + 1)) + 600;
        document.getElementById('userCount').textContent = count;
        document.getElementById('poolAmount').textContent = '$' + total.toLocaleString();
        
        for(let i=0; i<10; i++) {
            const row = document.createElement('div');
            row.className = 'player-row';
            row.innerHTML = `<span>User_${Math.floor(Math.random()*999)}</span> <span>$${(Math.random()*50).toFixed(2)}</span> <span>-</span>`;
            playerList.prepend(row);
        }
    }

    async function startCrash() {
        const bet = parseFloat(betInput.value);
        if (bet > userBalance || bet <= 0) return;

        betPlaced = true; hasCashout = false;
        betInput.disabled = document.getElementById('halfBtn').disabled = document.getElementById('doubleBtn').disabled = true;
        await updateDoc(doc(db, "users", userId), { balance: increment(-bet) });

        startBtn.style.display = 'none';
        cashoutBtn.style.display = 'block';
        cashoutBtn.textContent = `Cashout ($${bet.toFixed(2)})`;

        currentMult = 1.00;
        multDisplay.classList.remove('crashed');
        generateFakePlayers();

        // Crash Point Logic (House Edge 3%)
        const crashPoint = Math.random() < 0.03 ? 1.00 : (100 / (Math.random() * 99 + 1)).toFixed(2);
        
        gameLoop = setInterval(() => {
            currentMult += 0.01 * (currentMult/2);
            multDisplay.textContent = currentMult.toFixed(2) + 'x';
            
            if(!hasCashout) {
                cashoutBtn.textContent = `Cashout ($${(bet * currentMult).toFixed(2)})`;
            }

            // Fake player cashouts
            if(Math.random() > 0.95) {
                const rows = playerList.querySelectorAll('.player-row:not(.won)');
                if(rows[0]) {
                    rows[0].classList.add('won');
                    rows[0].children[2].textContent = currentMult.toFixed(2) + 'x';
                }
            }

            if (currentMult >= crashPoint) {
                clearInterval(gameLoop);
                multDisplay.textContent = currentMult.toFixed(2) + 'x Crashed!';
                multDisplay.classList.add('crashed');
                endGame();
            }
        }, 100);
    }

    async function doCashout() {
        if(hasCashout || !betPlaced) return;
        hasCashout = true;
        const bet = parseFloat(betInput.value);
        const win = bet * currentMult;
        await updateDoc(doc(db, "users", userId), { balance: increment(win) });
        cashoutBtn.style.background = 'var(--up)';
        cashoutBtn.textContent = `Won $${win.toFixed(2)}`;
        playTick();
    }

    function endGame() {
        betPlaced = false;
        setTimeout(() => {
            startBtn.style.display = 'block';
            cashoutBtn.style.display = 'none';
            cashoutBtn.style.background = '#fff';
            betInput.disabled = document.getElementById('halfBtn').disabled = document.getElementById('doubleBtn').disabled = false;
        }, 2000);
    }

    startBtn.onclick = startCrash;
    cashoutBtn.onclick = doCashout;
</script>
</body>
</html>
