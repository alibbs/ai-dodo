<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A | PRO CRASH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #060914;
            --panel-bg: #0f212e;
            --input-bg: #071620;
            --brand-color: #ff00b8;
            --accent-blue: #00f2ff;
            --win-green: #00e701;
            --lose-red: #ff3b3b;
            --text-main: #b1bad3;
            --border-ui: #2f4553;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg-dark); color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }

        /* --- Global Header --- */
        .game-header { width: 100%; max-width: 500px; padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo-a { width: 40px; height: 40px; background: rgba(255, 0, 184, 0.1); border: 1px solid var(--brand-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; text-shadow: 0 0 10px var(--brand-color); }
        .user-balance { background: var(--panel-bg); padding: 8px 15px; border-radius: 4px; font-weight: 800; color: var(--win-green); border: 1px solid var(--border-ui); font-size: 14px; }

        /* --- Game Visual Stage --- */
        .stage-container {
            width: 95%; max-width: 480px; height: 320px; background: radial-gradient(circle at bottom left, #1a2c38 0%, #071620 100%);
            border-radius: 12px; border: 1px solid var(--border-ui); position: relative; overflow: hidden; margin-bottom: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Signal/Status Indicator */
        .status-bar { position: absolute; top: 12px; right: 15px; display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800; color: var(--win-green); z-index: 10; text-transform: uppercase; }
        .status-dot { width: 6px; height: 6px; background: var(--win-green); border-radius: 50%; box-shadow: 0 0 8px var(--win-green); animation: pulse 1.5s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        #multiplier { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 65px; font-weight: 900; z-index: 10; letter-spacing: -2px; }
        #profit-display { position: absolute; top: 60%; left: 50%; transform: translateX(-50%); color: var(--win-green); font-weight: 800; font-size: 20px; display: none; }

        /* Plane & Animation */
        .plane-wrapper { position: absolute; bottom: 50px; left: 50px; z-index: 5; transition: transform 0.1s linear; }
        .plane-wrapper i { font-size: 40px; color: var(--accent-blue); transform: rotate(-15deg); filter: drop-shadow(0 0 15px var(--accent-blue)); }
        
        .wait-screen { position: absolute; inset: 0; background: rgba(6,9,20,0.9); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; display: none; }
        .progress-bar { width: 200px; height: 6px; background: var(--border-ui); border-radius: 10px; margin-top: 15px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--brand-color); box-shadow: 0 0 10px var(--brand-color); }

        /* --- Betting Panel --- */
        .control-panel { width: 95%; max-width: 480px; background: var(--panel-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border-ui); }
        .input-label { font-size: 11px; color: var(--text-main); font-weight: 800; margin-bottom: 8px; display: flex; justify-content: space-between; }
        
        .input-group { background: var(--input-bg); border: 2px solid var(--border-ui); border-radius: 6px; display: flex; align-items: center; padding: 4px; margin-bottom: 15px; }
        .input-group input { flex: 1; background: transparent; border: none; color: #fff; padding: 12px; font-weight: 800; outline: none; font-size: 16px; }
        .quick-bet { background: var(--border-ui); border: none; color: #fff; padding: 8px 12px; font-size: 12px; font-weight: 800; border-radius: 4px; cursor: pointer; margin-left: 4px; }

        .main-btn { width: 100%; padding: 20px; border: none; border-radius: 6px; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.3s transform; text-transform: uppercase; }
        .main-btn:active { transform: scale(0.98); }
        .btn-bet { background: var(--win-green); color: #000; }
        .btn-cashout { background: #fff; color: #000; display: none; }

        /* --- Stats/Fake Users --- */
        .stats-header { width: 95%; max-width: 480px; display: flex; justify-content: space-between; padding: 20px 5px 10px; font-size: 12px; font-weight: 800; color: var(--text-main); }
        .users-table { width: 95%; max-width: 480px; background: rgba(15, 33, 46, 0.5); border-radius: 8px; max-height: 250px; overflow-y: auto; }
        .user-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid rgba(47, 69, 83, 0.3); font-size: 13px; font-weight: 600; }
        .user-row.me { background: rgba(0, 231, 1, 0.05); border-left: 4px solid var(--win-green); }
        .user-name { display: flex; align-items: center; gap: 8px; }
        .user-name i { font-size: 10px; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="game-header">
        <div class="logo-a">A</div>
        <div id="balance-top" class="user-balance">$ 0.00</div>
    </div>

    <div class="stage-container">
        <div class="status-bar"><div class="status-dot"></div> Live Network</div>
        <div id="multiplier">1.00x</div>
        <div id="profit-display">$ 0.00</div>

        <div class="wait-screen" id="wait-screen">
            <div style="color: var(--text-main); font-weight: 800; letter-spacing: 1px;">PREPARING NEXT ROUND...</div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>

        <div class="plane-wrapper" id="plane-wrapper" style="display:none;"><i class="fa-solid fa-plane-up"></i></div>
        <svg style="position:absolute; inset:0; pointer-events:none;"><path id="path-line" d="" fill="none" stroke="var(--accent-blue)" stroke-width="3" stroke-dasharray="10,5" opacity="0.3"/></svg>
    </div>

    <div class="control-panel">
        <div class="input-label">
            <span>BET AMOUNT</span>
            <span style="color: var(--brand-color)">MIN: $0.10</span>
        </div>
        <div class="input-group">
            <input type="number" id="bet-input" value="10.00" step="0.1">
            <button class="quick-bet" onclick="modBet(0.5)">1/2</button>
            <button class="quick-bet" onclick="modBet(2)">2x</button>
        </div>

        <button id="btn-bet" class="main-btn btn-bet">Place Bet</button>
        <button id="btn-cashout" class="main-btn btn-cashout">Cashout</button>
    </div>

    <div class="stats-header">
        <span><i class="fa-solid fa-users"></i> <span id="count-players">0</span> Players</span>
        <span>Total: $<span id="total-pool">0.00</span></span>
    </div>
    <div class="users-table" id="users-table"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Same Config
    const firebaseConfig = { apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA", authDomain: "ai-dodo.firebaseapp.com", projectId: "ai-dodo", storageBucket: "ai-dodo.firebasestorage.app", messagingSenderId: "261622335803", appId: "1:261622335803:web:0b066791230535e7d5cf1e" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);

    let uID, balance = 0, currentMult = 1.0, isPlaying = false, hasCashout = false, nextRoundBet = false;
    let fakeUsers = [];

    onAuthStateChanged(auth, user => {
        if(user) {
            uID = user.uid;
            onSnapshot(doc(db, "users", uID), s => {
                balance = s.data().balance;
                document.getElementById('balance-top').textContent = "$" + balance.toLocaleString(undefined, {minimumFractionDigits:2});
            });
        }
    });

    window.modBet = (m) => { let i = document.getElementById('bet-input'); i.value = (parseFloat(i.value) * m).toFixed(2); };

    async function gameLoop() {
        while(true) {
            const cycle = 16000; // 16 sec total
            const now = Date.now();
            const time = now % cycle;

            if(time < 6000) { // Betting Phase (6s)
                updateUI('betting', time/6000 * 100);
                genFakeUsers();
                renderTable(false);
                await new Promise(r => setTimeout(r, 100));
            } else { // Flying Phase
                updateUI('flying');
                if(nextRoundBet) { isPlaying = true; nextRoundBet = false; }
                
                const roundSeed = Math.floor(now / cycle);
                const crashPoint = calcCrash(roundSeed);
                const startTime = now - (now % cycle) + 6000;

                while(true) {
                    const elapsed = (Date.now() - startTime) / 1000;
                    if(elapsed < 0) break;
                    currentMult = Math.pow(Math.E, 0.075 * elapsed); // Curve logic

                    if(currentMult >= crashPoint) break;

                    document.getElementById('multiplier').textContent = currentMult.toFixed(2) + 'x';
                    if(isPlaying && !hasCashout) {
                        const win = (document.getElementById('bet-input').value * currentMult).toFixed(2);
                        const prof = document.getElementById('profit-display');
                        prof.style.display = 'block';
                        prof.textContent = "+$" + win;
                    }

                    // Move Plane
                    let x = Math.min(elapsed * 40, 85), y = Math.min(Math.pow(elapsed, 1.3) * 12, 75);
                    document.getElementById('plane-wrapper').style.transform = `translate(${x}vw, -${y}vh)`;
                    
                    await new Promise(r => requestAnimationFrame(r));
                }

                // CRASHED
                document.getElementById('multiplier').textContent = currentMult.toFixed(2) + 'x';
                document.getElementById('multiplier').style.color = 'var(--lose-red)';
                document.getElementById('profit-display').style.color = 'var(--lose-red)';
                isPlaying = false; hasCashout = false;
                
                await new Promise(r => setTimeout(r, 3000));
                document.getElementById('multiplier').style.color = '#fff';
                document.getElementById('profit-display').style.color = 'var(--win-green)';
                document.getElementById('profit-display').style.display = 'none';
            }
        }
    }

    function calcCrash(seed) {
        // HOUSE EDGE 5%
        let h = (seed * 16807) % 2147483647;
        let r = h / 2147483647;
        if (r < 0.05) return 1.00; // 5% chance instant crash
        return Math.max(1.00, (0.95 / (1 - r))).toFixed(2);
    }

    function updateUI(state, progress = 0) {
        const wait = document.getElementById('wait-screen');
        const plane = document.getElementById('plane-wrapper');
        const btnB = document.getElementById('btn-bet');
        const btnC = document.getElementById('btn-cashout');

        if(state === 'betting') {
            wait.style.display = 'flex';
            plane.style.display = 'none';
            document.getElementById('progress-fill').style.width = progress + "%";
            if(!isPlaying) { btnB.style.display = 'block'; btnC.style.display = 'none'; }
        } else {
            wait.style.display = 'none';
            plane.style.display = 'block';
            if(isPlaying && !hasCashout) { btnB.style.display = 'none'; btnC.style.display = 'block'; }
        }
    }

    function genFakeUsers() {
        const names = ['CryptoWhale', 'Hidden', 'StakeKing', 'LuckyA', 'Hidden', 'Satoshi'];
        document.getElementById('count-players').textContent = Math.floor(Math.random()*300 + 100);
        document.getElementById('total-pool').textContent = Math.floor(Math.random()*5000 + 1000).toLocaleString();
        fakeUsers = names.map(n => ({ n, b: (Math.random()*150 + 5).toFixed(2), m: (Math.random()*2.5 + 1.1).toFixed(2) }));
    }

    function renderTable(active) {
        let html = isPlaying ? `<div class="user-row me"><div class="user-name"><i class="fa-solid fa-crown"></i> YOU</div><span>$${document.getElementById('bet-input').value}</span><span style="color:var(--win-green)">${hasCashout?'WON':'-'}</span></div>` : '';
        html += fakeUsers.map(u => `<div class="user-row"><div class="user-name">${u.n === 'Hidden' ? '<i class="fa-solid fa-user-secret"></i> Hidden' : u.n}</div><span>$${u.b}</span><span>${(active && currentMult >= u.m) ? u.m+'x' : '-'}</span></div>`).join('');
        document.getElementById('users-table').innerHTML = html;
    }

    document.getElementById('btn-bet').onclick = async () => {
        const amt = parseFloat(document.getElementById('bet-input').value);
        if(amt > balance || amt <= 0) return alert("No Balance!");
        await updateDoc(doc(db, "users", uID), { balance: increment(-amt) });
        nextRoundBet = true;
        document.getElementById('btn-bet').textContent = "Waiting for Round...";
        document.getElementById('btn-bet').disabled = true;
    };

    document.getElementById('btn-cashout').onclick = async () => {
        if(!isPlaying || hasCashout || currentMult < 1.05) return;
        hasCashout = true;
        const win = parseFloat(document.getElementById('bet-input').value) * currentMult;
        await updateDoc(doc(db, "users", uID), { balance: increment(win) });
        document.getElementById('btn-cashout').textContent = "CASHED OUT!";
        document.getElementById('btn-cashout').style.background = 'var(--win-green)';
    };

    gameLoop();
</script>
</body>
</html>
