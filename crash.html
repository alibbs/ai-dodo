<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AMANA ELITE | Crash Stake</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --up: #00ff96; --card: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1);
        }
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
            min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; align-items: center;
        }

        .header { width: 100%; max-width: 500px; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; font-size: 16px; } .logo span { color: var(--brand); }
        .bal-display { background: rgba(0, 255, 150, 0.1); border: 1px solid var(--up); padding: 5px 12px; border-radius: 50px; color: var(--up); font-weight: 800; font-size: 13px; }

        .history-bar { width: 100%; max-width: 500px; display: flex; gap: 8px; padding: 5px 15px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); min-height: 40px; align-items: center; }
        .hist-item { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; background: var(--card); border: 1px solid var(--border); white-space: nowrap; }

        .container { width: 100%; max-width: 500px; padding: 10px 15px; }

        .flight-window {
            width: 100%; height: 240px; background: #0a0e1a; border-radius: 20px;
            border: 1px solid var(--border); position: relative; overflow: hidden; margin-bottom: 15px;
        }
        #multiplier { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); font-size: 45px; font-weight: 900; z-index: 4; }
        .plane-node { position: absolute; bottom: 20px; left: 20px; z-index: 5; transition: transform 0.1s linear; }
        .plane-node i { font-size: 24px; color: var(--accent); transform: rotate(-15deg); }
        .plane-node.crashed i { color: #ff0050; }

        .controls { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .label-txt { font-size: 10px; color: #8b8da3; font-weight: 800; text-transform: uppercase; }
        .input-row { display: flex; gap: 5px; background: #0f212e; padding: 5px; border-radius: 8px; }
        .input-row input { flex: 1; background: transparent; border: none; color: #fff; padding: 8px; font-weight: 800; outline: none; }
        .btn-mini { background: #2f4553; border: none; color: #fff; padding: 0 10px; border-radius: 6px; font-weight: 700; cursor: pointer; }

        .main-action { width: 100%; padding: 16px; border-radius: 10px; border: none; font-weight: 900; font-size: 16px; cursor: pointer; }
        .btn-bet { background: var(--up); color: #060914; }
        .btn-cash { background: #fff; color: #000; display: none; }

        .stats-toggle { margin-top: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .stats-head { padding: 10px 15px; font-size: 11px; font-weight: 700; display: flex; justify-content: space-between; background: rgba(255,255,255,0.02); }
        .stats-body { max-height: 200px; overflow-y: auto; padding: 5px 15px 10px; }
        .p-row { display: flex; justify-content: space-between; font-size: 11px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .p-row.me { background: rgba(0, 242, 255, 0.05); border-radius: 4px; color: var(--accent); }
        .won-val { color: var(--up); font-weight: 800; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">AMANA <span>ELITE</span></div>
        <div id="userBal" class="bal-display"><i class="fa-solid fa-wallet"></i> 0.00</div>
    </div>

    <div class="history-bar" id="histBar"></div>

    <div class="container">
        <div class="flight-window">
            <div id="multiplier">1.00x</div>
            <div id="canvas-wrap" style="position:absolute; width:100%; height:100%;">
                <svg style="position:absolute; width:100%; height:100%;"><path id="flightPath" d="" fill="none" stroke="var(--accent)" stroke-width="3"/></svg>
                <div class="plane-node" id="planeNode"><i class="fa-solid fa-plane"></i></div>
            </div>
        </div>

        <div class="controls">
            <div class="input-group">
                <span class="label-txt">Bet Amount</span>
                <div class="input-row">
                    <input type="number" id="betInput" value="10.00">
                    <button class="btn-mini" onclick="adj(0.5)">½</button>
                    <button class="btn-mini" onclick="adj(2)">x2</button>
                </div>
            </div>
            <div class="input-group">
                <span class="label-txt">Auto Cashout</span>
                <div class="input-row">
                    <input type="number" id="autoInput" value="2.00" step="0.1">
                </div>
            </div>
            <button class="main-action btn-bet" id="btnBet">PLACE BET</button>
            <button class="main-action btn-cash" id="btnCash">CASHOUT</button>
        </div>

        <div class="stats-toggle">
            <div class="stats-head"><span>PLAYERS: <span id="pCount">0</span></span> <span style="color:var(--accent)">TOTAL: $<span id="totalBets">0.00</span></span></div>
            <div class="stats-body" id="playerList"></div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA", authDomain: "ai-dodo.firebaseapp.com", projectId: "ai-dodo", storageBucket: "ai-dodo.firebasestorage.app", messagingSenderId: "261622335803", appId: "1:261622335803:web:0b066791230535e7d5cf1e" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);

    let userId, userBalance = 0, currentMult = 1.0, isPlaying = false, hasCashout = false, hist = [];
    let fakePlayers = [];
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    onAuthStateChanged(auth, u => {
        if(u) { userId = u.uid; onSnapshot(doc(db, "users", userId), s => {
            userBalance = s.data().balance;
            document.getElementById('userBal').innerHTML = `<i class="fa-solid fa-wallet"></i> ${userBalance.toFixed(2)}`;
        }); }
    });

    window.adj = (f) => { if(!isPlaying) document.getElementById('betInput').value = (parseFloat(document.getElementById('betInput').value)*f).toFixed(2); };

    async function loop() {
        while(true) {
            document.getElementById('multiplier').style.color = 'var(--accent)';
            document.getElementById('planeNode').style.display = 'none';
            document.getElementById('flightPath').setAttribute('d', '');
            if(!isPlaying) { 
                document.getElementById('btnBet').style.display = 'block'; 
                document.getElementById('btnCash').style.display = 'none';
                document.getElementById('betInput').disabled = document.getElementById('autoInput').disabled = false;
            }
            
            fakePlayers = generateFakes();
            renderPlayers();

            await new Promise(r => setTimeout(r, 3000));

            document.getElementById('planeNode').style.display = 'block';
            document.getElementById('planeNode').classList.remove('crashed');
            const crashPoint = (Math.random() < 0.03) ? 1.00 : (1.00 / (1 - Math.random()) ** 0.96).toFixed(2);
            let start = Date.now();

            while(true) {
                let elapsed = (Date.now() - start) / 1000;
                currentMult = Math.pow(Math.E, 0.07 * elapsed);
                document.getElementById('multiplier').textContent = currentMult.toFixed(2) + 'x';
                
                // Auto Cashout Logic
                if(isPlaying && !hasCashout) {
                    let autoVal = parseFloat(document.getElementById('autoInput').value);
                    if(currentMult >= autoVal) { doCashout(); }
                }

                // Plane Visuals
                let x = Math.min(elapsed * 45, 80), y = Math.min(Math.pow(elapsed, 1.4) * 12, 75);
                document.getElementById('planeNode').style.transform = `translate(${x}vw, -${y}vh)`;
                document.getElementById('flightPath').setAttribute('d', `M 20 220 Q ${20 + (x*2)} 220, ${20 + (x*4.5)} ${220 - (y*3)}`);

                // Fakes Cashout
                fakePlayers.forEach(p => {
                    if(!p.out && currentMult >= p.t) {
                        p.out = true;
                        document.getElementById(`p-${p.id}`).querySelector('.p-res').innerHTML = `<span class="won-val">${p.t}x</span>`;
                    }
                });

                if(currentMult >= crashPoint) break;
                await new Promise(r => requestAnimationFrame(r));
            }

            document.getElementById('multiplier').textContent = currentMult.toFixed(2) + 'x';
            document.getElementById('multiplier').style.color = '#ff0050';
            document.getElementById('planeNode').classList.add('crashed');
            addHist(currentMult.toFixed(2));
            isPlaying = false; hasCashout = false;
            await new Promise(r => setTimeout(r, 2500));
        }
    }

    function generateFakes() {
        const stakeNames = ['Saka', 'Prime', 'Syztm', 'Stake_User', 'Unknown', 'Hidden', 'Maro', 'Wolf', 'Hidden', 'Zod'];
        let total = 0;
        let arr = stakeNames.map((n, i) => {
            let b = (Math.random()*150 + 2).toFixed(2);
            total += parseFloat(b);
            return { id: i, n, b, t: (1.1 + Math.random()*3).toFixed(2), out: false };
        });
        document.getElementById('totalBets').textContent = total.toFixed(2);
        document.getElementById('pCount').textContent = Math.floor(Math.random()*200+50);
        return arr;
    }

    function renderPlayers() {
        const list = document.getElementById('playerList');
        let html = '';
        if(isPlaying) {
            html += `<div class="p-row me"><span>YOU (Amana)</span><span>$${document.getElementById('betInput').value}</span><span class="p-res">${hasCashout ? 'WON' : '-'}</span></div>`;
        }
        html += fakePlayers.map(p => `<div class="p-row" id="p-${p.id}"><span>${p.n}</span><span>$${p.b}</span><span class="p-res">-</span></div>`).join('');
        list.innerHTML = html;
    }

    async function doCashout() {
        if(!isPlaying || hasCashout || currentMult < 1.01) return;
        hasCashout = true;
        const win = parseFloat(document.getElementById('betInput').value) * currentMult;
        await updateDoc(doc(db, "users", userId), { balance: increment(win) });
        document.getElementById('btnCash').style.background = 'var(--up)';
        document.getElementById('btnCash').textContent = 'WINNER!';
    }

    document.getElementById('btnBet').onclick = async () => {
        const bet = parseFloat(document.getElementById('betInput').value);
        if(bet > userBalance || bet <= 0) return;
        await updateDoc(doc(db, "users", userId), { balance: increment(-bet) });
        isPlaying = true;
        document.getElementById('betInput').disabled = document.getElementById('autoInput').disabled = true;
        document.getElementById('btnBet').style.display = 'none';
        document.getElementById('btnCash').style.display = 'block';
        renderPlayers();
    };

    document.getElementById('btnCash').onclick = doCashout;

    function addHist(v) {
        hist.unshift(v); if(hist.length > 10) hist.pop();
        document.getElementById('histBar').innerHTML = hist.map(h => `<div class="hist-item" style="color:${h >= 2 ? 'var(--up)' : (h < 1.2 ? '#ff0050' : '#fff')}">${h}x</div>`).join('');
    }

    loop();
</script>
</body>
</html>
