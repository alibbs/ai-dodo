<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>AMANA ELITE+ | Professional Terminal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --up: #00ff96; --down: #ff3b3b; --card: #11141d;
            --border: rgba(255,255,255,0.08);
        }

        * { touch-action: manipulation; box-sizing: border-box; -webkit-user-select: none; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* --- Header --- */
        .header { height: 50px; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; background: var(--card); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .header h1 { font-size: 14px; font-weight: 900; margin: 0; }
        .header h1 span { color: var(--brand); }
        .bal-display { text-align: right; line-height: 1; }
        .bal-display small { font-size: 8px; color: #666; }
        .bal-display b { color: var(--accent); font-size: 13px; display: block; }

        /* --- Upper Half: Chart --- */
        #chart-half { height: 45vh; background: #000; position: relative; border-bottom: 2px solid var(--border); }

        /* --- Lower Half: Management --- */
        #manage-half { height: 55vh; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }

        .tabs-nav { display: flex; background: var(--card); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #555; font-weight: 800; font-size: 11px; text-transform: uppercase; }
        .tab-btn.active { color: var(--brand); border-bottom: 2px solid var(--brand); }

        .tab-content { flex: 1; overflow-y: auto; padding: 12px; display: none; }
        .tab-content.active { display: block; }

        /* Trade UI Custom Sliders */
        .trade-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .in-box { background: var(--card); border: 1px solid var(--border); padding: 8px; border-radius: 8px; }
        .in-box label { display: block; font-size: 8px; color: #666; margin-bottom: 4px; }
        .in-box input { width: 100%; background: transparent; border: none; color: #fff; font-weight: 800; font-size: 14px; outline: none; }

        .slide-container { margin-bottom: 15px; }
        .range-slider {
            width: 100%; -webkit-appearance: none; height: 4px; border-radius: 5px;
            background: #222; outline: none; margin: 10px 0;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: var(--brand); cursor: pointer;
            box-shadow: 0 0 10px var(--brand);
        }

        .btns-row { display: flex; gap: 8px; margin-top: 10px; }
        .btn-trade { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: 900; color: #fff; font-size: 14px; }
        .bg-up { background: var(--up); }
        .bg-down { background: var(--down); }

        /* Position Display Card */
        .pos-card { background: #1a1d26; border-radius: 12px; padding: 12px; margin-top: 10px; border-left: 4px solid var(--brand); }
        .pnl-val { font-size: 24px; font-weight: 900; margin: 5px 0; }
        .close-pos-btn { width: 100%; background: #333; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 800; margin-top: 10px; }

        /* History Items */
        .hist-item { background: var(--card); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 11px; border: 1px solid var(--border); }
        .hist-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .txt-up { color: var(--up); }
        .txt-down { color: var(--down); }
    </style>
</head>
<body>

    <header class="header">
        <h1>AMANA <span>ELITE+</span></h1>
        <div class="bal-display">
            <small>WALLET BALANCE</small>
            <b id="walletBal">0.00</b>
        </div>
    </header>

    <section id="chart-half">
        <div id="tv_widget" style="height: 100%;"></div>
    </section>

    <section id="manage-half">
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('trade', this)">Trade / Position</button>
            <button class="tab-btn" onclick="switchTab('hist', this)">History</button>
        </div>

        <div id="tab-trade" class="tab-content active">
            <div class="slide-container">
                <div class="trade-inputs" style="margin-bottom:0">
                    <div class="in-box">
                        <label>AMOUNT (USDT)</label>
                        <input type="number" id="t-amount" value="0">
                    </div>
                    <div class="in-box">
                        <label>LEVERAGE</label>
                        <input type="text" id="t-lev-txt" value="10x" readonly>
                    </div>
                </div>
                <input type="range" min="0" max="100" value="0" class="range-slider" id="amount-slider">
                <div style="display:flex; justify-content:space-between; font-size:9px; color:#555; margin-top:-5px;">
                    <span>0%</span><span>50%</span><span>MAX</span>
                </div>
            </div>

            <div class="slide-container">
                <label style="font-size: 9px; color: #666;">ADJUST LEVERAGE (10x - 75x)</label>
                <input type="range" min="10" max="75" value="10" class="range-slider" id="lev-slider">
            </div>
            
            <div class="btns-row">
                <button class="btn-trade bg-down" onclick="executeTrade('SHORT')">SHORT</button>
                <button class="btn-trade bg-up" onclick="executeTrade('LONG')">LONG</button>
            </div>

            <div id="active-pos-area" style="display: none;">
                <div class="pos-card">
                    <div style="display:flex; justify-content:space-between; font-size:10px; color:#888;">
                        <b id="p-info" style="color:var(--brand)">BTCUSDT 10x</b>
                        <span>Entry: <span id="p-entry">0.00</span></span>
                    </div>
                    <div class="pnl-val" id="p-pnl">+0.00</div>
                    <div style="display:flex; justify-content:space-between; font-size:11px;">
                        <span id="p-roe">+0.00%</span>
                        <span style="color:var(--down)">Liq: <span id="p-liq">0.00</span></span>
                    </div>
                    <button class="close-pos-btn" onclick="closePosition()">CLOSE POSITION</button>
                </div>
            </div>
        </div>

        <div id="tab-hist" class="tab-content">
            <div id="history-list"></div>
        </div>
    </section>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
            authDomain: "ai-dodo.firebaseapp.com",
            projectId: "ai-dodo",
            storageBucket: "ai-dodo.firebasestorage.app",
            messagingSenderId: "261622335803",
            appId: "1:261622335803:web:0b066791230535e7d5cf1e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let uBal = 0, uID = null, curPrice = 0, activeP = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                uID = user.uid;
                onSnapshot(doc(db, "users", uID), (s) => {
                    uBal = s.data().balance || 0;
                    document.getElementById('walletBal').textContent = uBal.toFixed(2);
                });
            }
        });

        // Amount Slider Logic
        const amtSlider = document.getElementById('amount-slider');
        const amtInput = document.getElementById('t-amount');
        amtSlider.oninput = () => {
            let val = (amtSlider.value / 100) * uBal;
            amtInput.value = val.toFixed(2);
        };

        // Leverage Slider Logic
        const levSlider = document.getElementById('lev-slider');
        const levTxt = document.getElementById('t-lev-txt');
        levSlider.oninput = () => {
            levTxt.value = levSlider.value + "x";
        };

        new window.TradingView.widget({
            "autosize": true, "symbol": "BINANCE:BTCUSDT", "interval": "1", "theme": "dark",
            "container_id": "tv_widget", "hide_top_toolbar": true, "backgroundColor": "#060914"
        });

        const ws = new WebSocket(`wss://stream.binance.com:9443/ws/btcusdt@ticker`);
        ws.onmessage = (e) => {
            curPrice = parseFloat(JSON.parse(e.data).c);
            updateLivePNL();
        };

        window.switchTab = (t, btn) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + t).classList.add('active');
        };

        window.executeTrade = async (side) => {
            const amt = parseFloat(amtInput.value);
            const lev = parseInt(levSlider.value);
            const fee = amt * 0.025;

            if(amt <= 0) return alert("Please enter an amount");
            if(amt + fee > uBal) return alert("Insufficient Balance (Inc. 2.5% Fee)");
            if(activeP) return alert("Close active position first");

            await updateDoc(doc(db, "users", uID), { balance: increment(-(amt + fee)) });

            activeP = {
                side, entry: curPrice, amt, lev, fee,
                liq: side === 'LONG' ? curPrice * (1 - (0.68/lev)) : curPrice * (1 + (0.68/lev))
            };

            document.getElementById('active-pos-area').style.display = 'block';
            document.getElementById('p-info').textContent = "BTCUSDT " + side + " " + lev + "x";
            document.getElementById('p-entry').textContent = curPrice.toFixed(2);
            document.getElementById('p-liq').textContent = activeP.liq.toFixed(2);
        };

        function updateLivePNL() {
            if(!activeP) return;
            let diff = activeP.side === 'LONG' ? (curPrice - activeP.entry) : (activeP.entry - curPrice);
            let roe = (diff / activeP.entry) * 100 * activeP.lev;
            let pnl = (roe / 100) * activeP.amt;

            if(roe <= -68) { closePosition(true); return; }

            const pnlEl = document.getElementById('p-pnl');
            pnlEl.textContent = (pnl >= 0 ? '+' : '') + pnl.toFixed(2) + " USDT";
            pnlEl.style.color = pnl >= 0 ? 'var(--up)' : 'var(--down)';
            document.getElementById('p-roe').textContent = (roe >= 0 ? '+' : '') + roe.toFixed(2) + "% ROE";
            document.getElementById('p-roe').style.color = roe >= 0 ? 'var(--up)' : 'var(--down)';
        }

        window.closePosition = async (isLiq = false) => {
            if(!activeP) return;
            let diff = activeP.side === 'LONG' ? (curPrice - activeP.entry) : (activeP.entry - curPrice);
            let pnl = ((diff / activeP.entry) * activeP.lev) * activeP.amt;
            let finalReturn = isLiq ? 0 : (activeP.amt + pnl);

            if(finalReturn > 0) {
                await updateDoc(doc(db, "users", uID), { balance: increment(finalReturn) });
            }

            addToHistory(activeP.side, pnl, activeP.fee);
            activeP = null;
            document.getElementById('active-pos-area').style.display = 'none';
        };

        function addToHistory(side, pnl, fee) {
            const list = document.getElementById('history-list');
            const item = document.createElement('div');
            item.className = 'hist-item';
            item.innerHTML = `
                <div class="hist-row"><b>BTCUSDT ${side}</b><span class="${pnl>=0?'txt-up':'txt-down'}">${pnl>=0?'+':''}${pnl.toFixed(2)} USDT</span></div>
                <div class="hist-row" style="color:#555"><span>Fee: ${fee.toFixed(2)}</span><span>Net: ${(pnl-fee).toFixed(2)}</span></div>
            `;
            list.prepend(item);
        }
    </script>
</body>
</html>
