<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>AMANA GLOBAL | Create Account</title>

<style>
:root{
  --bg:#0b0f1f;
  --text:#ffffff;
  --muted:#b8b9d9;
  --brand1:#a100ff;
  --brand2:#ff00b8;
  --glass: rgba(255,255,255,.06);
  --border: rgba(255,255,255,.08);
  --radius:16px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family: system-ui, -apple-system, Tahoma, Arial;
  background: linear-gradient(135deg,#0b0f1f,#1c0833);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.container{width:100%;max-width:420px;}
.header{text-align:center;margin-bottom:20px;}

.brand{
  font-size:22px;
  font-weight:900;
  background:linear-gradient(135deg,var(--brand1),var(--brand2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.card{
  background:var(--glass);
  backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px;
}

label{
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
  display:block;
}

input,select{
  width:100%;
  padding:14px;
  margin-bottom:16px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(0,0,0,.4);
  color:#fff;
  font-size:15px;
}

select option{color:#000;}

input:focus,select:focus{
  border-color:var(--brand2);
  outline:none;
  box-shadow:0 0 0 3px rgba(255,0,184,.2);
}

button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  background:linear-gradient(135deg,var(--brand1),var(--brand2));
  color:#fff;
}

.msg{
  margin-top:15px;
  padding:12px;
  border-radius:12px;
  font-size:14px;
  display:none;
}

.success{background:rgba(0,255,150,.1);}
.error{background:rgba(255,0,80,.1);}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="brand">AMANA GLOBAL</div>
  <div style="color:var(--muted);font-size:13px;margin-top:4px;">
    Create Your Secure Account
  </div>
</div>

<div class="card">
<form id="createForm">

<label>Username</label>
<input id="username" required minlength="3" placeholder="Enter username" />

<label>Email</label>
<input type="email" id="email" required placeholder="you@example.com" />

<label>Password</label>
<input type="password" id="password" required minlength="8" placeholder="Minimum 8 characters" />

<label>Country</label>
<select id="country" required>
<option value="">Select Country</option>

<!-- Arab Countries First -->
<option value="+971">🇦🇪 United Arab Emirates (+971)</option>
<option value="+966">🇸🇦 Saudi Arabia (+966)</option>
<option value="+961">🇱🇧 Lebanon (+961)</option>
<option value="+20">🇪🇬 Egypt (+20)</option>
<option value="+962">🇯🇴 Jordan (+962)</option>
<option value="+974">🇶🇦 Qatar (+974)</option>
<option value="+965">🇰🇼 Kuwait (+965)</option>
<option value="+968">🇴🇲 Oman (+968)</option>
<option value="+973">🇧🇭 Bahrain (+973)</option>
<option value="+964">🇮🇶 Iraq (+964)</option>
<option value="+963">🇸🇾 Syria (+963)</option>
<option value="+212">🇲🇦 Morocco (+212)</option>
<option value="+213">🇩🇿 Algeria (+213)</option>
<option value="+216">🇹🇳 Tunisia (+216)</option>

<!-- Other Major Countries -->
<option value="+1">🇺🇸 United States (+1)</option>
<option value="+44">🇬🇧 United Kingdom (+44)</option>
<option value="+49">🇩🇪 Germany (+49)</option>
<option value="+33">🇫🇷 France (+33)</option>
<option value="+39">🇮🇹 Italy (+39)</option>
<option value="+34">🇪🇸 Spain (+34)</option>
<option value="+90">🇹🇷 Turkey (+90)</option>
<option value="+7">🇷🇺 Russia (+7)</option>
<option value="+86">🇨🇳 China (+86)</option>
<option value="+91">🇮🇳 India (+91)</option>
<option value="+92">🇵🇰 Pakistan (+92)</option>
<option value="+81">🇯🇵 Japan (+81)</option>
<option value="+82">🇰🇷 South Korea (+82)</option>
<option value="+61">🇦🇺 Australia (+61)</option>
<option value="+55">🇧🇷 Brazil (+55)</option>
<option value="+27">🇿🇦 South Africa (+27)</option>
<option value="+234">🇳🇬 Nigeria (+234)</option>
<option value="+62">🇮🇩 Indonesia (+62)</option>
<option value="+63">🇵🇭 Philippines (+63)</option>
<option value="+66">🇹🇭 Thailand (+66)</option>
<option value="+60">🇲🇾 Malaysia (+60)</option>

<!-- (You can easily expand to 200 countries later) -->

</select>

<label>Phone Number</label>
<input type="tel" id="phone" required placeholder="Enter phone number" />

<label>Promo Code (Optional)</label>
<input id="promo" placeholder="Enter promo code if any" />

<button type="submit">Create Account</button>

<div id="msg" class="msg"></div>

</form>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form=document.getElementById("createForm");
const msg=document.getElementById("msg");

function show(text,type){
  msg.style.display="block";
  msg.className="msg "+type;
  msg.textContent=text;
}

form.addEventListener("submit",async e=>{
e.preventDefault();

try{
const user=await createUserWithEmailAndPassword(auth,email.value,password.value);

await updateProfile(user.user,{displayName:username.value});

await setDoc(doc(db,"users",user.user.uid),{
username:username.value,
email:email.value,
country:country.value,
phone:country.value + phone.value,
promo:promo.value || null,
createdAt:serverTimestamp()
});

show("Account created successfully ✅","success");
setTimeout(()=>window.location="profile.html",800);

}catch(err){
show("Error: "+err.message,"error");
}
});
</script>

</body>
</html>
