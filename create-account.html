<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA GLOBAL | Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914;
            --text: #ffffff;
            --muted: #8b8da3;
            --brand1: #a100ff;
            --brand2: #ff00b8;
            --glass: rgba(255, 255, 255, .03);
            --border: rgba(255, 255, 255, .08);
            --radius: 24px;
            --accent: #00f2ff;
            --success: #00ff96;
            --error: #ff0050;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; font-family: 'Inter', system-ui, -apple-system;
            background: var(--bg);
            background: radial-gradient(circle at top left, #1a0b2e 0%, #060914 100%);
            color: var(--text); min-height: 100vh; display: flex;
            align-items: center; justify-content: center; padding: 20px;
        }
        .wrap { width: 100%; max-width: 420px; animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--glass); backdrop-filter: blur(30px);
            border: 1px solid var(--border); border-radius: var(--radius);
            padding: 35px 25px; text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
        }
        .logo {
            font-size: 28px; font-weight: 900; margin-bottom: 5px;
            background: linear-gradient(135deg, var(--accent), var(--brand2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -1.5px; text-transform: uppercase;
        }
        h1 { margin: 0 0 5px; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .sub { margin: 0 0 30px; color: var(--muted); font-size: 13px; }

        .form-group { text-align: left; margin-bottom: 18px; position: relative; }
        label {
            display: block; font-weight: 600; font-size: 11px; margin-bottom: 8px;
            color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
        }
        .field-wrapper { position: relative; }
        .field-wrapper i {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: #444; font-size: 16px; transition: 0.3s;
        }
        input, select {
            width: 100%; padding: 14px 15px 14px 45px; border-radius: 14px;
            border: 1px solid var(--border); background: rgba(0,0,0,.4);
            color: #fff; font-size: 15px; outline: none; transition: 0.3s;
        }
        input:focus, select:focus {
            border-color: var(--brand2); background: rgba(255,0,184,0.05);
            box-shadow: 0 0 15px rgba(255,0,184,0.15);
        }
        input:focus + i { color: var(--brand2); }

        .submit-btn {
            width: 100%; padding: 18px; border-radius: 16px; border: none !important;
            font-weight: 900; font-size: 16px; cursor: pointer;
            background: linear-gradient(135deg, var(--brand1), var(--brand2)) !important;
            color: #fff !important; margin-top: 10px; transition: 0.4s;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 8px 25px rgba(255, 0, 184, 0.3);
            display: flex; align-items: center; justify-content: center; gap: 10px;
            appearance: none; -webkit-appearance: none;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255, 0, 184, 0.4); }
        .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; filter: grayscale(1); }

        .login-link { margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border); }
        .btn-outline {
            display: block; width: 100%; padding: 14px; border-radius: 14px;
            border: 1px solid var(--border); background: transparent;
            color: var(--muted); text-decoration: none; font-size: 13px;
            font-weight: 700; transition: 0.3s; text-align: center;
        }
        .btn-outline:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: var(--accent); }

        .status-msg {
            margin-top: 20px; padding: 15px; border-radius: 16px;
            display: none; font-size: 13px; font-weight: 700;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
        .status-msg.err { background: rgba(255,0,80,0.1); color: var(--error); border: 1px solid rgba(255,0,80,0.2); }
        .status-msg.ok { background: rgba(0,255,150,0.1); color: var(--success); border: 1px solid rgba(0,255,150,0.2); }
    </style>
</head>
<body>

<div class="wrap">
    <div class="card">
        <div class="logo">AMANA</div>
        <h1>Create Account</h1>
        <p class="sub">Join the elite AI trading & gaming ecosystem</p>

        <form id="createForm">
            <div class="form-group">
                <label>Username</label>
                <div class="field-wrapper">
                    <input id="username" type="text" placeholder="e.g. AmanaElite" required minlength="3" />
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <div class="field-wrapper">
                    <input type="email" id="email" placeholder="name@domain.com" required />
                    <i class="fa-solid fa-envelope"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Security Password</label>
                <div class="field-wrapper">
                    <input type="password" id="password" placeholder="Min. 8 characters" required minlength="8" />
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <div style="flex: 1.2;">
                    <div class="form-group">
                        <label>Code</label>
                        <select id="country" required style="padding-left: 15px;">
                            <option value="+961">🇱🇧 +961</option>
                            <option value="+971">🇦🇪 +971</option>
                            <option value="+966">🇸🇦 +966</option>
                            <option value="+1">🇺🇸 +1</option>
                        </select>
                    </div>
                </div>
                <div style="flex: 2;">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <div class="field-wrapper">
                            <input type="tel" id="phone" placeholder="70123456" required style="padding-left: 40px;" />
                            <i class="fa-solid fa-phone"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 25px;">
                <label>Promo Code (Optional)</label>
                <div class="field-wrapper">
                    <input id="promo" placeholder="Enter if any" />
                    <i class="fa-solid fa-tag"></i>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">
                <span id="btnText">CREATE ACCOUNT</span>
            </button>
            
            <div id="statusBox" class="status-msg"></div>
        </form>

        <div class="login-link">
            <a href="login.html" class="btn-outline">ALREADY HAVE AN ACCOUNT? LOGIN</a>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, serverTimestamp, collection, query, where, limit, getDocs, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
        authDomain: "ai-dodo.firebaseapp.com",
        projectId: "ai-dodo",
        storageBucket: "ai-dodo.firebasestorage.app",
        messagingSenderId: "261622335803",
        appId: "1:261622335803:web:0b066791230535e7d5cf1e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("createForm");
    const statusBox = document.getElementById("statusBox");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");

    function showStatus(msg, type) {
        statusBox.textContent = msg;
        statusBox.style.display = "block";
        statusBox.className = "status-msg " + (type === 'success' ? 'ok' : 'err');
    }

    // --- الفحص الذكي: لو مسجل دخول، اطلعه بره الصفحة دغري ---
    onAuthStateChanged(auth, (user) => {
        if (user) { 
            window.location.replace("home.html"); 
        }
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> CREATING VAULT...';

        try {
            // 1. سحب محفظة من الـ Pool
            const poolRef = collection(db, "wallet_pool");
            const q = query(poolRef, where("isUsed", "==", false), limit(1));
            const poolSnap = await getDocs(q);

            if (poolSnap.empty) throw new Error("Our Investment Pool is currently full. Contact Admin.");

            const walletDoc = poolSnap.docs[0];
            const walletAddress = walletDoc.data().address;

            // 2. إنشاء المستخدم في Firebase Auth
            const emailVal = document.getElementById("email").value.trim();
            const passwordVal = document.getElementById("password").value;
            const userCredential = await createUserWithEmailAndPassword(auth, emailVal, passwordVal);
            const user = userCredential.user;

            // 3. تحديث الاسم
            const usernameVal = document.getElementById("username").value.trim();
            await updateProfile(user, { displayName: usernameVal });

            // 4. الربط في الـ Database بنظام الـ Transaction لضمان الأمان
            await runTransaction(db, async (transaction) => {
                transaction.update(doc(db, "wallet_pool", walletDoc.id), { 
                    isUsed: true, 
                    assignedTo: user.uid 
                });

                transaction.set(doc(db, "users", user.uid), {
                    uid: user.uid,
                    username: usernameVal,
                    email: emailVal,
                    country: document.getElementById("country").value,
                    phone: document.getElementById("country").value + document.getElementById("phone").value.trim(),
                    promo: document.getElementById("promo").value.trim() || "NONE",
                    balance: 0.0,
                    bot_profit: 0.0,
                    game_profit: 0.0,
                    trc20_address: walletAddress,
                    status: "active",
                    createdAt: serverTimestamp()
                });
            });

            btnText.innerHTML = '<i class="fa-solid fa-check"></i> DEPLOYED!';
            showStatus("Account & Wallet Synchronized! Redirecting...", "success");
            // التحويل سيتم تلقائياً عبر onAuthStateChanged
            
        } catch (err) {
            submitBtn.disabled = false;
            btnText.textContent = "CREATE ACCOUNT";
            let friendlyError = err.message;
            if(err.code === "auth/email-already-in-use") friendlyError = "Email already registered.";
            showStatus(friendlyError, "error");
        }
    });
</script>
</body>
</html>
