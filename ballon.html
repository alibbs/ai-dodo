<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMANA ELITE | BALLOON</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@600;800&display=swap');

        :root {
            --bg: #030712;
            --panel: #111827;
            --accent: #00f2ff;
            --win: #00ff88;
            --loss: #ff0055;
            --gold: #facc15;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }

        header { 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .bal-box { 
            background: #000; 
            padding: 8px 15px; 
            border-radius: 12px; 
            border: 1px solid var(--accent); 
            font-family: 'Orbitron'; 
            color: var(--gold);
            font-size: 14px;
        }

        .game-area { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative;
            perspective: 1000px;
        }

        /* البالون */
        .balloon-wrapper { 
            position: relative; 
            z-index: 5;
            transition: transform 0.1s linear;
        }

        .balloon {
            width: 100px; 
            height: 130px; 
            background: var(--accent);
            border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.3), 0 0 30px rgba(0,242,255,0.2);
            position: relative;
        }

        .balloon::after { 
            content: ""; 
            position: absolute; 
            bottom: -8px; 
            left: 50%; 
            transform: translateX(-50%); 
            border-left: 8px solid transparent; 
            border-right: 8px solid transparent; 
            border-bottom: 12px solid var(--accent); 
        }

        .multiplier-display { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-family: 'Orbitron'; 
            font-size: 2rem; 
            font-weight: 900; 
            z-index: 10; 
            pointer-events: none;
            white-space: nowrap;
        }

        .controls { 
            background: var(--panel); 
            padding: 20px 25px 40px 25px; 
            border-radius: 30px 30px 0 0; 
            border-top: 2px solid var(--accent);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 10px; color: #9ca3af; margin-bottom: 6px; font-weight: 800; letter-spacing: 1px; }
        .input-group input { 
            width: 100%; 
            background: #000; 
            border: 1px solid #374151; 
            padding: 14px; 
            border-radius: 12px; 
            color: #fff; 
            font-family: 'Orbitron'; 
            font-size: 1.1rem;
        }

        .action-btn {
            width: 100%; 
            padding: 20px; 
            border-radius: 16px; 
            border: none;
            background: var(--accent);
            color: #000; 
            font-family: 'Orbitron'; 
            font-size: 1.2rem; 
            font-weight: 900;
            cursor: pointer; 
            transition: 0.1s;
        }

        .action-btn.cashing { background: var(--win); }
        .action-btn:disabled { opacity: 0.5; filter: grayscale(1); }

        /* الأنيميشن عند الانفجار */
        .shake { animation: shakeBall 0.1s infinite; }
        @keyframes shakeBall {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            50% { transform: translate(-1px, -2px) rotate(-1deg); }
            100% { transform: translate(1px, 1px) rotate(1deg); }
        }

        #pop { 
            position: absolute; 
            font-size: 5rem; 
            display: none; 
            z-index: 20;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <div style="font-family:'Orbitron'; font-weight:900; font-size:12px;">AMANA <span style="color:var(--accent)">BALLOON</span></div>
        <div class="bal-box" id="balance">1,000.00</div>
    </header>

    <div class="game-area">
        <div id="pop">💥</div>
        <div class="balloon-wrapper" id="bWrapper">
            <div class="multiplier-display" id="multText">1.00x</div>
            <div class="balloon" id="balloon"></div>
        </div>
    </div>

    <div class="controls">
        <div class="input-group">
            <label>BET AMOUNT (USDT)</label>
            <input type="number" id="betAmt" value="10.00" step="1">
        </div>
        <button class="action-btn" id="btn" onclick="handleAction()">BET & PUMP</button>
    </div>

<script>
    let bal = 1000.00;
    let isPlaying = false;
    let currentMult = 1.00;
    let crashPoint = 0;
    let gameInterval;

    const btn = document.getElementById('btn');
    const balloon = document.getElementById('balloon');
    const bWrapper = document.getElementById('bWrapper');
    const multText = document.getElementById('multText');
    const balText = document.getElementById('balance');
    const pop = document.getElementById('pop');

    function handleAction() {
        if (!isPlaying) {
            startGame();
        } else {
            cashOut();
        }
    }

    function startGame() {
        const amt = parseFloat(document.getElementById('betAmt').value);
        if (isNaN(amt) || amt > bal || amt <= 0) {
            alert("Check your balance!");
            return;
        }

        bal -= amt;
        updateUI();
        
        isPlaying = true;
        currentMult = 1.00;
        pop.style.display = "none";
        multText.style.color = "#fff";
        balloon.style.opacity = "1";
        
        // --- منطق الخسارة الاحترافي ---
        let chance = Math.random();
        if (chance < 0.15) { // 15% يفرقع فوراً
            crashPoint = 1.00; 
        } else if (amt >= 50) { // لو الرهان كبير
            crashPoint = 1.1 + (Math.random() * 0.7); 
        } else {
            crashPoint = 1.2 + (Math.random() * 2.5); 
        }

        btn.innerText = "CASH OUT";
        btn.classList.add('cashing');
        
        gameInterval = setInterval(() => {
            currentMult += 0.02;
            multText.innerText = currentMult.toFixed(2) + "x";
            
            // تكبير البالون تدريجياً
            let scale = 1 + (currentMult - 1) * 0.4;
            bWrapper.style.transform = `scale(${scale})`;

            // إضافة اهتزاز قبل الانفجار بـ 0.2
            if (currentMult > crashPoint - 0.2) {
                bWrapper.classList.add('shake');
            }

            if (currentMult >= crashPoint) {
                gameOver();
            }
        }, 60);
    }

    function cashOut() {
        clearInterval(gameInterval);
        const amt = parseFloat(document.getElementById('betAmt').value);
        const win = amt * currentMult;
        bal += win;
        
        multText.style.color = "var(--win)";
        bWrapper.classList.remove('shake');
        endGame();
    }

    function gameOver() {
        clearInterval(gameInterval);
        isPlaying = false;
        bWrapper.classList.remove('shake');
        
        balloon.style.opacity = "0";
        pop.style.display = "block";
        multText.innerText = "POPPED!";
        multText.style.color = "var(--loss)";
        
        setTimeout(() => {
            pop.style.display = "none";
            endGame();
        }, 1000);
    }

    function endGame() {
        isPlaying = false;
        btn.innerText = "BET & PUMP";
        btn.classList.remove('cashing');
        btn.disabled = true;
        
        setTimeout(() => {
            currentMult = 1.00;
            multText.innerText = "1.00x";
            multText.style.color = "#fff";
            bWrapper.style.transform = "scale(1)";
            balloon.style.opacity = "1";
            btn.disabled = false;
            updateUI();
        }, 1200);
    }

    function updateUI() {
        balText.innerText = bal.toLocaleString(undefined, {minimumFractionDigits: 2});
    }
</script>
</body>
</html>
