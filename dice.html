<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AMANA ELITE | DICE PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@600;800;900&display=swap');

        :root {
            --bg: #02040a;
            --panel: #0d111c;
            --accent: #8b5cf6;
            --gold: #fbbf24;
            --up: #00e701;
            --down: #ff3b3b;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; outline: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 20px); }

        /* Modern Header */
        header { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .brand { font-family: 'Orbitron'; font-size: 14px; color: var(--accent); letter-spacing: 2px; }
        .balance-box { 
            background: var(--panel); padding: 10px 18px; border-radius: 14px; 
            border: 1px solid var(--border); display: flex; align-items: center; gap: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .balance-box span { font-family: 'Orbitron'; font-size: 1rem; color: #fff; }

        /* Game Stage */
        .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 30px; }
        
        /* Result Capsule */
        .dice-hub {
            width: 100%; max-width: 450px; background: var(--panel); border-radius: 32px;
            padding: 50px 25px 30px 25px; position: relative; border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .result-container {
            background: rgba(0,0,0,0.4); padding: 30px; border-radius: 24px;
            border: 1px solid var(--border); margin-bottom: 40px; position: relative;
        }
        .result-val { font-size: 70px; font-weight: 900; font-family: 'Orbitron'; letter-spacing: -2px; }
        
        /* Custom Slider Elite */
        .slider-wrapper { width: 100%; position: relative; padding: 20px 0; }
        .track { height: 14px; background: var(--down); border-radius: 20px; position: relative; overflow: hidden; border: 1px solid rgba(0,0,0,0.5); }
        .track-win { position: absolute; height: 100%; background: var(--up); right: 0; transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        
        input[type=range] {
            position: absolute; width: 100%; top: 12px; appearance: none; background: transparent; cursor: pointer; z-index: 10;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none; height: 42px; width: 42px; border-radius: 12px; background: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8); cursor: grab; border: 5px solid var(--accent);
            transition: 0.2s;
        }

        .tick-marks { display: flex; justify-content: space-between; padding: 12px 5px; color: #475569; font-weight: 800; font-size: 11px; }

        /* Stats Capsule */
        .stats-hub { 
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; width: 100%;
        }
        .s-box { 
            background: var(--glass); padding: 12px; border-radius: 16px; 
            border: 1px solid var(--border); text-align: center; 
        }
        .s-box label { display: block; font-size: 8px; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px; }
        .s-box span { font-family: 'Orbitron'; font-size: 13px; font-weight: 700; color: #fff; }

        /* Controls Panel */
        .controls { 
            background: var(--panel); padding: 25px 25px 45px 25px; 
            border-radius: 40px 40px 0 0; border-top: 1px solid var(--border);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }

        .bet-input-wrap {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            padding: 15px; border-radius: 20px; display: flex; flex-direction: column; gap: 5px; margin-bottom: 20px;
        }
        .bet-input-wrap label { font-size: 10px; color: #64748b; font-weight: 800; text-transform: uppercase; }
        .input-group { display: flex; align-items: center; gap: 10px; }
        .input-group input { 
            flex: 1; background: transparent; border: none; color: #fff; 
            font-size: 22px; font-weight: 900; font-family: 'Inter'; 
        }

        .roll-btn {
            width: 100%; padding: 22px; border-radius: 20px; border: none;
            background: linear-gradient(135deg, var(--accent), #6d28d9);
            color: #fff; font-size: 1.3rem; font-weight: 900;
            text-transform: uppercase; cursor: pointer;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.3);
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .roll-btn:active { transform: scale(0.96); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2); }

        /* Animations */
        .win-glow { color: var(--up) !important; text-shadow: 0 0 30px rgba(0, 231, 1, 0.6); }
        .loss-glow { color: var(--down) !important; text-shadow: 0 0 30px rgba(255, 59, 59, 0.6); }
    </style>
</head>
<body>

    <header>
        <div class="brand">AMANA ELITE</div>
        <div class="balance-box">
            <i class="fa-solid fa-coins" style="color:var(--gold)"></i>
            <span id="balText">1,000.00</span>
        </div>
    </header>

    <div class="game-area">
        <div class="dice-hub">
            <div class="result-container">
                <div id="resDisplay" class="result-val">50.00</div>
            </div>
            
            <div class="slider-wrapper">
                <div class="track">
                    <div id="winFill" class="track-win" style="width: 50%;"></div>
                </div>
                <input type="range" id="mainSlider" min="2" max="98" value="50" step="0.01">
                <div class="tick-marks">
                    <span>0</span><span>25</span><span>50</span><span>75</span><span>100</span>
                </div>
            </div>

            <div class="stats-hub">
                <div class="s-box"><label>Multiplier</label><span id="mVal">1.98x</span></div>
                <div class="s-box"><label>Roll Over</label><span id="tVal">50.00</span></div>
                <div class="s-box"><label>Win %</label><span id="cVal">50.00</span></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="bet-input-wrap">
            <label>Amount (USDT)</label>
            <div class="input-group">
                <i class="fa-solid fa-bolt" style="color:var(--accent)"></i>
                <input type="number" id="betAmount" value="10.00">
            </div>
        </div>
        <button class="roll-btn" id="rollBtn" onclick="executeRoll()">Roll Dice</button>
    </div>

<script>
    let currentBalance = 1000.00;
    const slider = document.getElementById('mainSlider');
    const winFill = document.getElementById('winFill');
    const resDisplay = document.getElementById('resDisplay');
    const mVal = document.getElementById('mVal');
    const tVal = document.getElementById('tVal');
    const cVal = document.getElementById('cVal');
    const balText = document.getElementById('balText');
    const rollBtn = document.getElementById('rollBtn');

    function refreshStats() {
        const val = parseFloat(slider.value);
        const winChance = 100 - val;
        
        // تحريك مساحة الربح (الأخضر)
        winFill.style.width = winChance + "%";
        
        // تحديث القيم
        tVal.innerText = val.toFixed(2);
        cVal.innerText = winChance.toFixed(2);
        mVal.innerText = (99 / winChance).toFixed(4) + "x";
    }

    slider.oninput = refreshStats;

    function executeRoll() {
        const bet = parseFloat(document.getElementById('betAmount').value);
        if (bet > currentBalance || bet <= 0) {
            rollBtn.style.animation = "shake 0.5s";
            setTimeout(() => rollBtn.style.animation = "", 500);
            return;
        }

        // خصم الرهان
        currentBalance -= bet;
        updateUI();
        rollBtn.disabled = true;

        const target = parseFloat(slider.value);
        const winChance = 100 - target;
        const multiplier = 99 / winChance;
        
        let frames = 0;
        const speed = setInterval(() => {
            const temp = (Math.random() * 100).toFixed(2);
            resDisplay.innerText = temp;
            resDisplay.className = "result-val";
            frames++;
            
            if (frames > 12) {
                clearInterval(speed);
                const final = Math.random() * 100;
                resDisplay.innerText = final.toFixed(2);
                
                if (final > target) {
                    // WIN
                    const profit = bet * multiplier;
                    currentBalance += profit;
                    resDisplay.classList.add("win-glow");
                } else {
                    // LOSS
                    resDisplay.classList.add("loss-glow");
                }
                
                updateUI();
                rollBtn.disabled = false;
            }
        }, 60);
    }

    function updateUI() {
        balText.innerText = currentBalance.toLocaleString(undefined, {minimumFractionDigits: 2});
    }

    // تهيئة أولية
    refreshStats();
    updateUI();
</script>

<style>
    /* إضافة حركة الاهتزاز عند الخطأ */
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
    }
</style>
</body>
</html>
