<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Join TARMAI GLOBAL | Secure Mining</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #8b5cf6;
            --bg-dark: #050810;
        }
        body { 
            background-color: var(--bg-dark); 
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }
        .mesh-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .glass-input:focus-within {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }
        input { background: transparent; border: none; outline: none; color: white; width: 100%; font-size: 14px; }
        input::placeholder { color: #64748b; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center px-8 py-12">
    <div class="mesh-bg"></div>

    <div class="text-center mb-10">
        <div class="w-16 h-16 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-xl shadow-blue-500/20">
            <i class="fas fa-layer-group text-2xl text-white"></i>
        </div>
        <h1 class="text-2xl font-black tracking-tighter uppercase">TARMAI <span class="text-blue-500">GLOBAL</span></h1>
        <p class="text-gray-500 text-xs mt-2 tracking-widest uppercase font-bold">Secure Infrastructure</p>
    </div>

    <div class="space-y-4">
        <div class="text-left mb-6">
            <h2 class="text-xl font-bold">Create Account</h2>
            <p class="text-gray-500 text-sm">Join the next generation of cloud mining.</p>
        </div>

        <div class="glass-input p-4 rounded-2xl flex items-center gap-4">
            <i class="fas fa-user text-gray-500 w-5"></i>
            <input type="text" placeholder="Full Name" required>
        </div>

        <div class="glass-input p-4 rounded-2xl flex items-center gap-4">
            <i class="fas fa-envelope text-gray-500 w-5"></i>
            <input type="email" placeholder="Email Address" required>
        </div>

        <div class="glass-input p-4 rounded-2xl flex items-center gap-4">
            <i class="fas fa-phone text-gray-500 w-5"></i>
            <input type="tel" placeholder="Phone Number" required>
        </div>

        <div class="glass-input p-4 rounded-2xl flex items-center gap-4">
            <i class="fas fa-lock text-gray-500 w-5"></i>
            <input type="password" placeholder="Create Password" required>
        </div>

        <div class="glass-input p-4 rounded-2xl flex items-center gap-4 opacity-70">
            <i class="fas fa-ticket-alt text-gray-500 w-5"></i>
            <input type="text" placeholder="Referral Code (Optional)">
        </div>

        <div class="flex items-center gap-3 px-2 py-2">
            <input type="checkbox" class="w-4 h-4 rounded border-gray-700 bg-transparent text-blue-600 focus:ring-0" required>
            <label class="text-[11px] text-gray-400">I agree to the <span class="text-blue-500">Terms of Service</span> and <span class="text-blue-500">Privacy Policy</span>.</label>
        </div>

        <button onclick="handleSignUp()" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-500/20 active:scale-95 transition mt-4">
            GET STARTED
        </button>

        <p class="text-center text-sm text-gray-500 mt-6">
            Already have an account? <a href="login.html" class="text-blue-500 font-bold">Login</a>
        </p>
    </div>

    <div class="mt-12 flex justify-center items-center gap-6 opacity-30 grayscale">
        <i class="fas fa-shield-halved text-xl"></i>
        <i class="fas fa-fingerprint text-xl"></i>
        <i class="fas fa-lock text-xl"></i>
    </div>

    <script>
        function handleSignUp() {
            // Logic to redirect or save data
            const btn = document.querySelector('button');
            btn.innerHTML = '<i class="fas fa-circle-notch animate-spin"></i> SECURING...';
            
            setTimeout(() => {
                window.location.href = "home.html";
            }, 1500);
        }
    </script>
</body>
</html>
