<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>AMANA CRASH | STAKE EDITION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914;
            --panel: #0f121d;
            --brand: #ff00b8;
            --up: #00ff96;
            --usdt: #26a17b;
            --border: #222635;
            --input-bg: #1a1d29;
        }

        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; position: fixed;
            font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
        }

        /* --- Header & USDT Balance --- */
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .balance-tag {
            background: var(--panel); border: 2px solid var(--border);
            padding: 8px 16px; border-radius: 8px; font-weight: 800; 
            display: flex; align-items: center; gap: 8px;
        }
        .usdt-icon { color: var(--usdt); font-size: 20px; }

        /* --- Game Viewport --- */
        .game-area {
            flex: 1; position: relative; margin: 0 10px;
            background: #000; border-radius: 15px;
            border: 1px solid var(--border); overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .multiplier-val { font-size: 65px; font-weight: 900; z-index: 10; font-variant-numeric: tabular-nums; }
        #rocket { position: absolute; bottom: 15%; left: 10%; font-size: 35px; color: var(--brand); z-index: 5; transform: rotate(-45deg); text-shadow: 0 0 20px var(--brand); }

        /* --- History --- */
        .history-lane { display: flex; gap: 6px; padding: 10px 15px; overflow-x: auto; }
        .hist-chip { background: var(--panel); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; border: 1px solid var(--border); }

        /* --- Stake Style Dashboard --- */
        .dashboard {
            background: var(--panel); border-top: 2px solid var(--border);
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            padding-bottom: 30px;
        }

        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .label-row { display: flex; justify-content: space-between; font-size: 11px; color: #55607b; font-weight: 700; text-transform: uppercase; }
        
        .input-wrapper {
            background: var(--input-bg); border: 2px solid var(--border);
            border-radius: 6px; display: flex; align-items: center; padding-right: 5px;
        }
        .input-wrapper input { 
            flex: 1; background: transparent; border: none; color: #fff; 
            padding: 12px; font-size: 15px; font-weight: 700; 
        }

        .quick-btns { display: flex; gap: 2px; }
        .quick-btns button { 
            background: #2f3749; border: none; color: #fff; 
            padding: 8px 12px; font-size: 11px; font-weight: 800; border-radius: 4px;
        }

        /* --- Main Action Button --- */
        .main-btn {
            width: 100%; padding: 18px; border-radius: 6px; border: none;
            font-size: 16px; font-weight: 800; text-transform: uppercase;
            cursor: pointer; transition: 0.1s;
        }
        .btn-bet { background: var(--brand); color: #fff; }
        .btn-bet:active { opacity: 0.8; }
        .btn-cashout { background: var(--up); color: #000; }
        .btn-waiting { background: #2f3749; color: #55607b; cursor: not-allowed; }

        .profit-preview { text-align: center; height: 18px; color: var(--up); font-size: 14px; font-weight: 800; }

    </style>
</head>
<body>

    <header>
        <a href="game.html" style="color:#fff;"><i class="fa-solid fa-chevron-left"></i></a>
        <div class="balance-tag">
            <i class="fa-solid fa-circle-dollar-to-slot usdt-icon"></i>
            <span id="userBalance">0.00</span>
        </div>
        <i class="fa-solid fa-chart-line" style="color:#2f3749"></i>
    </header>

    <div class="history-lane" id="history"></div>

    <div class="game-area">
        <i id="rocket" class="fa-solid fa-rocket"></i>
        <div id="multiplier" class="multiplier-val">1.00x</div>
    </div>

    <div class="dashboard">
        <div class="profit-preview" id="profitPreview"></div>

        <div class="control-group">
            <div class="label-row"><span>Bet Amount</span><span>USDT</span></div>
            <div class="input-wrapper">
                <input type="number" id="betAmount" value="10.00" step="1">
                <div class="quick-btns">
                    <button onclick="mult(0.5)">½</button>
                    <button onclick="mult(2)">2×</button>
                </div>
            </div>
        </div>

        <div class="control-group">
            <div class="label-row"><span>Auto Cashout</span></div>
            <div class="input-wrapper">
                <input type="number" id="autoCash" value="2.00" step="0.1">
            </div>
        </div>

        <button id="actionBtn" class="main-btn btn-bet" onclick="handleAction()">Place Bet</button>
        
        <div id="statusInfo" style="text-align:center; font-size:10px; color:#2f3749; font-weight:700; margin-top:5px;">NETWORK SECURE</div>
    </div>

<script>
    // --- Balance Sync ---
    let balance = parseFloat(localStorage.getItem('balance')) || 2840.15;
    const balanceEl = document.getElementById('userBalance');
    
    function syncBal() {
        balanceEl.textContent = balance.toLocaleString(undefined, {minimumFractionDigits: 2});
        localStorage.setItem('balance', balance);
    }
    syncBal();

    // --- Game Logic ---
    let multi = 1.00, state = "IDLE", hasBet = false, cashed = false, myBet = 0;
    let startT, anim;

    const multiText = document.getElementById('multiplier');
    const rocket = document.getElementById('rocket');
    const actionBtn = document.getElementById('actionBtn');
    const profitPreview = document.getElementById('profitPreview');

    function launch() {
        state = "RUNNING";
        startT = Date.now();
        multi = 1.00;
        multiText.style.color = "#fff";
        
        if(hasBet) {
            actionBtn.className = "main-btn btn-cashout";
            actionBtn.textContent = "Cash Out";
        } else {
            actionBtn.className = "main-btn btn-waiting";
            actionBtn.textContent = "Flying...";
        }
        tick();
    }

    function tick() {
        if(state !== "RUNNING") return;
        let elapsed = (Date.now() - startT) / 1000;
        
        // معادلة الطيران (Stake-like curve)
        multi = Math.pow(Math.E, 0.08 * elapsed);
        multiText.textContent = multi.toFixed(2) + "x";

        // Rocket Move
        rocket.style.left = Math.min(10 + elapsed * 5, 80) + "%";
        rocket.style.bottom = Math.min(15 + Math.pow(elapsed, 1.3) * 4, 75) + "%";

        if(hasBet && !cashed) {
            profitPreview.textContent = "+" + (myBet * multi).toFixed(2) + " USDT";
            // Auto Cashout check
            let auto = parseFloat(document.getElementById('autoCash').value);
            if(auto > 1.01 && multi >= auto) doCashOut();
        }

        // --- نظام الحماية الذكي (House Edge) ---
        // 1. نسبة كراش فوري (1.00x) بنسبة 3% (مثل ستيك)
        // 2. نسبة كراش بتزيد كل ما زاد الـ Multiplier
        let crashChance = 0.0015 + (multi * 0.004); 
        if(multi > 10) crashChance = 0.05; // حماية إضافية للأرقام العالية

        if(Math.random() < crashChance) {
            doCrash();
        } else {
            anim = requestAnimationFrame(tick);
        }
    }

    function handleAction() {
        if(state === "IDLE" && !hasBet) {
            let val = parseFloat(document.getElementById('betAmount').value);
            if(val > balance || val <= 0) return alert("Low Balance!");
            
            balance -= val;
            myBet = val;
            hasBet = true;
            syncBal();
            actionBtn.className = "main-btn btn-waiting";
            actionBtn.textContent = "Bet Placed";
        } else if(state === "RUNNING" && hasBet && !cashed) {
            doCashOut();
        }
    }

    function doCashOut() {
        if(cashed) return;
        cashed = true;
        let win = myBet * multi;
        balance += win;
        syncBal();
        actionBtn.className = "main-btn btn-waiting";
        actionBtn.textContent = "WIN +" + win.toFixed(2);
        profitPreview.textContent = "CASHED OUT";
    }

    function doCrash() {
        state = "CRASHED";
        cancelAnimationFrame(anim);
        multiText.style.color = "#ff3b3b";
        actionBtn.className = "main-btn btn-waiting";
        actionBtn.textContent = "Crashed";
        profitPreview.textContent = "";

        // Add history chip
        const chip = `<div class="hist-chip" style="color:${multi > 2 ? 'var(--up)' : '#ff3b3b'}">${multi.toFixed(2)}x</div>`;
        document.getElementById('history').insertAdjacentHTML('afterbegin', chip);

        setTimeout(reset, 3000);
    }

    function reset() {
        state = "IDLE"; hasBet = false; cashed = false;
        multiText.style.color = "#fff";
        multiText.textContent = "1.00x";
        rocket.style.left = "10%"; rocket.style.bottom = "15%";
        actionBtn.className = "main-btn btn-bet";
        actionBtn.textContent = "Place Bet";
        setTimeout(launch, 2000);
    }

    function mult(v) { document.getElementById('betAmount').value = (document.getElementById('betAmount').value * v).toFixed(2); }

    reset();
</script>
</body>
</html>
