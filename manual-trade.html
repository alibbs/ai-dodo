<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>AMANA ELITE+ | Pro Terminal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --up: #00ff96; --down: #ff3b3b; --card: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
            height: 100vh; overflow: hidden; display: flex; flex-direction: column;
        }

        /* --- Header --- */
        .app-header {
            padding: 15px 20px; background: var(--card); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .app-header h1 { margin: 0; font-size: 18px; font-weight: 900; letter-spacing: -1px; }
        .app-header h1 span { color: var(--brand); }

        /* --- Asset Selector --- */
        .asset-scroll {
            display: flex; gap: 10px; padding: 12px; overflow-x: auto; background: #0b0e1a;
        }
        .asset-scroll::-webkit-scrollbar { display: none; }
        .chip {
            padding: 8px 16px; background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; font-size: 12px; font-weight: 700; white-space: nowrap; transition: 0.3s;
        }
        .chip.active { border-color: var(--brand); color: var(--brand); background: rgba(255,0,184,0.1); }

        /* --- Chart Section --- */
        #chart-area { flex-grow: 1; background: #000; position: relative; }

        /* --- Trade Panel --- */
        .trade-panel {
            background: #0b0e1a; border-top: 1px solid var(--border);
            padding: 20px; border-radius: 30px 30px 0 0;
        }

        .input-row { display: flex; gap: 15px; margin-bottom: 20px; }
        .box { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 12px; border-radius: 15px; }
        .box label { display: block; font-size: 10px; color: #666; text-transform: uppercase; margin-bottom: 5px; }
        .box input { width: 100%; background: transparent; border: none; color: #fff; font-weight: 800; font-size: 16px; outline: none; }

        /* Leverage Slider */
        .lev-container { margin-bottom: 25px; }
        .lev-label { display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-bottom: 10px; }
        .lev-label b { color: var(--accent); }
        .slider {
            width: 100%; -webkit-appearance: none; height: 6px; border-radius: 5px;
            background: #1a1d26; outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px;
            background: var(--brand); border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 15px var(--brand);
        }

        .actions { display: flex; gap: 15px; }
        .btn {
            flex: 1; padding: 18px; border-radius: 18px; border: none;
            font-weight: 900; font-size: 16px; color: #fff; cursor: pointer; transition: 0.2s;
        }
        .btn-buy { background: var(--up); box-shadow: 0 10px 20px rgba(0,255,150,0.2); }
        .btn-sell { background: var(--down); box-shadow: 0 10px 20px rgba(255,59,59,0.2); }
        .btn:active { transform: scale(0.95); }

        /* --- Position Modal --- */
        #pos-display {
            position: absolute; bottom: 10px; left: 10px; right: 10px;
            background: rgba(18, 21, 28, 0.95); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 20px; padding: 15px;
            display: none; z-index: 100;
        }
        .pos-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .pnl-plus { color: var(--up); font-weight: 900; font-size: 20px; }
        .pnl-minus { color: var(--down); font-weight: 900; font-size: 20px; }
    </style>
</head>
<body>

    <div class="app-header">
        <h1>AMANA <span>ELITE+</span></h1>
        <div id="market-price" style="font-weight: 900; color: var(--accent);">0.00</div>
    </div>

    <div class="asset-scroll">
        <div class="chip active" onclick="updateAsset('BTCUSDT', this)">BTC</div>
        <div class="chip" onclick="updateAsset('ETHUSDT', this)">ETH</div>
        <div class="chip" onclick="updateAsset('SOLUSDT', this)">SOL</div>
        <div class="chip" onclick="updateAsset('BNBUSDT', this)">BNB</div>
        <div class="chip" onclick="updateAsset('XRPUSDT', this)">XRP</div>
    </div>

    <div id="chart-area">
        <div id="tv_chart" style="height: 100%;"></div>
        
        <div id="pos-display">
            <div class="pos-header">
                <span id="pos-type" style="font-size: 12px; font-weight: 900;"></span>
                <span id="pos-symbol" style="font-size: 12px; color: #888;"></span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <div id="pnl-amount" class="pnl-plus">+0.00 USDT</div>
                    <div id="roe-percent" style="font-size: 12px; color: var(--up);">+0.00%</div>
                </div>
                <button onclick="closePosition()" style="background: #333; color: #fff; border: none; padding: 8px 15px; border-radius: 10px; font-size: 12px;">Close</button>
            </div>
            <div style="margin-top: 10px; font-size: 10px; color: #555; display: flex; justify-content: space-between;">
                <span>Liq. Price: <b id="liq-price" style="color: var(--down);">0.00</b></span>
                <span>Margin: <b id="margin-val">0.00</b></span>
            </div>
        </div>
    </div>

    <div class="trade-panel">
        <div class="input-row">
            <div class="box">
                <label>Amount (USDT)</label>
                <input type="number" id="trade-amount" value="100">
            </div>
            <div class="box">
                <label>Leverage</label>
                <input type="text" id="lev-display" value="10x" readonly>
            </div>
        </div>

        <div class="lev-container">
            <div class="lev-label"><span>Leverage</span> <span>Max <b>75x</b></span></div>
            <input type="range" min="1" max="75" value="10" class="slider" id="lev-slider">
        </div>

        <div class="actions">
            <button class="btn btn-sell" onclick="executeTrade('SHORT')">SELL / SHORT</button>
            <button class="btn btn-buy" onclick="executeTrade('LONG')">BUY / LONG</button>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        let currentSymbol = "BINANCE:BTCUSDT";
        let rawSymbol = "BTCUSDT";
        let livePrice = 0;
        let activePos = null;

        // Initialize TradingView
        function loadChart(symbol) {
            new TradingView.widget({
                "autosize": true,
                "symbol": symbol,
                "interval": "1",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "hide_top_toolbar": true,
                "save_image": false,
                "container_id": "tv_chart",
                "backgroundColor": "#060914",
                "gridColor": "rgba(255, 255, 255, 0.05)"
            });
        }
        loadChart(currentSymbol);

        // Live Price via Binance WebSocket
        function connectPrice(symbol) {
            const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@ticker`);
            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                livePrice = parseFloat(data.c);
                document.getElementById('market-price').textContent = livePrice.toFixed(2);
                updatePNL();
            };
        }
        connectPrice(rawSymbol);

        // Leverage Slider Logic
        const slider = document.getElementById('lev-slider');
        const display = document.getElementById('lev-display');
        slider.oninput = function() { display.value = this.value + "x"; }

        function updateAsset(symbol, el) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            rawSymbol = symbol;
            currentSymbol = "BINANCE:" + symbol;
            loadChart(currentSymbol);
            connectPrice(symbol);
        }

        function executeTrade(type) {
            if(activePos) { alert("Close current position first!"); return; }
            
            const amount = parseFloat(document.getElementById('trade-amount').value);
            const lev = parseInt(slider.value);
            
            activePos = {
                type: type,
                symbol: rawSymbol,
                entry: livePrice,
                amount: amount,
                lev: lev,
                liq: type === 'LONG' ? livePrice * (1 - (0.68/lev)) : livePrice * (1 + (0.68/lev))
            };

            document.getElementById('pos-display').style.display = 'block';
            document.getElementById('pos-type').textContent = type;
            document.getElementById('pos-type').style.color = type === 'LONG' ? 'var(--up)' : 'var(--down)';
            document.getElementById('pos-symbol').textContent = rawSymbol + " Perp";
            document.getElementById('liq-price').textContent = activePos.liq.toFixed(2);
            document.getElementById('margin-val').textContent = amount + " USDT";
        }

        function updatePNL() {
            if(!activePos) return;

            let diff = activePos.type === 'LONG' ? (livePrice - activePos.entry) : (activePos.entry - livePrice);
            let pnl = (diff / activePos.entry) * activePos.amount * activePos.lev;
            let roe = (diff / activePos.entry) * 100 * activePos.lev;

            const pnlEl = document.getElementById('pnl-amount');
            const roeEl = document.getElementById('roe-percent');

            // Liquidation Check (68%)
            if(roe <= -68) {
                alert("LIQUIDATED! Loss reached 68%");
                closePosition();
                return;
            }

            pnlEl.textContent = (pnl >= 0 ? '+' : '') + pnl.toFixed(2) + " USDT";
            pnlEl.className = pnl >= 0 ? "pnl-plus" : "pnl-minus";
            roeEl.textContent = (roe >= 0 ? '+' : '') + roe.toFixed(2) + "%";
            roeEl.style.color = roe >= 0 ? "var(--up)" : "var(--down)";
        }

        function closePosition() {
            activePos = null;
            document.getElementById('pos-display').style.display = 'none';
        }
    </script>
</body>
</html>
