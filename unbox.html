<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA | Unboxing Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --card: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            background: radial-gradient(circle at center, #1a0b2e, #060914);
        }

        /* --- شريط الجوائز المتوقعة --- */
        .rewards-slider-wrapper {
            width: 100%; padding: 60px 0 20px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            overflow: hidden; position: relative;
        }
        .slider-title { 
            position: absolute; top: 10px; left: 20px; 
            font-size: 10px; color: var(--muted); letter-spacing: 2px;
        }
        .rewards-track {
            display: flex; gap: 10px; padding: 0 20px;
            overflow-x: auto; scroll-behavior: smooth;
        }
        .rewards-track::-webkit-scrollbar { display: none; }
        
        .reward-item {
            min-width: 80px; height: 100px; background: var(--card);
            border-radius: 15px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 10px;
        }
        .reward-item i { font-size: 24px; margin-bottom: 8px; }
        .reward-item b { color: #ffd700; }

        /* --- منطقة الصندوق --- */
        .unbox-container { text-align: center; width: 100%; max-width: 400px; padding: 40px 20px; }
        #box-visual { font-size: 100px; color: var(--accent); margin-bottom: 20px; transition: 0.5s; }
        
        .box-title { font-size: 24px; font-weight: 900; margin-bottom: 5px; }
        .box-info { color: #888; margin-bottom: 30px; }

        /* --- Buttons --- */
        .action-btn {
            width: 100%; padding: 18px; border-radius: 15px; border: none;
            font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .buy-btn { background: linear-gradient(45deg, var(--brand), #b000ff); color: #fff; }
        .sell-btn { background: #22c55e; color: #fff; display: none; margin-top: 15px; }

        /* --- Animations --- */
        .shake { animation: shake 0.4s infinite; }
        @keyframes shake {
            0% { transform: rotate(0deg); } 25% { transform: rotate(5deg); }
            50% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } 100% { transform: rotate(0deg); }
        }
        .reveal { animation: zoomIn 0.5s forwards; font-size: 120px !important; color: #ffd700 !important; }
        @keyframes zoomIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .back-btn { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 20px; }
    </style>
</head>
<body>

    <a href="mystery-box.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>

    <div class="rewards-slider-wrapper">
        <span class="slider-title">POSSIBLE REWARDS</span>
        <div class="rewards-track" id="rewards-track">
            </div>
    </div>

    <div class="unbox-container">
        <div id="box-visual"><i class="fa-solid fa-box-open"></i></div>
        <div class="box-title" id="display-name">Loading...</div>
        <div class="box-info">Entry Fee: <span id="display-price" style="color: #fff;">$0</span></div>
        
        <button class="action-btn buy-btn" id="main-btn" onclick="startUnboxing()">OPEN BOX</button>
        <button class="action-btn sell-btn" id="sell-btn" onclick="sellItem()">SELL ITEM (+$<span id="win-val">0</span>)</button>
        
        <p id="status-text" style="margin-top: 20px; color: #888; font-size: 12px;"></p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const price = parseInt(urlParams.get('price')) || 0;
        const name = urlParams.get('name') || "Box";

        document.getElementById('display-name').innerText = name;
        document.getElementById('display-price').innerText = `$${price}`;

        // 1. توليد الجوائز المتوقعة (شي غالي وشي رخيص)
        const track = document.getElementById('rewards-track');
        const possibleRewards = [
            { icon: 'fa-coins', val: (price * 0.1).toFixed(2), name: 'Dust' },
            { icon: 'fa-gem', val: (price * 0.5).toFixed(2), name: 'Shard' },
            { icon: 'fa-money-bill-wave', val: (price * 0.8).toFixed(2), name: 'Cash' },
            { icon: 'fa-crown', val: (price * 5).toFixed(2), name: 'JACKPOT' },
            { icon: 'fa-bolt', val: (price * 0.2).toFixed(2), name: 'Energy' }
        ];

        possibleRewards.forEach(item => {
            track.innerHTML += `
                <div class="reward-item">
                    <i class="fa-solid ${item.icon}"></i>
                    <span>${item.name}</span>
                    <b>$${item.val}</b>
                </div>
            `;
        });

        let currentWin = 0;

        // 2. منطق الحظ (غالبًا مش لصالح اللاعب)
        function startUnboxing() {
            const btn = document.getElementById('main-btn');
            const box = document.getElementById('box-visual');
            const status = document.getElementById('status-text');

            btn.style.display = 'none';
            box.classList.add('shake');
            status.innerText = "Unlocking assets...";

            setTimeout(() => {
                box.classList.remove('shake');
                box.classList.add('reveal');
                
                // حساب الجائزة: 80% خسارة (جائزة صغيرة)، 20% ربح أو تعادل
                const luck = Math.random();
                if (luck > 0.9) { // 10% Jackpot
                    currentWin = price * 3;
                    box.innerHTML = '<i class="fa-solid fa-trophy"></i>';
                    status.innerText = "OMG! EPIC WIN!";
                } else if (luck > 0.7) { // 20% Small Profit
                    currentWin = price * 1.2;
                    box.innerHTML = '<i class="fa-solid fa-gem"></i>';
                    status.innerText = "Nice! You got a rare item.";
                } else { // 70% Loss
                    currentWin = price * 0.3;
                    box.innerHTML = '<i class="fa-solid fa-poo"></i>';
                    status.innerText = "Better luck next time...";
                }

                document.getElementById('win-val').innerText = currentWin.toFixed(2);
                document.getElementById('sell-btn').style.display = 'block';
            }, 2500);
        }

        // 3. بيع الجائزة وإضافتها للرصيد
        function sellItem() {
            alert(`Item sold! $${currentWin.toFixed(2)} added to your balance.`);
            window.location.href = 'mystery-box.html';
        }
    </script>
</body>
</html>
