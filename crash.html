<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A | ELITE CRASH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #070912;
            --panel-bg: #0f212e;
            --input-bg: #071620;
            --brand-color: #ff00b8;
            --accent-blue: #00f2ff;
            --win-green: #00e701;
            --lose-red: #ff3b3b;
            --text-main: #b1bad3;
            --border-ui: #2f4553;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { margin: 0; background: var(--bg-dark); color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }

        /* --- Global Header --- */
        .game-header { width: 100%; max-width: 500px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); z-index: 100; }
        .logo-a { 
            width: 42px; height: 42px; background: rgba(255, 0, 184, 0.1); border: 2px solid var(--brand-color); 
            border-radius: 12px; display: flex; align-items: center; justify-content: center; 
            font-size: 26px; font-weight: 900; text-shadow: 0 0 15px var(--brand-color); 
            cursor: pointer; text-decoration: none; color: white; transition: 0.3s;
        }
        .logo-a:active { transform: scale(0.9); box-shadow: 0 0 20px var(--brand-color); }
        .user-balance { background: var(--panel-bg); padding: 10px 18px; border-radius: 8px; font-weight: 800; color: var(--win-green); border: 1px solid var(--border-ui); box-shadow: inset 0 0 10px rgba(0,231,1,0.1); }

        /* --- History Bar --- */
        .history-bar { width: 100%; max-width: 500px; display: flex; gap: 8px; padding: 10px 20px; overflow-x: auto; scrollbar-width: none; background: rgba(0,0,0,0.2); }
        .history-bar::-webkit-scrollbar { display: none; }
        .hist-item { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; background: var(--panel-bg); border: 1px solid var(--border-ui); min-width: 55px; text-align: center; }
        .hist-high { color: #ffd700; border-color: #ffd700; background: rgba(255,215,0,0.1); }
        .hist-low { color: var(--lose-red); }

        /* --- Game Visual Stage --- */
        .stage-container {
            width: 95%; max-width: 480px; height: 340px; background: radial-gradient(circle at 10% 90%, #162431 0%, #070912 100%);
            border-radius: 20px; border: 1px solid var(--border-ui); position: relative; overflow: hidden; margin: 10px 0;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .status-bar { position: absolute; top: 15px; left: 20px; display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 800; color: var(--text-main); z-index: 10; opacity: 0.7; }
        .status-dot { width: 8px; height: 8px; background: var(--win-green); border-radius: 50%; box-shadow: 0 0 10px var(--win-green); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.2; } }

        #multiplier { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 75px; font-weight: 900; z-index: 10; font-variant-numeric: tabular-nums; text-shadow: 0 0 30px rgba(255,255,255,0.1); }
        #profit-display { position: absolute; top: 62%; left: 50%; transform: translateX(-50%); color: var(--win-green); font-weight: 800; font-size: 22px; display: none; background: rgba(0,231,1,0.1); padding: 5px 15px; border-radius: 30px; }

        /* Plane & Grid */
        .grid-bg { position: absolute; inset: 0; background-image: linear-gradient(var(--border-ui) 1px, transparent 1px), linear-gradient(90deg, var(--border-ui) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.05; }
        .plane-wrapper { position: absolute; bottom: 50px; left: 50px; z-index: 5; transition: transform 0.1s linear; }
        .plane-wrapper i { font-size: 42px; color: var(--accent-blue); transform: rotate(-15deg); filter: drop-shadow(0 0 20px var(--accent-blue)); }
        
        /* Waiting Overlay */
        .wait-screen { position: absolute; inset: 0; background: rgba(7, 9, 18, 0.95); z-index: 30; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .wait-timer { font-size: 48px; font-weight: 900; color: var(--brand-color); margin-bottom: 10px; }
        .progress-bar { width: 220px; height: 5px; background: #1a2c38; border-radius: 10px; overflow: hidden; border: 1px solid var(--border-ui); }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--brand-color), #ff66d4); }

        /* --- Betting Panel --- */
        .control-panel { width: 95%; max-width: 480px; background: var(--panel-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-ui); box-shadow: 0 -5px 20px rgba(0,0,0,0.3); }
        .input-group { background: var(--input-bg); border: 2px solid var(--border-ui); border-radius: 8px; display: flex; align-items: center; padding: 5px; margin-bottom: 15px; }
        .input-group input { flex: 1; background: transparent; border: none; color: #fff; padding: 12px; font-weight: 800; outline: none; font-size: 18px; text-align: center; }
        .quick-btn { background: #2f4553; border: none; color: #fff; width: 45px; height: 40px; font-weight: 800; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .quick-btn:active { background: var(--brand-color); }

        .main-btn { width: 100%; padding: 22px; border: none; border-radius: 10px; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-bet { background: var(--win-green); color: #000; box-shadow: 0 4px 15px rgba(0,231,1,0.3); }
        .btn-bet.queued { background: var(--brand-color); color: #fff; box-shadow: 0 4px 15px rgba(255,0,184,0.3); }
        .btn-cashout { background: #fff; color: #000; box-shadow: 0 4px 15px rgba(255,255,255,0.2); display: none; }
        .main-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: scale(1) !important; }

    </style>
</head>
<body>

    <div class="game-header">
        <a href="home.html" class="logo-a">A</a>
        <div id="balance-top" class="user-balance">$ 0.00</div>
    </div>

    <div class="history-bar" id="history-bar">
        </div>

    <div class="stage-container">
        <div class="grid-bg"></div>
        <div class="status-bar"><div class="status-dot"></div> LIVE SYNC</div>
        <div id="multiplier">1.00x</div>
        <div id="profit-display">$ 0.00</div>

        <div class="wait-screen" id="wait-screen">
            <div style="font-size: 12px; font-weight: 800; color: var(--text-main); margin-bottom: 5px;">NEXT ROUND IN</div>
            <div class="wait-timer" id="wait-timer">5.0</div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>

        <div class="plane-wrapper" id="plane-wrapper" style="display:none;"><i class="fa-solid fa-paper-plane"></i></div>
        <svg style="position:absolute; inset:0; pointer-events:none;"><path id="path-line" d="" fill="none" stroke="var(--brand-color)" stroke-width="4" stroke-dasharray="10,5" opacity="0.4"/></svg>
    </div>

    <div class="control-panel">
        <div class="input-group">
            <button class="quick-btn" onclick="modBet(0.5)">½</button>
            <input type="number" id="bet-input" value="10.00" step="1">
            <button class="quick-btn" onclick="modBet(2)">2x</button>
        </div>

        <button id="btn-bet" class="main-btn btn-bet">Place Bet</button>
        <button id="btn-cashout" class="main-btn btn-cashout">Cashout</button>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA", authDomain: "ai-dodo.firebaseapp.com", projectId: "ai-dodo", storageBucket: "ai-dodo.firebasestorage.app", messagingSenderId: "261622335803", appId: "1:261622335803:web:0b066791230535e7d5cf1e" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);

    let uID, balance = 0, currentMult = 1.0, isPlaying = false, hasCashout = false, isQueued = false;
    let history = [1.45, 2.10, 12.05, 1.10, 3.50, 1.00, 4.22];

    onAuthStateChanged(auth, user => {
        if(user) {
            uID = user.uid;
            onSnapshot(doc(db, "users", uID), s => {
                balance = s.data().balance;
                document.getElementById('balance-top').textContent = "$" + balance.toLocaleString(undefined, {minimumFractionDigits:2});
            });
        }
    });

    function renderHistory() {
        const bar = document.getElementById('history-bar');
        bar.innerHTML = history.slice(-10).reverse().map(val => `
            <div class="hist-item ${val >= 2 ? 'hist-high' : 'hist-low'}">${val.toFixed(2)}x</div>
        `).join('');
    }
    renderHistory();

    window.modBet = (m) => { let i = document.getElementById('bet-input'); i.value = (parseFloat(i.value) * m).toFixed(2); };

    async function mainEngine() {
        while(true) {
            const cycle = 18000; // 6s wait + ~12s flight
            const now = Date.now();
            const time = now % cycle;

            if(time < 6000) { // WAITING PHASE
                const remaining = (6000 - time) / 1000;
                updateGameUI('betting', remaining);
                
                // Active Queue
                if(isQueued && !isPlaying) {
                    const amt = parseFloat(document.getElementById('bet-input').value);
                    if(balance >= amt) {
                        await updateDoc(doc(db, "users", uID), { balance: increment(-amt) });
                        isPlaying = true;
                        isQueued = false;
                    } else { isQueued = false; }
                }
                await new Promise(r => setTimeout(r, 100));
            } else { // FLYING PHASE
                updateGameUI('flying');
                
                const seed = Math.floor(now / cycle);
                const crash = calcCrash(seed);
                const start = now - (now % cycle) + 6000;

                while(true) {
                    const elapsed = (Date.now() - start) / 1000;
                    if(elapsed < 0) break;
                    currentMult = Math.pow(Math.E, 0.07 * elapsed);

                    if(currentMult >= crash) break;

                    document.getElementById('multiplier').textContent = currentMult.toFixed(2) + 'x';
                    if(isPlaying && !hasCashout) {
                        const win = (document.getElementById('bet-input').value * currentMult).toFixed(2);
                        const prof = document.getElementById('profit-display');
                        prof.style.display = 'block';
                        prof.textContent = "+$" + win;
                    }

                    // Move Plane
                    let x = Math.min(elapsed * 35, 80), y = Math.min(Math.pow(elapsed, 1.4) * 10, 70);
                    document.getElementById('plane-wrapper').style.transform = `translate(${x}vw, -${y}vh)`;
                    await new Promise(r => requestAnimationFrame(r));
                }

                // CRASH EVENT
                document.getElementById('multiplier').textContent = "CRASHED!";
                document.getElementById('multiplier').style.color = 'var(--lose-red)';
                history.push(parseFloat(crash));
                renderHistory();
                
                isPlaying = false; hasCashout = false;
                await new Promise(r => setTimeout(r, 3000));
                document.getElementById('multiplier').style.color = '#fff';
                document.getElementById('profit-display').style.display = 'none';
            }
        }
    }

    function calcCrash(seed) {
        let h = (seed * 16807) % 2147483647;
        let r = h / 2147483647;
        if (r < 0.04) return 1.00; // 4% House Edge
        return Math.max(1.00, (0.96 / (1 - r))).toFixed(2);
    }

    function updateGameUI(state, extra = 0) {
        const wait = document.getElementById('wait-screen');
        const plane = document.getElementById('plane-wrapper');
        const btnB = document.getElementById('btn-bet');
        const btnC = document.getElementById('btn-cashout');

        if(state === 'betting') {
            wait.style.display = 'flex';
            plane.style.display = 'none';
            document.getElementById('wait-timer').textContent = extra.toFixed(1);
            document.getElementById('progress-fill').style.width = (extra/6 * 100) + "%";
            
            if(!isPlaying && !isQueued) {
                btnB.style.display = 'block';
                btnB.textContent = "Place Bet";
                btnB.className = "main-btn btn-bet";
                btnB.disabled = false;
                btnC.style.display = 'none';
            }
        } else {
            wait.style.display = 'none';
            plane.style.display = 'block';
            if(isPlaying && !hasCashout) {
                btnB.style.display = 'none';
                btnC.style.display = 'block';
                btnC.textContent = "Cashout";
                btnC.style.background = "#fff";
            } else if (!isQueued) {
                btnB.style.display = 'block';
                btnB.textContent = "Bet for Next Round";
                btnB.className = "main-btn btn-bet queued";
            }
        }
    }

    document.getElementById('btn-bet').onclick = async () => {
        if(isQueued) return;
        isQueued = true;
        document.getElementById('btn-bet').textContent = "QUEUED...";
        document.getElementById('btn-bet').disabled = true;
    };

    document.getElementById('btn-cashout').onclick = async () => {
        if(!isPlaying || hasCashout || currentMult < 1.01) return;
        hasCashout = true;
        const win = parseFloat(document.getElementById('bet-input').value) * currentMult;
        await updateDoc(doc(db, "users", uID), { balance: increment(win) });
        document.getElementById('btn-cashout').textContent = "WON!";
        document.getElementById('btn-cashout').style.background = 'var(--win-green)';
    };

    mainEngine();
</script>
</body>
</html>
