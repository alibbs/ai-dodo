<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA ELITE | Overview</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --card-bg: rgba(255, 255, 255, 0.04); --border: rgba(255, 255, 255, 0.1);
            --text: #ffffff; --muted: #888; --success: #00ff96;
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: var(--text);
            padding-bottom: 100px;
            background: radial-gradient(circle at top right, #1a0b2e, #060914);
        }

        .container { padding: 20px; max-width: 450px; margin: auto; }

        .balance-hero {
            padding: 40px 20px; text-align: center;
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 30px; margin-top: 20px;
            backdrop-filter: blur(10px);
        }

        .bal-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
        .bal-value { font-size: 36px; font-weight: 900; margin: 10px 0; color: #fff; }

        .action-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 25px 0;
        }

        .action-btn {
            background: var(--card-bg); border: 1px solid var(--border);
            padding: 15px 10px; border-radius: 20px; text-align: center;
            color: var(--text); text-decoration: none; transition: 0.3s;
        }
        .action-btn i { display: block; font-size: 20px; margin-bottom: 8px; color: var(--brand); }
        .action-btn span { font-size: 11px; font-weight: 600; }
        .action-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

        .stats-list { background: var(--card-bg); border: 1px solid var(--border); border-radius: 25px; overflow: hidden; }
        .stat-item {
            display: flex; justify-content: space-between; padding: 18px 20px;
            border-bottom: 1px solid var(--border);
        }
        .stat-item:last-child { border-bottom: none; }
        .stat-info span { display: block; font-size: 12px; color: var(--muted); }
        .stat-info b { font-size: 15px; color: #fff; }
        .stat-val { text-align: right; font-weight: 700; color: var(--accent); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: rgba(6, 9, 20, 0.98); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { text-decoration: none; color: #555; text-align: center; flex: 1; font-size: 10px; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--brand); }
    </style>
</head>
<body>

<div class="container">
    <div class="balance-hero">
        <span class="bal-label" data-key="total_balance">Total Balance</span>
        <div class="bal-value" id="mainBal">0.00 USDT</div>
        <span style="color:var(--success); font-size: 12px;"><i class="fa-solid fa-shield-check"></i> Secured by AMANA AI</span>
    </div>

    <div class="action-grid">
        <a href="deposit.html" class="action-btn">
            <i class="fa-solid fa-arrow-down-long"></i>
            <span data-key="deposit">Deposit</span>
        </a>
        <a href="withdraw.html" class="action-btn">
            <i class="fa-solid fa-arrow-up-long"></i>
            <span data-key="withdraw">Withdraw</span>
        </a>
        <a href="transfer.html" class="action-btn">
            <i class="fa-solid fa-right-left"></i>
            <span data-key="transfer">Transfer</span>
        </a>
    </div>

    <div class="section-title" style="margin: 0 0 15px 10px; font-size: 12px; color: var(--muted); text-transform: uppercase;" data-key="asset_overview">Asset Overview</div>
    <div class="stats-list">
        <div class="stat-item">
            <div class="stat-info">
                <span data-key="spot_wallet">Spot Wallet</span>
                <b>USDT</b>
            </div>
            <div class="stat-val" id="spotBal">0.00</div>
        </div>
        <div class="stat-item">
            <div class="stat-info">
                <span data-key="bot_profit">Trading Profit</span>
                <b style="color:var(--success)">AI Bot</b>
            </div>
            <div class="stat-val" id="profitBal" style="color:var(--success)">+0.00</div>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><span data-key="home">Home</span></a>
    <a href="game.html" class="nav-item"><i class="fa-solid fa-gamepad"></i><span data-key="game">Game</span></a>
    <a href="bot-trade.html" class="nav-item"><i class="fa-solid fa-robot"></i><span data-key="bot">Bot</span></a>
    <a href="overview.html" class="nav-item active"><i class="fa-solid fa-chart-pie"></i><span data-key="overview">Overview</span></a>
    <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span data-key="profile">Profile</span></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
        authDomain: "ai-dodo.firebaseapp.com",
        projectId: "ai-dodo",
        storageBucket: "ai-dodo.firebasestorage.app",
        messagingSenderId: "261622335803",
        appId: "1:261622335803:web:0b066791230535e7d5cf1e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
        if (user) {
            onSnapshot(doc(db, "users", user.uid), (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    const bal = data.balance || 0;
                    const profit = data.bot_profit || 0;

                    document.getElementById('mainBal').textContent = bal.toFixed(2) + " USDT";
                    document.getElementById('spotBal').textContent = bal.toFixed(2);
                    document.getElementById('profitBal').textContent = "+" + profit.toFixed(2);
                }
            });
        } else { window.location.href = "login.html"; }
    });
</script>

<script src="translate.js"></script>
</body>
</html>
