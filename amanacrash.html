<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>AMANA CRASH | GLOBAL LIVE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #04060b;
            --panel: #0f121d;
            --brand: #ff00b8;
            --up: #00e701;
            --down: #ff3b3b;
            --border: #222635;
            --input-bg: #1a1d29;
        }

        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; }
        body { display: flex; flex-direction: column; }

        header { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .balance-tag { background: var(--panel); border: 1px solid var(--border); padding: 8px 14px; border-radius: 10px; font-weight: 800; display: flex; align-items: center; gap: 8px; }

        .game-area { flex: 1.5; position: relative; background: radial-gradient(circle at center, #111524 0%, #04060b 100%); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        .rocket-container { position: absolute; bottom: 15%; left: 10%; z-index: 5; transition: 0.1s linear; }
        #rocket { font-size: 45px; transform: rotate(-45deg); filter: drop-shadow(0 0 15px var(--brand)); transition: color 0.3s; }

        .multiplier-val { font-size: 70px; font-weight: 900; z-index: 10; font-variant-numeric: tabular-nums; }
        .waiting-msg { position: absolute; top: 20%; font-size: 14px; font-weight: 800; color: var(--brand); text-transform: uppercase; letter-spacing: 2px; }

        .dashboard { background: var(--panel); border-top: 2px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 35px; }
        .input-wrapper { background: var(--input-bg); border: 2px solid var(--border); border-radius: 8px; display: flex; align-items: center; padding: 4px 10px; }
        .input-wrapper label { font-size: 10px; color: #55607b; font-weight: 800; text-transform: uppercase; margin-right: 10px; }
        .input-wrapper input { flex: 1; background: transparent; border: none; color: #fff; padding: 10px 0; font-size: 16px; font-weight: 700; }

        .main-btn { width: 100%; padding: 20px; border-radius: 10px; border: none; font-size: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        .btn-bet { background: var(--brand); color: #fff; }
        .btn-cashout { background: var(--up) !important; color: #000 !important; box-shadow: 0 0 20px rgba(0, 231, 1, 0.4); }
        .btn-waiting { background: #242938; color: #55607b; }

        .profit-label { text-align: center; height: 22px; color: var(--up); font-size: 16px; font-weight: 800; }
    </style>
</head>
<body>

    <header>
        <a href="game.html" style="color:#fff;"><i class="fa-solid fa-chevron-left"></i></a>
        <div class="balance-tag">
            <i class="fa-solid fa-circle-dollar-to-slot" style="color:#26a17b"></i>
            <span id="userBalance">0.00</span>
        </div>
        <div id="onlineCount" style="font-size: 10px; color: var(--up);"><i class="fa-solid fa-circle"></i> LIVE</div>
    </header>

    <div class="game-area">
        <div id="waitingMsg" class="waiting-msg"></div>
        <div class="rocket-container" id="rocketBox">
            <i id="rocket" class="fa-solid fa-rocket"></i>
        </div>
        <div id="multiplier" class="multiplier-val">1.00x</div>
    </div>

    <div class="dashboard">
        <div class="profit-label" id="profitLabel"></div>
        <div class="input-wrapper">
            <label>Amount</label>
            <input type="number" id="betAmount" value="10.00">
        </div>
        <button id="actionBtn" class="main-btn btn-bet" onclick="handleAction()">Place Bet</button>
    </div>

<script>
    let balance = parseFloat(localStorage.getItem('balance')) || 2840.15;
    const balanceEl = document.getElementById('userBalance');
    const multiText = document.getElementById('multiplier');
    const rocket = document.getElementById('rocket');
    const rocketBox = document.getElementById('rocketBox');
    const actionBtn = document.getElementById('actionBtn');
    const waitingMsg = document.getElementById('waitingMsg');
    const profitLabel = document.getElementById('profitLabel');

    function sync() { balanceEl.textContent = balance.toLocaleString(undefined, {minimumFractionDigits: 2}); localStorage.setItem('balance', balance); }
    sync();

    // --- Global Sync Logic (Multiplayer Simulation) ---
    // الدورة مدتها 20 ثانية: 5 ثواني انتظار و 15 ثانية كحد أقصى للطيران
    const ROUND_DURATION = 20000; 
    const WAIT_TIME = 5000;

    let hasBetInThisRound = false;
    let cashedOutInThisRound = false;
    let currentBet = 0;

    function updateGame() {
        const now = Date.now();
        const cyclePos = now % ROUND_DURATION;

        if (cyclePos < WAIT_TIME) {
            // مرحلة الانتظار (الكل بيشوفها سوا)
            const timeLeft = Math.ceil((WAIT_TIME - cyclePos) / 1000);
            state = "IDLE";
            multiText.textContent = "1.00x";
            multiText.style.color = "#fff";
            waitingMsg.textContent = `Next Round in ${timeLeft}s`;
            rocketBox.style.display = "none";
            rocket.style.color = "var(--brand)";
            
            if (!hasBetInThisRound) {
                actionBtn.className = "main-btn btn-bet";
                actionBtn.textContent = "Place Bet";
            }
        } else {
            // مرحلة الطيران (الكل بيشوف نفس الرقم)
            state = "RUNNING";
            waitingMsg.textContent = "";
            rocketBox.style.display = "block";
            
            const flightTime = (cyclePos - WAIT_TIME) / 1000;
            const currentMulti = Math.pow(Math.E, 0.08 * flightTime);
            
            // تحديد نقطة الكراش بناءً على الدقيقة الحالية (موحدة للكل)
            const roundId = Math.floor(now / ROUND_DURATION);
            const crashPoint = getCrashPoint(roundId);

            if (currentMulti >= crashPoint) {
                // الكراش بيصير عند الكل بنفس اللحظة
                state = "CRASHED";
                multiText.textContent = crashPoint.toFixed(2) + "x";
                multiText.style.color = "var(--down)";
                rocket.style.color = "var(--down)";
                actionBtn.className = "main-btn btn-waiting";
                actionBtn.textContent = "Crashed";
                profitLabel.textContent = "";
                hasBetInThisRound = false;
                cashedOutInThisRound = false;
            } else {
                // الطيارة عم تطير
                multiText.textContent = currentMulti.toFixed(2) + "x";
                multiText.style.color = "#fff";
                rocket.style.color = "var(--up)";
                
                rocketBox.style.left = Math.min(10 + flightTime * 6, 80) + "%";
                rocketBox.style.bottom = Math.min(15 + Math.pow(flightTime, 1.3) * 5, 75) + "%";

                if (hasBetInThisRound && !cashedOutInThisRound) {
                    actionBtn.className = "main-btn btn-cashout";
                    actionBtn.textContent = "Cash Out";
                    profitLabel.textContent = "+" + (currentBet * currentMulti).toFixed(2);
                }
            }
        }
        requestAnimationFrame(updateGame);
    }

    // خوارزمية توليد نقطة كراش موحدة بناءً على رقم الجولة
    function getCrashPoint(seed) {
        const x = Math.sin(seed) * 10000;
        const random = x - Math.floor(x);
        // المعادلة تضمن إن أغلب الكراش بين 1.1 و 3، ومع فرص نادرة لأرقام عالية
        return Math.max(1.00, 0.99 / (1 - random));
    }

    function handleAction() {
        const now = Date.now();
        const cyclePos = now % ROUND_DURATION;

        if (cyclePos < WAIT_TIME && !hasBetInThisRound) {
            // المراهنة مسموحة فقط في وقت الانتظار
            let amt = parseFloat(document.getElementById('betAmount').value);
            if (amt > balance || amt <= 0) return;
            balance -= amt;
            currentBet = amt;
            hasBetInThisRound = true;
            sync();
            actionBtn.className = "main-btn btn-waiting";
            actionBtn.textContent = "Waiting for Start...";
        } else if (state === "RUNNING" && hasBetInThisRound && !cashedOutInThisRound) {
            // الكاش أوت أثناء الطيران
            cashedOutInThisRound = true;
            const flightTime = (cyclePos - WAIT_TIME) / 1000;
            const currentMulti = Math.pow(Math.E, 0.08 * flightTime);
            let win = currentBet * currentMulti;
            balance += win;
            sync();
            actionBtn.className = "main-btn btn-waiting";
            actionBtn.textContent = "Won +" + win.toFixed(2);
            profitLabel.textContent = "WINNER!";
        }
    }

    updateGame();
</script>
</body>
</html>
