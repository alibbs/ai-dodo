<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA | Pro Unboxing</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --card: rgba(255, 255, 255, 0.05); --gold: #ffd700;
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            background: radial-gradient(circle at center, #1a0b2e, #060914);
        }

        .top-bar {
            width: 100%; padding: 15px 20px; display: flex; justify-content: space-between;
            align-items: center; box-sizing: border-box; position: fixed; top: 0; z-index: 100;
            background: rgba(6, 9, 20, 0.8); backdrop-filter: blur(10px);
        }
        .user-balance {
            background: rgba(255, 255, 255, 0.1); padding: 8px 15px;
            border-radius: 20px; border: 1px solid var(--brand);
            font-weight: 800; color: var(--accent);
        }

        .rewards-slider-wrapper {
            width: 100%; padding: 80px 0 20px;
            background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(255,255,255,0.05);
            overflow: hidden; position: relative;
        }
        .slider-title { position: absolute; top: 65px; left: 20px; font-size: 9px; color: #888; letter-spacing: 2px; }
        
        .rewards-track {
            display: flex; gap: 12px; padding: 10px 20px;
            overflow-x: auto; scroll-behavior: smooth;
        }
        .rewards-track::-webkit-scrollbar { height: 4px; }
        .rewards-track::-webkit-scrollbar-thumb { background: var(--brand); border-radius: 10px; }
        
        .reward-item {
            min-width: 90px; height: 110px; background: var(--card);
            border-radius: 18px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; font-size: 10px; text-align: center;
            transition: 0.3s;
        }
        .reward-item i { font-size: 26px; margin-bottom: 8px; }
        .reward-item.highlight { border-color: var(--brand); box-shadow: 0 0 15px var(--brand); transform: scale(1.05); }
        .reward-item b { display: block; margin-top: 4px; color: var(--accent); }

        .unbox-container { text-align: center; width: 100%; max-width: 400px; padding: 40px 20px; margin-top: 20px; }
        #box-visual { font-size: 110px; color: var(--accent); margin-bottom: 25px; transition: 0.5s; }
        
        .box-title { font-size: 26px; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
        .box-info { color: #888; margin-bottom: 35px; font-size: 14px; }

        .action-btn {
            width: 100%; padding: 18px; border-radius: 18px; border: none;
            font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .buy-btn { background: linear-gradient(45deg, var(--brand), #b000ff); color: #fff; }
        .buy-btn:disabled { background: #333; cursor: not-allowed; opacity: 0.6; }
        .sell-btn { background: #22c55e; color: #fff; display: none; margin-top: 15px; }

        .shake { animation: shake 0.4s infinite; }
        @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(5deg); } 75% { transform: rotate(-5deg); } }
        .reveal { animation: zoomIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes zoomIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1.1); opacity: 1; } }

        .back-btn { color: #fff; font-size: 20px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="mystery-box.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="user-balance"><i class="fa-solid fa-wallet"></i> $<span id="balance-val">0.00</span></div>
    </div>

    <div class="rewards-slider-wrapper">
        <span class="slider-title">ITEMS IN THIS CHEST</span>
        <div class="rewards-track" id="rewards-track"></div>
    </div>

    <div class="unbox-container">
        <div id="box-visual"><i class="fa-solid fa-box-open"></i></div>
        <div class="box-title" id="display-name">...</div>
        <div class="box-info">Cost: <span id="display-price" style="color: #fff;">$0</span></div>
        
        <button class="action-btn buy-btn" id="main-btn" onclick="startUnboxing()">OPEN BOX</button>
        <button class="action-btn sell-btn" id="sell-btn" onclick="sellItem()">SELL ITEM (+$<span id="win-val">0</span>)</button>
        
        <p id="status-text" style="margin-top: 25px; color: #888; font-size: 13px;"></p>
    </div>

<script>
    // --- إعدادات Firebase الوهمية (يجب ربطها فعلياً بـ Database) ---
    let userBalance = 1000.00; 

    const urlParams = new URLSearchParams(window.location.search);
    const price = parseInt(urlParams.get('price')) || 0;
    const boxName = urlParams.get('name') || "Mystery Box";

    document.getElementById('display-name').innerText = boxName;
    document.getElementById('display-price').innerText = `$${price}`;
    
    // تعريف مكتبة الجوائز لكل نوع من الصناديق
    const allPossibleItems = {
        low: [ // للصناديق من 5$ لـ 25$
            { n: 'Rusty Nail', v: 0.1, i: 'fa-screwdriver', prob: 60 },
            { n: 'Old Coin', v: 1.5, i: 'fa-coins', prob: 25 },
            { n: 'Basic Chip', v: 5.0, i: 'fa-microchip', prob: 10 },
            { n: 'Silver Ring', v: 30.0, i: 'fa-ring', prob: 5 }
        ],
        high: [ // للصناديق من 40$ لـ 100$
            { n: 'Broken Glass', v: 2.0, i: 'fa-wine-glass-empty', prob: 65 },
            { n: 'Cyber Watch', v: 20.0, i: 'fa-stopwatch', prob: 20 },
            { n: 'Gold Ingot', v: 150.0, i: 'fa-bars', prob: 10 },
            { n: 'Bitcoin Core', v: 1500.0, i: 'fa-brands fa-bitcoin', prob: 4.5 },
            { n: 'Lamborghini', v: 250000.0, i: 'fa-car-side', prob: 0.5 }
        ]
    };

    // اختيار القائمة المناسبة حسب السعر
    const currentPool = (price >= 40) ? allPossibleItems.high : allPossibleItems.low;
    const track = document.getElementById('rewards-track');

    // عرض الجوائز في الشريط العلوي
    currentPool.forEach((item, index) => {
        track.innerHTML += `
            <div class="reward-item" id="item-${index}">
                <i class="fa-solid ${item.i}"></i>
                <span>${item.n}</span>
                <b>$${item.v.toFixed(2)}</b>
            </div>
        `;
    });

    function updateBalanceDisplay() {
        document.getElementById('balance-val').innerText = userBalance.toFixed(2);
        document.getElementById('main-btn').disabled = (userBalance < price);
    }
    updateBalanceDisplay();

    let wonItem = null;

    function startUnboxing() {
        if (userBalance < price) return;
        
        userBalance -= price; // سحب الرصيد عند الشراء
        updateBalanceDisplay();

        const btn = document.getElementById('main-btn');
        const box = document.getElementById('box-visual');
        const status = document.getElementById('status-text');

        btn.style.display = 'none';
        box.classList.add('shake');
        status.innerText = "Generating secure hash...";

        // منطق الاحتمالات (Probability Logic)
        let rand = Math.random() * 100;
        let cumulative = 0;
        
        for (let item of currentPool) {
            cumulative += item.prob;
            if (rand <= cumulative) {
                wonItem = item;
                break;
            }
        }

        setTimeout(() => {
            box.classList.remove('shake');
            box.classList.add('reveal');
            
            // عرض الجائزة التي خرجت من الصندوق
            box.innerHTML = `<i class="fa-solid ${wonItem.i}" style="color: ${wonItem.v > price ? '#ffd700' : '#fff'}"></i>`;
            status.innerText = `YOU GOT: ${wonItem.n}`;
            
            document.getElementById('win-val').innerText = wonItem.v.toFixed(2);
            document.getElementById('sell-btn').style.display = 'block';
        }, 2500);
    }

    function sellItem() {
        userBalance += wonItem.v; // إضافة ثمن الجائزة للرصيد
        updateBalanceDisplay();
        
        alert(`Sold for $${wonItem.v.toFixed(2)}`);
        
        // إعادة تصفير الحالة للشراء مرة أخرى
        document.getElementById('sell-btn').style.display = 'none';
        document.getElementById('main-btn').style.display = 'block';
        document.getElementById('box-visual').classList.remove('reveal');
        document.getElementById('box-visual').innerHTML = '<i class="fa-solid fa-box-open"></i>';
        document.getElementById('status-text').innerText = "";
    }
</script>
</body>
</html>
