<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA CASINO | Games Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914;
            --brand: #ff00b8;
            --accent: #00f2ff;
            --up: #00ff96;
            --gold: #ffcc00;
            --card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            padding-bottom: 110px;
            background: radial-gradient(circle at top right, #1a0b2e 0%, #060914 100%);
        }

        .container { padding: 20px; max-width: 450px; margin: auto; }

        /* --- Header --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .bal-display { background: rgba(0, 255, 150, 0.1); border: 1px solid var(--up); padding: 8px 15px; border-radius: 20px; color: var(--up); font-weight: 800; font-size: 14px; }

        /* --- Banner --- */
        .casino-banner {
            width: 100%; height: 120px; background: linear-gradient(135deg, #6200ff, #ff00b8);
            border-radius: 25px; margin-bottom: 30px; display: flex; align-items: center;
            padding: 20px; box-sizing: border-box; position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 0, 184, 0.3);
        }
        .casino-banner i { position: absolute; right: -10px; font-size: 100px; opacity: 0.2; transform: rotate(-15deg); }
        .casino-banner h2 { font-size: 20px; margin: 0; font-weight: 900; line-height: 1.2; z-index: 1; }

        /* --- Games Grid --- */
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }

        .game-item {
            background: var(--card); border: 1px solid var(--border); border-radius: 22px;
            padding: 25px 15px; text-align: center; transition: 0.3s; cursor: pointer;
            position: relative; overflow: hidden;
        }
        .game-item:active { transform: scale(0.92); background: rgba(255,255,255,0.08); }
        
        .game-item i { font-size: 40px; margin-bottom: 12px; display: block; }
        .game-item b { display: block; font-size: 16px; margin-bottom: 4px; letter-spacing: 0.5px; }
        .game-item span { font-size: 10px; color: #666; font-weight: 700; text-transform: uppercase; }

        .badge { position: absolute; top: 12px; left: 12px; font-size: 8px; font-weight: 900; background: var(--brand); color: #fff; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }

        /* الألوان */
        .color-crash { color: #ff3b3b; }
        .color-dice { color: var(--up); }
        .color-wheel { color: #a100ff; }
        .color-balloon { color: #00f2ff; }

        /* --- Bottom Nav --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: rgba(6, 9, 20, 0.98); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; backdrop-filter: blur(10px); }
        .nav-link { text-decoration: none; color: #444; text-align: center; flex: 1; font-size: 10px; }
        .nav-link i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-link.active { color: var(--brand); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="font-size: 24px; font-weight: 900; margin: 0;">Amana<span style="color:var(--brand)">Casino</span></h1>
        <div class="bal-display"><i class="fa-solid fa-coins"></i> 1,000.00</div>
    </div>

    <div class="casino-banner">
        <h2>BIG WINS AWAIT!<br><span style="font-size: 12px; opacity: 0.8; font-weight: 400;">Try our new rigged games</span></h2>
        <i class="fa-solid fa-clover"></i>
    </div>

    <div class="games-grid">
        
        <div class="game-item" onclick="location.href='dice.html'">
            <div class="badge">Rigged</div>
            <i class="fa-solid fa-dice color-dice"></i>
            <b>Dice Pro</b>
            <span>Over/Under</span>
        </div>

        <div class="game-item" onclick="location.href='wheel.html'">
            <div class="badge">Fast</div>
            <i class="fa-solid fa-dharmachakra color-wheel"></i>
            <b>Wheel</b>
            <span>Spin Fortune</span>
        </div>

        <div class="game-item" onclick="location.href='balloon.html'">
            <div class="badge">New</div>
            <i class="fa-solid fa-hot-tub-person color-balloon"></i> <b>Balloon</b>
            <span>Hold & Release</span>
        </div>

        <div class="game-item" style="opacity: 0.5;">
            <i class="fa-solid fa-rocket color-crash"></i>
            <b>Crash</b>
            <span>Coming Soon</span>
        </div>

        <div class="game-item" style="opacity: 0.5;">
            <i class="fa-solid fa-drumstick-bite" style="color:var(--gold)"></i>
            <b>Chicken</b>
            <span>Coming Soon</span>
        </div>

        <div class="game-item" style="opacity: 0.5;">
            <i class="fa-solid fa-braille" style="color:var(--accent)"></i>
            <b>Plinko</b>
            <span>Coming Soon</span>
        </div>

    </div>
</div>

<nav class="bottom-nav">
    <a href="#" class="nav-link"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="#" class="nav-link active"><i class="fa-solid fa-gamepad"></i><span>Games</span></a>
    <a href="#" class="nav-link"><i class="fa-solid fa-robot"></i><span>Bot</span></a>
    <a href="#" class="nav-link"><i class="fa-solid fa-user"></i><span>Profile</span></a>
</nav>

</body>
</html>
