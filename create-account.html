<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AMANA GLOBAL | Create Account</title>

<style>
:root{
--bg:#0b0f1f;
--text:#ffffff;
--muted:#b8b9d9;
--brand1:#a100ff;
--brand2:#ff00b8;
--glass:rgba(255,255,255,.06);
--border:rgba(255,255,255,.08);
--radius:16px;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:system-ui,-apple-system,Tahoma,Arial;
background:linear-gradient(135deg,#0b0f1f,#1c0833);
color:var(--text);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:16px;
}
.container{width:100%;max-width:420px;}
.header{text-align:center;margin-bottom:20px;}
.brand{
font-size:22px;
font-weight:900;
background:linear-gradient(135deg,var(--brand1),var(--brand2));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.card{
background:var(--glass);
backdrop-filter:blur(18px);
border:1px solid var(--border);
border-radius:var(--radius);
padding:22px;
}
label{font-size:13px;font-weight:700;margin-bottom:6px;display:block;}
input,select{
width:100%;
padding:14px;
margin-bottom:16px;
border-radius:14px;
border:1px solid var(--border);
background:rgba(0,0,0,.4);
color:#fff;
font-size:15px;
}
button{
width:100%;
padding:14px;
border-radius:14px;
border:none;
font-weight:800;
font-size:15px;
cursor:pointer;
background:linear-gradient(135deg,var(--brand1),var(--brand2));
color:#fff;
}
.msg{
margin-top:15px;
padding:12px;
border-radius:12px;
font-size:14px;
display:none;
}
.success{background:rgba(0,255,150,.1);color:#00ff96;}
.error{background:rgba(255,0,80,.1);color:#ff0050;}
</style>
</head>

<body>

<div class="container">
<div class="header">
<div class="brand">AMANA GLOBAL</div>
<div style="color:var(--muted);font-size:13px;margin-top:4px;">
Create Your Secure Account
</div>
</div>

<div class="card">
<form id="createForm">

<label>Username</label>
<input id="username" required minlength="3" />

<label>Email</label>
<input type="email" id="email" required />

<label>Password</label>
<input type="password" id="password" required minlength="8" />

<label>Country</label>
<select id="country" required>
<option value="">Select Country</option>
<option value="+1">USA (+1)</option>
<option value="+971">UAE (+971)</option>
<option value="+966">KSA (+966)</option>
</select>

<label>Phone</label>
<input type="tel" id="phone" required />

<label>Promo Code</label>
<input id="promo" />

<button type="submit">Create Account</button>

<div id="msg" class="msg"></div>

</form>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "PUT_YOUR_API_KEY",
authDomain: "PUT_YOUR_AUTH_DOMAIN",
projectId: "PUT_YOUR_PROJECT_ID",
storageBucket: "PUT_YOUR_STORAGE_BUCKET",
messagingSenderId: "PUT_YOUR_SENDER_ID",
appId: "PUT_YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("createForm");
const msg = document.getElementById("msg");

function show(text,type){
msg.style.display="block";
msg.className="msg "+type;
msg.textContent=text;
}

form.addEventListener("submit",async(e)=>{
e.preventDefault();

const btn=form.querySelector("button");
btn.disabled=true;
btn.textContent="Processing...";

/* ✅ الحل الصحيح بدون تعارض أسماء */
const usernameValue=document.getElementById("username").value.trim();
const emailValue=document.getElementById("email").value.trim();
const passwordValue=document.getElementById("password").value;
const countryValue=document.getElementById("country").value;
const phoneValue=document.getElementById("phone").value.trim();
const promoValue=document.getElementById("promo").value.trim();

try{

const userCredential=await createUserWithEmailAndPassword(auth,emailValue,passwordValue);

await updateProfile(userCredential.user,{
displayName:usernameValue
});

await setDoc(doc(db,"users",userCredential.user.uid),{
username:usernameValue,
email:emailValue,
country:countryValue,
phone:countryValue+phoneValue,
promo:promoValue||null,
createdAt:serverTimestamp()
});

show("Account created successfully ✅","success");

setTimeout(()=>{
window.location.href="profile.html";
},1000);

}catch(err){
btn.disabled=false;
btn.textContent="Create Account";
show(err.message,"error");
}
});
</script>

</body>
</html>
