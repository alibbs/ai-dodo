<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AMANA ELITE | GLOBAL CRASH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@700;900&display=swap');

        :root {
            --bg: #030712;
            --panel: #0f172a;
            --accent: #8b5cf6;
            --gold: #fbbf24;
            --up: #10b981;
            --down: #ef4444;
            --safe-top: env(safe-area-inset-top, 20px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; outline: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; padding-top: var(--safe-top); }

        /* Global History */
        .history-bar {
            display: flex; gap: 6px; padding: 12px; overflow: hidden;
            justify-content: center; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .h-item { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 900; background: var(--panel); border: 1px solid rgba(255,255,255,0.1); font-family: 'Orbitron'; }

        header { height: 60px; display: flex; align-items: center; justify-content: center; }
        .balance-box {
            background: #000; padding: 8px 25px; border-radius: 50px;
            border: 2px solid var(--accent); display: flex; align-items: center; gap: 10px;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }
        .balance-box span { font-family: 'Orbitron'; font-size: 1.2rem; }

        /* Game Stage */
        .stage { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #multi { font-size: 75px; font-weight: 900; font-family: 'Orbitron'; transition: color 0.2s; z-index: 10; }
        .rocket-wrap { position: absolute; bottom: 20%; left: 10%; transition: 0.1s linear; pointer-events: none; }
        #rocket-icon { font-size: 50px; transform: rotate(-45deg); transition: 0.2s; }
        .status-tag { position: absolute; top: 15%; font-size: 10px; letter-spacing: 2px; color: var(--gold); font-weight: 800; text-transform: uppercase; }

        /* Controls */
        .controls {
            background: var(--panel); padding: 20px 20px 35px 20px;
            border-radius: 30px 30px 0 0; border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 12px;
        }
        .profit-info { height: 20px; text-align: center; color: var(--up); font-weight: 900; font-size: 14px; }
        .in-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .fld { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 12px; }
        .fld label { font-size: 9px; color: #64748b; display: block; text-transform: uppercase; margin-bottom: 2px; font-weight: 800; }
        input { width: 100%; background: transparent; border: none; color: #fff; font-size: 16px; font-weight: 900; }

        .btn {
            width: 100%; padding: 18px; border-radius: 15px; border: none;
            font-size: 1.2rem; font-weight: 900; text-transform: uppercase; cursor: pointer;
            transition: 0.2s;
        }
        .btn-bet { background: var(--accent); color: #fff; box-shadow: 0 4px 0 #5b21b6; }
        .btn-out { background: var(--up); color: #000; box-shadow: 0 4px 0 #065f46; }
        .btn-dis { background: #1e293b; color: #475569; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="history-bar" id="history"></div>

    <header>
        <div class="balance-box">
            <i class="fa-solid fa-bolt" style="color:var(--gold)"></i>
            <span id="bal">1000.00</span>
        </div>
    </header>

    <div class="stage">
        <div class="status-tag" id="status">Syncing...</div>
        <div class="rocket-wrap" id="rktWrap">
            <i id="rocket-icon" class="fa-solid fa-rocket"></i>
        </div>
        <div id="multi">1.00x</div>
    </div>

    <div class="controls">
        <div class="profit-info" id="pft"></div>
        <div class="in-row">
            <div class="fld"><label>Amount</label><input type="number" id="amt" value="10"></div>
            <div class="fld"><label>Auto</label><input type="number" id="auto" value="2.00"></div>
        </div>
        <button id="mainBtn" class="btn btn-bet" onclick="act()">Place Bet</button>
    </div>

<script>
    // --- Global Config ---
    const ROUND_DURATION = 20000; // كل جولة 20 ثانية
    const WAIT_DURATION = 5000;   // وقت المراهنة 5 ثواني
    let balance = 1000.00;
    let myBet = { active: false, cashed: false, amount: 0 };

    // --- Global Seeded Logic (Stake Style) ---
    function getGlobalCrash(roundId) {
        // معادلة ثابتة تعتمد على رقم الجولة فقط لتوحيد النتيجة عالمياً
        const seed = Math.abs(Math.sin(roundId) * 16777216);
        const rand = (seed % 1000) / 1000;
        if (rand < 0.03) return 1.00; // 3% احتمال انفجار فوري
        return Math.min(500, Math.max(1.01, 0.99 / (1 - rand)));
    }

    function update() {
        const now = Date.now();
        const roundId = Math.floor(now / ROUND_DURATION);
        const cycle = now % ROUND_DURATION;
        const crashAt = getGlobalCrash(roundId);

        const multiEl = document.getElementById('multi');
        const statusEl = document.getElementById('status');
        const btn = document.getElementById('mainBtn');
        const rkt = document.getElementById('rktWrap');
        const rktIcon = document.getElementById('rocket-icon');

        if (cycle < WAIT_DURATION) {
            // PHASE: WAITING
            const timeLeft = Math.ceil((WAIT_DURATION - cycle) / 1000);
            statusEl.innerText = `Starts in ${timeLeft}s`;
            multiEl.innerText = "1.00x";
            multiEl.style.color = "#fff";
            rkt.style.display = "none";
            rktIcon.style.color = "var(--accent)";
            
            if (!myBet.active) {
                btn.className = "btn btn-bet";
                btn.innerText = "Place Bet";
            } else {
                btn.className = "btn btn-dis";
                btn.innerText = "Bet Placed";
            }
        } else {
            // PHASE: FLYING
            const flightTime = (cycle - WAIT_DURATION) / 1000;
            const currentMulti = Math.pow(1.08, flightTime); // نمو رياضي ثابت

            if (currentMulti >= crashAt) {
                // STATE: CRASHED
                statusEl.innerText = "Crashed";
                multiEl.innerText = crashAt.toFixed(2) + "x";
                multiEl.style.color = "var(--down)";
                rktIcon.style.color = "var(--down)";
                btn.className = "btn btn-dis";
                btn.innerText = "Crashed";
                myBet.active = false;
                myBet.cashed = false;
            } else {
                // STATE: LIVE
                statusEl.innerText = "Live";
                rkt.style.display = "block";
                multiEl.innerText = currentMulti.toFixed(2) + "x";
                multiEl.style.color = "var(--up)";
                
                // Rocket Animation
                rkt.style.left = Math.min(10 + flightTime * 5, 75) + "%";
                rkt.style.bottom = Math.min(20 + flightTime * 4, 65) + "%";

                if (myBet.active && !myBet.cashed) {
                    btn.className = "btn btn-out";
                    btn.innerText = "Cash Out";
                    document.getElementById('pft').innerText = `+${(myBet.amount * currentMulti).toFixed(2)}`;
                    
                    // Auto Cashout
                    let autoVal = parseFloat(document.getElementById('auto').value);
                    if (currentMulti >= autoVal) doOut(currentMulti);
                }
            }
        }
        
        // Sync History (Simple visualization)
        if (cycle < 100) updateHistory(roundId);

        requestAnimationFrame(update);
    }

    function updateHistory(currentRound) {
        const histEl = document.getElementById('history');
        histEl.innerHTML = '';
        for (let i = 1; i <= 6; i++) {
            const val = getGlobalCrash(currentRound - i);
            const div = document.createElement('div');
            div.className = 'h-item';
            div.style.color = val >= 2 ? 'var(--up)' : 'var(--down)';
            div.innerText = val.toFixed(2) + 'x';
            histEl.appendChild(div);
        }
    }

    function act() {
        const cycle = Date.now() % ROUND_DURATION;
        if (cycle < WAIT_DURATION && !myBet.active) {
            let a = parseFloat(document.getElementById('amt').value);
            if (a > balance || a <= 0) return;
            balance -= a;
            myBet = { active: true, cashed: false, amount: a };
            document.getElementById('bal').innerText = balance.toFixed(2);
        } else if (cycle >= WAIT_DURATION && myBet.active && !myBet.cashed) {
            const flightTime = (cycle - WAIT_DURATION) / 1000;
            const currentMulti = Math.pow(1.08, flightTime);
            doOut(currentMulti);
        }
    }

    function doOut(m) {
        if (myBet.cashed) return;
        myBet.cashed = true;
        const win = myBet.amount * m;
        balance += win;
        document.getElementById('bal').innerText = balance.toFixed(2);
        document.getElementById('mainBtn').className = "btn btn-dis";
        document.getElementById('mainBtn').innerText = "Won " + win.toFixed(2);
        document.getElementById('pft').innerText = "CASHED!";
    }

    update();
</script>
</body>
</html>
