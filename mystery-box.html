<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA | Luxury Mystery Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #03050a; 
            --brand: #ff00b8; 
            --accent: #00f2ff;
            --gold: #ffb800;
            --card: rgba(255, 255, 255, 0.03); 
            --border: rgba(255, 255, 255, 0.08);
            --muted: #666;
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 184, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 242, 255, 0.1) 0%, transparent 40%);
            min-height: 100vh; padding-bottom: 110px;
        }

        /* --- Header --- */
        .header { padding: 60px 20px 30px; text-align: center; position: relative; }
        .header h1 { 
            font-size: 32px; font-weight: 900; margin: 0; letter-spacing: -1.5px; 
            text-transform: uppercase;
        }
        .header span { 
            background: linear-gradient(to right, var(--brand), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 0, 184, 0.5));
        }
        .header p { color: var(--muted); font-size: 13px; margin-top: 10px; letter-spacing: 1px; }

        /* --- Section Titles --- */
        .section-title { 
            padding: 0 25px; margin: 40px 0 20px; font-size: 11px; 
            color: var(--muted); text-transform: uppercase; letter-spacing: 3px;
            display: flex; align-items: center; gap: 15px; font-weight: 700;
        }
        .section-title::after { content: ""; height: 1px; background: linear-gradient(90deg, var(--border), transparent); flex: 1; }

        /* --- Grid & Cards --- */
        .boxes-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 20px; padding: 0 20px;
        }

        .box-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 30px; padding: 30px 15px; text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            position: relative; overflow: hidden;
            backdrop-filter: blur(20px); cursor: pointer; text-decoration: none; color: inherit;
        }

        .box-card::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            pointer-events: none;
        }

        .box-card:active { transform: scale(0.92); }

        /* --- Glowing Icons --- */
        .box-icon {
            font-size: 50px; margin-bottom: 15px; display: block;
            transition: 0.3s;
        }
        
        /* Standard Boxes Style */
        .box-card.standard { border-bottom: 3px solid var(--accent); }
        .box-card.standard .box-icon { color: var(--accent); filter: drop-shadow(0 0 15px rgba(0, 242, 255, 0.4)); }
        
        /* Premium Boxes Style */
        .box-card.premium { border-bottom: 3px solid var(--gold); background: rgba(255, 184, 0, 0.03); }
        .box-card.premium .box-icon { 
            color: var(--gold); 
            filter: drop-shadow(0 0 20px rgba(255, 184, 0, 0.5)); 
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .box-name { font-weight: 700; font-size: 14px; display: block; margin-bottom: 4px; color: #eee; }
        .box-price { font-size: 20px; font-weight: 900; color: #fff; display: block; margin-bottom: 18px; }

        .buy-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff;
            padding: 12px; border-radius: 15px; font-size: 11px;
            font-weight: 800; width: 100%; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }

        .box-card:hover { border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.07); }
        .box-card:hover .buy-btn { background: #fff; color: #000; }

        /* --- Bottom Nav (Premium Glassmorphism) --- */
        .bottom-nav { 
            position: fixed; bottom: 20px; left: 20px; right: 20px; height: 75px;
            background: rgba(10, 10, 15, 0.85); display: flex; justify-content: space-around;
            align-items: center; border: 1px solid var(--border); 
            backdrop-filter: blur(25px); border-radius: 25px; z-index: 1000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .nav-item { color: #555; font-size: 20px; text-decoration: none; text-align: center; transition: 0.3s; }
        .nav-item.active { color: var(--brand); text-shadow: 0 0 10px var(--brand); }
        .nav-item span { display: block; font-size: 9px; margin-top: 5px; font-weight: 700; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="header">
        <h1>AMANA <span>LUXURY</span></h1>
        <p>HIGH-STAKES DIGITAL UNBOXING</p>
    </div>

    <div class="section-title">Common Assets</div>
    <div class="boxes-grid">
        <div class="box-card standard" onclick="openPurchase(5, 'Basic Drop')">
            <i class="fa-solid fa-cube box-icon"></i>
            <span class="box-name">Basic Drop</span>
            <span class="box-price">$5.00</span>
            <button class="buy-btn">Unlock</button>
        </div>
        <div class="box-card standard" onclick="openPurchase(10, 'Silver Box')">
            <i class="fa-solid fa-parachute-box box-icon"></i>
            <span class="box-name">Silver Box</span>
            <span class="box-price">$10.00</span>
            <button class="buy-btn">Unlock</button>
        </div>
    </div>

    <div class="section-title">High Roller Chests</div>
    <div class="boxes-grid">
        <div class="box-card premium" onclick="openPurchase(60, 'Master Chest')">
            <i class="fa-solid fa-vault box-icon"></i>
            <span class="box-name">Master Chest</span>
            <span class="box-price">$60.00</span>
            <button class="buy-btn">Unlock</button>
        </div>
        <div class="box-card premium" onclick="openPurchase(100, 'Legendary Box')">
            <i class="fa-solid fa-gem box-icon"></i>
            <span class="box-name">Legendary Box</span>
            <span class="box-price">$100.00</span>
            <button class="buy-btn">Unlock</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-item"><i class="fa-solid fa-grid-2"></i><span>Home</span></a>
        <a href="game.html" class="nav-item active"><i class="fa-solid fa-bolt"></i><span>Play</span></a>
        <a href="bot-trade.html" class="nav-item"><i class="fa-solid fa-robot"></i><span>Bot</span></a>
        <a href="profile.html" class="nav-item"><i class="fa-solid fa-user-ninja"></i><span>Profile</span></a>
    </nav>

    <script>
        function openPurchase(price, name) {
            // تأثير اهتزاز بسيط قبل الانتقال
            window.location.href = `unbox.html?price=${price}&name=${encodeURIComponent(name)}`;
        }
    </script>
</body>
</html>
