<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AMANA ELITE | Live Crash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --up: #00ff96; --card: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1);
        }
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
            min-height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center;
        }

        /* Header */
        .header { width: 100%; max-width: 500px; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo { font-weight: 900; font-size: 16px; letter-spacing: 1px; } .logo span { color: var(--brand); }
        .bal-display { background: rgba(0, 255, 150, 0.1); border: 1px solid var(--up); padding: 5px 12px; border-radius: 50px; color: var(--up); font-weight: 800; font-size: 13px; }

        .history-bar { width: 100%; max-width: 500px; display: flex; gap: 8px; padding: 5px 15px; overflow-x: auto; scrollbar-width: none; min-height: 45px; align-items: center; }
        .hist-item { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; background: var(--card); border: 1px solid var(--border); }

        /* Game Scene */
        .container { width: 100%; max-width: 500px; padding: 5px 15px; flex: 1; }
        .flight-window {
            width: 100%; height: 260px; background: radial-gradient(circle at center, #0f172a 0%, #060914 100%);
            border-radius: 24px; border: 1px solid var(--border); position: relative; overflow: hidden;
        }
        
        #multiplier { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 55px; font-weight: 900; z-index: 10; text-shadow: 0 10px 20px rgba(0,0,0,0.5); transition: color 0.2s; }
        
        /* Waiting UI */
        .wait-overlay { position: absolute; inset: 0; background: rgba(6,9,20,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; display: none; }
        .wait-txt { font-weight: 800; font-size: 14px; color: #8b8da3; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .progress-box { width: 200px; height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
        .progress-fill { height: 100%; width: 0%; background: var(--up); box-shadow: 0 0 15px var(--up); }

        .plane-node { position: absolute; bottom: 30px; left: 30px; z-index: 15; transition: transform 0.1s linear; display: none; }
        .plane-node i { font-size: 30px; color: var(--accent); transform: rotate(-15deg); filter: drop-shadow(0 0 10px var(--accent)); animation: hover 0.5s infinite alternate; }
        @keyframes hover { from { translate: 0 0; } to { translate: 2px -2px; } }

        /* Controls */
        .controls { background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 20px; margin-top: 15px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .field { flex: 1; background: #0f212e; padding: 10px; border-radius: 12px; border: 1px solid var(--border); }
        .field span { display: block; font-size: 9px; color: #8b8da3; font-weight: 800; margin-bottom: 4px; }
        .field input { width: 100%; background: transparent; border: none; color: #fff; font-weight: 800; font-size: 16px; outline: none; }
        
        .main-action { width: 100%; padding: 18px; border-radius: 15px; border: none; font-weight: 900; font-size: 18px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn-bet { background: var(--up); color: #060914; }
        .btn-bet:disabled { background: #2f4553; color: #8b8da3; }
        .btn-cash { background: #fff; color: #000; display: none; }
        .btn-cash:disabled { opacity: 0.5; }

        /* Stats */
        .stats-head { padding: 12px 15px; font-size: 11px; font-weight: 800; display: flex; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: 12px 12px 0 0; margin-top: 15px; }
        .stats-body { max-height: 180px; overflow-y: auto; background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-top: none; border-radius: 0 0 12px 12px; padding: 5px 15px; }
        .p-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .p-row.me { color: var(--accent); font-weight: 900; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">AMANA <span>ELITE</span></div>
        <div id="userBal" class="bal-display"><i class="fa-solid fa-wallet"></i> 0.00</div>
    </div>

    <div class="history-bar" id="histBar"></div>

    <div class="container">
        <div class="flight-window">
            <div id="multiplier">1.00x</div>
            <div class="wait-overlay" id="waitOverlay">
                <div class="wait-txt">Next Round in</div>
                <div class="progress-box"><div class="progress-fill" id="progressFill"></div></div>
            </div>
            <div style="position:absolute; width:100%; height:100%;">
                <svg style="position:absolute; width:100%; height:100%;"><path id="flightPath" d="" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="5,5"/></svg>
                <div class="plane-node" id="planeNode"><i class="fa-solid fa-plane"></i></div>
            </div>
        </div>

        <div class="controls">
            <div class="input-row">
                <div class="field"><span>AMOUNT</span><input type="number" id="betInput" value="10.00"></div>
                <div class="field"><span>AUTO</span><input type="number" id="autoInput" value="2.00" step="0.1"></div>
            </div>
            <button class="main-action btn-bet" id="btnBet">PLACE BET</button>
            <button class="main-action btn-cash" id="btnCash">CASHOUT</button>
        </div>

        <div class="stats-head">
            <span>PLAYERS (<span id="pCount">0</span>)</span>
            <span style="color:var(--accent)">POOL: $<span id="totalBets">0.00</span></span>
        </div>
        <div class="stats-body" id="playerList"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA", authDomain: "ai-dodo.firebaseapp.com", projectId: "ai-dodo", storageBucket: "ai-dodo.firebasestorage.app", messagingSenderId: "261622335803", appId: "1:261622335803:web:0b066791230535e7d5cf1e" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);

    let userId, userBalance = 0, currentMult = 1.0, isPlaying = false, hasCashout = false, nextBet = false;
    let hist = [];

    // Audio
    const audio = new (window.AudioContext || window.webkitAudioContext)();
    function sfx(f) { const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=f; g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime+0.1); o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+0.1); }

    onAuthStateChanged(auth, u => { if(u) { userId = u.uid; onSnapshot(doc(db, "users", userId), s => { userBalance = s.data().balance; document.getElementById('userBal').innerHTML = `<i class="fa-solid fa-wallet"></i> ${userBalance.toFixed(2)}`; }); } });

    // Global Sync Logic
    async function syncLoop() {
        while(true) {
            const now = Date.now();
            const cycle = 15000; // Each round is 15 seconds
            const timeInCycle = now % cycle;

            if (timeInCycle < 5000) { // Waiting Phase (5s)
                const p = (timeInCycle / 5000) * 100;
                document.getElementById('waitOverlay').style.display = 'flex';
                document.getElementById('progressFill').style.width = p + '%';
                document.getElementById('multiplier').textContent = "1.00x";
                document.getElementById('multiplier').style.color = "#8b8da3";
                document.getElementById('planeNode').style.display = 'none';
                document.getElementById('flightPath').setAttribute('d', '');
                
                if(!isPlaying) {
                    document.getElementById('btnBet').style.display = 'block';
                    document.getElementById('btnCash').style.display = 'none';
                    document.getElementById('betInput').disabled = document.getElementById('autoInput').disabled = false;
                }
                
                renderFakes();
                await new Promise(r => setTimeout(r, 50));
            } else { // Flight Phase (10s max)
                document.getElementById('waitOverlay').style.display = 'none';
                document.getElementById('planeNode').style.display = 'block';
                document.getElementById('multiplier').style.color = 'var(--accent)';
                
                if(nextBet) { isPlaying = true; nextBet = false; }
                if(isPlaying) { document.getElementById('btnBet').style.display = 'none'; document.getElementById('btnCash').style.display = 'block'; }

                const elapsed = (timeInCycle - 5000) / 1000;
                // Deterministic Crash Point based on Timestamp
                const roundId = Math.floor(now / cycle);
                const crashPoint = getCrashPoint(roundId);

                while(((Date.now() % cycle) - 5000) / 1000 < 10) {
                    let liveElapsed = ((Date.now() % cycle) - 5000) / 1000;
                    if(liveElapsed < 0) break;
                    
                    currentMult = Math.pow(Math.E, 0.08 * liveElapsed);
                    
                    if(currentMult >= crashPoint) break;

                    document.getElementById('multiplier').textContent = currentMult.toFixed(2) + 'x';
                    
                    // Cashout Logic
                    if(isPlaying && !hasCashout) {
                        document.getElementById('btnCash').disabled = currentMult < 1.01;
                        if(currentMult >= parseFloat(document.getElementById('autoInput').value)) doCashout();
                    }

                    // Plane Physics
                    let x = Math.min(liveElapsed * 40, 80), y = Math.min(Math.pow(liveElapsed, 1.3) * 15, 70);
                    document.getElementById('planeNode').style.transform = `translate(${x}vw, -${y}vh)`;
                    document.getElementById('flightPath').setAttribute('d', `M 30 230 Q ${30+(x*2.5)} 230, ${30+(x*4.5)} ${230-(y*3)}`);

                    await new Promise(r => requestAnimationFrame(r));
                }

                // Crash
                sfx(100);
                document.getElementById('multiplier').textContent = currentMult.toFixed(2) + 'x';
                document.getElementById('multiplier').style.color = '#ff0050';
                if(!hasCashout) isPlaying = false; 
                
                // History Update
                if(hist[0] !== currentMult.toFixed(2)) {
                    hist.unshift(currentMult.toFixed(2)); if(hist.length > 10) hist.pop();
                    document.getElementById('histBar').innerHTML = hist.map(h => `<div class="hist-item" style="color:${h >= 2 ? 'var(--up)' : '#ff0050'}">${h}x</div>`).join('');
                }

                // Reset for next
                setTimeout(() => {
                    hasCashout = false; isPlaying = false;
                    document.getElementById('btnCash').style.background = '#fff';
                    document.getElementById('btnCash').textContent = 'CASHOUT';
                }, 1000);

                const waitTime = cycle - (Date.now() % cycle);
                await new Promise(r => setTimeout(r, waitTime));
            }
        }
    }

    function getCrashPoint(seed) {
        let res = (seed * 16807) % 2147483647;
        let random = res / 2147483647;
        return (random < 0.03) ? 1.00 : (1.00 / (1 - random) ** 0.96).toFixed(2);
    }

    function renderFakes() {
        const list = document.getElementById('playerList');
        const names = ['Nar_22', 'Ba777', 'Olymbis23', 'Hidden', 'Zoro_X', 'Hidden', 'King99', 'Hidden'];
        let pool = (Math.random() * 6000 + 800).toFixed(2);
        document.getElementById('totalBets').textContent = pool;
        document.getElementById('pCount').textContent = Math.floor(Math.random()*500+100);
        
        let html = isPlaying ? `<div class="p-row me"><span>YOU</span><span>$${document.getElementById('betInput').value}</span><span>-</span></div>` : '';
        html += names.map(n => `<div class="p-row"><span>${n}</span><span>$${(Math.random()*100).toFixed(2)}</span><span>-</span></div>`).join('');
        list.innerHTML = html;
    }

    async function doCashout() {
        if(!isPlaying || hasCashout || currentMult < 1.01) return;
        hasCashout = true; sfx(800);
        const win = parseFloat(document.getElementById('betInput').value) * currentMult;
        await updateDoc(doc(db, "users", userId), { balance: increment(win) });
        document.getElementById('btnCash').style.background = 'var(--up)';
        document.getElementById('btnCash').textContent = 'WON!';
    }

    document.getElementById('btnBet').onclick = async () => {
        const bet = parseFloat(document.getElementById('betInput').value);
        if(bet > userBalance || bet <= 0) return;
        sfx(400);
        await updateDoc(doc(db, "users", userId), { balance: increment(-bet) });
        nextBet = true;
        document.getElementById('btnBet').disabled = true;
        document.getElementById('btnBet').textContent = "BETTING...";
        document.getElementById('betInput').disabled = document.getElementById('autoInput').disabled = true;
    };

    document.getElementById('btnCash').onclick = doCashout;
    syncLoop();
</script>
</body>
</html>
