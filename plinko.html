<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>AMANA PLINKO | ASMR EDITION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #0f172a;
            --sidebar: #212631;
            --input: #0f121d;
            --moov: #a333ff;
            --red: #ff3b3b;
            --border: #2f3749;
            --text-gray: #b1bad3;
        }

        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; }
        body { display: flex; flex-direction: column; }

        header { padding: 15px; display: flex; justify-content: center; background: var(--bg); }
        .balance-box { background: var(--input); padding: 8px 20px; border-radius: 6px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); font-weight: 800; }

        .game-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; }
        #plinko-canvas { width: 100%; height: 85%; }

        .multiplier-row { display: flex; gap: 2px; width: 95%; max-width: 500px; margin-bottom: 25px; }
        .m-box { flex: 1; height: 26px; background: var(--red); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 7px; font-weight: 900; color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.4); }

        .controls { background: var(--sidebar); padding: 20px 20px 40px 20px; display: flex; flex-direction: column; gap: 10px; border-radius: 20px 20px 0 0; }
        .bet-btn { background: var(--moov); border: none; color: #fff; padding: 18px; border-radius: 6px; font-size: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer; box-shadow: 0 4px 0 #7a1fd1; }
    </style>
</head>
<body>

    <header>
        <div class="balance-box">
            <i class="fa-solid fa-coins" style="color:#26a17b"></i>
            <span id="userBalance">0.00</span>
        </div>
    </header>

    <div class="game-screen">
        <canvas id="plinko-canvas"></canvas>
        <div class="multiplier-row" id="multiplierRow"></div>
    </div>

    <div class="controls">
        <div style="background:var(--input); border:1px solid var(--border); padding:10px; border-radius:6px; margin-bottom:10px;">
            <div style="font-size:10px; color:var(--text-gray); margin-bottom:5px;">BET AMOUNT</div>
            <input type="number" id="betAmount" value="10.00" style="background:transparent; border:none; color:#fff; width:100%; font-weight:800; font-size:16px;">
        </div>
        <button class="bet-btn" onclick="placeBet()">Play</button>
    </div>

<script>
    const canvas = document.getElementById('plinko-canvas');
    const ctx = canvas.getContext('2d');
    const multiRow = document.getElementById('multiplierRow');
    let balance = parseFloat(localStorage.getItem('balance')) || 2500.00;
    let balls = [], pegs = [];
    const rows = 16;

    // --- Soft ASMR Sound Engine ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSoftTick() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine'; // Sine wave is softer than square/triangle
        osc.frequency.setValueAtTime(150, audioCtx.currentTime); // Low frequency for "thud"
        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    function playSoftWin() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(660, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
    }

    const stakeData = [1000, 130, 26, 9, 4, 2, 0.2, 0, 0, 0, 0.2, 2, 4, 9, 26, 130, 1000];

    function sync() {
        document.getElementById('userBalance').textContent = balance.toLocaleString(undefined, {minimumFractionDigits: 2});
        localStorage.setItem('balance', balance);
    }
    sync();

    function initBoard() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        pegs = [];
        const spacing = canvas.width / (rows + 4);
        for (let i = 2; i <= rows + 1; i++) {
            const rowY = spacing * (i + 1);
            for (let j = 0; j <= i; j++) {
                const x = canvas.width / 2 + (j - i / 2) * (spacing * 1.1);
                pegs.push({ x, y: rowY, active: 0 });
            }
        }
        multiRow.innerHTML = '';
        stakeData.forEach(m => {
            const div = document.createElement('div');
            div.className = 'm-box';
            div.textContent = m + 'x';
            multiRow.appendChild(div);
        });
    }

    function placeBet() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        let amt = parseFloat(document.getElementById('betAmount').value);
        if (amt > balance || amt <= 0) return;
        balance -= amt; sync();

        // House Edge Logic (99% center)
        const r = Math.random() * 100;
        let target = Math.floor(stakeData.length / 2);
        if (r < 0.5) target = Math.random() > 0.5 ? 0 : stakeData.length - 1;
        else if (r < 10) target = Math.random() > 0.5 ? 4 : 12;

        const spacing = canvas.width / (rows + 4);
        const targetX = canvas.width / 2 + (target - (stakeData.length - 1) / 2) * (spacing * 1.1);

        balls.push({ x: canvas.width / 2, y: 30, vx: 0, vy: 0, targetX, bet: amt, win: stakeData[target] });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pegs.forEach(p => {
            ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = p.active > 0 ? '#fff' : '#3d4459';
            ctx.fill();
            if(p.active > 0) p.active--;
        });

        balls.forEach((b, i) => {
            b.vy += 0.5; // Gravity
            b.vx += (b.targetX - b.x) * 0.04;
            b.vx *= 0.93;
            b.x += b.vx; b.y += b.vy;

            pegs.forEach(p => {
                const d = Math.hypot(b.x - p.x, b.y - p.y);
                if (d < 10) {
                    p.active = 10;
                    b.vy *= -0.55; // Basket-ball bounce effect
                    b.vx += (b.x - p.x) * 0.5;
                    playSoftTick();
                }
            });

            // Coin UI
            ctx.beginPath(); ctx.arc(b.x, b.y, 9, 0, Math.PI * 2);
            ctx.fillStyle = '#a333ff';
            ctx.shadowBlur = 10; ctx.shadowColor = '#a333ff';
            ctx.fill(); ctx.shadowBlur = 0;

            if (b.y > canvas.height - 10) {
                balance += (b.bet * b.win); sync();
                playSoftWin();
                balls.splice(i, 1);
            }
        });
        requestAnimationFrame(draw);
    }

    initBoard(); draw();
    window.addEventListener('resize', initBoard);
</script>
</body>
</html>
