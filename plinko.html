<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>AMANA PLINKO | PRO EDITION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #04060b;
            --panel: #0f121d;
            --moov: #a333ff;
            --peg: #ffffff;
            --red: #ff3b3b;
            --border: #222635;
            --input-bg: #1a1d29;
        }

        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; }
        body { display: flex; flex-direction: column; }

        header { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .balance-tag { background: var(--panel); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-weight: 800; display: flex; align-items: center; gap: 8px; }

        .game-area { flex: 1.8; position: relative; background: radial-gradient(circle at center, #111524 0%, #04060b 100%); overflow: hidden; }
        #plinko-canvas { width: 100%; height: 100%; }

        .multi-container {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 2px; width: 94%; justify-content: center;
        }
        .m-box {
            flex: 1; height: 24px; background: var(--red); border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            font-size: 7px; font-weight: 900; color: #fff; text-shadow: 1px 1px 2px #000;
            transition: 0.3s;
        }

        .dashboard { background: var(--panel); border-top: 2px solid var(--border); padding: 15px 20px 30px 20px; display: flex; flex-direction: column; gap: 12px; }
        
        /* Risk Selector Tabs */
        .risk-selector { display: flex; background: var(--input-bg); border-radius: 8px; padding: 4px; gap: 4px; }
        .risk-btn { flex: 1; border: none; background: transparent; color: #55607b; padding: 8px; border-radius: 6px; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; }
        .risk-btn.active { background: #2f3749; color: #fff; box-shadow: 0 0 10px rgba(0,0,0,0.3); }

        .input-wrapper { background: var(--input-bg); border: 2px solid var(--border); border-radius: 8px; display: flex; align-items: center; padding-right: 8px; }
        .input-wrapper input { flex: 1; background: transparent; border: none; color: #fff; padding: 12px; font-size: 16px; font-weight: 700; }
        
        .main-btn { width: 100%; padding: 18px; border-radius: 8px; border: none; font-size: 18px; font-weight: 900; text-transform: uppercase; background: var(--moov); color: #fff; box-shadow: 0 0 15px rgba(163, 51, 255, 0.4); }
    </style>
</head>
<body>

    <header>
        <a href="game.html" style="color:#fff;"><i class="fa-solid fa-chevron-left"></i></a>
        <div class="balance-tag">
            <i class="fa-solid fa-coins" style="color:#26a17b"></i>
            <span id="userBalance">0.00</span>
        </div>
        <div style="width:20px"></div>
    </header>

    <div class="game-area">
        <canvas id="plinko-canvas"></canvas>
        <div class="multi-container" id="multi-row"></div>
    </div>

    <div class="dashboard">
        <div class="risk-selector">
            <button class="risk-btn" onclick="setRisk('low', this)">Low</button>
            <button class="risk-btn active" onclick="setRisk('medium', this)">Medium</button>
            <button class="risk-btn" onclick="setRisk('high', this)">High</button>
        </div>

        <div class="input-wrapper">
            <input type="number" id="betAmount" value="10.00">
            <div style="display:flex; gap:4px;">
                <button onclick="mult(0.5)" style="background:#2f3749; border:none; color:#fff; padding:5px 8px; border-radius:4px; font-size:10px;">½</button>
                <button onclick="mult(2)" style="background:#2f3749; border:none; color:#fff; padding:5px 8px; border-radius:4px; font-size:10px;">2×</button>
            </div>
        </div>

        <button class="main-btn" onclick="dropCoin()">Bet</button>
    </div>

<script>
    const canvas = document.getElementById('plinko-canvas');
    const ctx = canvas.getContext('2d');
    const multiRow = document.getElementById('multi-row');
    let balance = parseFloat(localStorage.getItem('balance')) || 2840.15;
    let currentRisk = 'medium';

    const riskData = {
        low: [5, 3, 2, 1.5, 1.1, 1, 0.5, 1, 1.1, 1.5, 2, 3, 5],
        medium: [20, 10, 5, 2, 1.2, 0.5, 0.2, 0.5, 1.2, 2, 5, 10, 20],
        high: [100, 50, 20, 10, 5, 1, 0.1, 1, 5, 10, 20, 50, 100]
    };

    function sync() {
        document.getElementById('userBalance').textContent = balance.toLocaleString(undefined, {minimumFractionDigits: 2});
        localStorage.setItem('balance', balance);
    }
    sync();

    function setRisk(level, btn) {
        currentRisk = level;
        document.querySelectorAll('.risk-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMultipliers();
        initBoard();
    }

    function renderMultipliers() {
        multiRow.innerHTML = '';
        riskData[currentRisk].forEach(m => {
            const div = document.createElement('div');
            div.className = 'm-box';
            div.textContent = m + 'x';
            multiRow.appendChild(div);
        });
    }

    let pegs = [], balls = [];
    const rows = 12; // عدد الصفوف ثابت للسهولة أو ممكن تغيره مع الريسك

    function initBoard() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        pegs = [];
        const spacing = canvas.width / (rows + 3);
        for (let i = 2; i <= rows + 1; i++) {
            const rowY = spacing * i;
            for (let j = 0; j < i + 1; j++) {
                const x = canvas.width / 2 + (j - i / 2) * spacing;
                pegs.push({ x, y: rowY, active: 0 });
            }
        }
    }

    function dropCoin() {
        let amt = parseFloat(document.getElementById('betAmount').value);
        if (amt > balance || amt <= 0) return;
        balance -= amt; sync();

        balls.push({
            x: canvas.width / 2 + (Math.random() * 2 - 1),
            y: 30, vx: 0, vy: 0, bet: amt
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        pegs.forEach(peg => {
            ctx.beginPath();
            ctx.arc(peg.x, peg.y, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = peg.active > 0 ? '#fff' : '#444';
            if(peg.active > 0) { ctx.shadowBlur = 10; ctx.shadowColor = '#fff'; }
            ctx.fill(); ctx.shadowBlur = 0;
            if(peg.active > 0) peg.active--;
        });

        balls.forEach((ball, index) => {
            ball.vy += 0.5; // جاذبية
            ball.x += ball.vx;
            ball.y += ball.vy;

            pegs.forEach(peg => {
                const dx = ball.x - peg.x;
                const dy = ball.y - peg.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 8) {
                    peg.active = 10;
                    ball.vy *= -0.4;
                    // --- الذكاء الاصطناعي (3% Win Chance) ---
                    // جعل الطابة تنجذب للمركز دائماً بنسبة بسيطة لتقليل الربح
                    let attraction = (canvas.width / 2 - ball.x) * 0.05;
                    ball.vx = (dx / dist) * 2 + attraction;
                }
            });

            // رسم العملة الموف
            ctx.beginPath(); ctx.arc(ball.x, ball.y, 7, 0, Math.PI * 2);
            ctx.fillStyle = '#a333ff'; ctx.shadowBlur = 15; ctx.shadowColor = '#a333ff'; ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = '8px Arial'; ctx.textAlign = 'center';
            ctx.fillText('$', ball.x, ball.y + 3); ctx.shadowBlur = 0;

            if (ball.y > canvas.height - 40) {
                const spacing = canvas.width / (rows + 3);
                const col = Math.round((ball.x - canvas.width / 2) / spacing + riskData[currentRisk].length / 2 - 0.5);
                const safeCol = Math.max(0, Math.min(riskData[currentRisk].length - 1, col));
                
                balance += ball.bet * riskData[currentRisk][safeCol];
                sync();
                balls.splice(index, 1);
            }
        });
        requestAnimationFrame(draw);
    }

    function mult(v) { document.getElementById('betAmount').value = (document.getElementById('betAmount').value * v).toFixed(2); }

    renderMultipliers();
    initBoard();
    draw();
</script>
</body>
</html>
