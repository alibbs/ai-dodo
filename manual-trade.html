<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA ELITE+ | Live Terminal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --up: #00ff96; --down: #ff3b3b;
            --card: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            overflow: hidden; height: 100vh; display: flex; flex-direction: column;
        }

        /* --- Top Bar (Balance) --- */
        .top-status {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--border);
        }
        .user-balance { font-weight: 900; color: var(--accent); font-size: 18px; }
        .user-balance span { font-size: 10px; color: #aaa; text-transform: uppercase; display: block; }

        /* --- Asset Tabs --- */
        .asset-tabs {
            display: flex; overflow-x: auto; background: #0b0e1a; padding: 5px 10px; gap: 8px;
        }
        .asset-tabs::-webkit-scrollbar { display: none; }
        .tab {
            padding: 8px 15px; border-radius: 8px; font-size: 11px; font-weight: 700;
            background: var(--card); border: 1px solid var(--border); cursor: pointer;
        }
        .tab.active { border-color: var(--brand); color: var(--brand); background: rgba(255,0,184,0.1); }

        /* --- Chart --- */
        #chart-box { flex-grow: 1; position: relative; width: 100%; }
        .live-label {
            position: absolute; top: 15px; right: 15px; z-index: 5;
            background: rgba(255, 59, 59, 0.2); color: var(--down);
            padding: 4px 10px; border-radius: 5px; font-size: 10px; font-weight: 900;
            border: 1px solid var(--down);
        }

        /* --- Trading Controls (IQ Style) --- */
        .controls {
            background: #0b0e1a; padding: 20px;
            border-top: 1px solid var(--border);
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }
        .control-group { position: relative; }
        .control-group label {
            position: absolute; top: -8px; left: 12px; background: #0b0e1a;
            padding: 0 5px; font-size: 10px; color: #666; font-weight: 700;
        }
        .control-group input {
            width: 100%; background: transparent; border: 1px solid var(--border);
            padding: 15px; border-radius: 12px; color: #fff; font-weight: 900; font-size: 16px;
            box-sizing: border-box;
        }

        .action-btns {
            grid-column: span 2; display: flex; gap: 15px; margin-top: 5px;
        }
        .btn {
            flex: 1; padding: 18px; border-radius: 15px; border: none;
            font-weight: 900; font-size: 18px; color: #fff; cursor: pointer;
            transition: 0.2s;
        }
        .btn-up { background: var(--up); box-shadow: 0 5px 15px rgba(0, 255, 150, 0.2); }
        .btn-down { background: var(--down); box-shadow: 0 5px 15px rgba(255, 59, 59, 0.2); }
        .btn:active { transform: scale(0.95); }

        .bottom-nav { 
            height: 70px; background: #060914; border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; align-items: center;
        }
    </style>
</head>
<body>

    <div class="top-status">
        <div class="user-info">
            <span data-key="balance">Wallet Balance</span>
            <div class="user-balance"><span id="userBalance">0.00</span> USDT</div>
        </div>
        <div id="livePriceHeader" style="text-align: right; font-weight: 900; font-size: 20px;">0.00</div>
    </div>

    <div class="asset-tabs">
        <div class="tab active" onclick="setSymbol('BTCUSDT', this)">BTC</div>
        <div class="tab" onclick="setSymbol('ETHUSDT', this)">ETH</div>
        <div class="tab" onclick="setSymbol('SOLUSDT', this)">SOL</div>
        <div class="tab" onclick="setSymbol('BNBUSDT', this)">BNB</div>
        <div class="tab" onclick="setSymbol('XRPUSDT', this)">XRP</div>
    </div>

    <div id="chart-box">
        <div class="live-label">LIVE BINANCE</div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>AMOUNT</label>
            <input type="number" id="amountInput" value="10">
        </div>
        <div class="control-group">
            <label>LEVERAGE (MAX 75x)</label>
            <input type="number" id="levInput" value="10" max="75">
        </div>

        <div class="action-btns">
            <button class="btn btn-down" onclick="trade('SELL')">PUT</button>
            <button class="btn btn-up" onclick="trade('BUY')">CALL</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
        authDomain: "ai-dodo.firebaseapp.com",
        projectId: "ai-dodo",
        storageBucket: "ai-dodo.firebasestorage.app",
        messagingSenderId: "261622335803",
        appId: "1:261622335803:web:0b066791230535e7d5cf1e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentBalance = 0;
    let userUID = null;

    // --- Chart Setup ---
    const chart = LightweightCharts.createChart(document.getElementById('chart-box'), {
        layout: { backgroundColor: '#060914', textColor: '#555' },
        grid: { vertLines: { color: '#131722' }, horzLines: { color: '#131722' } },
        timeScale: { timeVisible: true, secondsVisible: true }
    });
    const lineSeries = chart.addLineSeries({ color: '#ff00b8', lineWidth: 2 });

    // --- Firebase Auth & Balance ---
    onAuthStateChanged(auth, (user) => {
        if (user) {
            userUID = user.uid;
            onSnapshot(doc(db, "users", user.uid), (snap) => {
                if (snap.exists()) {
                    currentBalance = snap.data().balance || 0;
                    document.getElementById('userBalance').textContent = currentBalance.toLocaleString(undefined, {minimumFractionDigits: 2});
                }
            });
        } else { window.location.href = "login.html"; }
    });

    // --- Binance WebSocket ---
    let ws;
    window.setSymbol = (symbol, el) => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        if (ws) ws.close();
        ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@kline_1s`);
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            const price = parseFloat(data.k.c);
            lineSeries.update({ time: data.k.t / 1000, value: price });
            document.getElementById('livePriceHeader').textContent = price.toLocaleString();
            document.getElementById('livePriceHeader').style.color = data.k.c >= data.k.o ? 'var(--up)' : 'var(--down)';
        };
    };
    setSymbol('BTCUSDT', document.querySelector('.tab'));

    // --- Trade Execution ---
    window.trade = async (type) => {
        const amount = parseFloat(document.getElementById('amountInput').value);
        if (amount > currentBalance) {
            alert("Insufficient Balance!");
            return;
        }
        if (amount <= 0) return;

        // خصم الرصيد من Firebase
        try {
            const userRef = doc(db, "users", userUID);
            await updateDoc(userRef, { balance: increment(-amount) });
            alert(`Order Placed: ${type}\nAmount: ${amount} USDT\nStatus: Pending Result...`);
            // هنا يمكنك إضافة منطق حساب الربح بعد فترة زمنية كما في IQ Option
        } catch (e) { console.error(e); }
    };

    window.addEventListener('resize', () => {
        chart.applyOptions({ width: document.getElementById('chart-box').offsetWidth });
    });
</script>
</body>
</html>
