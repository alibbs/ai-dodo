<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AMANA GLOBAL | Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

<style>
:root{
--bg:#060914;
--text:#ffffff;
--muted:#8b8da3;
--brand1:#a100ff;
--brand2:#ff00b8;
--glass:rgba(255,255,255,.03);
--border:rgba(255,255,255,.08);
--radius:24px;
--accent:#00f2ff;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
margin:0;
font-family: 'Inter', system-ui, -apple-system;
background: var(--bg);
background: radial-gradient(circle at top right, #1a0b2e 0%, #060914 100%);
color:var(--text);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.wrap{width:100%;max-width:400px; animation: fadeIn 0.8s ease-out;}
@keyframes fadeIn { from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }

.card{
background:var(--glass);
backdrop-filter:blur(30px);
border:1px solid var(--border);
border-radius:var(--radius);
padding:40px 25px;
text-align:center;
box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
position: relative;
overflow: hidden;
}

.logo{
font-size:32px;
font-weight:900;
margin-bottom:8px;
background:linear-gradient(135deg, var(--accent), var(--brand2));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
letter-spacing: -1.5px;
text-transform: uppercase;
}

h1{margin:0 0 10px; font-size:24px; font-weight:800; letter-spacing:-0.5px;}
.sub{margin:0 0 35px; color:var(--muted); font-size:13px; line-height:1.6; padding: 0 10px;}

.form-group{text-align:left; margin-bottom:20px; position:relative;}
label{
display:block;
font-weight:600;
font-size:11px;
margin-bottom:8px;
color:var(--muted);
text-transform: uppercase;
letter-spacing: 1.2px;
}

.field-wrapper { position: relative; }
.field-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #444; font-size: 16px; transition: 0.3s; }

.field{
width:100%;
padding:15px 15px 15px 45px;
border-radius:16px;
border:1px solid var(--border);
background:rgba(0,0,0,.4);
color:var(--text);
font-size:15px;
transition: 0.3s;
}
.field:focus{
outline:none;
border-color:var(--brand2);
background:rgba(255,0,184,0.05);
box-shadow:0 0 20px rgba(255,0,184,.15);
}
.field:focus + i { color: var(--brand2); transform: translateY(-50%) scale(1.1); }

.btn{
width:100%;
padding:18px;
border-radius:16px;
font-weight:900;
font-size:16px;
cursor:pointer;
border:none;
background: linear-gradient(135deg, var(--brand1), var(--brand2));
color:#fff;
margin-top:10px;
transition: 0.4s;
text-transform: uppercase;
letter-spacing: 2px;
box-shadow: 0 8px 25px rgba(255, 0, 184, 0.3);
display: flex;
align-items: center;
justify-content: center;
gap: 10px;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255, 0, 184, 0.5); }
.btn:disabled { opacity: 0.5; filter: grayscale(1); cursor: not-allowed; }

.create-acc-wrap {
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
}
.create-acc-wrap p { font-size: 13px; color: var(--muted); margin-bottom: 15px; }
.btn-outline {
    display: block;
    width: 100%;
    padding: 15px;
    border-radius: 16px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
    font-weight: 800;
    transition: 0.3s;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.btn-outline:hover { background: rgba(0, 242, 255, 0.1); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }

.msg{
margin-top:20px;
padding:14px;
border-radius:14px;
display:none;
font-size:13px;
font-weight: 600;
animation: slideUp 0.3s ease;
}
@keyframes slideUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.msg.error{background:rgba(255,0,80,.1); color:#ff4d8d; border: 1px solid rgba(255,0,80,0.2);}
.msg.success{background:rgba(0,255,184,.1); color:#00ffb8; border: 1px solid rgba(0,255,184,0.2);}

.footer-note{ margin-top:30px; font-size:10px; color:#444; letter-spacing: 1px; text-transform: uppercase; }
</style>
</head>
<body>

<div class="wrap">
    <div class="card">
        <div class="logo">AMANA</div>
        <h1>Digital Hub</h1>
        <p class="sub">Experience the next generation of <b>AI Arbitrage</b> and <b>Elite Crypto Gaming</b>.</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <div class="field-wrapper">
                    <input id="email" class="field" type="email" placeholder="name@email.com" required>
                    <i class="fa-solid fa-envelope"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Security Password</label>
                <div class="field-wrapper">
                    <input id="password" class="field" type="password" placeholder="••••••••" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>

            <button class="btn" type="submit" id="submitBtn">
                <span id="btnText">LOGIN</span>
            </button>
            <div id="msg" class="msg"></div>
        </form>

        <div class="create-acc-wrap">
            <p>New to our ecosystem?</p>
            <a href="create-account.html" class="btn-outline">CREATE ACCOUNT</a>
        </div>

        <div class="footer-note">
            &copy; 2026 AMANA GLOBAL ELITE SYSTEM
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
  authDomain: "ai-dodo.firebaseapp.com",
  projectId: "ai-dodo",
  storageBucket: "ai-dodo.firebasestorage.app",
  messagingSenderId: "261622335803",
  appId: "1:261622335803:web:0b066791230535e7d5cf1e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");
const submitBtn = document.getElementById("submitBtn");
const btnText = document.getElementById("btnText");

function showMsg(text, type) {
    msg.style.display = "block";
    msg.className = "msg " + type;
    msg.textContent = text;
}

// الفحص الذكي: لو المستخدم مسجل دخول، حوله فوراً دون انتظار
onAuthStateChanged(auth, (user) => {
    if (user) { 
        window.location.replace("home.html"); 
    }
});

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> AUTHENTICATING...';

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        await signInWithEmailAndPassword(auth, email, password);
        showMsg("Identity Verified. Entering Hub...", "success");
        // التحويل سيتم تلقائياً عبر onAuthStateChanged بالأعلى
    } catch (error) {
        submitBtn.disabled = false;
        btnText.textContent = "LOGIN";
        showMsg("Access Denied: Invalid credentials.", "error");
    }
});
</script>

</body>
</html>
