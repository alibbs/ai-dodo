<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>AMANA GLOBAL | Create Account</title>

<style>
:root{
  --bg:#0b0f1f;
  --text:#ffffff;
  --muted:#b8b9d9;
  --brand1:#a100ff;
  --brand2:#ff00b8;
  --glass: rgba(255,255,255,.06);
  --border: rgba(255,255,255,.08);
  --radius:16px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family: system-ui, -apple-system, Tahoma, Arial;
  background: linear-gradient(135deg,#0b0f1f,#1c0833);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

/* Container */
.container{
  width:100%;
  max-width:420px;
}

/* Header */
.header{
  text-align:center;
  margin-bottom:20px;
}

.brand{
  font-size:22px;
  font-weight:900;
  background:linear-gradient(135deg,var(--brand1),var(--brand2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* Card */
.card{
  background:var(--glass);
  backdrop-filter:blur(18px);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px;
}

/* Form */
label{
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
  display:block;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:16px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(0,0,0,.4);
  color:#fff;
  font-size:15px;
}

input:focus{
  border-color:var(--brand2);
  outline:none;
  box-shadow:0 0 0 3px rgba(255,0,184,.2);
}

/* Button */
button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  background:linear-gradient(135deg,var(--brand1),var(--brand2));
  color:#fff;
  transition:.3s;
}

button:active{
  transform:scale(.98);
}

/* Message */
.msg{
  margin-top:15px;
  padding:12px;
  border-radius:12px;
  font-size:14px;
  display:none;
}

.success{background:rgba(0,255,150,.1);}
.error{background:rgba(255,0,80,.1);}

/* Desktop enhancement */
@media(min-width:768px){
  body{
    background: linear-gradient(-45deg,#0b0f1f,#140b2d,#1c0833,#120822);
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
  }

  @keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  .container{
    max-width:480px;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="brand">AMANA GLOBAL</div>
  <div style="color:var(--muted);font-size:13px;margin-top:4px;">
    Create Your Secure Account
  </div>
</div>

<div class="card">
<form id="createForm">

<label>Username</label>
<input id="username" required minlength="3" placeholder="Enter username" />

<label>Email</label>
<input type="email" id="email" required placeholder="you@example.com" />

<label>Password</label>
<input type="password" id="password" required minlength="8" placeholder="Minimum 8 characters" />

<label>Location</label>
<input id="location" required placeholder="City, Country" />

<button type="submit">Create Account</button>

<div id="msg" class="msg"></div>

</form>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form=document.getElementById("createForm");
const msg=document.getElementById("msg");

function show(text,type){
  msg.style.display="block";
  msg.className="msg "+type;
  msg.textContent=text;
}

form.addEventListener("submit",async e=>{
e.preventDefault();

try{
const user=await createUserWithEmailAndPassword(auth,email.value,password.value);
await updateProfile(user.user,{displayName:username.value});
await setDoc(doc(db,"users",user.user.uid),{
username:username.value,
email:email.value,
location:location.value,
createdAt:serverTimestamp()
});
show("Account created successfully ✅","success");
setTimeout(()=>window.location="profile.html",800);
}catch(err){
show("Error: "+err.message,"error");
}
});
</script>

</body>
</html>
