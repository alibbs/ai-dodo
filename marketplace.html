<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>AMANA Market | Digital Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --card: #11141d; --border: rgba(255,255,255,0.1);
            --text-gray: #8e8e93;
        }

        body {
            margin: 0; padding: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff; overflow-x: hidden;
        }

        /* Header & Cart Icon */
        .store-header {
            padding: 20px; background: linear-gradient(to bottom, #11141d, var(--bg));
            border-bottom: 1px solid var(--border); text-align: center; position: relative;
        }
        .cart-trigger {
            position: absolute; right: 20px; top: 25px; font-size: 20px; color: var(--accent);
        }
        .cart-count {
            position: absolute; top: -8px; right: -10px; background: var(--brand);
            font-size: 10px; padding: 2px 6px; border-radius: 50%;
        }

        .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; padding-bottom: 100px; }
        .item-card { background: var(--card); border-radius: 18px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }

        .item-img { width: 100%; height: 110px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; }
        .item-img img { max-width: 90%; max-height: 90%; object-fit: contain; }

        .item-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
        .item-name { font-size: 13px; font-weight: 800; margin-bottom: 8px; color: #fff; height: 35px; overflow: hidden; }

        .variant-select {
            width: 100%; background: #060914; color: #fff; border: 1px solid var(--border);
            padding: 8px; border-radius: 8px; font-size: 11px; margin-bottom: 10px;
        }

        .price-now { font-size: 16px; font-weight: 900; color: var(--accent); margin-bottom: 8px; display: block; }

        .add-btn { 
            width: 100%; background: var(--brand); color: #fff; border: none; padding: 10px; 
            border-radius: 10px; font-size: 11px; font-weight: 800; cursor: pointer;
        }

        /* Cart Overlay */
        .cart-overlay {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100%;
            background: var(--bg); z-index: 1000; transition: 0.3s; padding: 20px; box-sizing: border-box;
        }
        .cart-overlay.active { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .cart-items { max-height: 60vh; overflow-y: auto; }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .checkout-footer { position: absolute; bottom: 20px; left: 20px; right: 20px; }
        .pay-btn { width: 100%; background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: 900; }
    </style>
</head>
<body>

    <header class="store-header">
        <h1>AMANA <span>MARKET</span></h1>
        <p>Auto-Delivery via Email</p>
        <div class="cart-trigger" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart-count" id="cartCount">0</span>
        </div>
    </header>

    <div class="market-grid" id="marketGrid"></div>

    <div class="cart-overlay" id="cartOverlay">
        <div class="cart-header">
            <h2>Your Wishlist</h2>
            <i class="fa-solid fa-xmark" style="font-size: 24px;" onclick="toggleCart()"></i>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="checkout-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <span>Total Amount:</span>
                <span id="totalPrice" style="color: var(--accent); font-weight: 900;">$0.00</span>
            </div>
            <button class="pay-btn" onclick="processCheckout()">PAY & SEND TO GMAIL</button>
        </div>
    </div>

    <script>
        const products = [
            { 
                id: 1, name: "Alfa Official Recharge", img: "https://upload.wikimedia.org/wikipedia/commons/4/4a/Alfa_Logo.png", 
                variants: [ 
                    {n: "$3.64 (30 Days)", p: 4.00}, {n: "$9.09 (30 Days)", p: 10.10}, 
                    {n: "$17.18 (30 Days)", p: 18.10}, {n: "$22.73 (30 Days)", p: 24.50},
                    {n: "$45.45 (90 Days)", p: 47.50}, {n: "$68.18 (180 Days)", p: 71.00}
                ]
            },
            { 
                id: 2, name: "Touch Official Recharge", img: "https://mir-s3-cdn-cf.behance.net/projects/404/6e991533355325.Y3JvcCw4OTgsNzAzLDAsMA.png", 
                variants: [ 
                    {n: "$3.64 (30 Days)", p: 4.00}, {n: "$9.09 (30 Days)", p: 10.10}, 
                    {n: "$17.18 (30 Days)", p: 18.10}, {n: "$22.73 (30 Days)", p: 24.50},
                    {n: "$45.45 (90 Days)", p: 47.50}, {n: "$68.18 (360 Days)", p: 71.00}
                ]
            },
            { 
                id: 3, name: "PUBG Mobile UC", img: "https://upload.wikimedia.org/wikipedia/en/3/3b/Pubg_mobile_logo.png", 
                variants: [ 
                    {n: "60 UC", p: 1.00}, {n: "325 UC", p: 5.50}, {n: "660 UC", p: 10.50}, 
                    {n: "1800 UC", p: 26.00}, {n: "3850 UC", p: 52.00}, {n: "8100 UC", p: 102.00}
                ]
            },
            { 
                id: 4, name: "iTunes Card (US Store)", img: "https://upload.wikimedia.org/wikipedia/commons/d/df/ITunes_logo.svg", 
                variants: [ {n: "$5 Card", p: 5.50}, {n: "$10 Card", p: 11.00}, {n: "$25 Card", p: 26.50}, {n: "$50 Card", p: 52.00} ]
            },
            { 
                id: 5, name: "Google Play (US)", img: "https://upload.wikimedia.org/wikipedia/commons/7/7a/Google_Play_2022_logo.svg", 
                variants: [ {n: "$5 Card", p: 5.50}, {n: "$10 Card", p: 11.00}, {n: "$25 Card", p: 26.50}, {n: "$50 Card", p: 52.00} ]
            }
        ];

        let cart = [];

        function loadMarketplace() {
            const grid = document.getElementById('marketGrid');
            grid.innerHTML = products.map(item => `
                <div class="item-card">
                    <div class="item-img"><img src="${item.img}"></div>
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <select class="variant-select" id="v-${item.id}" onchange="updatePriceDisplay(${item.id})">
                            ${item.variants.map(v => `<option value="${v.p}">${v.n}</option>`).join('')}
                        </select>
                        <span class="price-now" id="p-${item.id}">$${(item.variants[0].p + 1).toFixed(2)}</span>
                        <button class="add-btn" onclick="addToCart(${item.id})">ADD TO WISHLIST</button>
                    </div>
                </div>
            `).join('');
        }

        function updatePriceDisplay(id) {
            const p = parseFloat(document.getElementById(`v-${id}`).value) + 1;
            document.getElementById(`p-${id}`).innerText = `$${p.toFixed(2)}`;
        }

        function addToCart(id) {
            const product = products.find(x => x.id === id);
            const select = document.getElementById(`v-${id}`);
            const variantName = select.options[select.selectedIndex].text;
            const price = parseFloat(select.value) + 1;

            cart.push({ name: product.name, variant: variantName, price: price });
            updateCartUI();
        }

        function updateCartUI() {
            document.getElementById('cartCount').innerText = cart.length;
            const itemsCont = document.getElementById('cartItems');
            let total = 0;
            itemsCont.innerHTML = cart.map((item, index) => {
                total += item.price;
                return `<div class="cart-item">
                    <span>${item.name} (${item.variant})</span>
                    <b>$${item.price.toFixed(2)}</b>
                </div>`;
            }).join('');
            document.getElementById('totalPrice').innerText = `$${total.toFixed(2)}`;
        }

        function toggleCart() {
            document.getElementById('cartOverlay').classList.toggle('active');
        }

        function processCheckout() {
            if(cart.length === 0) return alert("Wishlist is empty!");
            
            // هنا السيستم بيعمل Checkout وبيرسل للداتابيز
            alert("Payment Successful!\nThe codes have been generated and sent to your registered Gmail.");
            cart = [];
            updateCartUI();
            toggleCart();
        }

        loadMarketplace();
    </script>
</body>
</html>
