<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>AMANA CRASH | ULTIMATE SYNC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #04060b;
            --panel: #0f121d;
            --brand: #ff00b8;
            --up: #00e701;
            --down: #ff3b3b;
            --border: #222635;
            --input-bg: #1a1d29;
            --usdt: #26a17b;
        }

        /* قفل الشاشة ومنع الزوم */
        * { touch-action: manipulation; -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; position: fixed;
            font-family: 'Inter', sans-serif; background: var(--bg); color: #fff;
        }

        body { display: flex; flex-direction: column; }

        /* Header */
        header { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .balance-tag {
            background: var(--panel); border: 1px solid var(--border);
            padding: 8px 14px; border-radius: 8px; font-weight: 800; 
            display: flex; align-items: center; gap: 8px;
        }

        /* Game Area (Expanded) */
        .game-area {
            flex: 1.8; position: relative; background: radial-gradient(circle at center, #111524 0%, #04060b 100%);
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .rocket-container { position: absolute; bottom: 15%; left: 10%; z-index: 5; transition: 0.1s linear; display: none; }
        #rocket { font-size: 50px; transform: rotate(-45deg); filter: drop-shadow(0 0 15px var(--brand)); transition: color 0.3s, filter 0.3s; }
        
        .multiplier-val { font-size: 80px; font-weight: 900; z-index: 10; font-variant-numeric: tabular-nums; }
        .waiting-status { position: absolute; top: 15%; font-size: 12px; font-weight: 800; color: var(--brand); letter-spacing: 2px; }

        /* Stake Style Dashboard */
        .dashboard {
            background: var(--panel); border-top: 2px solid var(--border);
            padding: 15px 20px 35px 20px; display: flex; flex-direction: column; gap: 10px;
        }

        .profit-label { text-align: center; height: 20px; color: var(--up); font-weight: 800; font-size: 15px; }

        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .label-row { display: flex; justify-content: space-between; font-size: 11px; color: #55607b; font-weight: 800; text-transform: uppercase; }

        .input-wrapper {
            background: var(--input-bg); border: 2px solid var(--border);
            border-radius: 6px; display: flex; align-items: center; padding-right: 4px;
        }
        .input-wrapper input { flex: 1; background: transparent; border: none; color: #fff; padding: 12px; font-size: 16px; font-weight: 700; }

        .quick-btns { display: flex; gap: 2px; }
        .quick-btns button { background: #2f3749; border: none; color: #fff; padding: 8px 10px; font-size: 11px; font-weight: 800; border-radius: 4px; }

        .main-btn {
            width: 100%; padding: 18px; border-radius: 6px; border: none;
            font-size: 18px; font-weight: 900; text-transform: uppercase; transition: 0.2s;
        }
        .btn-bet { background: var(--brand); color: #fff; }
        .btn-cashout { background: var(--up) !important; color: #000 !important; box-shadow: 0 0 20px rgba(0, 231, 1, 0.4); }
        .btn-waiting { background: #242938; color: #55607b; }

    </style>
</head>
<body>

    <header>
        <a href="game.html" style="color:#fff;"><i class="fa-solid fa-chevron-left"></i></a>
        <div class="balance-tag">
            <i class="fa-solid fa-circle-dollar-to-slot" style="color:var(--usdt)"></i>
            <span id="userBalance">0.00</span>
        </div>
        <div style="width:20px"></div>
    </header>

    <div class="game-area">
        <div id="waitingMsg" class="waiting-status"></div>
        <div class="rocket-container" id="rocketBox">
            <i id="rocket" class="fa-solid fa-rocket"></i>
        </div>
        <div id="multiplier" class="multiplier-val">1.00x</div>
    </div>

    <div class="dashboard">
        <div class="profit-label" id="profitLabel"></div>

        <div class="control-group">
            <div class="label-row"><span>Bet Amount</span><span>USDT</span></div>
            <div class="input-wrapper">
                <input type="number" id="betAmount" value="10.00">
                <div class="quick-btns">
                    <button onclick="mult(0.5)">½</button>
                    <button onclick="mult(2)">2×</button>
                </div>
            </div>
        </div>

        <div class="control-group">
            <div class="label-row"><span>Auto Cashout</span></div>
            <div class="input-wrapper">
                <input type="number" id="autoCash" value="2.00" step="0.1">
            </div>
        </div>

        <button id="actionBtn" class="main-btn btn-bet" onclick="handleAction()">Place Bet</button>
    </div>

<script>
    let balance = parseFloat(localStorage.getItem('balance')) || 2840.15;
    const balanceEl = document.getElementById('userBalance');
    const multiText = document.getElementById('multiplier');
    const rocket = document.getElementById('rocket');
    const rocketBox = document.getElementById('rocketBox');
    const actionBtn = document.getElementById('actionBtn');
    const waitingMsg = document.getElementById('waitingMsg');
    const profitLabel = document.getElementById('profitLabel');

    function sync() { balanceEl.textContent = balance.toLocaleString(undefined, {minimumFractionDigits: 2}); localStorage.setItem('balance', balance); }
    sync();

    // Multiplayer Global Sync Settings
    const ROUND_TIME = 20000; 
    const WAIT_TIME = 5000;
    let hasBet = false, cashed = false, currentBet = 0, state = "IDLE";

    function update() {
        const now = Date.now();
        const cycle = now % ROUND_TIME;

        if (cycle < WAIT_TIME) {
            // --- WAIT PHASE ---
            state = "IDLE";
            const remaining = Math.ceil((WAIT_TIME - cycle) / 1000);
            waitingMsg.textContent = `NEXT ROUND IN ${remaining}S`;
            multiText.textContent = "1.00x";
            multiText.style.color = "#fff";
            rocketBox.style.display = "none";
            rocket.style.color = "var(--brand)"; 
            rocket.style.filter = "drop-shadow(0 0 15px var(--brand))";
            
            if (!hasBet) {
                actionBtn.className = "main-btn btn-bet";
                actionBtn.textContent = "Place Bet";
            } else {
                actionBtn.className = "main-btn btn-waiting";
                actionBtn.textContent = "Bet Placed";
            }
        } else {
            // --- FLY PHASE ---
            state = "RUNNING";
            waitingMsg.textContent = "";
            rocketBox.style.display = "block";
            
            const flightTime = (cycle - WAIT_TIME) / 1000;
            const currentMulti = Math.pow(Math.E, 0.08 * flightTime);
            
            // Sync Crash Point
            const roundId = Math.floor(now / ROUND_TIME);
            const crashAt = getCrashPoint(roundId);

            if (currentMulti >= crashAt) {
                // CRASHED
                state = "CRASHED";
                multiText.textContent = crashAt.toFixed(2) + "x";
                multiText.style.color = "var(--down)";
                rocket.style.color = "var(--down)";
                rocket.style.filter = "drop-shadow(0 0 15px var(--down))";
                actionBtn.className = "main-btn btn-waiting";
                actionBtn.textContent = "Crashed";
                profitLabel.textContent = "";
                hasBet = false; cashed = false;
            } else {
                // FLYING
                multiText.textContent = currentMulti.toFixed(2) + "x";
                rocket.style.color = "var(--up)";
                rocket.style.filter = "drop-shadow(0 0 15px var(--up))";
                
                rocketBox.style.left = Math.min(10 + flightTime * 6, 80) + "%";
                rocketBox.style.bottom = Math.min(15 + Math.pow(flightTime, 1.3) * 5, 75) + "%";

                if (hasBet && !cashed) {
                    actionBtn.className = "main-btn btn-cashout";
                    actionBtn.textContent = "Cash Out";
                    profitLabel.textContent = "+" + (currentBet * currentMulti).toFixed(2) + " USDT";
                    
                    // Auto Cashout Logic
                    let auto = parseFloat(document.getElementById('autoCash').value);
                    if(auto > 1.01 && currentMulti >= auto) doCashOut(currentMulti);
                }
            }
        }
        requestAnimationFrame(update);
    }

    function getCrashPoint(seed) {
        const x = Math.sin(seed) * 10000;
        const rand = x - Math.floor(x);
        return Math.max(1.00, 0.98 / (1 - rand)); // نفس نظام ستيك
    }

    function handleAction() {
        const cycle = Date.now() % ROUND_TIME;
        if (cycle < WAIT_TIME && !hasBet) {
            let amt = parseFloat(document.getElementById('betAmount').value);
            if (amt > balance || amt <= 0) return;
            balance -= amt;
            currentBet = amt;
            hasBet = true;
            sync();
        } else if (state === "RUNNING" && hasBet && !cashed) {
            const flightTime = (cycle - WAIT_TIME) / 1000;
            const currentMulti = Math.pow(Math.E, 0.08 * flightTime);
            doCashOut(currentMulti);
        }
    }

    function doCashOut(m) {
        if(cashed) return;
        cashed = true;
        let win = currentBet * m;
        balance += win;
        sync();
        actionBtn.className = "main-btn btn-waiting";
        actionBtn.textContent = "Won +" + win.toFixed(2);
        profitLabel.textContent = "CASHED OUT!";
        // عند الربح تضوي نيون براند
        rocket.style.color = "var(--brand)";
        rocket.style.filter = "drop-shadow(0 0 20px var(--brand))";
    }

    function mult(v) { document.getElementById('betAmount').value = (document.getElementById('betAmount').value * v).toFixed(2); }

    update();
</script>
</body>
</html>
