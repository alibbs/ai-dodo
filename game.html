<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA ELITE | Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914;
            --brand: #ff00b8;
            --accent: #00f2ff;
            --up: #00ff96;
            --gold: #ffcc00;
            --card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1); /* زدنا الوضوح شوي ليطابق صفحة البوت */
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            padding-bottom: 100px; /* تناسب مع حجم البار الجديد */
            background: radial-gradient(circle at top right, #1a0b2e 0%, #060914 100%);
            min-height: 100vh;
        }

        .container { padding: 20px; max-width: 450px; margin: auto; }

        /* --- Header --- */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .bal-display { 
            background: rgba(0, 255, 150, 0.1); 
            border: 1px solid var(--up); 
            padding: 8px 15px; border-radius: 20px; 
            color: var(--up); font-weight: 800; font-size: 14px;
        }

        /* --- Banner --- */
        .casino-banner {
            width: 100%; height: 120px; background: linear-gradient(135deg, #6200ff, #ff00b8);
            border-radius: 25px; margin-bottom: 30px; display: flex; align-items: center;
            padding: 20px; box-sizing: border-box; position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 0, 184, 0.3);
        }
        .casino-banner h2 { font-size: 20px; margin: 0; font-weight: 900; z-index: 1; line-height: 1.2; }

        /* --- Games Grid --- */
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }

        .game-item {
            background: var(--card); border: 1px solid var(--border); border-radius: 22px;
            padding: 25px 15px; text-align: center; transition: 0.3s; cursor: pointer;
            position: relative; backdrop-filter: blur(10px);
        }
        .game-item:active { transform: scale(0.95); background: rgba(255,255,255,0.08); }
        .game-item i { font-size: 38px; margin-bottom: 12px; display: block; }
        .game-item b { display: block; font-size: 15px; margin-bottom: 4px; }
        .game-item span { font-size: 9px; color: #777; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

        .badge { position: absolute; top: 12px; left: 12px; font-size: 8px; font-weight: 900; background: var(--brand); color: #fff; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }

        /* Icon Colors */
        .c-crash { color: #ff3b3b; } .c-dice { color: var(--up); }
        .c-wheel { color: #a100ff; } .c-ballon { color: #00f2ff; }
        .c-plinko { color: #ffcc00; } .c-flip { color: #00ff88; }

        /* --- Updated Bottom Navigation (Same as AI Bot) --- */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 80px; 
            background: rgba(6, 9, 20, 0.98); border-top: 1px solid var(--border); 
            display: flex; justify-content: space-around; align-items: center; 
            z-index: 1000; backdrop-filter: blur(10px); 
        }
        .nav-item { text-decoration: none; color: #555; text-align: center; flex: 1; font-size: 10px; transition: 0.3s; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--brand); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="font-size: 22px; font-weight: 900; margin: 0; letter-spacing: -1px;">AMANA <span style="color:var(--brand)">ELITE</span></h1>
        <div class="bal-display" id="hubBal"><i class="fa-solid fa-wallet"></i> 1,000.00</div>
    </div>

    <div class="casino-banner">
        <h2>ALL SYSTEMS ONLINE<br><span style="font-size: 12px; opacity: 0.8; font-weight: 400;">Pick your game & dominate</span></h2>
        <i class="fa-solid fa-fire" style="position:absolute; right:10px; font-size:80px; opacity:0.15; transform: rotate(10deg);"></i>
    </div>

    <div class="games-grid">
        <div class="game-item" onclick="location.href='crash.html'">
            <div class="badge">Hot</div>
            <i class="fa-solid fa-rocket c-crash"></i>
            <b>Crash</b>
            <span>Multiplier</span>
        </div>

        <div class="game-item" onclick="location.href='dice.html'">
            <i class="fa-solid fa-dice c-dice"></i>
            <b>Dice Pro</b>
            <span>Over / Under</span>
        </div>

        <div class="game-item" onclick="location.href='ballon.html'">
            <div class="badge" style="background:var(--accent); color:#000">New</div>
            <i class="fa-solid fa-circle-dot c-ballon"></i>
            <b>Balloon</b>
            <span>Hold & Pump</span>
        </div>

        <div class="game-item" onclick="location.href='wheel.html'">
            <i class="fa-solid fa-dharmachakra c-wheel"></i>
            <b>Wheel</b>
            <span>Spin Fortune</span>
        </div>

        <div class="game-item" onclick="location.href='plinko.html'">
            <i class="fa-solid fa-braille c-plinko"></i>
            <b>Plinko</b>
            <span>Lucky Drop</span>
        </div>

        <div class="game-item" onclick="location.href='flip.html'">
            <i class="fa-solid fa-coins c-flip"></i>
            <b>Coin Flip</b>
            <span>50/50 Luck</span>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <a href="home.html" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="game.html" class="nav-item"><i class="fa-solid fa-gamepad"></i><span>Game</span></a>
    <a href="bot-trade.html" class="nav-item"><i class="fa-solid fa-robot"></i><span>Bot</span></a>
    <a href="overview.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>Overview</span></a>
    <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></a>
</nav>

<script>
    function syncBalance() {
        let savedBal = localStorage.getItem('casino_balance');
        if (!savedBal) {
            localStorage.setItem('casino_balance', '1000.00');
            savedBal = '1000.00';
        }
        document.getElementById('hubBal').innerHTML = `<i class="fa-solid fa-wallet"></i> ${parseFloat(savedBal).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
    }
    
    syncBalance();
    setInterval(syncBalance, 1000);
</script>

</body>
</html>
