<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA ELITE+ | Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --card-bg: rgba(255, 255, 255, 0.04); --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff; --muted: #888;
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: var(--text);
            background: radial-gradient(circle at top right, #1a0b2e, #060914);
            min-height: 100vh;
        }

        .container { padding: 20px; max-width: 450px; margin: auto; }

        /* --- App Branding Header --- */
        .app-header {
            text-align: center;
            padding: 40px 0 30px;
        }
        .app-header h1 {
            font-size: 32px;
            font-weight: 900;
            margin: 0;
            letter-spacing: -1.5px;
            background: linear-gradient(to right, #fff, var(--brand));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-header span {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            display: block;
            margin-top: 5px;
        }

        /* --- Options Grid --- */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 10px;
        }

        .opt-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer; /* للتأكد أن اليد تظهر عند التأشير */
        }

        .opt-card:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

        .opt-icon {
            width: 60px;
            height: 60px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 5px;
        }

        /* Colors for icons */
        .bg-manual { background: rgba(0, 242, 255, 0.1); color: var(--accent); border: 1px solid rgba(0, 242, 255, 0.2); }
        .bg-game { background: rgba(255, 0, 184, 0.1); color: var(--brand); border: 1px solid rgba(255, 0, 184, 0.2); }
        .bg-market { background: rgba(255, 215, 0, 0.1); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.2); }
        .bg-box { background: rgba(161, 0, 255, 0.1); color: #a100ff; border: 1px solid rgba(161, 0, 255, 0.2); }

        .opt-card b { font-size: 14px; font-weight: 800; display: block; }
