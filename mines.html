<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>A | ELITE MINES PREMIER</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --bg-dark: #0b0e18;
  --panel-bg: #1a1d29;
  --input-bg: #0d0f17;
  --brand-color: #ff00b8;
  --accent-blue: #00f2ff;
  --win-green: #00ffa3;
  --lose-red: #ff3b5c;
  --text-main: #94a3b8;
  --border-ui: rgba(255, 255, 255, 0.05);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; touch-action: manipulation; }

html, body { 
  height: 100%; width: 100%; margin: 0; padding: 0;
  background: var(--bg-dark); color: #fff; overflow-x: hidden;
  position: fixed;
}

body { display: flex; flex-direction: column; align-items: center; padding-top: 70px; }

/* Alert System */
#custom-alert {
  position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
  background: var(--lose-red); color: white; padding: 14px 28px;
  border-radius: 12px; font-weight: 800; z-index: 9999; font-size: 14px;
  box-shadow: 0 10px 40px rgba(255, 59, 92, 0.4);
  transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex; align-items: center; gap: 12px;
}
#custom-alert.show { top: 25px; }

/* Header */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(11, 14, 24, 0.95); border-bottom: 1px solid var(--border-ui);
  backdrop-filter: blur(10px); padding: 10px 20px;
  display: flex; justify-content: space-between; align-items: center;
}
.logo-a { 
  width: 42px; height: 42px; background: linear-gradient(135deg, var(--brand-color), #8b5cf6);
  border-radius: 12px; display: flex; align-items: center; justify-content: center; 
  font-size: 22px; font-weight: 900; color: white; text-decoration: none;
}
.user-balance { 
  background: rgba(255, 255, 255, 0.03); padding: 8px 16px; border-radius: 10px; 
  font-weight: 800; color: var(--win-green); border: 1px solid var(--border-ui);
}

/* Card & Status */
.card {
  width: 94%; max-width: 480px; background: var(--panel-bg);
  border-radius: 24px; border: 1px solid var(--border-ui);
  padding: 15px; margin-bottom: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.3);
}
.status-bar {
  text-align: center; font-weight: 800; font-size: 14px;
  padding: 10px; border-radius: 12px; margin-bottom: 15px;
  background: rgba(255,255,255,0.03); color: var(--text-main);
}
.status-win { color: var(--win-green); background: rgba(0, 255, 163, 0.05); }

/* Mines Grid */
.grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
}
.cell {
  aspect-ratio: 1; border-radius: 12px; background: #2a2e3f;
  cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center;
  transition: 0.2s; border: none; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
}
.cell:active { transform: scale(0.95); }
.cell.revealed { background: var(--input-bg); box-shadow: none; cursor: default; }

.icon { font-size: 24px; opacity: 0; transform: scale(0.5); transition: 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
.cell.revealed .icon { opacity: 1; transform: scale(1); }
.gem { color: var(--accent-blue); text-shadow: 0 0 15px var(--accent-blue); }
.mine { color: var(--lose-red); text-shadow: 0 0 15px var(--lose-red); }

/* Inputs */
.input-wrap {
  background: var(--input-bg); border-radius: 14px; border: 1px solid var(--border-ui);
  display: flex; align-items: center; padding: 5px; margin-bottom: 10px;
}
.input-wrap input {
  flex: 1; background: transparent; border: none; color: #fff;
  text-align: center; font-weight: 800; font-size: 16px; outline: none;
}
.btn-util {
  background: #2a2e3f; border: none; color: #fff; width: 44px; height: 44px;
  border-radius: 10px; font-weight: 800; cursor: pointer;
}
.btn-max { width: 60px; color: var(--brand-color); background: rgba(255, 0, 184, 0.1); }

.main-btn {
  width: 100%; padding: 20px; border: none; border-radius: 16px;
  font-size: 18px; font-weight: 900; cursor: pointer; text-transform: uppercase;
}
.btn-start { background: var(--win-green); color: #064e3b; }
.btn-cashout { background: #fff; color: #000; display: none; }
</style>
</head>

<body>

<div id="custom-alert">
  <i class="fa-solid fa-triangle-exclamation"></i>
  <span id="alert-msg">Insufficient Balance!</span>
</div>

<header>
  <a href="home.html" class="logo-a">A</a>
  <div id="balance-top" class="user-balance">$ 0.00</div>
</header>

<div class="card">
  <div id="status" class="status-bar">SET BET & MINES TO START</div>
  <div class="grid" id="grid"></div>
</div>

<div class="card" id="controls">
  <div class="input-wrap">
    <button class="btn-util" onclick="modBet(0.5)">½</button>
    <input type="number" id="bet-input" value="10.00" inputmode="decimal">
    <button class="btn-util" onclick="modBet(2)">2x</button>
    <button class="btn-util btn-max" onclick="setMax()">MAX</button>
  </div>
  
  <div class="input-wrap">
    <label style="padding-left:15px; font-size:12px; font-weight:800; color:var(--text-main)">MINES</label>
    <input type="number" id="mines-count" value="3" min="1" max="24">
  </div>

  <button id="btn-main" class="main-btn btn-start" onclick="handleAction()">Start Game</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA", authDomain: "ai-dodo.firebaseapp.com", projectId: "ai-dodo", storageBucket: "ai-dodo.firebasestorage.app", messagingSenderId: "261622335803", appId: "1:261622335803:web:0b066791230535e7d5cf1e" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);

let uID, balance = 0, isPlaying = false, revealedCount = 0, minesPositions = [];
const gridEl = document.getElementById('grid'), btnMain = document.getElementById('btn-main'), betInp = document.getElementById('bet-input');

function showAlert(msg) {
  const a = document.getElementById('custom-alert');
  document.getElementById('alert-msg').textContent = msg;
  a.classList.add('show');
  setTimeout(() => a.classList.remove('show'), 3000);
}

onAuthStateChanged(auth, user => {
  if(user) {
    uID = user.uid;
    onSnapshot(doc(db, "users", uID), s => {
      balance = s.data()?.balance || 0;
      document.getElementById('balance-top').textContent = "$" + balance.toLocaleString(undefined, {minimumFractionDigits: 2});
    });
  }
});

window.modBet = (m) => { if(!isPlaying) betInp.value = (parseFloat(betInp.value) * m).toFixed(2); };
window.setMax = () => { if(!isPlaying) betInp.value = balance.toFixed(2); };

function buildGrid() {
  gridEl.innerHTML = "";
  for(let i=0; i<25; i++) {
    const c = document.createElement('button');
    c.className = 'cell';
    c.innerHTML = '<i class="fa-solid fa-gem icon gem"></i>';
    c.onclick = () => reveal(i, c);
    gridEl.appendChild(c);
  }
}

function calculateMult() {
  const m = parseInt(document.getElementById('mines-count').value);
  let mult = 1;
  for(let i=0; i<revealedCount; i++) {
    mult *= (25 - i) / (25 - m - i);
  }
  return mult * 0.98; // House Edge
}

window.handleAction = async () => {
  if(!isPlaying) {
    const amt = parseFloat(betInp.value), mCount = parseInt(document.getElementById('mines-count').value);
    if(amt > balance || amt <= 0) return showAlert("Invalid Balance!");
    if(mCount < 1 || mCount > 24) return showAlert("Mines: 1-24");

    isPlaying = true; revealedCount = 0; minesPositions = [];
    while(minesPositions.length < mCount) {
      let r = Math.floor(Math.random() * 25);
      if(!minesPositions.includes(r)) minesPositions.push(r);
    }

    await updateDoc(doc(db, "users", uID), { balance: increment(-amt) });
    buildGrid();
    btnMain.textContent = "Cashout ($0.00)";
    btnMain.className = "main-btn btn-cashout";
    btnMain.style.display = "block";
    document.getElementById('status').textContent = "LUCK IS ON YOUR SIDE";
  } else {
    cashout();
  }
};

async function reveal(i, el) {
  if(!isPlaying || el.classList.contains('revealed')) return;
  el.classList.add('revealed');

  if(minesPositions.includes(i)) {
    el.innerHTML = '<i class="fa-solid fa-bomb icon mine"></i>';
    gameOver(false);
  } else {
    revealedCount++;
    const mult = calculateMult();
    const profit = parseFloat(betInp.value) * mult;
    btnMain.textContent = `Cashout ($${profit.toFixed(2)})`;
    document.getElementById('status').textContent = `MULTIPLIER: ${mult.toFixed(2)}x`;
  }
}

async function cashout() {
  if(revealedCount === 0) return;
  const win = parseFloat(betInp.value) * calculateMult();
  await updateDoc(doc(db, "users", uID), { balance: increment(win) });
  document.getElementById('status').textContent = `WON: $${win.toFixed(2)}`;
  document.getElementById('status').classList.add('status-win');
  gameOver(true);
}

function gameOver(win) {
  isPlaying = false;
  const cells = document.querySelectorAll('.cell');
  minesPositions.forEach(idx => {
    cells[idx].classList.add('revealed');
    cells[idx].innerHTML = '<i class="fa-solid fa-bomb icon mine"></i>';
  });
  
  btnMain.textContent = "Start Game";
  btnMain.className = "main-btn btn-start";
  if(!win) {
    document.getElementById('status').textContent = "BOOM! TRY AGAIN";
    document.getElementById('status').classList.remove('status-win');
  }
}

buildGrid();
</script>
</body>
</html>
