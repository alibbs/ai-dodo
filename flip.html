<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>AMANA ELITE | COIN FLIP PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@600;800;900&display=swap');

        :root {
            --bg: #02040a;
            --panel: #0d111c;
            --accent: #8b5cf6;
            --gold: #fbbf24;
            --up: #00e701;
            --down: #ff3b3b;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; position: fixed; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; }
        body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 20px); }

        /* Multiplier Top Bar */
        .multiplier-bar {
            height: 60px; background: rgba(0,0,0,0.5); display: flex; align-items: center; 
            justify-content: center; gap: 10px; border-bottom: 1px solid var(--border);
        }
        .m-chip { 
            padding: 5px 12px; border-radius: 8px; font-family: 'Orbitron'; font-size: 14px; 
            background: var(--panel); color: #64748b; border: 1px solid var(--border);
        }
        .m-chip.active { background: var(--accent); color: #fff; border-color: #fff; box-shadow: 0 0 15px var(--accent); }

        header { height: 60px; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .balance-box { 
            background: #000; padding: 8px 25px; border-radius: 50px; 
            border: 2px solid var(--accent); display: flex; align-items: center; gap: 10px;
        }

        .game-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        /* Profit Badge */
        #profitFloat {
            position: absolute; top: 20px; font-family: 'Orbitron'; font-weight: 900;
            color: var(--up); font-size: 24px; display: none; text-shadow: 0 0 10px var(--up);
        }

        .coin-container { width: 160px; height: 160px; perspective: 1000px; margin-bottom: 30px; }
        .coin {
            width: 100%; height: 100%; position: relative; transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .coin div {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            backface-visibility: hidden; display: flex; align-items: center; justify-content: center;
            font-size: 50px; border: 6px solid;
        }
        .heads { background: var(--panel); border-color: var(--accent); color: var(--accent); }
        .tails { background: var(--panel); border-color: var(--gold); color: var(--gold); transform: rotateY(180deg); }

        .controls { background: var(--panel); padding: 20px 20px 40px 20px; border-radius: 35px 35px 0 0; border-top: 1px solid var(--border); }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .pick-btn { 
            padding: 18px; border-radius: 15px; border: none; color: #fff; font-weight: 900; 
            font-size: 16px; cursor: pointer; transition: 0.2s;
        }
        .btn-h { background: var(--accent); box-shadow: 0 5px 0 #5b21b6; }
        .btn-t { background: var(--gold); color: #000; box-shadow: 0 5px 0 #b45309; }
        .btn-cash { 
            grid-column: span 2; background: var(--up); color: #000; display: none;
            padding: 20px; font-size: 1.2rem; box-shadow: 0 5px 0 #059669;
        }
        
        .bet-box { background: rgba(0,0,0,0.4); padding: 12px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 10px; }
        .bet-box label { font-size: 9px; color: #64748b; text-transform: uppercase; font-weight: 800; display: block; }
        .bet-box input { width: 100%; background: transparent; border: none; color: #fff; font-size: 20px; font-weight: 900; }

        .disabled { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

    <div class="multiplier-bar" id="mBar">
        <div class="m-chip">1.98x</div>
        <div class="m-chip">3.92x</div>
        <div class="m-chip">7.76x</div>
        <div class="m-chip">15.3x</div>
        <div class="m-chip">30.4x</div>
    </div>

    <header>
        <div class="balance-box">
            <i class="fa-solid fa-gem" style="color:var(--gold)"></i>
            <span id="balText">1000.00</span>
        </div>
    </header>

    <div class="game-area">
        <div id="profitFloat">0.00x</div>
        <div class="coin-container">
            <div id="coin" class="coin">
                <div class="heads"><i class="fa-solid fa-bolt"></i></div>
                <div class="tails"><i class="fa-solid fa-crown"></i></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="bet-box" id="betInputArea">
            <label>Bet Amount</label>
            <input type="number" id="betAmt" value="10.00">
        </div>

        <div class="btn-grid" id="gameBtns">
            <button class="pick-btn btn-h" onclick="play('H')">HEADS</button>
            <button class="pick-btn btn-t" onclick="play('T')">TAILS</button>
            <button class="pick-btn btn-cash" id="cashBtn" onclick="cashout()">CASHOUT</button>
        </div>
    </div>

<script>
    let balance = 1000.00;
    let gameActive = false;
    let currentBet = 0;
    let round = 0;
    const multipliers = [1.98, 3.92, 7.76, 15.36, 30.41, 60.21, 119.22];

    const coin = document.getElementById('coin');
    const balText = document.getElementById('balText');
    const cashBtn = document.getElementById('cashBtn');
    const profitFloat = document.getElementById('profitFloat');
    const betInputArea = document.getElementById('betInputArea');
    const mChips = document.querySelectorAll('.m-chip');

    function play(choice) {
        if (!gameActive) {
            const amt = parseFloat(document.getElementById('betAmt').value);
            if (amt > balance || amt <= 0) return;
            balance -= amt;
            currentBet = amt;
            gameActive = true;
            round = 0;
            updateUI();
        }

        // Rigged Logic: كلما زاد الراوند زادت نسبة الخسارة
        // الراوند الأول 50/50، بعد كذا النسبة تصير أصعب تدريجياً
        const winChance = round === 0 ? 0.48 : (0.45 - (round * 0.05)); 
        const win = Math.random() < winChance;
        const resultSide = win ? choice : (choice === 'H' ? 'T' : 'H');

        // Animation
        const isHeads = resultSide === 'H';
        const rotation = isHeads ? (round * 1440) : (round * 1440 + 180);
        coin.style.transform = `rotateY(${rotation + 720}deg)`;

        disableBtns(true);

        setTimeout(() => {
            if (win) {
                // تدرج في الربح
                round++;
                const currentMult = multipliers[round-1];
                profitFloat.innerText = currentMult + "x";
                profitFloat.style.display = "block";
                
                // تحديث شريط الضرب فوق
                updateMultiplierBar();

                cashBtn.style.display = "block";
                cashBtn.innerText = `CASHOUT ${(currentBet * currentMult).toFixed(2)}`;
                disableBtns(false);
            } else {
                // خسارة
                document.body.style.backgroundColor = "#450a0a";
                setTimeout(() => document.body.style.backgroundColor = "var(--bg)", 200);
                resetGame();
            }
        }, 600);
    }

    function cashout() {
        const winAmt = currentBet * multipliers[round-1];
        balance += winAmt;
        alert(`CONGRATS! You won ${winAmt.toFixed(2)} USDT`);
        resetGame();
    }

    function resetGame() {
        gameActive = false;
        currentBet = 0;
        round = 0;
        profitFloat.style.display = "none";
        cashBtn.style.display = "none";
        betInputArea.classList.remove('disabled');
        mChips.forEach(c => c.className = 'm-chip');
        updateUI();
        disableBtns(false);
    }

    function updateUI() {
        balText.innerText = balance.toFixed(2);
        if(gameActive) betInputArea.classList.add('disabled');
    }

    function updateMultiplierBar() {
        mChips.forEach((c, idx) => {
            c.className = (idx === round - 1) ? 'm-chip active' : 'm-chip';
        });
    }

    function disableBtns(status) {
        const btns = document.querySelectorAll('.pick-btn');
        btns.forEach(b => {
            if (status) b.classList.add('disabled');
            else b.classList.remove('disabled');
        });
    }
</script>
</body>
</html>
