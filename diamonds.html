<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AMANA ELITE | Diamonds</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #060914;
            --brand: #ff00b8;
            --accent: #00f2ff;
            --up: #00ff96;
            --card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            background: radial-gradient(circle at top right, #1a0b2e 0%, #060914 100%);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }

        .container { width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; }

        /* Header & Balance */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; width: 100%; }
        .bal-display { 
            background: rgba(0, 255, 150, 0.1); border: 1px solid var(--up); 
            padding: 8px 15px; border-radius: 20px; color: var(--up); 
            font-weight: 800; font-size: 14px;
        }

        /* Grid */
        .grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
            background: var(--card); padding: 15px; border-radius: 20px;
            border: 1px solid var(--border); margin-bottom: 20px;
        }

        .tile {
            aspect-ratio: 1; background: rgba(255,255,255,0.05); border-radius: 12px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 24px; transition: 0.2s; border: 1px solid var(--border);
        }
        .tile:active { transform: scale(0.9); }
        .tile.revealed { background: rgba(0,0,0,0.4); border: none; cursor: default; }
        .tile.bomb-hit { background: rgba(255, 0, 80, 0.2); border: 1px solid #ff0050; }
        .tile i { opacity: 0; transform: scale(0.5); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tile.revealed i { opacity: 1; transform: scale(1); }

        /* Controls */
        .controls {
            background: var(--card); padding: 20px; border-radius: 25px;
            border: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px;
        }
        .input-row { display: flex; gap: 10px; }
        .input-box { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 10px; color: #777; font-weight: 800; text-transform: uppercase; }
        input, select {
            background: rgba(0,0,0,0.3); border: 1px solid var(--border);
            padding: 12px; border-radius: 12px; color: #fff; font-weight: bold; outline: none;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--brand), #6200ff);
            border: none; padding: 16px; border-radius: 15px; color: #fff;
            font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        .btn-main:disabled { opacity: 0.3; cursor: not-allowed; }
        .cashout-btn { background: var(--up); color: #060914; display: none; }

        /* Stats */
        .stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; font-weight: bold; }
        
        .d-gem { color: var(--accent); text-shadow: 0 0 10px var(--accent); }
        .d-bomb { color: #ff0050; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0; font-size:18px;">DIAMONDS</h2>
        <div class="bal-display" id="userBalance"><i class="fa-solid fa-wallet"></i> 0.00</div>
    </div>

    <div class="stats">
        <span>Multiplier: <span id="multText" style="color:var(--accent)">1.00x</span></span>
        <span>Profit: <span id="profitText" style="color:var(--up)">$0.00</span></span>
    </div>

    <div class="grid" id="gameGrid"></div>

    <div class="controls">
        <div class="input-row">
            <div class="input-box">
                <label>Bet Amount</label>
                <input type="number" id="betAmount" value="10" min="1">
            </div>
            <div class="input-box">
                <label>Bombs</label>
                <select id="bombCount">
                    <option value="1">1</option>
                    <option value="3" selected>3</option>
                    <option value="5">5</option>
                    <option value="10">10</option>
                </select>
            </div>
        </div>
        <button class="btn-main" id="startBtn">PLACE BET</button>
        <button class="btn-main cashout-btn" id="cashoutBtn">CASHOUT</button>
    </div>
</div>

<audio id="sndGem" src="https://www.soundjay.com/buttons/sounds/button-37a.mp3"></audio>
<audio id="sndBomb" src="https://www.soundjay.com/free-music/sounds/fail-farewell-01.mp3"></audio>
<audio id="sndClick" src="https://www.soundjay.com/buttons/sounds/button-50.mp3"></audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
        authDomain: "ai-dodo.firebaseapp.com",
        projectId: "ai-dodo",
        storageBucket: "ai-dodo.firebasestorage.app",
        messagingSenderId: "261622335803",
        appId: "1:261622335803:web:0b066791230535e7d5cf1e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let userBalance = 0;
    let userId = null;
    let gameActive = false;
    let bombs = [];
    let revealedCount = 0;
    let currentMult = 1.00;

    const grid = document.getElementById('gameGrid');
    const startBtn = document.getElementById('startBtn');
    const cashoutBtn = document.getElementById('cashoutBtn');
    const balDisplay = document.getElementById('userBalance');

    // Load Sounds
    const sndGem = document.getElementById('sndGem'); sndGem.volume = 0.3;
    const sndBomb = document.getElementById('sndBomb'); sndBomb.volume = 0.2;
    const sndClick = document.getElementById('sndClick'); sndClick.volume = 0.2;

    onAuthStateChanged(auth, (user) => {
        if (user) {
            userId = user.uid;
            onSnapshot(doc(db, "users", userId), (snap) => {
                if (snap.exists()) {
                    userBalance = snap.data().balance || 0;
                    balDisplay.innerHTML = `<i class="fa-solid fa-wallet"></i> ${userBalance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                }
            });
        } else { window.location.href = "login.html"; }
    });

    function createBoard() {
        grid.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.onclick = () => revealTile(i);
            grid.appendChild(tile);
        }
    }

    async function initGame() {
        const bet = parseFloat(document.getElementById('betAmount').value);
        if (bet > userBalance) return alert("Insufficient Balance!");
        if (bet <= 0) return;

        sndClick.play();
        // خصم الرصيد فوراً من Firebase
        await updateDoc(doc(db, "users", userId), { balance: increment(-bet) });

        const bombNum = parseInt(document.getElementById('bombCount').value);
        bombs = [];
        while(bombs.length < bombNum) {
            let r = Math.floor(Math.random() * 25);
            if(!bombs.includes(r)) bombs.push(r);
        }

        gameActive = true;
        revealedCount = 0;
        currentMult = 1.00;
        updateStats();
        
        startBtn.disabled = true;
        cashoutBtn.style.display = 'block';
        createBoard();
    }

    async function revealTile(index) {
        if (!gameActive) return;
        const tile = grid.children[index];
        if (tile.classList.contains('revealed')) return;

        tile.classList.add('revealed');
        
        if (bombs.includes(index)) {
            sndBomb.play();
            tile.classList.add('bomb-hit');
            tile.innerHTML = '<i class="fa-solid fa-bomb d-bomb"></i>';
            endGame(false);
        } else {
            sndGem.currentTime = 0; sndGem.play();
            tile.innerHTML = '<i class="fa-solid fa-gem d-gem"></i>';
            revealedCount++;
            calculateMultiplier();
            updateStats();
        }
    }

    function calculateMultiplier() {
        const bombNum = parseInt(document.getElementById('bombCount').value);
        const total = 25;
        let m = 1;
        for(let i=0; i<revealedCount; i++) {
            m *= (total - i) / (total - bombNum - i);
        }
        currentMult = m * 0.98; 
    }

    function updateStats() {
        const bet = parseFloat(document.getElementById('betAmount').value);
        document.getElementById('multText').textContent = currentMult.toFixed(2) + 'x';
        document.getElementById('profitText').textContent = '$' + (bet * currentMult).toFixed(2);
    }

    async function endGame(isWin) {
        gameActive = false;
        startBtn.disabled = false;
        cashoutBtn.style.display = 'none';

        if (isWin) {
            const bet = parseFloat(document.getElementById('betAmount').value);
            const winAmount = bet * currentMult;
            await updateDoc(doc(db, "users", userId), { balance: increment(winAmount) });
        }

        // كشف القنابل
        bombs.forEach(i => {
            const t = grid.children[i];
            if(!t.classList.contains('revealed')) {
                t.classList.add('revealed');
                t.innerHTML = '<i class="fa-solid fa-bomb d-bomb" style="opacity:0.3"></i>';
            }
        });
    }

    startBtn.onclick = initGame;
    cashoutBtn.onclick = () => { if(gameActive) { sndGem.play(); endGame(true); } };

    createBoard();
</script>
</body>
</html>
