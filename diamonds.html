<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AMANA ELITE | Diamonds Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #060914;
            --brand: #ff00b8;
            --accent: #00f2ff;
            --up: #00ff96;
            --card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            background: radial-gradient(circle at top right, #1a0b2e 0%, #060914 100%);
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }

        .logo-mini { position: absolute; top: 15px; left: 15px; font-size: 14px; font-weight: 900; }
        .logo-mini span { color: var(--brand); }

        .container { width: 100%; max-width: 420px; padding: 15px; box-sizing: border-box; margin-top: 40px; }

        .wallet-header { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .bal-display { 
            background: rgba(0, 255, 150, 0.08); border: 1px solid var(--up); 
            padding: 6px 12px; border-radius: 50px; color: var(--up); 
            font-weight: 800; font-size: 13px;
        }

        /* Fixed Grid - No Movement */
        .grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
            background: rgba(255, 255, 255, 0.02); padding: 12px; border-radius: 15px;
            border: 1px solid var(--border); margin-bottom: 20px;
        }

        .tile {
            aspect-ratio: 1; background: #213743; border-radius: 8px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 22px; transition: background 0.1s; 
            border: none; /* Fixed border to prevent jumping */
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3);
            position: relative;
        }
        .tile:active { transform: scale(0.95); }
        .tile.revealed { background: #0f212e; box-shadow: none; cursor: default; }
        .tile.bomb-hit { background: rgba(255, 0, 80, 0.4) !important; }
        
        .tile i { opacity: 0; transform: scale(0.4); transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .tile.revealed i { opacity: 1; transform: scale(1); }

        .controls {
            background: var(--card); padding: 20px; border-radius: 20px;
            border: 1px solid var(--border); display: flex; flex-direction: column; gap: 15px;
        }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 11px; color: #8b8da3; font-weight: 700; text-transform: uppercase; }

        .bet-input-wrapper { display: flex; gap: 5px; }
        .bet-input-wrapper input { flex: 1; min-width: 0; }
        .btn-adjust { 
            background: #2f4553; border: none; color: #fff; 
            padding: 0 15px; border-radius: 8px; font-weight: 800; font-size: 12px;
            cursor: pointer;
        }
        .btn-adjust:disabled { opacity: 0.4; }

        input, select {
            background: #0f212e; border: 1px solid var(--border);
            padding: 14px; border-radius: 10px; color: #fff; font-weight: 800; outline: none;
            font-size: 14px;
        }
        input:disabled, select:disabled { opacity: 0.6; }

        .btn-main {
            background: var(--up); color: #060914;
            border: none; padding: 16px; border-radius: 10px;
            font-weight: 900; font-size: 16px; cursor: pointer;
        }
        .cashout-btn { background: #fff; color: #000; display: none; }

        .stats-float {
            display: flex; justify-content: space-between; padding: 0 10px 10px 10px;
            font-size: 13px; font-weight: 800;
        }

        .d-gem { color: var(--accent); text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        .d-bomb { color: #ff0050; }
    </style>
</head>
<body>

<div class="logo-mini">AMANA <span>ELITE</span></div>

<div class="container">
    <div class="wallet-header">
        <div class="bal-display" id="userBalance"><i class="fa-solid fa-wallet"></i> 0.00</div>
    </div>

    <div class="stats-float">
        <span>Multiplier: <span id="multText" style="color:var(--accent)">1.00x</span></span>
        <span>Profit: <span id="profitText" style="color:var(--up)">$0.00</span></span>
    </div>

    <div class="grid" id="gameGrid"></div>

    <div class="controls">
        <div class="input-group">
            <label>Bet Amount</label>
            <div class="bet-input-wrapper">
                <input type="number" id="betAmount" value="10.00" step="1">
                <button class="btn-adjust" id="halfBtn" onclick="adjustBet(0.5)">½</button>
                <button class="btn-adjust" id="doubleBtn" onclick="adjustBet(2)">x2</button>
            </div>
        </div>
        <div class="input-group">
            <label>Mines</label>
            <select id="bombCount">
                <option value="1">1 Mine</option>
                <option value="3" selected>3 Mines</option>
                <option value="5">5 Mines</option>
                <option value="10">10 Mines</option>
                <option value="24">24 Mines</option>
            </select>
        </div>
        <button class="btn-main" id="startBtn">Bet</button>
        <button class="btn-main cashout-btn" id="cashoutBtn">Cashout</button>
    </div>
</div>

<audio id="sndGem" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio> 
<audio id="sndBomb" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2570/2570-preview.mp3"></audio>
<audio id="sndClick" preload="auto" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
        authDomain: "ai-dodo.firebaseapp.com",
        projectId: "ai-dodo",
        storageBucket: "ai-dodo.firebasestorage.app",
        messagingSenderId: "261622335803",
        appId: "1:261622335803:web:0b066791230535e7d5cf1e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let userBalance = 0, userId = null, gameActive = false, bombs = [], revealedCount = 0, currentMult = 1.00;

    const grid = document.getElementById('gameGrid'), 
          startBtn = document.getElementById('startBtn'), 
          cashoutBtn = document.getElementById('cashoutBtn'), 
          balDisplay = document.getElementById('userBalance'),
          betInput = document.getElementById('betAmount'),
          bombSelect = document.getElementById('bombCount');

    // Soft Volume
    const sndGem = document.getElementById('sndGem'); sndGem.volume = 0.4;
    const sndBomb = document.getElementById('sndBomb'); sndBomb.volume = 0.3;
    const sndClick = document.getElementById('sndClick'); sndClick.volume = 0.2;

    window.adjustBet = (factor) => {
        if(gameActive) return;
        betInput.value = (parseFloat(betInput.value || 0) * factor).toFixed(2);
    };

    onAuthStateChanged(auth, (user) => {
        if (user) {
            userId = user.uid;
            onSnapshot(doc(db, "users", userId), (snap) => {
                if (snap.exists()) {
                    userBalance = snap.data().balance || 0;
                    balDisplay.innerHTML = `<i class="fa-solid fa-wallet"></i> ${userBalance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
                }
            });
        }
    });

    function createBoard() {
        grid.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.innerHTML = '&nbsp;'; // Keep height fixed
            tile.onclick = () => revealTile(i);
            grid.appendChild(tile);
        }
    }

    async function initGame() {
        const bet = parseFloat(betInput.value);
        if (bet > userBalance || bet <= 0) return;

        sndClick.currentTime = 0; sndClick.play();
        
        betInput.disabled = bombSelect.disabled = true;
        document.getElementById('halfBtn').disabled = document.getElementById('doubleBtn').disabled = true;

        await updateDoc(doc(db, "users", userId), { balance: increment(-bet) });

        const bombNum = parseInt(bombSelect.value);
        bombs = [];
        while(bombs.length < bombNum) {
            let r = Math.floor(Math.random() * 25);
            if(!bombs.includes(r)) bombs.push(r);
        }

        gameActive = true; revealedCount = 0; currentMult = 1.00;
        updateStats();
        startBtn.style.display = 'none';
        cashoutBtn.style.display = 'block';
        createBoard();
    }

    async function revealTile(index) {
        if (!gameActive) return;
        const tile = grid.children[index];
        if (tile.classList.contains('revealed')) return;

        tile.classList.add('revealed');
        
        if (bombs.includes(index)) {
            sndBomb.currentTime = 0; sndBomb.play();
            tile.innerHTML = '<i class="fa-solid fa-bomb d-bomb"></i>';
            tile.classList.add('bomb-hit');
            endGame(false);
        } else {
            // Instant Sound Playback
            const soundClone = sndGem.cloneNode();
            soundClone.volume = 0.4;
            soundClone.play();
            
            tile.innerHTML = '<i class="fa-solid fa-gem d-gem"></i>';
            revealedCount++;
            calculateMultiplier();
            updateStats();
        }
    }

    function calculateMultiplier() {
        const bombNum = parseInt(bombSelect.value);
        let m = 1;
        for(let i=0; i<revealedCount; i++) { m *= (25 - i) / (25 - bombNum - i); }
        currentMult = m * 0.99; 
    }

    function updateStats() {
        const bet = parseFloat(betInput.value);
        document.getElementById('multText').textContent = currentMult.toFixed(2) + 'x';
        document.getElementById('profitText').textContent = '$' + (bet * currentMult).toFixed(2);
    }

    async function endGame(isWin) {
        gameActive = false;
        startBtn.style.display = 'block';
        cashoutBtn.style.display = 'none';

        if (isWin) {
            const bet = parseFloat(betInput.value);
            await updateDoc(doc(db, "users", userId), { balance: increment(bet * currentMult) });
        }

        bombs.forEach(i => {
            const t = grid.children[i];
            if(!t.classList.contains('revealed')) {
                t.classList.add('revealed');
                t.innerHTML = '<i class="fa-solid fa-bomb d-bomb" style="opacity:0.2"></i>';
            }
        });

        betInput.disabled = bombSelect.disabled = false;
        document.getElementById('halfBtn').disabled = document.getElementById('doubleBtn').disabled = false;
    }

    startBtn.onclick = initGame;
    cashoutBtn.onclick = () => { if(gameActive) { sndGem.cloneNode().play(); endGame(true); } };
    createBoard();
</script>
</body>
</html>
