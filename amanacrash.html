<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AMANA CRASH PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914;
            --card: #0f121d;
            --brand: #ff00b8;
            --up: #00ff96;
            --down: #ff3b3b;
            --border: rgba(255, 255, 255, 0.08);
            --input-bg: #1a1d29;
        }

        body {
            margin: 0; font-family: 'Inter', sans-serif;
            background: var(--bg); color: #fff;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- Game Viewport (القسم العلوي - صغير مثل ستيك) --- */
        .game-header { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .game-container {
            position: relative;
            margin: 0 10px;
            height: 40vh; /* تصغير حجم الشاشة العلوية */
            background: #000;
            border-radius: 12px;
            border: 2px solid var(--border);
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .stars { position: absolute; width: 200%; height: 200%; background: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity: 0.2; animation: moveStars 30s linear infinite; }
        @keyframes moveStars { from { transform: translate(0,0); } to { transform: translate(-50%, -50%); } }

        .multiplier-text { font-size: 50px; font-weight: 900; z-index: 10; text-shadow: 0 0 20px var(--brand); }
        #rocket { position: absolute; bottom: 15%; left: 10%; font-size: 35px; color: var(--brand); transform: rotate(-45deg); z-index: 5; transition: 0.1s; }

        /* --- History Bar --- */
        .history-bar { display: flex; gap: 8px; padding: 12px 15px; overflow-x: auto; white-space: nowrap; }
        .hist-item { background: var(--card); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; border: 1px solid var(--border); }

        /* --- Betting Section (القسم السفلي - واسع ومريح) --- */
        .bet-area {
            flex: 1;
            background: var(--card);
            border-top: 2px solid var(--border);
            padding: 15px;
            display: flex; flex-direction: column;
            gap: 12px;
        }

        .input-group { background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
        .input-group label { display: block; font-size: 10px; color: #777; font-weight: 800; margin-bottom: 4px; text-transform: uppercase; }
        .input-row { display: flex; align-items: center; }
        .input-row input { flex: 1; background: transparent; border: none; color: #fff; font-size: 16px; font-weight: 700; outline: none; }
        
        /* Buttons x2 / 1/2 */
        .quick-btns { display: flex; gap: 5px; }
        .quick-btns button { background: #2a2e3f; border: none; color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; }

        .main-btn {
            width: 100%; padding: 18px; border-radius: 8px; border: none;
            font-size: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.2s;
        }
        .btn-bet { background: var(--brand); color: #fff; box-shadow: 0 4px 15px rgba(255, 0, 184, 0.3); }
        .btn-cashout { background: var(--up); color: #000; }
        .btn-waiting { background: #252836; color: #555; }

        .profit-info { text-align: center; color: var(--up); font-weight: 800; font-size: 14px; height: 20px; }
    </style>
</head>
<body>

    <div class="game-header">
        <a href="game.html" style="color:#fff;"><i class="fa-solid fa-chevron-left"></i></a>
        <div style="font-weight: 800; font-size: 14px; color: var(--up);"><i class="fa-solid fa-wallet"></i> 2,840.15</div>
    </div>

    <div class="game-container">
        <div class="stars"></div>
        <i id="rocket" class="fa-solid fa-rocket"></i>
        <div id="multiplier" class="multiplier-text">1.00x</div>
    </div>

    <div class="history-bar" id="history">
        <div class="hist-item" style="color:var(--up)">1.50x</div>
        <div class="hist-item" style="color:var(--down)">1.03x</div>
    </div>

    <div class="bet-area">
        <div class="profit-info" id="profitText"></div>

        <div class="input-group">
            <label>Amount (USDT)</label>
            <div class="input-row">
                <input type="number" id="betAmount" value="10.00">
                <div class="quick-btns">
                    <button onclick="mult(0.5)">1/2</button>
                    <button onclick="mult(2)">x2</button>
                </div>
            </div>
        </div>

        <div class="input-group">
            <label>Auto Cashout</label>
            <div class="input-row">
                <input type="number" id="autoCash" value="2.00">
            </div>
        </div>

        <button id="mainBtn" class="main-btn btn-bet" onclick="handleAction()">Place Bet</button>
        
        <div id="status" style="text-align: center; font-size: 11px; color: #444; margin-top: 5px;">WAITING FOR NEXT ROUND</div>
    </div>

<script>
    let multi = 1.00;
    let state = "IDLE";
    let hasBet = false;
    let cashed = false;
    let betVal = 0;
    let startTime, anim;

    const multiEl = document.getElementById('multiplier');
    const rocketEl = document.getElementById('rocket');
    const mainBtn = document.getElementById('mainBtn');
    const profitEl = document.getElementById('profitText');

    function start() {
        state = "RUNNING";
        startTime = Date.now();
        if(hasBet) {
            betVal = parseFloat(document.getElementById('betAmount').value);
            mainBtn.className = "main-btn btn-cashout";
            mainBtn.textContent = "Cash Out";
        } else {
            mainBtn.className = "main-btn btn-waiting";
            mainBtn.textContent = "Flying...";
        }
        tick();
    }

    function tick() {
        if(state !== "RUNNING") return;
        let elapsed = (Date.now() - startTime) / 1000;
        multi = Math.pow(Math.E, 0.08 * elapsed);
        multiEl.textContent = multi.toFixed(2) + "x";

        // Rocket Move
        rocketEl.style.left = Math.min(10 + elapsed * 5, 80) + "%";
        rocketEl.style.bottom = Math.min(15 + Math.pow(elapsed, 1.4) * 3, 75) + "%";

        if(hasBet && !cashed) {
            profitEl.textContent = "Profit: +" + (betVal * multi).toFixed(2) + " USDT";
            let auto = parseFloat(document.getElementById('autoCash').value);
            if(auto > 1 && multi >= auto) doCashOut();
        }

        // Risk Logic
        if(Math.random() < (0.001 + multi * 0.004)) doCrash();
        else anim = requestAnimationFrame(tick);
    }

    function handleAction() {
        if(state === "IDLE" && !hasBet) {
            hasBet = true;
            mainBtn.className = "main-btn btn-waiting";
            mainBtn.textContent = "Bet Placed";
        } else if(state === "RUNNING" && hasBet && !cashed) {
            doCashOut();
        }
    }

    function doCashOut() {
        cashed = true;
        let win = (betVal * multi).toFixed(2);
        mainBtn.textContent = "WON " + win;
        mainBtn.className = "main-btn btn-waiting";
        profitEl.textContent = "CASHED OUT!";
    }

    function doCrash() {
        state = "CRASHED";
        cancelAnimationFrame(anim);
        multiEl.style.color = "var(--down)";
        mainBtn.className = "main-btn btn-waiting";
        mainBtn.textContent = "Crashed";
        profitEl.textContent = "";

        const chip = `<div class="hist-item" style="color:${multi > 2 ? 'var(--up)' : 'var(--down)'}">${multi.toFixed(2)}x</div>`;
        document.getElementById('history').insertAdjacentHTML('afterbegin', chip);

        setTimeout(reset, 3000);
    }

    function reset() {
        state = "IDLE"; hasBet = false; cashed = false;
        multiEl.style.color = "white";
        multiEl.textContent = "1.00x";
        rocketEl.style.left = "10%"; rocketEl.style.bottom = "15%";
        mainBtn.className = "main-btn btn-bet";
        mainBtn.textContent = "Place Bet";
        setTimeout(start, 3000);
    }

    function mult(v) { document.getElementById('betAmount').value = (document.getElementById('betAmount').value * v).toFixed(2); }
    reset();
</script>
</body>
</html>
