<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AMANA GLOBAL | Login</title>

<style>
:root{
--bg:#0b0f1f;
--text:#ffffff;
--muted:#b8b9d9;
--brand1:#a100ff;
--brand2:#ff00b8;
--glass:rgba(255,255,255,.05);
--border:rgba(255,255,255,.1);
--radius:20px;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:system-ui,-apple-system,"Segoe UI",Arial;
background:linear-gradient(-45deg,#0b0f1f,#140b2d,#1c0833,#120822);
background-size:400% 400%;
animation:bgMove 12s ease infinite;
color:var(--text);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:24px;
}
@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}
.wrap{width:100%;max-width:420px;}
.card{
background:var(--glass);
backdrop-filter:blur(25px);
border:1px solid var(--border);
border-radius:var(--radius);
padding:40px 30px;
text-align:center;
}
.logo{
font-size:26px;
font-weight:900;
margin-bottom:10px;
background:linear-gradient(135deg,var(--brand1),var(--brand2));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
h1{margin:0 0 8px;font-size:24px;font-weight:800;}
.sub{margin:0 0 30px;color:var(--muted);font-size:14px;}
.form-group{text-align:left;margin-bottom:18px;}
label{
display:block;
font-weight:700;
font-size:13px;
margin-bottom:8px;
color:var(--muted);
}
.field{
width:100%;
padding:14px 16px;
border-radius:14px;
border:1px solid var(--border);
background:rgba(0,0,0,.3);
color:var(--text);
font-size:15px;
}
.field:focus{
outline:none;
border-color:var(--brand2);
box-shadow:0 0 15px rgba(255,0,184,.2);
}
.btn{
width:100%;
padding:14px;
border-radius:14px;
font-weight:800;
font-size:16px;
cursor:pointer;
border:none;
background:linear-gradient(135deg,var(--brand1),var(--brand2));
color:#fff;
margin-top:10px;
}
.msg{
margin-top:20px;
padding:12px;
border-radius:12px;
display:none;
font-size:14px;
}
.msg.error{background:rgba(255,0,80,.15);color:#ff4d8d;}
.msg.success{background:rgba(0,255,184,.15);color:#00ffb8;}
.footer-note{
margin-top:25px;
font-size:12px;
color:var(--muted);
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">
<div class="logo">AMANA GLOBAL</div>
<h1>Welcome Back</h1>
<p class="sub">Login to your dashboard</p>

<form id="loginForm">
<div class="form-group">
<label>Email Address</label>
<input id="email" class="field" type="email" required>
</div>

<div class="form-group">
<label>Password</label>
<input id="password" class="field" type="password" required>
</div>

<button class="btn" type="submit">Authorize Login</button>
<div id="msg" class="msg"></div>
</form>

<div class="footer-note">
&copy; 2026 AMANA GLOBAL
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
getAuth, 
signInWithEmailAndPassword,
onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
apiKey: "PUT_YOUR_API_KEY",
authDomain: "PUT_YOUR_AUTH_DOMAIN",
projectId: "PUT_YOUR_PROJECT_ID",
storageBucket: "PUT_YOUR_STORAGE_BUCKET",
messagingSenderId: "PUT_YOUR_SENDER_ID",
appId: "PUT_YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form=document.getElementById("loginForm");
const msg=document.getElementById("msg");

function show(text,type){
msg.style.display="block";
msg.className="msg "+type;
msg.textContent=text;
}

// إذا المستخدم مسجل مسبقاً → تحويل مباشر
onAuthStateChanged(auth,(user)=>{
if(user){
window.location.href="profile.html";
}
});

form.addEventListener("submit",async(e)=>{
e.preventDefault();

const btn=form.querySelector(".btn");
btn.disabled=true;
btn.textContent="Verifying...";

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

try{
await signInWithEmailAndPassword(auth,email,password);

show("Login successful ✅","success");

setTimeout(()=>{
window.location.href="profile.html";
},800);

}catch(error){
btn.disabled=false;
btn.textContent="Authorize Login";

if(error.code==="auth/user-not-found"){
show("Account not found","error");
}else if(error.code==="auth/wrong-password" || error.code==="auth/invalid-credential"){
show("Invalid email or password","error");
}else{
show(error.message,"error");
}
}
});
</script>

</body>
</html>
