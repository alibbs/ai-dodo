<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel | Live Tracking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        body { background: #05070a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; padding: 30px; }
        .container { max-width: 1100px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff00b8; padding-bottom: 15px; margin-bottom: 30px; }
        h1 { color: #ff00b8; margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 2px; }
        
        .user-card { 
            background: #0f121d; border: 1px solid #1f263d; border-radius: 15px; 
            margin-bottom: 20px; overflow: hidden; animation: fadeIn 0.5s ease;
        }
        .user-info { background: #161b2e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f263d; }
        .user-email { color: #00f2ff; font-weight: bold; font-size: 16px; }
        
        .session-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .session-table th { text-align: left; padding: 12px 20px; color: #666; font-weight: 600; text-transform: uppercase; border-bottom: 1px solid #1f263d; }
        .session-table td { padding: 12px 20px; border-bottom: 1px solid #14192b; }
        
        .device-tag { color: #fff; background: #333; padding: 3px 8px; border-radius: 5px; font-size: 11px; }
        .loc-tag { color: #00ff96; font-weight: 600; }
        .ip-tag { color: #aaa; font-family: monospace; }
        .time-tag { color: #ffb800; font-size: 11px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .live-dot { height: 8px; width: 8px; background-color: #00ff96; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 8px #00ff96; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-microchip"></i> Live Surveillance</h1>
        <div id="status"><span class="live-dot"></span> System Online</div>
    </div>

    <div id="monitorBody">
        </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDJz5qW8oBVQo40ghpSKOMon5iXpGCQSRA",
        authDomain: "ai-dodo.firebaseapp.com",
        projectId: "ai-dodo",
        storageBucket: "ai-dodo.firebasestorage.app",
        messagingSenderId: "261622335803",
        appId: "1:261622335803:web:0b066791230535e7d5cf1e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    onSnapshot(collection(db, "users"), (snapshot) => {
        const monitorBody = document.getElementById('monitorBody');
        monitorBody.innerHTML = '';

        snapshot.forEach((userDoc) => {
            const userData = userDoc.data();
            const userId = userDoc.id;

            const card = document.createElement('div');
            card.className = 'user-card';
            card.innerHTML = `
                <div class="user-info">
                    <span class="user-email"><i class="fa-solid fa-user-shield"></i> ${userData.email || 'No Email'}</span>
                    <span style="font-size:12px; color:#555">UID: ${userId}</span>
                </div>
                <div id="sessions-${userId}">
                    <table class="session-table">
                        <thead>
                            <tr>
                                <th>Device / OS</th>
                                <th>Location</th>
                                <th>IP Address</th>
                                <th>Last Seen</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-${userId}">
                            <tr><td colspan="4" style="text-align:center; color:#444;">Scanning active sessions...</td></tr>
                        </tbody>
                    </table>
                </div>
            `;
            monitorBody.appendChild(card);

            // جلب الأجهزة والموقع لكل مستخدم
            onSnapshot(collection(db, "users", userId, "active_sessions"), (sSnap) => {
                const tbody = document.getElementById(`tbody-${userId}`);
                if (!sSnap.empty) {
                    tbody.innerHTML = '';
                    sSnap.forEach(doc => {
                        const s = doc.data();
                        tbody.innerHTML += `
                            <tr>
                                <td><span class="device-tag">${s.platform}</span> <br> <small style="color:#555">${s.vendor || ''}</small></td>
                                <td><span class="loc-tag"><i class="fa-solid fa-location-dot"></i> ${s.location || 'Unknown'}</span></td>
                                <td><span class="ip-tag">${s.ip || '0.0.0.0'}</span></td>
                                <td><span class="time-tag">${new Date(s.last_active).toLocaleTimeString()}</span></td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#444;">No device data available</td></tr>';
                }
            });
        });
    });
</script>

</body>
</html>
