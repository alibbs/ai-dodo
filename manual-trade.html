<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>AMANA ELITE+ | Split Terminal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --bg: #060914; --brand: #ff00b8; --accent: #00f2ff;
            --up: #00ff96; --down: #ff3b3b; --card: #11141d;
            --border: rgba(255,255,255,0.08);
        }

        * { touch-action: manipulation; box-sizing: border-box; -webkit-user-select: none; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* --- Header --- */
        .header { height: 50px; padding: 0 15px; display: flex; justify-content: space-between; align-items: center; background: var(--card); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .header h1 { font-size: 14px; font-weight: 900; margin: 0; }
        .header h1 span { color: var(--brand); }
        #live-price { font-weight: 900; color: var(--accent); font-size: 14px; }

        /* --- Upper Half: Chart --- */
        #chart-half { height: 50vh; background: #000; position: relative; border-bottom: 2px solid var(--border); }

        /* --- Lower Half: Management --- */
        #manage-half { height: 50vh; display: flex; flex-direction: column; background: var(--bg); }

        /* Tabs Navigation */
        .tabs-nav { display: flex; background: var(--card); border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #555; font-weight: 800; font-size: 12px; cursor: pointer; text-transform: uppercase; }
        .tab-btn.active { color: var(--brand); border-bottom: 2px solid var(--brand); }

        .tab-content { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .tab-content.active { display: block; }

        /* Position Details */
        .pos-card { background: var(--card); border-radius: 15px; padding: 20px; border: 1px solid var(--border); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .stat-item label { display: block; font-size: 10px; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        .stat-item div { font-size: 16px; font-weight: 800; }

        .profit-large { font-size: 32px; font-weight: 900; text-align: center; margin: 10px 0; }
        
        .close-btn { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--down); color: #fff; font-weight: 900; font-size: 16px; margin-top: 10px; }

        /* History List */
        .hist-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
        .hist-item b { color: var(--up); }
        .hist-item.loss b { color: var(--down); }

        /* Empty State */
        .empty { text-align: center; color: #444; margin-top: 40px; font-size: 13px; }
    </style>
</head>
<body>

    <header class="header">
        <h1>AMANA <span>ELITE+</span></h1>
        <div id="live-price">0.00</div>
    </header>

    <section id="chart-half">
        <div id="tv_chart_container" style="height: 100%;"></div>
    </section>

    <section id="manage-half">
        <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('pos', this)">Open Position</button>
            <button class="tab-btn" onclick="switchTab('hist', this)">Trade History</button>
        </div>

        <div id="tab-pos" class="tab-content active">
            <div id="no-pos" class="empty">No active trades.<br>Open a trade from the Market.</div>
            
            <div id="active-pos-ui" style="display: none;">
                <div class="pos-card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                        <b id="ui-side" style="color:var(--up)">LONG 10x</b>
                        <span id="ui-symbol" style="color:#888">BTC/USDT</span>
                    </div>
                    
                    <div class="profit-large" id="ui-pnl">+0.00</div>
                    <div id="ui-roe" style="text-align:center; font-weight:bold; margin-bottom:20px;">+0.00%</div>

                    <div class="stat-grid">
                        <div class="stat-item">
                            <label>Entry Price</label>
                            <div id="ui-entry">0.00</div>
                        </div>
                        <div class="stat-item">
                            <label>Liquidation</label>
                            <div id="ui-liq" style="color:var(--down)">0.00</div>
                        </div>
                        <div class="stat-item">
                            <label>Margin</label>
                            <div id="ui-margin">0.00 USDT</div>
                        </div>
                        <div class="stat-item">
                            <label>Current</label>
                            <div id="ui-current">0.00</div>
                        </div>
                    </div>

                    <button class="close-btn" onclick="requestClose()">CLOSE TRADE</button>
                </div>
            </div>
        </div>

        <div id="tab-hist" class="tab-content">
            <div id="history-list">
                <div class="hist-item"><span>BTC/USDT (Long)</span> <b>+12.40 USDT</b></div>
                <div class="hist-item loss"><span>ETH/USDT (Short)</span> <b>-5.20 USDT</b></div>
            </div>
        </div>
    </section>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, updateDoc, increment, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Firebase Config (نفس الإعدادات)
        const app = initializeApp({ /* ... config ... */ });
        const db = getFirestore(app);
        const auth = getAuth(app);

        let uID = null, curPrice = 0, activeP = null;

        // تبديل التبويبات
        window.switchTab = (target, btn) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + target).classList.add('active');
        }

        // تشغيل الشارت
        new TradingView.widget({
            "autosize": true, "symbol": "BINANCE:BTCUSDT", "interval": "1", "theme": "dark",
            "container_id": "tv_chart_container", "hide_top_toolbar": true, "backgroundColor": "#000000"
        });

        // مراقبة السعر
        const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@ticker');
        ws.onmessage = (e) => {
            curPrice = parseFloat(JSON.parse(e.data).c);
            document.getElementById('live-price').textContent = curPrice.toFixed(2);
            updateUI();
        };

        function updateUI() {
            if(!activeP) {
                document.getElementById('no-pos').style.display = 'block';
                document.getElementById('active-pos-ui').style.display = 'none';
                return;
            }

            document.getElementById('no-pos').style.display = 'none';
            document.getElementById('active-pos-ui').style.display = 'block';

            let diff = activeP.side === 'LONG' ? (curPrice - activeP.entry) : (activeP.entry - curPrice);
            let roe = (diff / activeP.entry) * 100 * activeP.lev;
            let pnl = (roe / 100) * activeP.amt;

            // تحديث الأرقام في الواجهة
            document.getElementById('ui-pnl').textContent = (pnl >= 0 ? '+' : '') + pnl.toFixed(2);
            document.getElementById('ui-pnl').style.color = pnl >= 0 ? 'var(--up)' : 'var(--down)';
            document.getElementById('ui-roe').textContent = (roe >= 0 ? '+' : '') + roe.toFixed(2) + "%";
            document.getElementById('ui-roe').style.color = roe >= 0 ? 'var(--up)' : 'var(--down)';
            document.getElementById('ui-current').textContent = curPrice.toFixed(2);

            // Liquidation
            if(roe <= -68) { closeTrade(true); }
        }

        window.requestClose = () => { if(confirm("Close this position at market price?")) closeTrade(false); };

        async function closeTrade(isLiq) {
            // منطق إغلاق الصفقة وإرجاع الربح/الخسارة للرصيد
            // إضافة العملية لـ history-list في Firestore
            activeP = null;
            alert(isLiq ? "Position Liquidated!" : "Position Closed.");
            updateUI();
        }

        // ملاحظة: كود فتح الصفقة (Open) سيكون في صفحة منفصلة أو Modal يرسل البيانات لـ activeP
    </script>
</body>
</html>
