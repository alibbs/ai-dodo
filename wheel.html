<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AMANA ELITE | WHEEL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@600;800;900&display=swap');

        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #8b5cf6;
            --gold: #facc15;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Header */
        header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }
        .bal-box { background: #000; padding: 8px 15px; border-radius: 10px; border: 1px solid var(--accent); font-family: 'Orbitron'; color: var(--gold); }

        /* Wheel Area */
        .game-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        .wheel-wrapper { position: relative; width: 320px; height: 320px; margin-bottom: 20px; }
        
        /* السهم المشير للأسفل */
        .pointer { 
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 30px; height: 30px; background: #fff; clip-path: polygon(0 0, 100% 0, 50% 100%);
            z-index: 10; filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }

        canvas { width: 100%; height: 100%; border-radius: 50%; border: 8px solid var(--panel); box-shadow: 0 0 50px rgba(0,0,0,0.5); }

        /* Controls */
        .controls { background: var(--panel); padding: 20px; border-radius: 30px 30px 0 0; }
        
        .risk-selector { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .risk-btn { padding: 10px; border: none; border-radius: 8px; background: #334155; color: #94a3b8; font-weight: 800; cursor: pointer; transition: 0.3s; }
        .risk-btn.active { background: var(--accent); color: #fff; }

        .input-wrap { background: #0f172a; padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--border); }
        .input-wrap label { font-size: 10px; color: #64748b; display: block; margin-bottom: 5px; }
        .input-wrap input { background: transparent; border: none; color: #fff; width: 100%; font-size: 18px; font-weight: 800; }

        .spin-btn { width: 100%; padding: 18px; border-radius: 15px; border: none; background: var(--accent); color: #fff; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #6d28d9; }
        .spin-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #6d28d9; }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* History */
        .history { display: flex; gap: 5px; margin-top: 15px; overflow-x: auto; height: 30px; }
        .hist-item { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 900; background: #334155; display: flex; align-items: center; }

    </style>
</head>
<body>

    <header>
        <div style="font-family:'Orbitron'; font-weight:900;">AMANA <span style="color:var(--accent)">WHEEL</span></div>
        <div class="bal-box" id="bal">1,000.00</div>
    </header>

    <div class="game-container">
        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
        </div>
        <div id="result-msg" style="font-family:'Orbitron'; font-size:24px; font-weight:900; height:30px;"></div>
    </div>

    <div class="controls">
        <div class="risk-selector">
            <button class="risk-btn active" onclick="setRisk('low')">LOW</button>
            <button class="risk-btn" onclick="setRisk('med')">MED</button>
            <button class="risk-btn" onclick="setRisk('high')">HIGH</button>
        </div>

        <div class="input-wrap">
            <label>Amount</label>
            <input type="number" id="betAmt" value="10.00">
        </div>

        <button class="spin-btn" id="spinBtn" onclick="spinWheel()">SPIN</button>
        
        <div class="history" id="history"></div>
    </div>

<script>
    let balance = 1000.00;
    let currentRisk = 'low';
    let isSpinning = false;
    let currentRotation = 0;

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');

    // إعدادات الستيك (Segments)
    const configs = {
        low: [1.5, 1.2, 0, 1.2, 1.5, 1.2, 0, 1.2, 1.5, 1.2],
        med: [2, 1.5, 0, 1.5, 2, 0, 3, 0, 1.5, 0],
        high: [0, 0, 0, 0, 5, 0, 0, 0, 0, 10]
    };

    function setRisk(risk) {
        if(isSpinning) return;
        currentRisk = risk;
        document.querySelectorAll('.risk-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        drawWheel();
    }

    function drawWheel() {
        const segments = configs[currentRisk];
        const angleStep = (Math.PI * 2) / segments.length;
        
        ctx.clearRect(0,0,600,600);
        
        segments.forEach((val, i) => {
            const angle = i * angleStep;
            ctx.beginPath();
            ctx.moveTo(300, 300);
            ctx.arc(300, 300, 280, angle, angle + angleStep);
            
            // تلوين حسب القيمة
            if(val === 0) ctx.fillStyle = '#334155';
            else if(val <= 1.5) ctx.fillStyle = '#8b5cf6';
            else ctx.fillStyle = '#f59e0b';
            
            ctx.fill();
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 4;
            ctx.stroke();

            // إضافة النص
            ctx.save();
