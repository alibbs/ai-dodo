<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Join AMANA | Secure Mining</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #3b82f6;
            --bg-dark: #050810;
        }
        body { 
            background-color: var(--bg-dark); 
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }
        .mesh-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.1) 0%, transparent 40%);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }
        input, select { background: transparent; border: none; outline: none; color: white; width: 100%; font-size: 14px; }
        option { background: #1e293b; color: white; }
        
        .logo-container {
            width: 85px; height: 85px;
            border: 2px dashed rgba(59, 130, 246, 0.4);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px;
            position: relative;
            overflow: hidden;
            background: rgba(59, 130, 246, 0.05);
        }
        .logo-preview { width: 100%; height: 100%; object-fit: cover; display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center px-8 py-10">
    <div class="mesh-bg"></div>

    <div class="text-center mb-8">
        <label for="logo-upload" class="cursor-pointer">
            <div class="logo-container" id="logo-box">
                <i class="fas fa-camera text-blue-500/50 text-xl" id="camera-icon"></i>
                <img id="output" class="logo-preview"/>
            </div>
            <input type="file" id="logo-upload" accept="image/*" class="hidden" onchange="previewImage(event)">
        </label>
        <h1 class="text-2xl font-black tracking-tighter uppercase italic">AMANA <span class="text-blue-500 italic">GLOBAL</span></h1>
        <p class="text-[10px] text-gray-500 tracking-[0.3em] font-bold">ESTABLISHED 2026</p>
    </div>

    <div class="space-y-4">
        <div class="glass-input p-4 rounded-2xl flex items-center gap-4">
            <i class="fas fa-user text-gray-500 w-5"></i>
            <input type="text" placeholder="Full Name">
        </div>

        <div class="glass-input p-4 rounded-2xl flex items-center gap-4">
            <i class="fas fa-envelope text-gray-500 w-5"></i>
            <input type="email" placeholder="Email Address">
        </div>

        <div class="flex gap-2">
            <div class="glass-input p-4 rounded-2xl flex items-center w-32">
                <select id="country-code">
                    <option value="+1">🇺🇸 +1</option>
                    <option value="+44">🇬🇧 +44</option>
                    <option value="+966">🇸🇦 +966</option>
                    <option value="+971">🇦🇪 +971</option>
                    <option value="+962">🇯🇴 +962</option>
                    <option value="+961">🇱🇧 +961</option>
                    <option value="+20">🇪🇬 +20</option>
                    <option value="+974">🇶🇦 +974</option>
                    <option value="+965">🇰🇼 +965</option>
                </select>
            </div>
            <div class="glass-input p-4 rounded-2xl flex-1">
                <input type="tel" placeholder="Phone Number">
            </div>
        </div>

        <div class="glass-input p-4 rounded-2xl flex items-center gap-4">
            <i class="fas fa-lock text-gray-500 w-5"></i>
            <input type="password" placeholder="Password">
        </div>

        <button onclick="submitForm()" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-500/30 active:scale-95 transition mt-4">
            CREATE ACCOUNT
        </button>

        <p class="text-center text-xs text-gray-500">
            Already a member? <a href="login.html" class="text-blue-500 font-bold">Sign In</a>
        </p>
    </div>

    <script>
        function previewImage(event) {
            var reader = new FileReader();
            reader.onload = function(){
                var output = document.getElementById('output');
                output.src = reader.result;
                output.style.display = 'block';
                document.getElementById('camera-icon').style.display = 'none';
                document.getElementById('logo-box').style.borderStyle = 'solid';
            };
            reader.readAsDataURL(event.target.files[0]);
        }

        // List of 70+ countries logic
        const countryData = [
            {code: "+968", name: "OM", flag: "🇴🇲"}, {code: "+973", name: "BH", flag: "🇧🇭"},
            {code: "+212", name: "MA", flag: "🇲🇦"}, {code: "+213", name: "DZ", flag: "🇩🇿"},
            {code: "+216", name: "TN", flag: "🇹🇳"}, {code: "+218", name: "LY", flag: "🇱🇾"},
            {code: "+964", name: "IQ", flag: "🇮🇶"}, {code: "+963", name: "SY", flag: "🇸🇾"},
            {code: "+49", name: "DE", flag: "🇩🇪"}, {code: "+33", name: "FR", flag: "🇫🇷"},
            {code: "+31", name: "NL", flag: "🇳🇱"}, {code: "+39", name: "IT", flag: "🇮🇹"},
            {code: "+34", name: "ES", flag: "🇪🇸"}, {code: "+7", name: "RU", flag: "🇷🇺"},
            {code: "+81", name: "JP", flag: "🇯🇵"}, {code: "+86", name: "CN", flag: "🇨🇳"},
            {code: "+90", name: "TR", flag: "🇹🇷"}, {code: "+61", name: "AU", flag: "🇦🇺"}
            // You can easily add more here...
        ];

        const select = document.getElementById('country-code');
        countryData.forEach(c => {
            let opt = document.createElement('option');
            opt.value = c.code;
            opt.innerHTML = `${c.flag} ${c.code}`;
            select.appendChild(opt);
        });

        function submitForm() {
            const btn = document.querySelector('button');
            btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i> CREATING...';
            setTimeout(() => { window.location.href = "home.html"; }, 1500);
        }
    </script>
</body>
</html>
